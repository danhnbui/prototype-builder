<!doctype html>
<!-- pb design-system site — a deterministic projection of registry.json (components + tokens).
     render.py inlines the registry + per-component node JSON and injects the shared runtime plus the
     emitted render functions at the markers in the script below. Sibling of prototype.html; both are
     built from the same registry by /pb:build --render and served by /pb:preview. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Theme (before first paint): System unless the viewer chose. pbSetTheme("system"|"light"|"dark"). -->
<script>(function () {
  var d = document.documentElement, K = 'pb-theme';
  function put(v) { if (v === 'light' || v === 'dark') d.setAttribute('data-theme', v); else d.removeAttribute('data-theme'); }
  try { put(localStorage.getItem(K)); } catch (e) {}
  window.pbSetTheme = function (v) {
    put(v);
    try { if (v === 'light' || v === 'dark') localStorage.setItem(K, v); else localStorage.removeItem(K); } catch (e) {}
  };
})();</script>
<title>Design system</title>
<style>
  /*__PB_CHROME__*/

  /* TWO SCOPES. The page chrome is the TOOL: its names (--ds-*) are aliases of chrome.css's --pb-*,
     so this site and the prototype shell are one vocabulary instead of two near-misses. The
     components are the PROJECT: their tokens live on .pb-product, below, and the registry's tokens
     are scoped to it (applyRegistryTokens). A project can be any colour and this page does not move.
     The chrome follows the tool's theme (System / Light / Dark, chrome.css); the specimens never do —
     every .pb-product is `color-scheme: light`, so a stage, a variant cell and a swatch are the same
     pixels in a dark tool as in a light one. */
  :root {
    --ds-bg:var(--pb-page); --ds-surface:var(--pb-surface); --ds-ink:var(--pb-ink); --ds-mut:var(--pb-ink-2);
    --ds-faint:var(--pb-ink-3); --ds-line:var(--pb-hair); --ds-stage:var(--pb-stage); --ds-accent:var(--pb-ink);
    --ds-mono:var(--pb-mono); --ds-sans:var(--pb-font);
    --danger:var(--pb-fail); --success:var(--pb-pass); --neutral-90:var(--pb-ink);   /* status, not brand */
  }
  /* The PROJECT's defaults (the registry's tokens override these). Same names the components use. */
  .pb-product {
    /* Brand */
    --brand:                  #1c4ed8;
    --brand-soft:             #eef2ff;
    --brand-strong:           #1e3aa3;
    /* Neutrals */
    --neutral-0:#ffffff; --neutral-5:#f8f9fb; --neutral-10:#eff1f5; --neutral-20:#c1c9d2;
    --neutral-40:#8a94a0; --neutral-60:#5e6873; --neutral-80:#2d343c; --neutral-90:#1c1f22;
    /* Semantic */
    --bg-soft:var(--neutral-5); --text-active-primary:var(--neutral-90); --text-active-secondary:var(--neutral-60);
    --text-tertiary:var(--neutral-40); --border:var(--neutral-20); --border-strong:var(--neutral-40);
    --fill-active-primary:var(--brand); --fill-active-secondary:var(--brand-soft); --fill-hover-secondary:var(--neutral-10);
    --danger:#dc2626; --success:#16a34a;
    /* Nested-DS aliases so interactive checkboxes style on flat-pb-token projects too */
    --color-brand-primary:var(--brand); --color-bg-surface:var(--neutral-0); --color-border:var(--border);
    /* Fonts */
    --font-heading:'Inter',system-ui,-apple-system,sans-serif; --font-body:'Inter',system-ui,-apple-system,sans-serif;
    --font-size-xxs:10px; --font-size-xs:12px; --font-size-s:14px; --font-size-base:16px; --font-size-l:18px; --font-size-xl:20px; --font-size-xxl:24px; --font-size-xxxl:32px;
    --font-weight-medium:500; --font-weight-bold:700;
    --line-height-l:24px; --line-height-ui:1; --line-height-copy:1.5;
    --radius-small:8px; --radius-medium:16px; --radius-large:24px; --radius-full:9999px;
    --shadow-sm:0 1px 3px rgba(28,31,34,0.08); --shadow-md:0 4px 12px rgba(28,31,34,0.08);
  }

  *{box-sizing:border-box}
  /* A demo stage shows the PROJECT's components, so it is painted in the PROJECT's colours
     (mountThemeBridge, below): the page chrome follows the tool's theme, the project's tokens have
     exactly one. Every specimen is a light island in a dark tool. */
  .ds-render-fail { border:1px dashed var(--pb-fail); border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.5; color:var(--ds-ink); background:var(--pb-fail-bg); }
  .ds-render-fail code { font-family:var(--ds-mono); font-size:11.5px; background:var(--pb-wash); padding:0 4px; border-radius:3px; }
  .ds-render-fail-msg { margin-top:6px; font-family:var(--ds-mono); font-size:11px; color:var(--ds-mut); }
  body{margin:0;background:var(--ds-bg);color:var(--ds-ink);font-family:var(--ds-sans);font-size:var(--pb-t-md);line-height:1.5;-webkit-font-smoothing:antialiased}
  code{font-family:var(--ds-mono);font-size:.92em}

  /* ── The bar: chrome.css's .pb-bar, the identical bar the prototype shell wears. The project
     button (runtime.js) at the far left, a hairline, the one surface, then Search and the crossing
     back to the prototype — in the same slot as the prototype's "Design system" link. ── */
  .pb-tab[aria-current="page"]{cursor:default}
  .pb-bar-start{display:flex;align-items:center;flex:none}
  .pb-bar-vr{width:var(--pb-hair-w);height:1.25rem;background:var(--pb-hair);flex:none;align-self:center;margin:0 calc(var(--pb-s2) * -1)}
  .pb-bar-end{gap:var(--pb-s1)}
  .pb-bar-item + .pb-bar-item::before{left:-3px}
  .ds-browse{display:none}

  /* ── Docs layout: the tree on the left, one page at a time on the right ── */
  .ds-shell{display:grid;grid-template-columns:17.5rem minmax(0,1fr);align-items:start}
  .ds-nav{position:sticky;top:var(--pb-bar-h);height:calc(100vh - var(--pb-bar-h));display:flex;flex-direction:column;border-right:var(--pb-hair-w) solid var(--pb-hair);background:var(--ds-bg)}
  /* the filter is the shared bar (pbFilterBar): search · Source chip · Clear · "N of M pages".
     The result count lives in it and nowhere else. */
  .ds-fbar{flex:none;padding:var(--pb-s4) var(--pb-s3) 0}
  .ds-fbar .pb-fbar{padding-bottom:var(--pb-s3)}
  .ds-fbar .pb-fbar-q{width:100%}
  .ds-fbar .pb-fbar-grow{display:none}
  /* the tree: two labels, Components and Foundations. A label is not a control: nothing to open, nothing to count */
  .ds-tree{flex:1;min-height:0;overflow:auto;padding:0 var(--pb-s2) var(--pb-s3);scrollbar-width:thin}
  .ds-sec{margin:var(--pb-s3) 0 var(--pb-s1);padding:0 var(--pb-s3);color:var(--pb-ink-3);font-size:var(--pb-t-sm);font-weight:var(--pb-w-bold);letter-spacing:var(--pb-track);text-transform:uppercase}
  .ds-sec[hidden]{display:none}
  .ds-sub{display:grid;gap:var(--pb-hair-w);margin:0 0 var(--pb-s3)}
  /* a row: the name, then what it is (its level) and where it comes from (Local / Library) */
  .ds-item{display:grid;gap:.125rem;padding:var(--pb-s2) var(--pb-s3);border-radius:var(--pb-r-md);color:var(--ds-mut);text-decoration:none}
  .ds-item:hover{color:var(--ds-ink);background:var(--pb-wash)}
  /* the page you are on: a wash and the bold weight — never a bar down its left edge */
  .ds-item[aria-current="page"]{background:var(--pb-wash);color:var(--ds-ink)}
  .ds-item[aria-current="page"] .t{font-weight:var(--pb-w-bold)}
  .ds-item .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ds-item-m{display:flex;align-items:center;gap:var(--pb-s2);min-width:0;color:var(--pb-ink-3);font-size:var(--pb-t-sm)}
  /* in a list the badge is quiet: the word still says it; the page's own head carries the full-contrast one */
  .ds-item .ds-badge{height:1.125rem;padding:0 var(--pb-s1);border-color:var(--pb-hair-2);color:var(--pb-ink-2);font-weight:var(--pb-w-reg)}
  .ds-item .ds-badge.is-local{background:var(--pb-wash);color:var(--pb-ink)}
  /* author `display` beats the UA's [hidden]{display:none}: say it again, or a filtered-out row stays on screen */
  .ds-item[hidden]{display:none}
  .ds-tree .pb-fbar-none{padding:var(--pb-s2) var(--pb-s3)}
  /* the source key, pinned under the tree */
  .ds-key{flex:none;display:grid;gap:var(--pb-s2);padding:var(--pb-s3);border-top:var(--pb-hair-w) solid var(--pb-hair);font-size:var(--pb-t-sm);color:var(--pb-ink-2)}
  .ds-key div{display:flex;gap:var(--pb-s2);align-items:baseline}
  /* Local = filled, Library = outlined; the word says it, the fill only repeats it */
  .ds-badge{display:inline-flex;align-items:center;height:1.25rem;padding:0 var(--pb-s2);border:var(--pb-hair-w) solid var(--pb-ink);border-radius:var(--pb-r);font-size:var(--pb-t-sm);font-weight:var(--pb-w-bold);letter-spacing:.02em;line-height:1;white-space:nowrap;flex:none}
  .ds-badge.is-local{background:var(--pb-ink);color:var(--pb-on-ink)}
  .ds-badge.is-library{background:none;color:var(--pb-ink)}
  .ds-scrim{display:none}

  /* ── a page ── */
  #ds-root{min-width:0;max-width:64rem;padding:var(--pb-s5) var(--pb-s6) var(--pb-s6)}
  [data-page][hidden]{display:none !important}
  /* the head is the shared .pb-head (pbHeadHTML, chrome.css): name · badge + level · id in mono · Push on the right */
  .ds-lvl{color:var(--pb-ink-2);font-size:var(--pb-t-md)}
  /* the component's tabs are L2 — washed text segments */
  .ds-tabs{display:flex;gap:var(--pb-s1);margin:0 0 var(--pb-s5);overflow-x:auto;scrollbar-width:none}
  .ds-tabs::-webkit-scrollbar{display:none}
  .ds-tab{display:inline-flex;flex-direction:column;justify-content:center;height:var(--pb-hit);padding:0 var(--pb-s3);border:0;border-radius:var(--pb-r-md);background:none;color:var(--pb-ink-2);font:inherit;white-space:nowrap}
  .ds-tab:hover:not([aria-selected="true"]){background:var(--pb-stage);color:var(--pb-ink)}
  .ds-tab[aria-selected="true"]{background:var(--pb-wash);color:var(--pb-ink);font-weight:var(--pb-w-bold)}
  .ds-tab::after{content:attr(data-t);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:var(--pb-w-bold)}
  .ds-panel[hidden]{display:none}
  .ds-h2{margin:var(--pb-s6) 0 var(--pb-s2);font-size:var(--pb-t-md);font-weight:var(--pb-w-bold)}
  .ds-cap{margin:var(--pb-s2) 0 0;color:var(--pb-ink-3);font-size:var(--pb-t-sm)}
  .ds-p{margin:0;color:var(--pb-ink-2);max-width:62ch}

  /* Overview: the workbench — toolbar, the live demo at a device width, the code, the props */
  .ds-wb{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--pb-s3)}
  /* the toolbar: a variant picker per enum prop · the device · (B5's Layers, in its slot) · Code */
  .ds-tools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--pb-s3) var(--pb-s4)}
  /* a picker is capped to its container: a long option label ellipsizes (the whole label is the select's title)
     instead of growing the select — and the page — past the viewport */
  .ds-tg{display:flex;align-items:center;gap:var(--pb-s2);min-width:0;max-width:100%}
  .ds-tg--seg{flex-wrap:wrap}
  .ds-tg--seg .pb-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .ds-tl{flex:none;color:var(--pb-ink-3);font:var(--pb-t-sm)/1 var(--ds-mono)}
  .ds-tools .pb-seg-btn{padding:0 var(--pb-s3)}
  /* the chosen segment is already lifted; hover still has to answer, so it takes a firmer edge */
  .cmp .pb-seg-btn[aria-checked="true"]:hover{box-shadow:0 0 0 var(--pb-hair-w) var(--pb-ink-3)}
  .ds-sel{flex:0 1 auto;min-width:0;max-width:100%;height:var(--pb-hit);padding:0 var(--pb-s2);border:var(--pb-hair-w) solid var(--pb-hair-2);border-radius:var(--pb-r-md);background:var(--pb-surface);color:var(--pb-ink);font:inherit;font-size:var(--pb-t-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ds-layers{display:flex;align-items:center;gap:var(--pb-s2)}
  .ds-layers:empty{display:none}
  .ds-codebtn{margin-left:auto}
  .ds-codebtn[aria-pressed="true"]{background:var(--pb-wash);border-color:var(--pb-ink-3);font-weight:var(--pb-w-bold)}
  .ds-spechint{display:none}
  .cmp:has([data-pb-layer="spec"].is-on) .ds-spechint{display:inline}
  .ds-note{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--pb-s1) var(--pb-s4);margin:0;color:var(--pb-ink-3);font-size:var(--pb-t-sm)}
  /* the Code view: HTML (the live demo, pretty-printed) | CSS (its styleSrc sheet) */
  .ds-code{display:grid;gap:var(--pb-s3);padding:var(--pb-s3) 0}
  .ds-code[hidden],.ds-code-pane[hidden]{display:none}
  .ds-code-seg{width:max-content;max-width:100%}
  .ds-code-pane{display:grid;gap:var(--pb-s2);min-width:0}
  .ds-code-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--pb-s2) var(--pb-s4)}
  .ds-code-h .ds-src{color:var(--pb-ink-3);font:var(--pb-t-sm)/1.4 var(--ds-mono);overflow-wrap:anywhere}
  .ds-hooks{display:inline-flex;align-items:center;gap:var(--pb-s2);color:var(--pb-ink-2);font-size:var(--pb-t-sm)}
  .ds-hooks input{width:var(--pb-ico-sm);height:var(--pb-ico-sm);margin:0;accent-color:var(--pb-ink)}
  .ds-pre{margin:0;padding:var(--pb-s3) var(--pb-s4);max-height:26rem;overflow:auto;background:var(--pb-surface);color:var(--pb-ink);border:var(--pb-hair-w) solid var(--pb-hair);border-radius:var(--pb-r-lg);font:var(--pb-t-sm)/1.55 var(--pb-mono);white-space:pre;tab-size:2;scrollbar-width:thin}
  .ds-pre code{font:inherit}
  .ds-code-sub{margin:var(--pb-s2) 0 0;font-size:var(--pb-t-md);font-weight:var(--pb-w-bold)}
  .ds-notes{margin-top:var(--pb-s6)}
  /* the stage shows the demo AT a device's width (.ds-fit, below), scaled down to fit the column */
  .stage{position:relative;margin:0;min-height:9rem;padding:var(--pb-s5);display:flex;align-items:center;justify-content:center;background:var(--ds-project-surface,var(--ds-stage));color:var(--ds-project-ink,var(--ds-ink));border:var(--pb-hair-w) solid var(--ds-line);border-radius:var(--pb-r-lg)}
  .ds-vp{flex:none;position:relative}
  .ds-fit{container:pb-screen/inline-size;width:var(--ds-spec-w,375px);max-width:100%}
  .ds-vp > .ds-fit{max-width:none;transform-origin:0 0}
  /* Every place a component renders is a `pb-screen` container (product.css), so a component's own
     @container rules answer the slot it is shown in. The demo's container is `.ds-fit`, sized to the
     device picked in the toolbar (a mobile demo answers "compact", not the column's "medium"); a
     variant cell and a specimen are containers of their own. A container has no intrinsic width,
     so each one states it. */
  .cell .box,.ds-spec-in{container:pb-screen/inline-size}
  .ds-spec-in{width:var(--ds-spec-w,375px);max-width:100%}
  .ds-spec-in > .ds-fit{width:100%}
  [data-step-pane][hidden]{display:none !important}
  /* props: the body of the "Edit props" disclosure */
  .ds-props-h{display:flex;align-items:center;justify-content:space-between;gap:var(--pb-s2);min-height:var(--pb-hit);margin-bottom:var(--pb-s1)}
  .ds-props-h span{color:var(--pb-ink-3);font-size:var(--pb-t-sm)}
  .ds-props-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:0 var(--pb-s5)}
  .ds-prop{display:grid;gap:var(--pb-s1);padding:var(--pb-s2) 0;border-top:var(--pb-hair-w) solid var(--pb-hair)}
  .ds-prop-k{display:flex;align-items:baseline;gap:var(--pb-s2);font-family:var(--ds-mono);font-size:var(--pb-t-sm);color:var(--pb-ink)}
  .ds-prop-k .ty{margin-left:auto;font-family:var(--ds-sans);color:var(--pb-ink-3)}
  .ds-prop input,.ds-prop select,.ds-prop textarea{width:100%;min-width:0;max-width:100%;height:var(--pb-hit);padding:0 var(--pb-s2);border:var(--pb-hair-w) solid var(--pb-hair-2);border-radius:var(--pb-r-md);background:var(--pb-surface);color:var(--pb-ink);font:inherit;font-size:var(--pb-t-md)}
  .ds-prop select{text-overflow:ellipsis}
  .ds-prop textarea{height:4.5rem;padding:var(--pb-s1) var(--pb-s2);font-family:var(--ds-mono);font-size:var(--pb-t-sm);resize:vertical}
  .ds-prop [aria-invalid="true"]{border-color:var(--pb-fail)}
  .ds-prop--sw{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .ds-switch{position:relative;flex:none;width:2.25rem;height:1.25rem;padding:0;border:var(--pb-hair-w) solid var(--pb-hair-2);border-radius:var(--pb-r-pill);background:var(--pb-press)}
  .ds-switch::after{content:"";position:absolute;top:.125rem;left:.125rem;width:.875rem;height:.875rem;border-radius:50%;background:var(--pb-surface);box-shadow:0 0 0 var(--pb-hair-w) var(--pb-ink-3);transition:transform var(--pb-t)}
  .ds-switch:hover{border-color:var(--pb-ink-3)}
  .ds-switch[aria-checked="true"]{background:var(--pb-ink);border-color:var(--pb-ink)}
  .ds-switch[aria-checked="true"]::after{transform:translateX(1rem);background:var(--pb-on-ink);box-shadow:none}
  .ds-props-none{margin:var(--pb-s2) 0;color:var(--pb-ink-3);font-size:var(--pb-t-sm)}
  .ds-toks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:0 var(--pb-s4)}
  .ds-tok{display:flex;align-items:center;gap:var(--pb-s3);min-height:2.5rem;padding:0 var(--pb-s2);border-radius:var(--pb-r-md);color:var(--pb-ink);text-decoration:none}
  a.ds-tok:hover{background:var(--pb-wash)}
  .ds-tok code{font-size:var(--pb-t-sm)}
  .ds-tok .v{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pb-ink-3);font-family:var(--ds-mono);font-size:var(--pb-t-sm)}
  .ds-used{display:flex;flex-wrap:wrap;gap:var(--pb-s2)}
  .ds-used a,.ds-used span{display:inline-flex;align-items:center;height:1.75rem;padding:0 var(--pb-s3);border:var(--pb-hair-w) solid var(--pb-hair-2);border-radius:var(--pb-r-md);color:var(--pb-ink-2);text-decoration:none;font-size:var(--pb-t-sm)}
  .ds-used a:hover{background:var(--pb-wash);color:var(--pb-ink)}

  /* Variants: the live grid */
  .grid{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:var(--pb-s4)}
  .cell{display:flex;flex-direction:column;gap:var(--pb-s2);min-width:0;color:var(--ds-project-ink,var(--ds-ink))}
  .cell .lab{font-family:var(--ds-mono);font-size:var(--pb-t-sm);color:var(--ds-mut)}
  .cell .box{background:var(--ds-project-surface,var(--ds-stage));color:var(--ds-project-ink,var(--ds-ink));border:var(--pb-hair-w) solid var(--ds-line);border-radius:var(--pb-r-lg);padding:var(--pb-s4);display:flex;align-items:center;justify-content:center;min-height:3.25rem;overflow:auto}
  .cell .box > *{max-width:100%}

  /* Variants & spec, and Anatomy: the LIVE specimen with an overlay the engine (runtime.js, chrome.css .pb-sp-*)
     draws from its DOM boxes, and a table beside it. The specimen is the product (.pb-product); the overlay is
     the tool, so it sits beside the product, never inside it. The whole island says color-scheme: light, so the
     tool's ink resolves to its light half on the light island in either theme. */
  .ds-anat{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--pb-s5);align-items:start}
  .ds-spec{position:relative;display:flex;justify-content:center;color-scheme:light;min-width:0;background:var(--ds-project-surface,var(--pb-stage));border:var(--pb-hair-w) solid var(--pb-hair);border-radius:var(--pb-r-lg);padding:2.75rem 2.5rem 2.5rem 3rem;overflow:hidden}
  .ds-spec-in{position:relative}
  /* room for the markers: with Anatomy on, the demo stage and a variant cell gain the margin a specimen has */
  .stage.is-anat,.ds-vc-box.is-anat{padding:2.25rem}
  /* a variant card: its live cell, and its spec table beside it (stacked when the column is narrow) */
  .ds-vbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--pb-s2) var(--pb-s4);margin:0 0 var(--pb-s4)}
  .ds-vbar .ds-cap{margin:0;flex:1 1 18rem}
  .ds-vgrid{grid-template-columns:minmax(0,1fr);gap:var(--pb-s5);container:ds-v/inline-size}
  .ds-vc{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--pb-s2) var(--pb-s4);align-items:start;padding:0 0 var(--pb-s5);border-bottom:var(--pb-hair-w) solid var(--pb-hair)}
  .ds-vc:last-child{border-bottom:0;padding-bottom:0}
  .ds-vc .lab{grid-column:1 / -1;display:flex;align-items:center;gap:var(--pb-s2)}
  .ds-vc-def{padding:0 var(--pb-s2);border:var(--pb-hair-w) solid var(--pb-hair-2);border-radius:var(--pb-r-pill);color:var(--pb-ink-2);font:var(--pb-t-sm)/1.25rem var(--pb-font)}
  .cell .ds-vc-box{position:relative;overflow:visible}
  .ds-vt{min-width:0;color:var(--pb-ink)}   /* the card is the project's ink (.cell); its table is the tool's */
  .ds-vt .ds-tw{margin-top:0}
  @container ds-v (min-width: 46rem){ .ds-vc{grid-template-columns:minmax(12rem,22rem) minmax(0,1fr)} }

    [{ name:'root', type:'container', el:els.root || {} }].concat(parts).forEach(function(p){
      if (p.type === 'instance') { out.push('/* ' + p.name + ' — instance of ' + p.instanceOf + ': its own spec */'); return; }
      var ds = partDecls(p.el);
      out.push('[data-part="' + p.name + '"] {' + (ds.length ? '\n' + ds.map(function(d){
        return d.css ? '  ' + d.css + ': ' + d.val + ';' : '  /* ' + d.k + ' ' + d.val + (d.note ? ' — ' + d.note : '') + ' */';

  /* an instance's own tokens, from the child component's sidecar: its root, then each of its own parts */
  function childTokens(kid, id){

    if (!kid || !partList(kid)) return head + '<p class="ds-cap">Not measured yet — <code>/pb:build</code> measures it.</p>';
    var els = kid.elements || {}, groups = [{ name:'root', el:els.root || {} }].concat(partList(kid).filter(function(p){ return p.type !== 'instance'; }));

    }).join('');
    return head + (rows ? '<dl class="ds-child-l">' + rows + '</dl>' : '<p class="ds-cap">It records no tokens of its own.</p>');
  }

  /* Anatomy: the live specimen, numbered, over a parts table — # · part · type · Required/Optional (and when) ·

    var rows = all.map(function(p){

        + '<td data-l="#"><span class="ds-n' + (p.root ? ' is-root' : '') + '"' + (p.root ? ' title="The root has no marker"' : '') + '>' + (p.root ? '·' : p.n) + '</span></td>'

      + '<div class="ds-ptw"><div class="ds-pbar"><p class="ds-cap">A token chip copies <code>var(--token)</code>.</p>'
      + '<button type="button" class="pb-btn pb-btn--sm" data-copy-css="' + pbEscape(c.id) + '">' + pbUiIcon('copy') + 'Copy as CSS</button></div>'
      + '<div class="ds-tw"><table class="ds-ptab"><thead><tr><th scope="col">#</th><th scope="col">Part</th><th scope="col">Type</th><th scope="col">Presence</th><th scope="col">Tokens</th></tr></thead><tbody>'

  // ── Variants & spec: each card's table, from that card's own live render ──
  function vtLen(e){ return e.tok ? '<code>' + pbEscape(e.tok) + '</code>' : pbEscape(String(e.v)); }
  function vtZero(e){ return typeof e.v === 'number' && e.v === 0; }
  function vtDash(){ return '<span class="dim">—</span>'; }
  function vtSides(a){        // [top, right, bottom, left] of {v, tok}, as the CSS shorthand would write them
    if (!a || a.every(vtZero)) return vtDash();
    var k = a.map(function(e){ return e.tok || String(e.v); }), idx = [0, 1, 2, 3];
    if (k[0] === k[2] && k[1] === k[3]) idx = k[0] === k[1] ? [0] : [0, 1];
    else if (k[1] === k[3]) idx = [0, 1, 2];
    return idx.map(function(i){ return vtLen(a[i]); }).join(' ');
  }
  function vtGap(a){
    if (!a) return vtDash();

  function vtColour(e){

  }
  var VT_COLS = [['padding','Padding',function(r){ return vtSides(r.pd); }], ['margin','Margin',function(r){ return vtSides(r.mg); }],
                 ['gap','Gap',function(r){ return vtGap(r.gap); }], ['radius','Radius',function(r){ return vtSides(r.rad); }],
                 ['fill','Fill',function(r){ return vtColour(r.fill); }], ['text','Text',function(r){ return vtColour(r.text); }]];
  /* the card's table; `defRows` are the default variant's (null on the default card itself) — a value that
     differs from its counterpart there is highlighted, and so is a part the default variant does not render */
  function renderVTable(card, rows, defRows){
    var by = {}; (defRows || []).forEach(function(r){ by[r.name] = r; });
    var body = rows.map(function(r){
      var d = defRows ? by[r.name] : null, nm = '<th scope="row">' + pbEscape(r.name) + '</th>';

        + '<td colspan="6" class="dim">instance of <code>' + pbEscape(r.instanceOf) + '</code> · margin ' + vtSides(r.mg) + '</td></tr>';
      return '<tr data-part-row="' + pbEscape(r.name) + '">' + nm.replace('<th', '<th' + (newPart ? ' class="is-diff"' : '')) + VT_COLS.map(function(col){
        var h = col[2](r), dh = d && d.shown && d.type !== 'instance' ? col[2](d) : null;

  // ── the overlay: the engine in runtime.js (pbSpec*) draws it from the LIVE boxes, never from stored coordinates ──

  // ── the tree ────────────────────────────────────────────────────────────────────
  /* Two plain labels — Components, Foundations — over their rows. A component row is its name, plus

        + '<span class="t">'+pbEscape(nameOf(c))+'</span>'+(isLibrary(c) ? '' : '<span class="ds-item-m">'+badge(c)+'</span>')+'</a>';

      h += '<a class="ds-item" data-f="'+pbEscape(g.label.toLowerCase())+'" href="#/f/'+g.key+'" data-to="f/'+g.key+'"><span class="t">'+g.label+'</span>'
        + '<span class="ds-item-m"><span class="lv">'+g.list.length+' token'+(g.list.length === 1 ? '' : 's')+'</span></span></a>';

      + '<div><span class="ds-badge is-local">Local</span><span>Built in this project only.</span></div>'

  /* what the shared bar filters: every row, with its source as the one facet (re-run on each keystroke) */
  function treeItems(){

  /* ── narrow: the tree is a drawer from the bar's "Components" button ── */

  /* ── One page at a time, by hash: #/c/<id>, #/c/<id>/<tab>, #/f/<kind>. All pages stay in the DOM

    var key = cur.getAttribute('data-page'), isC = key.charAt(0) === 'c';

  // ── the shared chrome (runtime.js): project button + menu, Project settings, ⌘K ──

        + '<span class="pb-bar-lb">Prototype</span></a>';

  function openSettings(returnFocus, after){
    pbUiOpenSettings({
      meta: (PB_REGISTRY && PB_REGISTRY.meta) || {}, viewOnly: VIEW_ONLY, returnFocus: returnFocus,

        d.close();
        openSettings(page && page.querySelector('.push'), function(){ openPush(id); });
      }
    });
    d.addEventListener('close', function(){
      if (d.isConnected) setTimeout(function(){ if (!d.open) d.remove(); }, 0);
      var b = page && page.querySelector('.push'); if (b && !document.querySelector('dialog[open]')) b.focus();
    });
    d.showModal();
    d.querySelector('[data-close]').focus();
  }

  buildDS();
</script>
</body>
</html>
