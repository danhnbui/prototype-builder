    .erd-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .erd-entity-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
    .erd-entity-head .erd-entity-title { margin:0; }
    .erd-entity-variants { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .erd-fixed { table-layout:fixed; }
    .erd-fixed th:nth-child(1), .erd-fixed td:nth-child(1) { width:24%; }
    .erd-fixed th:nth-child(2), .erd-fixed td:nth-child(2) { width:20%; }
    .erd-fixed th:nth-child(3), .erd-fixed td:nth-child(3) { width:28%; }
    .erd-fixed th:nth-child(4), .erd-fixed td:nth-child(4) { width:28%; }
    .erd-fixed td { word-break:break-word; }
    .erd-legend-mini svg { width:38px; height:12px; display:block; }
    .erd-legend-svgwrap { display:inline-flex; width:56px; flex-shrink:0; }
    .erd-legend-svgwrap svg { width:56px; height:14px; }
      /* ── UX Design sub-tabs: Logic · Information Architecture · User Flow · Test Cases ──── */
    .ux-subtabs { margin: 0 0 12px; }
    .ux-scroll-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .ux-scroll-wrap > .summary-scroll { flex: 1; min-height: 0; overflow: auto; padding-right: 8px; }
    /* IA (job list | site map) and User Flow (canvas | stories) are two-pane rows inside the
       same tabstrip-on-top shell — each pane scrolls on its own, the row itself does not. */
    .ux-scroll-wrap > .ia-layout,
    .ux-scroll-wrap > .ux-flow-body { flex: 1; min-height: 0; overflow: hidden; }
    /* The section heading spans both columns; only the grid below it flexes to fill the viewport. */
    .ia-head { flex: 0 0 auto; }
    .ia-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }
    .ia-jobs-col, .ia-map-col { min-height: 0; overflow: auto; padding-right: 8px; }
    /* The job list can be empty while the derived site map beside it is full — the empty state
       lives in the column, so it drops the centered page-width framing. */
    .ia-jobs-col .empty-state { max-width: none; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 32px 28px; }
    .ux-flow-body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 26vw, 400px); gap: 24px; align-items: stretch; }
    .lg-views { display: flex; align-items: center; gap: 4px; margin: 4px 0 16px; }
    .lg-view {
      border: 1px solid var(--border); background: transparent; color: inherit;
      font: inherit; font-size: var(--font-size-s); padding: 5px 12px;
      border-radius: 999px; cursor: pointer;
    }
    .lg-view.active { background: var(--brand, #4f46e5); color: #fff; border-color: transparent; }
    .lg-stats { margin-left: auto; font-size: var(--font-size-xs); color: var(--text-tertiary); }
    .lg-warn { color: #c2410c; font-weight: var(--font-weight-bold); }
    .lg-dim { color: var(--text-tertiary); font-size: var(--font-size-xs); }
    .lg-link { color: var(--brand, #4f46e5); text-decoration: none; }
    .lg-link:hover { text-decoration: underline; }
    .lg-link--write { font-weight: var(--font-weight-bold); }
    .lg-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin: 0 0 18px; }
    /* `.meta-h3` carries margin-top:28px to separate sections in a scrolling document. As a card's
       FIRST child that margin is padding the card a second time — 43px above the heading against
       15px below the last row. Collapse the outer margins; the card's own padding is the spacing. */
    .lg-card > :first-child, .ia-card > :first-child, .lg-detail > :first-child,
    .ct-term > :first-child, .ia-node > :first-child { margin-top: 0; }
    .lg-card > :last-child, .ia-card > :last-child, .lg-detail > :last-child,
    .ct-term > :last-child, .ia-node > :last-child { margin-bottom: 0; }
    .lg-chip { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 999px; background: rgba(127,127,127,.12); vertical-align: middle; }
    .lg-chip--kind { background: rgba(79,70,229,.12); color: var(--brand, #4f46e5); }
    .lg-chip--save { background: rgba(22,163,74,.15); color: #15803d; }
    .lg-chip--dead { background: rgba(194,65,12,.15); color: #c2410c; text-decoration: line-through; }
    .lg-c-yes { background: rgba(22,163,74,.15); color: #15803d; }
    .lg-c-no { background: transparent; color: var(--text-tertiary); }
    .lg-c-edit { background: rgba(22,163,74,.15); color: #15803d; }
    .lg-c-read { background: rgba(79,70,229,.12); color: var(--brand, #4f46e5); }
    .lg-c-hidden { background: rgba(127,127,127,.12); color: var(--text-tertiary); }
    .lg-svg-wrap { overflow-x: auto; margin: 8px 0 12px; }
    .lg-st { fill: rgba(79,70,229,.06); stroke: var(--brand, #4f46e5); stroke-width: 1.2; }
    .lg-st-t { font-size: 13px; font-weight: 600; text-anchor: middle; fill: currentColor; }
    .lg-st-k { font-size: 11px; text-anchor: middle; fill: var(--text-tertiary); font-family: var(--font-mono, ui-monospace, monospace); }
    .lg-arrow { stroke: var(--text-tertiary); stroke-width: 1.4; fill: none; }
    .lg-arrow--back { stroke-dasharray: 4 3; }
    .lg-arrow-head { fill: var(--text-tertiary); }
    /* Scope, not state. A band is a SPAN: square corners (a pill reads as another node), a dashed
       top and bottom so it never competes with the solid state boxes, and solid end caps so you can
       see exactly where the condition starts and stops holding. */
    .lg-ov { fill: rgba(194,65,12,.08); stroke: #c2410c; stroke-width: 1; stroke-dasharray: 4 3; }
    .lg-ov--alt { fill: rgba(194,65,12,.16); }
    .lg-ov-cap { stroke: #c2410c; stroke-width: 2; }
    .lg-ov-t { font-size: 11px; text-anchor: start; fill: #c2410c; font-weight: 600; }
    /* The line between the two zones, and the words for which is which. */
    .lg-axis { stroke: var(--border); stroke-width: 1; }
    .lg-zone { font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
      fill: var(--text-tertiary); text-anchor: start; }
    .lg-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-s); margin: 6px 0 12px; }
    .lg-table th { text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .lg-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .lg-tr-ov td { background: rgba(194,65,12,.04); }
    .lg-st--dead { stroke: #c2410c; stroke-dasharray: 4 3; fill: rgba(194,65,12,.06); }
    .lg-tr-dead td { background: rgba(194,65,12,.06); }
    .lg-matrix td, .lg-matrix th { text-align: center; }
    .lg-matrix td:first-child, .lg-matrix th:first-child { text-align: left; }
    .lg-ripple { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
    /* The filter input is rendered once, outside the repainted region — the same rule as the
       Data tab's search. Focus is structurally safe, not restored. */
    .lg-list-wrap { border: 1px solid var(--border); border-radius: 12px; padding: 10px; max-height: 70vh; overflow: auto; position: sticky; top: 0; }
    .lg-search { width: 100%; box-sizing: border-box; font: inherit; font-size: var(--font-size-s); padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; margin-bottom: 8px; }
    .lg-group-h { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin: 10px 6px 4px; }
    .logic-row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: var(--font-size-s); }
    .logic-row:hover { background: rgba(127,127,127,.10); }
    .logic-row.active { background: rgba(79,70,229,.12); color: var(--brand, #4f46e5); }
    .logic-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lg-detail { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-height: 300px; }
    .lg-sec { margin: 12px 0; }
    .lg-sec-h { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px; }
    .lg-line { padding: 3px 0; font-size: var(--font-size-s); }
    /* A superseded trade-off stays readable — it is the record of a decision that was reversed,
       which is worth more than a deletion — but must never read as current. */
    .lg-card--sup { opacity: .62; border-style: dashed; }
    .tw-opts { margin: 2px 0 0; padding-left: 20px; font-size: var(--font-size-s); line-height: 1.55; }
    /* Information Architecture */
    .ia-roles { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
    .ia-stats { margin: 0 0 16px; font-size: var(--font-size-xs); color: var(--text-tertiary); }
    /* flex:0 0 auto — a role dot lives in flex rows (.ia-node-t, .ia-jrow); with the default
       shrink a long title squashes it into an ellipse instead of truncating the title. */
    .ia-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; flex: 0 0 auto; }
    .ia-job { display: inline-flex; align-items: center; gap: 2px; font-size: var(--font-size-s); line-height: 20px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: rgba(127,127,127,.05); margin: 0 6px 6px 0; }
    .ia-job--new { border-style: dashed; border-color: #c2410c; background: rgba(194,65,12,.06); }
    .ia-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
    /* A flagged row stays in the list; the warning rail is what marks it, not a separate box. */
    .ia-new-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .ia-jrow-why { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
                   flex-wrap: wrap; margin-top: 8px; }
    .ia-jrow-why > .lg-dim { flex: 1 1 300px; min-width: 0; line-height: 1.45; }
    .ia-jrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); font-size: var(--font-size-s); line-height: 1.45; }
    .ia-jrow--new { background: rgba(194,65,12,.045); border-left: 2px solid #c2410c;
                    padding-left: 10px; padding-right: 10px; border-radius: 0 6px 6px 0; }
    .ia-jrow--new .ia-jrow-text { color: #c2410c; }
    .ia-jrow--new .ia-jrow-text em { color: inherit; opacity: .78; }
    .ia-jrow-text em { font-style: normal; color: var(--text-secondary, #555); }
    .ia-jrow-meta { white-space: nowrap; }
    .ia-map-head, .ia-map-row { display: grid; gap: 12px; align-items: start; }
    .ia-map-head { margin: 10px 0 6px; }
    .ia-layer { border-top: 3px solid var(--brand, #4f46e5); padding: 8px 2px 6px; }
    .ia-layer--ov { border-top-color: #c2410c; margin-top: 14px; }
    .ia-layer-n { font-weight: var(--font-weight-bold); font-size: var(--font-size-s); }
    .ia-layer-p { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 4px; line-height: 1.4; }
    .ia-layer-r, .ia-layer-so { margin-top: 4px; font-size: var(--font-size-xs); line-height: 1.4; }
    .ia-map-row { position: relative; border-top: 1px dashed var(--border); padding: 14px 0 8px; }
    .ia-map-group { position: absolute; top: -9px; left: 0; background: var(--bg-page, #fff); padding: 0 6px 0 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); }
    .ia-node { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; cursor: pointer; background: rgba(79,70,229,.03); }
    .ia-node:hover { border-color: var(--brand, #4f46e5); }
    .ia-node--empty { border-style: dashed; border-color: #c2410c; background: rgba(194,65,12,.03); }
    .ia-node-t { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-s); }
    .ia-node-j { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .ia-mini { font-size: 11px; line-height: 16px; padding: 1px 7px; border-radius: 999px; background: rgba(127,127,127,.10); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ia-node-ov { margin-top: 6px; font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .ia-ov { font-size: 11px; padding: 0 6px; border-radius: 6px; border: 1px dashed #c2410c; color: #c2410c; cursor: pointer; }
    .ia-from { font-size: 11px; margin: 0 0 2px 4px; }
    .ia-orphans { margin-top: 8px; font-size: var(--font-size-xs); }
    /* Site map as an org chart: a fixed-height canvas the user pans/zooms inside, so a deep tree
       never stretches the column. HTML nodes over an SVG edge layer — the nodes keep their styling,
       hover and click, which is what a pure-SVG chart would have cost. */
    .ia-map-col { display: flex; flex-direction: column; overflow: hidden; }
    .ia-map-title { flex: 0 0 auto; margin-bottom: 8px; }
    .ia-canvas { flex: 1 1 auto; min-height: 260px; height: auto; }
    .ia-stage { pointer-events: none; }
    .ia-edges { position: absolute; inset: 0; }
    .ia-edge { fill: none; stroke: var(--text-tertiary); stroke-width: 1.4; }
    .ia-rowline { stroke: var(--border); stroke-dasharray: 3 5; }
    .ia-rowlab { position: absolute; left: 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
                 color: var(--text-tertiary); line-height: 1.3; pointer-events: auto; cursor: help; }
    .ia-rowlab-n { display: block; font-size: 10px; opacity: .8; }
    .ia-node--card { position: absolute; margin: 0; box-sizing: border-box; overflow: hidden;
                     pointer-events: auto; background: var(--neutral-0, #fff); cursor: default; }
    .ia-node--card:hover { border-color: var(--border); }
    /* Text wraps; nothing is ever cut. The card's height is computed to hold it. */
    .ia-node--card .ia-node-t { align-items: flex-start; }
    .ia-node--card .ia-node-t > strong { min-width: 0; overflow-wrap: anywhere; }
    .ia-node--card .ia-node-t .ia-dot { margin-top: 5px; }
    .ia-node-id { font-size: 11px; overflow-wrap: anywhere; line-height: 1.35; }
    .ia-node--ov .ia-node-t { overflow-wrap: anywhere; line-height: 1.35; }
    .ia-node-m { font-size: 11px; color: var(--text-tertiary); margin-top: 4px;
                 display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ia-node-go { flex: 0 0 auto; font: inherit; font-size: 10px; line-height: 16px; padding: 0 7px;
                  border: 1px solid var(--border); border-radius: 999px; background: transparent;
                  color: var(--brand, #4f46e5); cursor: pointer; white-space: nowrap; opacity: 0; transition: opacity .12s; }
    .ia-node--card:hover .ia-node-go, .ia-node-go:focus-visible { opacity: 1; }
    .ia-node-go:hover { background: rgba(79,70,229,.10); border-color: var(--brand, #4f46e5); }
    .ia-rail-toggle { font: inherit; font-size: 10px; line-height: 14px; padding: 0 4px; margin-right: 2px;
                      border: 1px solid var(--border); border-radius: 4px; background: transparent;
                      color: inherit; cursor: pointer; }
    .ia-rail-toggle:hover { border-color: #c2410c; color: #c2410c; }
    .ia-rowlab--ov { color: #c2410c; }
    /* Overlays: dashed like the chips they replaced, so a drawer never reads as a screen. */
    .ia-edge--ov { stroke: #c2410c; stroke-dasharray: 3 4; opacity: .65; }
    .ia-rowline--ov { stroke: #c2410c; opacity: .45; }
    .ia-node--ov { border-style: dashed; border-color: #c2410c; background: rgba(194,65,12,.04); }
    .ia-node--ov .ia-node-t { color: #c2410c; font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; }
    /* The job list carries its own heading; the frame around it was one border too many. */
    .ia-card--flat { border: 0; padding: 0; }
    /* Content — glossary + wording deck */
    .ct-filter { margin-left: auto; width: 200px; font: inherit; font-size: var(--font-size-s); padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; }
    .ct-terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    /* Flex column so the rule link can sit on the card's BOTTOM edge (margin-top:auto) rather
       than in the header, where a long rule title wrapped and shoved the term name around. */
    .ct-term { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; }
    .ct-term-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .ct-en { font-size: var(--font-size-xs); color: var(--text-tertiary); }
    .ct-def { margin: 6px 0 0; font-size: var(--font-size-s); line-height: 1.5; }
    .ct-line { margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .ct-rule-line { margin-top: auto; padding-top: 10px; }
    .ct-rule { font-size: var(--font-size-xs); }
    .ct-aka, .ct-avoid { font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 999px; }
    .ct-aka { background: rgba(127,127,127,.12); }
    .ct-avoid { background: rgba(194,65,12,.10); color: #c2410c; text-decoration: line-through; }
    .ct-group { margin-bottom: 18px; }
    .ct-group-h { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 2px; }
    .ct-table { table-layout: fixed; }
    .ct-key { width: 26%; }
    .ct-key code { font-size: var(--font-size-xs); color: var(--text-tertiary); }
    .ct-text { width: 40%; font-weight: var(--font-weight-bold); }
    .ct-note { color: var(--text-tertiary); font-size: var(--font-size-xs); }
  </style>

  <!-- Mermaid CDN — used by the ERD tab. Keep this even if you don't ship ERD;
       it's a small script and lets agents toggle it on at any time. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <!-- Third-party scripts a project DECLARES in registry.runtime[] (entries with a `url`).
       render.py replaces this marker; an empty runtime[] leaves it exactly as it is. -->
  <!--__PB_RUNTIME_DEPS__-->
</head>

<body>
  <div id="meta-nav"></div>
  <div id="app"></div>

  <script>
    /* =========================================================================
       STATE LOADER (v1.1.1) — state lives in registry.json, NOT here.
       /pb:build --render inlines registry.json into PB_REGISTRY below (replacing
       the null between the markers). adaptRegistryToPBData() maps the registry
       schema onto the PB_DATA shape every render function already reads, so the
       render machinery is unchanged. A null registry → the empty default,
       identical to a blank template. Runtime UI mutations (view / selection) land
       on the in-memory PB_DATA only and never write back to registry.json.
       ========================================================================= */
    const PB_REGISTRY = /*__PB_REGISTRY_START__*/ null /*__PB_REGISTRY_END__*/;
    /* The derived logic graph (render.py's load_logic). Absent on an older project or a
       hand-off rendered before it existed — every view that reads it degrades to an empty
       state rather than breaking. */
    const PB_LOGIC = /*__PB_LOGIC_START__*/ null /*__PB_LOGIC_END__*/;
    window.PB_LOGIC = PB_LOGIC;
    const PB_SHELL_VERSION = "{{PB_SHELL_VERSION}}";   /* filled by render.build_html; 'unknown' if unfilled */

    function pbEmptyData() {
      return {
        overview: { objectives: null, principles: [] },
        userInsights: { quantitative: null, researchSummary: null, executiveSummary: null },
        handoff: { view: 'component', organisms: [], screens: [], selectedScreenId: null, selectedElementId: null },
        flow: { populated: false },
        erd: { populated: false },
        content: { terms: [], strings: [] },
      };
    }

    // registry.json schema → PB_DATA shape. `components` are the handoff organisms
    // (same object shape); `meta.*` carries the Project Summary content.
    function adaptRegistryToPBData(reg) {
      if (!reg) return pbEmptyData();
      const d = pbEmptyData();
      const m = reg.meta || {};
      if (m.overview)     d.overview     = m.overview;
      if (m.userInsights) d.userInsights = m.userInsights;
      d.handoff.organisms = reg.components || [];
      d.handoff.screens   = reg.screens || [];
      if (reg.flow) d.flow = reg.flow;
      if (reg.erd)  d.erd  = reg.erd;
      if (reg.content) d.content = reg.content;
      return d;
    }

    // ── W3C DTCG token resolver (mirrors pb/tools/tokens.py) ────────────────────────────
    // registry.tokens is a W3C Design Tokens document: each token is { $value, $type? };
    // a group is a nested object (no $value); "{a.b}" is an alias. The doc is usually flat
    // (name == CSS var), but a cloned DS may be nested with aliases. Legacy { value, kind }
    // tokens are still read (graceful degrade, NS6) so an un-migrated registry still styles.
    /* The shared runtime lives in pb/template/runtime.js — ONE copy, injected here and
       into design-system.html by render.py so both sites render components identically.
       It used to be pasted in below, 291 lines that had to be kept in step by hand. */
/*__PB_RUNTIME__*/

    const PB_DATA = adaptRegistryToPBData(PB_REGISTRY);

    /* =========================================================================
       STATE — minimal app state
       Add your prototype's state fields below the metaView line.
       ========================================================================= */
    const state = {
      metaView: 'prototype',          // 'prototype' | 'summary' | 'flow' | 'handoff' | 'erd'
      summarySubTab: 'overview',      // 'overview' | 'insights'
      handoffDrawerOpenFor: null,     // null | <organism.id> — opens right-side drawer (v0.3.0)
      handoffDrawerSegment: 'anatomy', // 'anatomy' | 'spec' | 'uiLogic' | 'usage' (v0.3.17)
      screenDrawerOpenFor: null,      // null | element.id — screen-view element drawer (v0.3.18)
      screenDrawerSegment: 'spec',    // 'spec' | 'uiLogic' | 'demo' (v0.3.18)
      protoDevice: null,              // 'monitor' | 'laptop' | 'tablet' | 'mobile' — defaults from meta.device
      protoShell: null,               // 'browser' | 'app' | 'none' — display chrome; defaults from meta.shell
      protoDeviceB: null,             // compare mode: a SECOND device showing the same screen (v2.0.0)
      protoHistory: [],               // screen-id stack for the browser back button
      handoffScope: null,            // 'global' | 'local' — UI Design component sub-tab
      erdView: null,                 // 'diagram' | 'table' — Data tab view mode
      erdVariant: {},                // { <entity>: 'schema' | <mock label> } — per-table data set (4.4)
      contentView: null,             // Content sub-view: 'terms' | 'strings'
      iaOverlaysOpen: true,          // site map: show the overlay rail (collapsible — it is the busiest one)
      tcOpen: null,                  // Test Cases: the card whose detail panel is open ('g4' | 's0-1')
      uxView: null,                  // UX Design sub-tab: 'ia' | 'flow' | 'logic' (D-14)
      iaRole: 'all',                 // Information Architecture role filter
      logicView: null,               // 'rules' | 'ripple'
      logicFocus: null,              // { type: 'handler'|'slice'|'item', id }
      erdQuery: '',                  // the Data-tab filter text (D-24). Survives a view repaint
                                     // because the input is rendered into the toolbar, not the rows.
      flowIndex: 0,                  // index into flow.flows[] (multi-flow dropdown)
      activeRole: null,              // resolved meta.defaultRole — the role the sandbox previews as (v1.5)
      /* TODO: add your app state here, e.g.:
         user: null,
         currentScreen: 'home',
         items: [],
      */
    };

    const $  = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    /* Icon helper (DS-agnostic) — set the icon source via registry config.iconCdn (e.g. your
       design system's SVG CDN). Leave it unset to fall back to an inline SVG placeholder. */
    const ICON_CDN = (PB_REGISTRY && PB_REGISTRY.config && PB_REGISTRY.config.iconCdn) || '';
    /* View-only mode (set by /pb:handoff --people): hides every authoring CTA. */
    const VIEW_ONLY = !!(PB_REGISTRY && PB_REGISTRY.config && PB_REGISTRY.config.viewOnly);
    function safeIcon(name, size = 16) {
      if (ICON_CDN) {
        return `<img src="${ICON_CDN}${name}.svg" width="${size}" height="${size}" alt=""
          style="display:inline-block;vertical-align:middle;flex-shrink:0">`;
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true"
        style="display:inline-block;vertical-align:middle;flex-shrink:0">
        <rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
    }

    /* =========================================================================
       RENDER — top-level dispatcher
       ========================================================================= */
    function render() {
      renderMetaNav();
      if (state.metaView === 'prototype') renderPrototype();
      else renderMetaPanel();
    }

    /* =========================================================================
       META-NAV — 4-tab bar at the top
       ========================================================================= */
    function renderMetaNav() {
      const tabs = [
        ['prototype', 'Prototype'],
        ['summary',   'Project Summary'],
        ['flow',      'UX Design'],
        ['erd',       'Data'],
      ];
      const el = document.getElementById('meta-nav');
      if (!el) return;
      el.className = 'meta-nav';
      el.innerHTML = tabs.map(([id, label]) =>
        `<button class="meta-tab ${state.metaView === id ? 'active' : ''}"
                 onclick="setMetaView('${id}')">${label}</button>`
      ).join('') + pbDsLink() +
        `<button class="meta-sandbox" onclick="openSandboxMenu(this)" aria-haspopup="dialog" aria-label="Sandbox tools">
           <svg class="meta-sandbox-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h8M16 7h4M4 12h3M11 12h9M4 17h10M18 17h2"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg><span>Sandbox</span>
           <svg class="meta-sandbox-car" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
         </button>`;
    }

    /* One registry, two sites — and until now only one of them was reachable. Links to the
       design-system site served beside this one by /pb:preview.

       Two constraints, both load-bearing:
       - It must NOT carry `.meta-tab`. Two tests assert that class appears exactly 4 times;
         this is a second SITE, not a fifth tab, so `.meta-ds-link` is the honest class anyway.
       - It is PROTOCOL-GATED. A `--people` hand-off is opened over file://, where there is no
         server and /design-system 404s. A link that is dead in the most-shared artifact pb
         produces is worse than no link. */
    function pbDsLink() {
      if (!/^https?:$/.test(location.protocol)) return '';
      /* Opens in a NEW TAB. The two sites are peers, not a flow: you go to the workbench to
         check a component and come back to the screen you were reading, and a same-tab jump
         costs you the tab, the scroll and the active role. `rel="noopener"` because
         `target="_blank"` otherwise hands the opened page a live `window.opener`. */
      return `<a class="meta-ds-link" href="/design-system" target="_blank" rel="noopener"
            title="The component workbench — every component as a live demo + variant grid. Opens in a new tab.">
           <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
           <span>Design system</span>
           <svg class="meta-ds-out" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>
         </a>`;
    }

    function setMetaView(v) { state.metaView = v; render(); window.scrollTo({top: 0}); }
    function setSummarySubTab(v) { state.summarySubTab = v; renderMetaSummary(); }
    function setHandoffScope(v) { state.handoffScope = v; renderHandoff(); }
    function setErdView(v) { state.erdView = v; renderMetaERD(); }
    function setErdVariant(entity, key) { state.erdVariant = state.erdVariant || {}; state.erdVariant[entity] = key; renderMetaERD(); }
    function setFlowIndex(i) { state.flowIndex = parseInt(i, 10) || 0; renderMetaFlow(); }
    function openHandoffDrawer(id) { state.handoffDrawerOpenFor = id; state.handoffDrawerSegment = 'anatomy'; renderHandoff(); }
    function closeHandoffDrawer() { state.handoffDrawerOpenFor = null; renderHandoff(); }
    function setHandoffDrawerSegment(s) { state.handoffDrawerSegment = s; renderHandoff(); }
    function openScreenDrawer(id) { state.screenDrawerOpenFor = id; state.screenDrawerSegment = 'spec'; renderHandoff(); }
    function closeScreenDrawer() { state.screenDrawerOpenFor = null; renderHandoff(); }
    function setScreenDrawerSegment(s) { state.screenDrawerSegment = s; renderHandoff(); }
    function openComponentTab(orgId) { state.screenDrawerOpenFor = null; setHandoffView('component'); setTimeout(function(){ openHandoffDrawer(orgId); }, 60); }

    /* Copy a command to clipboard + show a toast + flash the source button.
       `btn` is optional — pass the clicked button element for inline ✓ Copied feedback.
       `dest` is optional — 'claude' | 'terminal' | 'auto' (default). Auto-detect by
       command prefix: starts with '/' → Claude Code; else → Terminal. (v0.3.3) */
    function copyAndToast(command, label, btn, dest) {
      const destination = (function () {
        const d = (dest || 'auto').toLowerCase();
        if (d === 'claude') return 'Claude Code';
        if (d === 'terminal') return 'Terminal';
        return command.trim().startsWith('/') ? 'Claude Code' : 'Terminal';
      })();
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = command;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { /* silent */ }
        document.body.removeChild(ta);
      };
      const flashBtn = () => {
        if (!btn || btn._syncFlashing) return;
        btn._syncFlashing = true;
        const original = btn.innerHTML;
        btn.innerHTML = '✓ Copied';
        btn.classList.add('is-copied');
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = original;
          btn.classList.remove('is-copied');
          btn.disabled = false;
          btn._syncFlashing = false;
        }, 1500);
      };
      const showToast = (ok) => {
        document.querySelectorAll('.sync-toast').forEach(prev => prev.remove());
        const t = document.createElement('div');
        t.className = 'sync-toast';
        t.textContent = ok
          ? `Copied — paste with ⌘V to run "${command}"`
          : `Copy failed. Command: ${command}`;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add('is-visible'), 10);
        setTimeout(() => {
          t.classList.remove('is-visible');
          setTimeout(() => t.remove(), 220);
        }, 5000);
      };
      flashBtn();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(command).then(() => showToast(true), () => { fallback(); showToast(true); });
      } else {
        fallback(); showToast(true);
      }
    }

    /* Esc closes the handoff drawer. */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (state.handoffDrawerOpenFor) closeHandoffDrawer();
        else if (state.screenDrawerOpenFor) closeScreenDrawer();
      }
    });

    /* ===========================================================================
       v0.3.5 — Copy popover. Replaces the old fire-and-forget toast for sync /
       generate CTAs. Opens an anchored card with the command, a copy icon,
       a "✓ Copied" status line, and clear destination guidance (Claude Code
       conversation vs Terminal). Auto-copies on open; users can re-copy via
       the icon button. Close: × / click outside / Esc.
       =========================================================================== */
    const COPY_POPOVER_ICONS = {
      copy:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      claude:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
      terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="6 9 9 12 6 15"/><line x1="12" y1="15" x2="16" y2="15"/></svg>',
      close:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
    };

    /* v0.3.7 — One command, two representations.
       Terminal gets the slash form. Chat input gets a short natural-language
       prompt that mentions the command name as a keyword — Claude follows
       the routing rule in CLAUDE.md to find and execute the actual body. */

    const COMMAND_HINTS = {
      '/pb:init':        'Scaffold the project — PRD intake, stack + DS locks, seeds registry.json.',
      '/pb:specify':     'Write the spec — prototype-shaped user stories with JTBD and tab mapping.',
      '/pb:clarify':     'Capture user insights and UI-logic trade-offs into the Project Summary.',
      '/pb:plan':        'Generate the implementation plan and per-tab task breakdown.',
      '/pb:build':       'Patch registry.json (trio-gated). Add --render to regenerate prototype.html.',
      '/pb:preview':     'Start the live dev server — watches registry.json and live-reloads the browser.',
      '/pb:plan --flow':   'Generate the UX Design tab — Mermaid wireflow + QA test checklist.',
      '/pb:plan --data':    'Generate the Data tab — field/type table + Mermaid ERD with PK/FK guardrails.',
      '/pb:test --drift': 'Audit the trio against the constitution. Read-only — no writes.',
      '/pb:handoff':    '--people for a view-only prototype, --context for a portable bundle.',
      '/pb:handoff --tier=host':    'Wrap prototype.html in a runnable Vite/Next reference build.',
      '/pb:update-version': 'Run versioned schema updates. Dry-run by default; use --apply to execute.',
    };

    const CHAT_PROMPTS = {
      '/pb:init':        'Run /pb:init to scaffold this project — PRD intake, set the Stack + DS locks, seed registry.json + memory/.',
      '/pb:specify':     'Run /pb:specify to produce the spec/PRD — prototype-shaped user stories with JTBD and the tabs each affects.',
      '/pb:clarify':     'Run /pb:clarify to capture user insights + UI-logic trade-offs into the Project Summary and decisions.md.',
      '/pb:plan':        'Run /pb:plan to produce the implementation plan + a per-tab task breakdown (each task: acceptance + skill).',
      '/pb:build':       'Run /pb:build to apply a targeted registry.json patch (trio-gated); add --render to regenerate prototype.html.',
      '/pb:preview':     'Run /pb:preview to start the live dev server — it watches registry.json + render/*.js and reloads the browser.',
      '/pb:plan --flow':   'Run /pb:plan --flow to (re)generate the UX Design tab — a Mermaid wireflow plus a QA test checklist.',
      '/pb:plan --data':    'Run /pb:plan --data to (re)generate the Data tab — a field/type/example table plus a Mermaid erDiagram (PK/FK/cardinality guardrails).',
      '/pb:test --drift': 'Run /pb:test --drift to audit the trio (screens, components, logic) against the constitution (report-only, no writes).',
      '/pb:handoff':    'Run /pb:handoff --people for a view-only self-documenting prototype.html, or --context for a portable bundle.',
      '/pb:handoff --tier=host':    'Run /pb:handoff --tier=host to scaffold a runnable reference build from prototype.html.',
      '/pb:update-version': 'Run /pb:update-version to apply a versioned registry schema update (dry-run by default; --apply to execute).',
    };
    function chatPromptFor(slashCommand) {
      if (CHAT_PROMPTS[slashCommand]) return CHAT_PROMPTS[slashCommand];
      const bare = slashCommand.replace(/^\//, '');
      return `Run ${bare} in this Claude Code session.`;
    }

    function copyCommandToClipboard(command) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(command).catch(() => copyCommandFallback(command));
      }
      copyCommandFallback(command);
      return Promise.resolve();
    }
    function copyCommandFallback(command) {
      const ta = document.createElement('textarea');
      ta.value = command;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* silent */ }
      document.body.removeChild(ta);
    }
    function escapeHtmlAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function openCopyPopover(command, anchorBtn, dest) {
      const hint = COMMAND_HINTS[command.trim()];
      copyAndToast(command, hint || null, anchorBtn, dest);
    }

    function closeCopyPopover() {
      const pop = document.querySelector('.copy-popover');
      const bd  = document.querySelector('.copy-popover-backdrop');
      if (pop) {
        pop.classList.remove('is-visible');
        setTimeout(() => { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 180);
      }
      if (bd && bd.parentNode) bd.parentNode.removeChild(bd);
      window.removeEventListener('keydown', copyPopoverKeyHandler);
      window.removeEventListener('resize', repositionCopyPopover);
      copyPopoverAnchor = null;
    }
    function copyPopoverKeyHandler(e) {
      if (e.key === 'Escape') closeCopyPopover();
    }

    let copyPopoverAnchor = null;
    function positionCopyPopover(pop, anchorBtn) {
      copyPopoverAnchor = anchorBtn;
      if (!anchorBtn) {
        pop.style.top  = '90px';
        pop.style.left = (window.innerWidth / 2 - pop.offsetWidth / 2) + 'px';
        return;
      }
      const aRect = anchorBtn.getBoundingClientRect();
      const pW = pop.offsetWidth  || 360;
      const pH = pop.offsetHeight || 220;
      const gap = 10;
      const margin = 12;

      let top  = aRect.bottom + gap;
      if (top + pH > window.innerHeight - margin) {
        top = Math.max(margin, aRect.top - pH - gap);
      }
      let left = aRect.left + aRect.width / 2 - pW / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pW - margin));

      pop.style.top  = top + 'px';
      pop.style.left = left + 'px';
    }
    function repositionCopyPopover() {
      const pop = document.querySelector('.copy-popover');
      if (pop && copyPopoverAnchor) positionCopyPopover(pop, copyPopoverAnchor);
    }

    function recopyFromPopover(btn) {
      const pop = btn.closest('.copy-popover');
      if (!pop) return;
      const command = btn.dataset.cmd || pop.dataset.command || '';
      copyCommandToClipboard(command);
      const status = pop.querySelector('[data-popover-status]');
      if (status) {
        status.textContent = 'Copied to clipboard';
        status.classList.remove('is-flash');
        void status.offsetWidth;
        status.classList.add('is-flash');
      }
    }

    /* v0.3.8 — Legend popover for the User Flow canvas. Reuses the .copy-popover
       shell for anchored positioning + dismiss behavior. */
    const FLOW_LEGEND_SHAPES = [
      { cls: 'shape-start',      glyph: '( )',   name: 'Start',           desc: 'Stadium — the entry point of the flow' },
      { cls: 'shape-end',        glyph: '( )',   name: 'End',             desc: 'Stadium — a terminal state (success or hard fail)' },
      { cls: 'shape-action',     glyph: '[ ]',   name: 'Action',          desc: 'Rectangle — a screen or user action' },
      { cls: 'shape-decision',   glyph: '?',     name: 'Decision',        desc: 'Diamond — a branching question, ends with ?' },
      { cls: 'shape-input',      glyph: '/ /',   name: 'Input / Output',  desc: 'Parallelogram — data entering or leaving' },
      { cls: 'shape-subprocess', glyph: '[[ ]]', name: 'Subprocess',      desc: 'Reusable sub-flow — detail lives in the test checklist' },
      { cls: 'shape-cylinder',   glyph: '( )',   name: 'External system', desc: 'Cylinder — database, API, third party' },
    ];

    function openFigmaPushPanel(anchorBtn) {
      closeFigmaPushPanel();
      const organisms = (PB_DATA.handoff && PB_DATA.handoff.organisms) || [];
      const screens   = (PB_DATA.handoff && PB_DATA.handoff.screens)   || [];

      function statusBadge(org) {
        if (org.dsMatch) return '<span class="fp-badge fp-badge-reuse" title="Matched in the design system — pushed as an instance, not rebuilt">reuse</span>';
        if (!org.figmaId && !org.figmaComponentSetId) return '<span class="fp-badge fp-badge-new">new</span>';
        return '<span class="fp-badge fp-badge-update" title="Already in Figma — this push updates it">update</span>';
      }
      function screenStatus(s) {
        return s.figmaFrameId ? `<span class="fp-item-meta">frame ${s.figmaFrameId}</span>` : '<span class="fp-badge fp-badge-new">new</span>';
      }
      // Which screens reference this component (via elements[].orgId) — what an update affects.
      function screensUsing(orgId) {
        return screens.filter(s => (s.elements || []).some(e => e.orgId === orgId)).map(s => s.name);
      }

      const orgRows = organisms.map((o, i) => {
        const used = screensUsing(o.id);
        const isUpdate = !!(o.figmaId || o.figmaComponentSetId);
        const affected = used.length
          ? `<div class="fp-item-affected ${isUpdate ? 'is-warn' : ''}">${isUpdate ? '⚠ affects ' : 'Used in '}${used.length} screen${used.length !== 1 ? 's' : ''}: ${used.map(pbEscape).join(', ')}</div>`
          : `<div class="fp-item-affected fp-item-affected--muted">Not placed on any screen yet</div>`;
        return `
        <li class="fp-item fp-item--stacked" onclick="this.querySelector('input').click()">
          <div class="fp-item-row">
            <input type="checkbox" id="fp-org-${i}" data-fp-org="${pbEscape(o.id)}" checked onclick="event.stopPropagation();fpUpdateSummary()">
            <span class="fp-item-name">${pbEscape(o.name)}${statusBadge(o)}</span>
            <span class="fp-item-meta">${pbEscape(o.id)}</span>
          </div>
          ${affected}
        </li>`;
      }).join('');

      const scrRows = screens.map((s, i) => `
        <li class="fp-item" onclick="this.querySelector('input').click()">
          <input type="checkbox" id="fp-scr-${i}" data-fp-scr="${pbEscape(s.id)}" checked onclick="event.stopPropagation();fpUpdateSummary()">
          <span class="fp-item-name">${pbEscape(s.name)}</span>
          ${screenStatus(s)}
        </li>`).join('');

      const backdrop = document.createElement('div');
      backdrop.className = 'fp-backdrop';
      backdrop.onclick = closeFigmaPushPanel;

      const panel = document.createElement('div');
      panel.className = 'fp-panel';
      panel.id = 'fp-panel';
      panel.innerHTML = `
        <div class="fp-panel-head">
          <span class="fp-panel-title">Push to Figma</span>
          <button class="fp-panel-close" onclick="closeFigmaPushPanel()" aria-label="Close">×</button>
        </div>
        <div class="fp-panel-body">
          ${organisms.length ? `
            <div class="fp-section-head">
              <span class="fp-section-label">Components (${organisms.length})</span>
              <button class="fp-select-all" onclick="fpToggleAll('org')">Deselect all</button>
            </div>
            <ul class="fp-list">${orgRows}</ul>
          ` : ''}
          ${screens.length ? `
            <div class="fp-section-head">
              <span class="fp-section-label">Screens (${screens.length})</span>
              <button class="fp-select-all" onclick="fpToggleAll('scr')">Deselect all</button>
            </div>
            <ul class="fp-list">${scrRows}</ul>
          ` : ''}
        </div>
        <div class="fp-panel-foot">
          <span class="fp-summary" id="fp-summary"></span>
          <button class="fp-push-btn" id="fp-push-btn" onclick="fpConfirmPush(this)">Push selected →</button>
        </div>`;

      document.body.appendChild(backdrop);
      document.body.appendChild(panel);
      setTimeout(() => { panel.classList.add('is-visible'); fpUpdateSummary(); }, 10);
    }

    function closeFigmaPushPanel() {
      const p = document.getElementById('fp-panel');
      const b = document.querySelector('.fp-backdrop');
      if (p) { p.classList.remove('is-visible'); setTimeout(() => p.remove(), 200); }
      if (b) b.remove();
    }

    function fpToggleAll(type) {
      const boxes = document.querySelectorAll(`[data-fp-${type}]`);
      const anyChecked = Array.from(boxes).some(b => b.checked);
      boxes.forEach(b => { b.checked = !anyChecked; });
      // update button label
      const head = type === 'org'
        ? document.querySelector('.fp-section-label:first-of-type + button')
        : null;
      document.querySelectorAll('.fp-select-all').forEach(btn => {
        const t = btn.getAttribute('onclick').includes("'org'") ? 'org' : 'scr';
        const bs = document.querySelectorAll(`[data-fp-${t}]`);
        const ac = Array.from(bs).some(b => b.checked);
        btn.textContent = ac ? 'Deselect all' : 'Select all';
      });
      fpUpdateSummary();
    }

    function fpUpdateSummary() {
      const orgBoxes = Array.from(document.querySelectorAll('[data-fp-org]'));
      const scrBoxes = Array.from(document.querySelectorAll('[data-fp-scr]'));
      const selOrg = orgBoxes.filter(b => b.checked).length;
      const selScr = scrBoxes.filter(b => b.checked).length;
      const sumEl = document.getElementById('fp-summary');
      const btnEl = document.getElementById('fp-push-btn');
      if (sumEl) sumEl.innerHTML = `<strong>${selOrg}</strong> component${selOrg!==1?'s':''} · <strong>${selScr}</strong> screen${selScr!==1?'s':''}`;
      if (btnEl) btnEl.disabled = (selOrg + selScr === 0);
      // update select-all btn labels
      document.querySelectorAll('.fp-select-all').forEach(btn => {
        const t = btn.getAttribute('onclick').includes("'org'") ? 'org' : 'scr';
        const bs = document.querySelectorAll(`[data-fp-${t}]`);
        const ac = Array.from(bs).some(b => b.checked);
        btn.textContent = ac ? 'Deselect all' : 'Select all';
      });
    }

    function fpConfirmPush(btn) {
      const orgIds = Array.from(document.querySelectorAll('[data-fp-org]:checked')).map(b => b.dataset.fpOrg);
      const scrIds = Array.from(document.querySelectorAll('[data-fp-scr]:checked')).map(b => b.dataset.fpScr);
      const allOrg = document.querySelectorAll('[data-fp-org]').length;
      const allScr = document.querySelectorAll('[data-fp-scr]').length;

      let scope = 'both';
      if (orgIds.length === 0) scope = 'screens';
      if (scrIds.length === 0) scope = 'components';

      let cmd = `/pb:handoff --mode=3 --scope=${scope} --batch`;
      if (orgIds.length > 0 && orgIds.length < allOrg) cmd += ` --organism=${orgIds.join(',')}`;
      if (scrIds.length > 0 && scrIds.length < allScr) cmd += ` --screen=${scrIds.join(',')}`;

      closeFigmaPushPanel();
      openCopyPopover(cmd, btn);

      // Show progress panel immediately after confirming
      pbShowProgress({ components: { done:0, total: orgIds.length }, screens: { done:0, total: scrIds.length } });
    }

    /* ── Push progress panel ─────────────────────────────────────────────── */
    let _fpProgress = null;

    function pbShowProgress(data) {
      pbHideProgress();
      _fpProgress = data || { components:{ done:0, total:0 }, screens:{ done:0, total:0 } };
      const el = document.createElement('div');
      el.className = 'fp-progress';
      el.id = 'fp-progress';
      el.innerHTML = `
        <div class="fp-progress-head">
          <span class="fp-progress-title">Figma push progress</span>
          <button class="fp-progress-close" onclick="pbHideProgress()" aria-label="Dismiss">×</button>
        </div>
        <div id="fp-progress-body"></div>
        <div class="fp-progress-hint">Run the copied command — <code>/pb:handoff</code> reports progress here as it pushes.</div>`;
      document.body.appendChild(el);
      setTimeout(() => el.classList.add('is-visible'), 10);
      _fpRenderProgress();
    }

    function pbSetPushProgress(data) {
      if (!document.getElementById('fp-progress')) pbShowProgress(data);
      _fpProgress = data;
      _fpRenderProgress();
    }
    window.pbSetPushProgress = pbSetPushProgress;

    function _fpRenderProgress() {
      const body = document.getElementById('fp-progress-body');
      if (!body || !_fpProgress) return;
      const rows = [];
      const types = [['components','Components'],['screens','Screens']];

          </div>`);
      }

      // something the moment you flip it rather than arming an empty state.
      const others = PROTO_DEVICES.filter(d => supported.indexOf(d.id) !== -1 && d.id !== state.protoDevice);

    /* The runnable scenarios — flow.stories[].scenarios[] that carry a test{} block.
       Each comes back with the SENTENCE that describes it. This used to read `sc.title`, a field
       the authored shape has never had (/pb:plan writes { text, category, test }), so every row in
       the menu said "scenario" and the list was unreadable. The description is the test case, and
       it is the same string UX Design → Test Cases shows. */
    function pbTestScenarios() {
      const stories = (PB_DATA && PB_DATA.flow && PB_DATA.flow.stories) || [];
      const out = [];
      stories.forEach(s => (s.scenarios || []).forEach(sc => {
        if (!sc || typeof sc !== 'object' || !sc.test) return;
        // `test.roles` scopes a scenario to the role(s) it was written for — the same field
        // test_run.py reads (D-27). A scenario without it keeps showing for everyone, so nothing
        // authored before this disappears. Deliberately NOT admin-aware the way pbScreenAllowsRole
        // is: this is a curated per-role list, not a permission gate, so an admin sees the
        // scenarios tagged for admin rather than every scenario ever written.
        const roles = sc.test.roles;
        if (roles && roles.length && (state.activeRole == null || roles.indexOf(state.activeRole) === -1)) return;
        const lr = sc.lastResult || {};
        const st = !lr.status ? 'untested' : pbResultStale(lr) ? 'stale'
          : lr.status === 'pass' ? 'pass' : lr.status === 'fail' ? 'fail' : 'untested';
        out.push({ text: sc.text || sc.title || sc.name || sc.id || 'scenario',
                   category: sc.category || '', story: s.title || '',
                   start: (sc.test && sc.test.start) || '', status: st });
      }));
      return out;
    }
    const PB_SCENARIO_GLYPH = { pass: '\u2713', fail: '\u2717', stale: '\u27f3', untested: '\u25cb' };

    /* Picking a scenario stages the sandbox for it: jump to the screen it starts on and say which
       one you are now driving. The list was inert — you could read the scenarios and do nothing. */
    window.pbStartScenario = function (i) {
      const sc = pbTestScenarios()[+i];
      if (!sc) return;
      closeCopyPopover();
      if (sc.start && pbScreensHas(sc.start)) setProtoScreen(sc.start);
      pbToast(sc.text);
    };

    /* The consolidated Sandbox menu content — adapts to the active tab. Roles/Explore/Terminal are
       dropdowns, disabled when the project has no data for them. */
    function pbSandboxMenuHTML() {
      const onProto = state.metaView === 'prototype';
      const roles = (typeof pbRolesList === 'function') ? pbRolesList() : [];
      const tests = pbTestScenarios();
      const close = `<button class="copy-popover-close" type="button" aria-label="Close" onclick="closeCopyPopover()">${COPY_POPOVER_ICONS.close}</button>`;
      const preview = onProto ? pbSandboxPreviewControls() : '';

      const rolesSel = roles.length
        ? `<select class="sbx-select" aria-label="Preview as role" onchange="setProtoRole(this.value); pbSandboxRerender()">
             ${roles.map(r => `<option value="${escapeHtmlAttr(r.id)}" ${r.id === state.activeRole ? 'selected' : ''}>${pbEscape(r.name || r.id)}${r.isAdmin ? ' · admin' : ''}</option>`).join('')}
           </select>`
        : `<select class="sbx-select" disabled aria-label="Roles (none defined)"><option>None</option></select>`;
      // Scenarios are authored as full sentences, so a flat list of them is a wall — on a real
      // project, forty lines of prose in a dropdown. Group by the story that owns them (the story
      // title is the scope, and it is stated once per group instead of implied per row) and clamp
      // each to its first line; the whole sentence stays in the option's tooltip, uncut.
      const clamp = (t, n) => t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
      const groups = [];
      tests.forEach((t, i) => {
        const last = groups[groups.length - 1];
        (last && last.story === (t.story || '') ? last : (groups.push({ story: t.story || '', rows: [] }),
          groups[groups.length - 1])).rows.push([t, i]);
      });
      const testsSel = tests.length
        ? `<select class="sbx-select" aria-label="Scenario testing" onchange="pbStartScenario(this.value)">
             <option disabled selected value="">${tests.length} scenario${tests.length > 1 ? 's' : ''}…</option>
             ${groups.map(g => {
                 const rows = g.rows.map(([t, i]) =>
                   `<option value="${i}" title="${escapeHtmlAttr(t.text)}">${PB_SCENARIO_GLYPH[t.status]} ${pbEscape(clamp(t.text, 42))}</option>`).join('');
                 return g.story ? `<optgroup label="${escapeHtmlAttr(g.story)}">${rows}</optgroup>` : rows;
               }).join('')}
           </select>`
        : `<select class="sbx-select" disabled aria-label="Scenario testing (none)"><option>None</option></select>`;
      const exploreSel = `<select class="sbx-select" disabled aria-label="Explore options (none)"><option>None</option></select>`;

      return `
        ${close}
        ${preview}
        <div class="proto-menu-overline" ${onProto ? '' : 'style="margin-top:0"'}>Sandbox</div>
        <div class="sbx-row ${roles.length ? '' : 'is-disabled'}"><span class="sbx-row-lbl">Roles</span>${rolesSel}</div>
        <div class="sbx-row is-disabled"><span class="sbx-row-lbl">Explore</span>${exploreSel}</div>
        <div class="sbx-row ${tests.length ? '' : 'is-disabled'}"><span class="sbx-row-lbl">Scenario testing</span>${testsSel}</div>
        <div class="proto-menu-hr"></div>
        <button class="proto-menu-item" type="button" onclick="pbResetSandbox(); closeCopyPopover()">Reset session</button>
        <div class="sbx-foot">pb v${PB_SHELL_VERSION}</div>`;
    }
