      const el = document.getElementById('pb-info-dialog');
      if (el) el.remove();
      document.removeEventListener('keydown', pbInfoDialogEsc);
    }
    function pbInfoDialogEsc(e) { if (e.key === 'Escape') closeInfoDialog(); }

    function renderMetaPanel() {
      switch (state.metaView) {
        case 'summary': return renderMetaSummary();
        case 'flow':    return renderMetaFlow();
        case 'erd':     return renderMetaERD();
      }
    }

    /* =========================================================================
       TAB 1 — PROTOTYPE
       This is the live, interactive app users will test. Replace the
       placeholder below with your prototype's UI.
       ========================================================================= */
    function renderPrototype() {
      // The live app = the registry's screens, rendered via their generated renderFn.
      const screens = (PB_DATA.handoff && PB_DATA.handoff.screens) || [];
      const header = pbPageHeader({ title: 'Prototype', infoKey: 'prototype' });

      if (!screens.length) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.prototype,
                title: 'Your prototype goes here',
                body: 'Run /pb:build to add screens — this tab renders them as the live app users interact with, with a real navigation and form-validation runtime. The other four tabs are the documentation layer.',
                ctaLabel: 'Generate prototype screens', command: '/pb:build', label: 'Build command copied',
              })}
            </div>
          </div>`;
        return;
      }

      if (!state.protoScreenId || !screens.some(s => s.id === state.protoScreenId)) state.protoScreenId = screens[0].id;
      const meta = (PB_REGISTRY && PB_REGISTRY.meta) || {};
      // Supported device sizes — meta.devices (normalized to the 4-key model; legacy 'desktop'
      // expands to monitor+laptop). The current device must be supported.
      const supported = pbNormalizeDeviceList(meta.devices);
      if (!state.protoDevice) state.protoDevice = pbNormalizeDevice(meta.device || 'laptop');
      if (supported.indexOf(state.protoDevice) === -1) state.protoDevice = supported[0] || 'laptop';
      if (!state.protoShell) state.protoShell = PB_SHELLS[meta.shell] || 'browser';
      // v1.5 — resolve the active role (absent meta.roles ⇒ null, switcher hidden, nothing gated).
      const roles = (meta.roles && meta.roles.length) ? meta.roles : [];
      if (roles.length) {
        if (state.activeRole == null || !roles.some(r => r.id === state.activeRole)) state.activeRole = pbResolveDefaultRole();
      } else {
        state.activeRole = null;
      }
      let sel = screens.find(s => s.id === state.protoScreenId);
      // If the active (non-admin) role may not see the selected screen, fall back to the first it can.
      if (roles.length && sel && !pbScreenAllowsRole(sel, state.activeRole)) {
        const permitted = screens.find(s => pbScreenAllowsRole(s, state.activeRole));
        if (permitted) { state.protoScreenId = permitted.id; sel = permitted; }
      }
      const device = state.protoDevice;
      const shell = state.protoShell;

      // v1.9 — the Prototype tab has NO page header: chrome · device · compare · structure tree ·
      // sandbox all live in the consolidated Sandbox menu in the meta nav (openSandboxMenu), and the
      // preview fills the tab. The header-tool builders that used to sit here were already dead, and
      // one of them was a SECOND chrome toggle that only ever offered Browser and App — the pair of
      // them is how `none` came to be an option you could click and nothing happened.
      const isStructOpen = document.getElementById('proto-struct-panel')
        && document.getElementById('proto-struct-panel').classList.contains('is-open');

      // Compare (v2.0.0) — the same screen on a second device. It must be a device this project
      // supports, and it must not be the primary: a laptop beside itself is a bug, not a view.
      const devB = (state.protoDeviceB && state.protoDeviceB !== device
                    && supported.indexOf(state.protoDeviceB) !== -1) ? state.protoDeviceB : null;
      if (state.protoDeviceB && !devB) state.protoDeviceB = null;

      const body = (typeof window[sel.renderFn] === 'function')
        ? window[sel.renderFn]()
        : `<div class="placeholder-card"><p>Screen "${sel.name}" has no render function yet — run <code>/pb:build --render</code>.</p></div>`;

      const closeIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

      $('#app').innerHTML = `
        <div class="pb-page pb-page--viewport pb-page--proto">
          <div class="pb-content pb-content--fill">
            <div class="pb-main proto-main" id="proto-main">
              <div class="proto-stage" id="proto-stage">
                <div class="proto-fit${devB ? ' is-compare' : ''}" id="proto-fit">
                  <div class="proto-pair-box" id="proto-pair-box">
                    <div class="proto-pair" id="proto-pair">
                      ${protoFrameSlot('a', device, sel, meta, shell, body, !!devB)}
                      ${devB ? protoFrameSlot('b', devB, sel, meta, shell, body, true) : ''}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div id="proto-struct-panel" class="proto-struct-panel${isStructOpen ? ' is-open' : ''}">
              <div class="proto-struct-head">
                <span class="proto-struct-title">Structure</span>
                <button class="proto-struct-close" type="button" aria-label="Close the structure tree"
                        onclick="toggleProtoStructPanel()">${closeIcon}</button>
              </div>
              <div class="proto-struct-panel-body">${pbRenderStructureTree(screens)}</div>
            </div>
          </div>
        </div>`;
      wireProtoNav(document.getElementById('proto-frame'));
      if (devB) wireProtoNav(document.getElementById('proto-frame-b'));
      pbApplyRoleGating();
      pbSyncMachines(document.getElementById('proto-frame'));
      const frameB = document.getElementById('proto-frame-b');
      if (frameB) pbSyncMachines(frameB);
      requestAnimationFrame(function () {
        // pbMirrorFrames FIRST: it splits the two frames' radio groups, and a frame still showing
        // a collapsed view measures short — the pair would then be scaled to a height it is about
        // to stop having.
        pbMirrorFrames(); fitProtoFrame(); pbSetStatusBarContrast(); pbWatchStage();
      });
    }

    /* ── Compare mode: two frames, one session ──────────────────────────────────────────────
       Both frames show the same screen, so anything that changes INSIDE that screen has to show
       in both or the comparison is a lie. Screen-level navigation already did, because it
       re-renders — but everything below it did not: a wizard step, a revealed password, a
       validation error, a typed value all landed only in the frame that was clicked.

       Mirroring one verb at a time would not hold. `registry.runtime[]` lets a project run its
       own code against the DOM, and the next verb pb adds would have to remember to join in. So
       the mirror is general and knows nothing about verbs. Both frames hold IDENTICAL markup, so
       an element's twin is the node in the same position — which is exactly what re-serialising
       innerHTML replays, for free and for anything.

         · structure, attributes, injected nodes → a MutationObserver copies src.innerHTML across
         · value / checked / selectedIndex       → DOM *properties*. They are not in innerHTML and
                                                   they emit no mutation record, so an input and
                                                   change listener carries those over on their own
         · scrollTop / scrollLeft                → the same kind of thing, and the one that made
                                                   in-page navigation look broken (v2.0.0). A jump
                                                   to a section, a `scrollIntoView`, a re-render
                                                   that returns to the top: all of them move ONE
                                                   frame, and the copy above then put the twin's
                                                   old offset straight back. The content reached
                                                   both frames; only one of them was looking at it.

       The observers are DISCONNECTED around the write rather than skipped with a boolean: the
       callback is a microtask, so a flag set and cleared synchronously is already false by the
       time the echo arrives, while disconnect() drops the queued records outright.

       None of this exists outside compare mode. One `.proto-screen` means nothing to mirror and
       no observer is attached, so the single-frame path pays nothing. */
    var _pbMirror = null;
    const PB_MIRROR_OPTS = { subtree: true, childList: true, attributes: true, characterData: true };
    const PB_MIRROR_FIELDS = 'input, textarea, select';

    function pbMirrorPause(fn) {
      if (!_pbMirror) { fn(); return; }
      _pbMirror.obs.forEach(function (o) { o.disconnect(); });
      try { fn(); } finally {
        _pbMirror.obs.forEach(function (o, i) { o.observe(_pbMirror.roots[i], PB_MIRROR_OPTS); });
      }
    }

    /* A node's twin is the node at the same position in the other frame — the mirror's whole
       premise, so the address of a node is its chain of child indexes up to the frame root. */
    function pbFramePath(root, el) {
      const path = [];
      while (el && el !== root) {
        const p = el.parentNode;
        if (!p || p.nodeType !== 1) return null;
        path.push(Array.prototype.indexOf.call(p.children, el));
        el = p;
      }
      return el === root ? path : null;
    }
    function pbFrameNodeAt(root, path) {
      let el = root;
      for (let i = path.length - 1; i >= 0 && el; i--) el = el.children[path[i]];
      return el || null;
    }

    /* Taken as a snapshot rather than copied field by field, because the write that sits between
       the read and the apply can disturb the frame being read FROM — see pbScopeRadios. */
    function pbFieldSnapshot(root) {
      return Array.prototype.map.call(root.querySelectorAll(PB_MIRROR_FIELDS), function (el) {
        return (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked }
             : (el.tagName === 'SELECT') ? { index: el.selectedIndex }
             : { value: el.value };
      });
    }
    function pbApplyFieldSnapshot(root, snap) {
      const els = root.querySelectorAll(PB_MIRROR_FIELDS);
      for (let i = 0; i < els.length && i < snap.length; i++) {
        const el = els[i], rec = snap[i];
        if ('checked' in rec) { if (el.checked !== rec.checked) el.checked = rec.checked; }
        else if ('index' in rec) { if (el.selectedIndex !== rec.index) el.selectedIndex = rec.index; }
        else if (el.value !== rec.value) el.value = rec.value;
      }
    }
    function pbCopyFieldState(src, dst) { pbApplyFieldSnapshot(dst, pbFieldSnapshot(src)); }

    /* A radio button group is every radio sharing a NAME **and a form owner**, across the whole
       document. Two frames of the same screen is two of every radio in it, so the browser treats
       them as one group and only one of the two can be checked — checking the second frame's
       radio silently unchecks the first frame's, and there is no event and no mutation to notice
       it by. A project that drives its in-page navigation from CSS-only radio state (a
       `:has(#view-a:checked) .view-a { display:flex }` switch, which is how a prototype gets tabs
       and master-detail without a line of JS) therefore renders its content in EXACTLY ONE of the
       two frames: the other one's view is `display:none` and the frame looks empty.

       Renaming the radios would break any `[name="…"]` the project's own CSS uses. The form owner
       is the other half of what defines a group, and nothing selects on it: each secondary frame
       gets an empty `<form>` of its own, and its radios point at it. Same names, same ids, same
       CSS — two groups. It is re-applied after every copy, because innerHTML brings the original
       attributes back with it. */
    function pbScopeRadios(root, i) {
      const id = 'pb-radio-scope-' + i;
      let form = document.getElementById(id);
      if (!form) {
        form = document.createElement('form');
        form.id = id;
        form.hidden = true;
        form.addEventListener('submit', function (e) { e.preventDefault(); });
        document.body.appendChild(form);
      }
      Array.prototype.forEach.call(root.querySelectorAll('input[type="radio"]'), function (r) {
        if (r.getAttribute('form') !== id) r.setAttribute('form', id);
      });
    }

    /* Writing scrollTop fires a scroll event of its own, which would bounce straight back and
       fight the frame the user is actually driving. The echo is suppressed by time rather than by
       a flag cleared on the next event: a write that lands on the value already there fires
       nothing at all, and a flag nobody clears would then swallow the next real scroll. */
    const PB_SCROLL_ECHO_MS = 150;
    function pbNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
    function pbScrollQuiet(el) { if (el) el.__pbEcho = pbNow() + PB_SCROLL_ECHO_MS; }
    function pbScrollIsEcho(el) { return !!(el && el.__pbEcho && pbNow() < el.__pbEcho); }

    /* The two frames are DIFFERENT widths — that is the entire point of compare — so the same
       pixel offset is not the same content: a phone lays the same screen out far taller than a
       laptop does. What carries across is the PROPORTION. A jump to the last section lands on the
       last section in both; halfway down stays halfway down. */
    function pbCarryScrollTo(src, dst) {
      const sy = src.scrollHeight - src.clientHeight, dy = dst.scrollHeight - dst.clientHeight;
      const sx = src.scrollWidth - src.clientWidth, dx = dst.scrollWidth - dst.clientWidth;
      const top = sy > 0 ? Math.round((src.scrollTop / sy) * dy) : 0;
      const left = sx > 0 ? Math.round((src.scrollLeft / sx) * dx) : 0;
      if (Math.abs(dst.scrollTop - top) > 1 || Math.abs(dst.scrollLeft - left) > 1) {
        pbScrollQuiet(dst);
        dst.scrollTop = top; dst.scrollLeft = left;
      }
    }
    /* innerHTML resets every scroll position the twin holds — its own and every scroller inside
       it — and the twin is not the frame the user is looking at, so they all go back. */
    function pbScrollSnapshot(root) {
      const out = [[[], root.scrollTop, root.scrollLeft]];
      Array.prototype.forEach.call(root.querySelectorAll('*'), function (el) {
        if (el.scrollTop || el.scrollLeft) {
          const p = pbFramePath(root, el);
          if (p) out.push([p, el.scrollTop, el.scrollLeft]);
        }
      });
      return out;
    }
    function pbScrollRestore(root, snap) {
      snap.forEach(function (rec) {
        const el = rec[0].length ? pbFrameNodeAt(root, rec[0]) : root;
        if (!el) return;
        pbScrollQuiet(el);
        el.scrollTop = rec[1]; el.scrollLeft = rec[2];
      });
    }

    /* ONE frame drives the session (v2.0.0). Two frames in one document means every id in a
       screen body exists twice, so a project's own handler splits down the middle: `this` and
       `closest` find the frame that was clicked, `document.getElementById` always finds the
       first one. A click in the second frame ran half in each — the pane switched in frame A,
       the tab highlight moved in frame B — and the mirror then copied one half over the other,
       leaving BOTH frames showing a state that never existed.

       So a click in a secondary frame is replayed on the primary frame's twin node: the handler
       runs once, in one frame, with `this` and the ids agreeing, and the mirror carries the
       result back. The second frame stays live — it is still the thing you click — it just is
       not a second session, which is what the id space already decided.

       Not replayed: what the browser drives itself. A text field, a select, a label keep their
       click so the caret stays in the frame being typed in, and the field carry above syncs the
       value. ⌥-click is the inspector — read-only and deliberately frame-local. */
    const PB_MIRROR_NATIVE = 'input, textarea, select, option, label, [contenteditable]';
    function pbForwardClick(e, sec, primary) {
      if (e.altKey || !e.target || e.target.nodeType !== 1) return;
      if (e.target.closest(PB_MIRROR_NATIVE)) return;
      const path = pbFramePath(sec, e.target);
      if (!path || !path.length) return;
      const twin = pbFrameNodeAt(primary, path);
      if (!twin) return;
      e.preventDefault();
      e.stopPropagation();
      let ev;
      try {
        ev = new MouseEvent('click', { bubbles: true, cancelable: true, view: window,
          ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, metaKey: e.metaKey });
      } catch (err) {
        ev = document.createEvent('MouseEvents');
        ev.initEvent('click', true, true);
      }
      twin.dispatchEvent(ev);
    }

    function pbMirrorFrames() {
      if (_pbMirror) {
        _pbMirror.obs.forEach(function (o) { o.disconnect(); });
        _pbMirror.roots.forEach(function (r) { r.removeEventListener('scroll', _pbMirror.onScroll, true); });
      }
      _pbMirror = null;
      const roots = Array.prototype.slice.call(document.querySelectorAll('.proto-screen'));
      if (roots.length < 2 || typeof MutationObserver === 'undefined') return;
      const copy = function (src) {
        // Read the live properties BEFORE the write: parsing a `checked` attribute into the twin
        // takes the group away from the frame we are copying from, so `src` needs putting back too.
        const snap = pbFieldSnapshot(src);
        roots.forEach(function (dst, i) {
          if (dst === src) return;
          const keep = pbScrollSnapshot(dst);
          dst.innerHTML = src.innerHTML;
          if (i) pbScopeRadios(dst, i);
          pbApplyFieldSnapshot(dst, snap);
          pbScrollRestore(dst, keep);
        });
        pbApplyFieldSnapshot(src, snap);
      };
      const obs = roots.map(function (src) {
        return new MutationObserver(function () { pbMirrorPause(function () { copy(src); }); });
      });
      // Scroll does not bubble, so the listener captures: one per frame covers the frame itself
      // and every scroller inside it.
      const onScroll = function (e) {
        const src = e.currentTarget, el = e.target;
        if (!el || el.nodeType !== 1 || pbScrollIsEcho(el)) return;
        const path = (el === src) ? [] : pbFramePath(src, el);
        if (!path) return;
        roots.forEach(function (dst) {
          if (dst === src) return;
          const twin = path.length ? pbFrameNodeAt(dst, path) : dst;
          if (twin) pbCarryScrollTo(el, twin);
        });
      };
      // Before anything is observed: the render that just built both frames let the second one's
      // `checked` attributes take the group from the first, so scope the groups apart and put
      // every radio back to what its own markup says. Both frames came from one HTML string, so
      // the attribute IS the shared truth at this point.
      roots.forEach(function (r, i) { if (i) pbScopeRadios(r, i); });
      roots.forEach(function (r) {
        Array.prototype.forEach.call(r.querySelectorAll('input[type="radio"]'), function (x) {
          if (x.checked !== x.defaultChecked) x.checked = x.defaultChecked;
        });
      });
      _pbMirror = { roots: roots, obs: obs, onScroll: onScroll };
      obs.forEach(function (o, i) { o.observe(roots[i], PB_MIRROR_OPTS); });
      roots.forEach(function (src) {
        const carry = function () {
          pbMirrorPause(function () {
            roots.forEach(function (dst) { if (dst !== src) pbCopyFieldState(src, dst); });
          });
        };
        src.addEventListener('input', carry);
        src.addEventListener('change', carry);
        src.addEventListener('scroll', onScroll, true);
      });
      roots.slice(1).forEach(function (sec) {
        sec.addEventListener('click', function (e) { pbForwardClick(e, sec, roots[0]); }, true);
      });
    }

    /* The stage changes width for reasons that are not a window resize — the structure panel
       slides in and out beside it over 250ms. A single frame rides that out in CSS (max-width:100%),
       but compare mode's scale is computed in JS at render time, so opening the panel left the pair
       at its old size, overflowing the column and running under the panel. One observer on the
       stage covers the panel, the window, and whatever moves the column next. */
    var _pbStageRO = null;
    function pbWatchStage() {
      const stage = document.getElementById('proto-stage');
      if (!stage || typeof ResizeObserver === 'undefined') return;
      if (!_pbStageRO) _pbStageRO = new ResizeObserver(function () { fitProtoFrame(); });
      _pbStageRO.disconnect();
      _pbStageRO.observe(stage);
    }

    /* One device's frame. Compare mode renders two — the same screen body twice, each laid out at
       its own TRUE CSS width, so the wrapping and the media queries you see are the real ones.
       The bodies are pure functions of the registry, so rendering one twice is free and identical.
       What two frames are NOT is two sessions: they share this document, so a screen body that
       looks itself up by a duplicated id finds frame A's copy. That is why a click in the second
       frame is replayed on the first one's twin node (pbForwardClick) and the result mirrored back
       — one session, two views, rather than two half-sessions fighting over one id space. */
    function protoFrameSlot(slot, deviceId, sel, meta, shell, body, compare) {
      const d = PROTO_DEVICES.find(x => x.id === deviceId) || PROTO_DEVICES[1];
      const isDevice = (deviceId === 'tablet' || deviceId === 'mobile');
      const sfx = slot === 'a' ? '' : '-' + slot;
      // Compare gives BOTH frames their real pixel height, so the pair is one object to scale.
      const wrapH = compare ? `;height:${d.h}px` : (isDevice ? '' : ';height:100%');
      const scrH = (compare || !isDevice) ? 'flex:1 1 auto;min-height:0' : `height:${d.h}px`;
      const cap = compare
        ? `<div class="proto-frame-cap">${pbEscape(d.label)}<em>${d.w} × ${d.h}</em></div>` : '';
      return `<div class="proto-frame-slot">${cap}
          <div class="proto-frame proto-frame--${deviceId} proto-shell--${shell}" id="proto-frame-wrap${sfx}"
               style="width:${d.w}px${compare ? '' : ';max-width:100%'}${wrapH}">
            ${protoChrome(shell, deviceId, sel, meta, slot)}
            <div class="proto-screen" id="proto-frame${sfx}" style="${scrH}">${body}</div>
          </div>
        </div>`;
    }

    // Display chrome. `none` is the third value (v2.0.0): an internal back-office tool is not a
    // web site, and dressing every screen in a fake tab strip, a synthesised URL and a window frame
    // spends 77px of vertical space on set dressing that misleads the reviewer. A real project
    // reached for this by hiding the chrome in its own forked stylesheet — so pb ships the option
    // instead. Tablet and mobile keep their device frames under `none`: those are a PHONE, a
    // different mockup, and nobody asked to remove them.
    const PB_SHELL_OPTS = [['browser', 'Browser'], ['app', 'App'], ['none', 'None']];
    const PB_SHELLS = { browser: 'browser', app: 'app', none: 'none' };

    // The 4 fixed device sizes (logical CSS px). Gated per project by meta.devices.
    const PROTO_DEVICES = [
      { id: 'monitor', label: 'Large monitor', w: 1920, h: 1080 },
      { id: 'laptop',  label: 'Laptop',        w: 1280, h: 832  },
      { id: 'tablet',  label: 'Tablet',        w: 834,  h: 1112 },
      { id: 'mobile',  label: 'Mobile',        w: 429,  h: 926  },
    ];
    // Normalize a meta.devices list to the 4-key model — legacy 'desktop' → monitor + laptop.
    function pbNormalizeDeviceList(list) {
      const order = ['monitor', 'laptop', 'tablet', 'mobile'];
      const set = {};
      (list || []).forEach(d => {
        if (d === 'desktop') { set.monitor = 1; set.laptop = 1; }
        else if (order.indexOf(d) !== -1) set[d] = 1;
      });
      const out = order.filter(d => set[d]);
      return out.length ? out : order.slice();
    }
    function pbNormalizeDevice(dev) {
      if (dev === 'desktop') return 'laptop';
      return ['monitor', 'laptop', 'tablet', 'mobile'].indexOf(dev) !== -1 ? dev : 'laptop';
    }
    // The furniture of a browser window, drawn once. `back` and `reload` are the only two that do
    // anything; the rest are the photograph — marked aria-hidden and inert rather than `disabled`,
    // because they are not controls this prototype declined to implement, they are Chrome's.
    const PB_CHROME_ICONS = (function () {
      const w = (d, extra) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}${extra || ''}</svg>`;
      return {
        back: w('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
        fwd: w('<path d="M5 12h14M12 5l7 7-7 7"/>'),
        reload: w('<path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/><path d="M20.5 4v5h-5"/>'),
        puzzle: w('<path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.6a2.6 2.6 0 0 0-5.2 0V5H4a2 2 0 0 0-2 2v3.6h1.4a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.4a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/>'),
        kebab: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
        lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
        x: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      };
    })();

        return { path: path, hint: hint };
      }
      // 2) anatomy-part match by className anchor (real DOM class -> a component part name)
      try {
        for (var i = 0; i < comps.length; i++) {
          var parts = ((comps[i].anatomy || {}).parts) || [];
          for (var j = 0; j < parts.length; j++) {
            var anchor = parts[j].anchor;
            if (anchor && el.matches && el.matches(anchor)) {
              return { path: 'screen:' + screenId + ' › component:' + comps[i].id + ' › part:' + (parts[j].name || anchor),
                       hint: (parts[j].name || anchor) + ' · ' + (comps[i].name || comps[i].id) };
            }
          }
        }
      } catch (e) { /* selector edge cases — fall through */ }
      // 3) DOM fallback — never precise, but always copyable
      var tag = (el.tagName || 'node').toLowerCase();
      var cls = (el.classList && el.classList.length) ? '.' + el.classList[0] : (el.id ? '#' + el.id : '');
      var txt = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 32);
      return { path: 'screen:' + screenId + ' › ' + tag + cls, hint: txt ? '"' + txt + '"' : tag };
    }
    function pbInspectShow(el) {
      var frame = (el && el.closest && el.closest('.proto-screen')) || document.getElementById('proto-frame');
      if (!el || !frame || el === frame || !frame.contains(el)) { pbInspectHide(); return; }
      var info = pbInspectName(el);
      var r = el.getBoundingClientRect();
      var e = pbInspectEls();
      e.box.style.display = 'block';
      e.box.style.top = r.top + 'px'; e.box.style.left = r.left + 'px';
      e.box.style.width = r.width + 'px'; e.box.style.height = r.height + 'px';
      e.label.innerHTML = '';
      var p = document.createElement('span'); p.className = 'pb-inspect-path'; p.textContent = info.path; e.label.appendChild(p);
      if (info.hint) { var h = document.createElement('span'); h.className = 'pb-inspect-hint'; h.textContent = info.hint; e.label.appendChild(h); }
      e.label.style.display = 'flex';
      var ly = r.top - 30; if (ly < 4) ly = r.bottom + 6;
      e.label.style.top = ly + 'px'; e.label.style.left = Math.max(4, r.left) + 'px';
    }
    function pbInspectHide() {
      var box = document.getElementById('pb-inspect-box'); if (box) box.style.display = 'none';
      var label = document.getElementById('pb-inspect-label'); if (label) label.style.display = 'none';
    }
    function pbInspectCopy(el) {
      var info = pbInspectName(el);
      copyCommandToClipboard(info.path);
      pbToast('Copied  ' + info.path);
    }
    function pbInspectWireKeys() {
      if (pbInspectKeysWired) return; pbInspectKeysWired = true;
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Alt' && state.metaView === 'prototype' && pbInspectLast) pbInspectShow(pbInspectLast);
      });
      document.addEventListener('keyup', function (e) { if (e.key === 'Alt') pbInspectHide(); });
      window.addEventListener('scroll', pbInspectHide, true);
    }
    function wireProtoNav(frame) {
      frame = frame || document.getElementById('proto-frame');
      if (!frame) return;
      pbInspectWireKeys();
      frame.addEventListener('click', function (e) {
        if (e.altKey) { e.preventDefault(); e.stopPropagation(); pbInspectCopy(e.target); return; }  // ⌥-click = copy reference
        var nav = e.target.closest('[data-nav]');
        if (nav) { var id=nav.getAttribute('data-nav'); if(pbScreensHas(id)){ e.preventDefault(); if(pbNavAllowed(id)) setProtoScreen(id); } return; }
        var tog = e.target.closest('[data-action="toggle-password"]');
        if (tog) { e.preventDefault(); pbTogglePassword(tog); return; }
        var sub = e.target.closest('[data-action="submit"]');
        if (sub) { e.preventDefault(); pbProtoSubmit(sub); return; }
        if (e.target.closest('[data-step-go]')) { e.preventDefault(); pbStepClick(e.target); return; }
      });
      frame.addEventListener('mousemove', function (e) {
        pbInspectLast = e.target;
        if (e.altKey) pbInspectShow(e.target); else pbInspectHide();
      });
      frame.addEventListener('mouseleave', function () { pbInspectLast = null; pbInspectHide(); });
    }

    /* =========================================================================
       TAB 2 — PROJECT SUMMARY
         2.1 Overview              (Objectives + Principles, auto-syncs)
         2.2 User Insights         (Quantitative + Research Summary + Executive Summary)
       Two sub-tabs, and this tab holds nothing else (D-33). UI Logic Trade-offs left for
       UX Design → Logic in v2.0.0 (D-30) and then stopped being a separate record at all: a
       trade-off is a rule, so it is a field ON the rule. `Others` — the one field with no schema,
       no writer and no check — is retired with it; `content` and `ia.rules[]` are where the
       terminology and the business rules it accreted actually belong.
       Empty sub-sections render with empty-state copy.
       ========================================================================= */
    /* v0.3.0 — Tab 2 sub-tab navigation. Only the active sub-section renders. */
    const SUMMARY_SUBTABS = [
      ['overview',  'Overview'],
      ['insights',  'User Insights'],
    ];

    function renderMetaSummary() {
      const o  = (PB_DATA && PB_DATA.overview) || {};
      const ui = (PB_DATA && PB_DATA.userInsights) || {};
      const hasSummary = !!(o.objectives || (o.principles && o.principles.length) ||
        ui.quantitative || ui.researchSummary || ui.executiveSummary);
      // A sub-tab that no longer exists must not survive in state from an earlier render.
      if (!SUMMARY_SUBTABS.some(([id]) => id === state.summarySubTab)) state.summarySubTab = 'overview';

      const header = pbPageHeader({ title: 'Project Summary', infoKey: 'summary' });

      if (!hasSummary) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.summary,
                title: 'No summary yet',
                body: 'The Project Summary is auto-synced from your spec and clarify steps — objectives, principles, user insights, and UI-logic trade-offs.',
                ctaLabel: 'Write the spec', command: '/pb:specify',
              })}
            </div>
          </div>`;
        return;
      }

      const subTabs = SUMMARY_SUBTABS.map(([id, label]) =>
        `<button class="meta-subtab ${state.summarySubTab === id ? 'active' : ''}"
                 onclick="setSummarySubTab('${id}')">${label}</button>`
      ).join('');
      const body = {
        overview:  pbRenderOverview,
        insights:  pbRenderUserInsights,
      }[state.summarySubTab]();

      // v1.5 — split layout: scrolling content on the left, a scroll-spy table of contents on
      // the right that reflects the left column and navigates on click.
      $('#app').innerHTML = `
        <div class="pb-page pb-page--viewport">
          ${header}
          <div class="pb-content pb-content--split pb-content--fill">
            <div class="pb-main summary-main">
              <div class="meta-subtabs">${subTabs}</div>
              <div class="summary-scroll" id="summary-scroll">${body}</div>
            </div>
            <aside class="pb-aside summary-toc">
              <p class="pb-dialog-h">On this page</p>
              <nav class="summary-toc-nav" id="summary-toc-nav"></nav>
            </aside>
          </div>
        </div>
      `;
      requestAnimationFrame(pbBuildSummaryToc);
    }

    /* Build the Project Summary table of contents from the left column's headings, wire
       click-to-scroll + scroll-spy highlighting. Re-runs on every sub-tab render. */
    function pbBuildSummaryToc() {
      const scroll = document.getElementById('summary-scroll');
      const nav = document.getElementById('summary-toc-nav');
      if (!scroll || !nav) return;
      const heads = Array.from(scroll.querySelectorAll('.meta-h2, .meta-h3'));
      if (!heads.length) { nav.innerHTML = '<p class="pb-aside-empty" style="padding:6px 0">No sections.</p>'; return; }
      heads.forEach((h, i) => { if (!h.id) h.id = 'summary-sec-' + i; });
      // Group headings into a tree: each h2 is a parent node, the h3s under it are children —
      // rendered with the same .pb-tree component as the Prototype structure panel.
      const groups = []; let cur = null;
      heads.forEach(h => {
        if (h.classList.contains('meta-h2')) { cur = { head: h, children: [] }; groups.push(cur); }
        else { if (!cur) { cur = { head: null, children: [] }; groups.push(cur); } cur.children.push(h); }
      });
      const tocNode = (h, isChild) => isChild
        ? `<li class="pb-tree-node"><span class="pb-tree-node-label summary-toc-item" data-toc="${h.id}" onclick="pbSummaryTocClick(event,'${h.id}')">${pbEscape(h.textContent)}</span></li>`
        : `<div class="pb-tree-screen-name summary-toc-item" data-toc="${h.id}" onclick="pbSummaryTocClick(event,'${h.id}')"><span>${pbEscape(h.textContent)}</span></div>`;
      nav.innerHTML = '<div class="pb-tree summary-toc-tree">' + groups.map(g => {
        const parent = g.head ? tocNode(g.head, false) : '';
        const kids = g.children.length ? `<ul class="pb-tree-list">${g.children.map(c => tocNode(c, true)).join('')}</ul>` : '';
        return `<div class="pb-tree-screen">${parent}${kids}</div>`;
      }).join('') + '</div>';
      scroll.onscroll = pbSummaryTocSpy;
      pbSummaryTocSpy();
    }
    function pbSummaryTocClick(e, id) {
      e.preventDefault();
      const scroll = document.getElementById('summary-scroll');
      const el = document.getElementById(id);
      if (!scroll || !el) return;
      const top = scroll.scrollTop + (el.getBoundingClientRect().top - scroll.getBoundingClientRect().top) - 8;
      scroll.scrollTo({ top: top, behavior: 'smooth' });
    }
    function pbSummaryTocSpy() {
      const scroll = document.getElementById('summary-scroll');
      const nav = document.getElementById('summary-toc-nav');
      if (!scroll || !nav) return;
      const heads = Array.from(scroll.querySelectorAll('.meta-h2, .meta-h3'));
      const stop = scroll.getBoundingClientRect().top;
      let active = heads[0];
      heads.forEach(h => { if (h.getBoundingClientRect().top - stop <= 16) active = h; });
      nav.querySelectorAll('.summary-toc-item').forEach(a =>
        a.classList.toggle('is-toc-active', !!active && a.getAttribute('data-toc') === active.id));
    }

    function pbRenderOverview() {
      const o = (PB_DATA && PB_DATA.overview) || {};
      const objectiveBody = o.objectives
        ? `<p class="meta-p">${pbEscape(o.objectives)}</p>`
        : `<p class="meta-p" style="color:var(--text-tertiary);font-style:italic">
             No objective recorded yet. Run <code>/pb:specify</code> to capture one.
           </p>`;
      const principles = (o.principles && o.principles.length)
        ? o.principles.map(p => `
            <div class="meta-principle">
              <span class="meta-principle-num">${p.num}</span>
              <span class="meta-principle-text"><strong>${pbEscape(p.title)}</strong> — ${pbEscape(p.body)}</span>
            </div>`).join('')
        : `<p class="meta-p" style="color:var(--text-tertiary);font-style:italic">
             No principles recorded yet. Run <code>/pb:init</code> to capture them.
           </p>`;
      return `
        <div class="meta-section">
          <div class="meta-h2">2.1 Overview</div>
          <div style="margin-bottom:24px">
            <p class="meta-label">Objectives</p>
            ${objectiveBody}
          </div>
          <div style="margin-bottom:24px">
            <p class="meta-label">Principles</p>
            ${principles}
          </div>
        </div>
      `;
    }

    function pbRenderUserInsights() {
      const u = (PB_DATA && PB_DATA.userInsights) || {};
      const sub = (title, body) => `
        <div style="margin-bottom:24px">
          <p class="meta-label">${title}</p>
          <p class="meta-p">${body ? pbEscape(body) : '<em style="color:var(--text-tertiary)">Not recorded yet.</em>'}</p>
        </div>`;
      return `
        <div class="meta-section">
          <div class="meta-h2">2.2 User Insights</div>
          ${sub('Quantitative Data', u.quantitative)}
          ${sub('Research Summary Report', u.researchSummary)}
          ${sub('Executive Summary', u.executiveSummary)}
        </div>
      `;
    }

    /* A rule's DECISION — the part a rule cannot state for itself: what was asked, what lost, what
       was chosen, and why. It used to be `meta.tradeoffs[]`: a separate array, a separate view and
       a separate capture step in /pb:clarify, for a record that was already a rule. D-30 moved it
       beside the rules it produced; D-33 admitted it WAS one. Now any rule may carry a decision
       block and the card draws it, whatever the rule's kind.

       `[SUPERSEDED <date>]` in a title is still read. It is the convention the projects invented
       when the schema had no status field — `decision.status` is that field now, and the migration
       rewrites the prefix into it, but a title written the old way keeps working. */
    const PB_SUPERSEDED = /^\s*\[SUPERSEDED([^\]]*)\]\s*/i;

    function pbRuleDecision(d) {
      if (!d || typeof d !== 'object') return '';
      const opts = Array.isArray(d.options) ? d.options
        : (typeof d.options === 'string' ? d.options.split('|').map(x => x.trim()).filter(Boolean) : []);
      if (!d.question && !opts.length && !d.chose && !d.why) return '';
      // What LOST is the whole reason this record exists, so it is shown beside what won rather
      // than as a list the winner also appears in.
      const lost = opts.filter(o => o !== d.chose);
      return `<div class="lg-sec">
          <div class="lg-sec-h">Decided</div>
          ${d.question ? `<p class="meta-p">${pbEscape(d.question)}</p>` : ''}
          ${d.chose ? `<p class="meta-p"><strong>${pbEscape(d.chose)}</strong>${lost.length
              ? ` <span class="lg-dim">over ${lost.map(o => pbEscape(o)).join(' · ')}</span>` : ''}</p>` : ''}
          ${!d.chose && opts.length ? `<ul class="tw-opts">${opts.map(o => `<li>${pbEscape(o)}</li>`).join('')}</ul>` : ''}
          ${d.why ? `<p class="meta-p">${pbEscape(d.why)}</p>` : ''}
          ${d.affects ? `<div class="lg-dim">Affects: ${pbEscape(d.affects)}</div>` : ''}
        </div>`;
    }

    /* A project that has not run /pb:update-version yet still holds its decisions in the retired
       `meta.tradeoffs[]`. The shell stopped reading that field as a view — and rendering nothing
       would take 22 decisions off someone's screen and call it a tidy-up, which is the exact
       failure D-30 refused for `others`. So they render, through the same decision renderer, under
       a banner naming the one command that turns them into rules. Both disappear with the field. */
    function pbLegacyTradeoffs() {
      const t = ((PB_REGISTRY && PB_REGISTRY.meta) || {}).tradeoffs;
      return Array.isArray(t) ? t.filter(x => x && typeof x === 'object') : [];
    }
    function pbRenderLegacyTradeoffs() {
      const t = pbLegacyTradeoffs();
      if (!t.length) return '';
      return `<div class="pb-qa-warn">
          <div class="pb-qa-warn-head">⚠ ${t.length} decision${t.length === 1 ? '' : 's'} still in the retired <code>meta.tradeoffs</code></div>
          <ul class="pb-qa-warn-list">
            <li>A trade-off is a rule with its decision still attached. Run <code>/pb:update-version</code> to move these into <strong>ia.rules[]</strong> — they render here, unchanged, until you do.</li>
          </ul>
        </div>` + t.map((to, i) => {
          const raw = to.title || '';
          const sup = PB_SUPERSEDED.exec(raw);
          return `<div class="lg-card" id="tradeoff-${i + 1}">
              <div class="meta-h3">${pbEscape(sup ? raw.replace(PB_SUPERSEDED, '') : raw)}
                ${pbLgChip('decision', 'lg-chip--kind')}
                ${sup ? `<span class="lg-chip lg-chip--dead" style="text-decoration:none">superseded${pbEscape(sup[1] || '')}</span>` : ''}</div>
              ${pbRuleDecision({ question: to.question, options: to.options, chose: to.decision,
                                 why: to.why, affects: to.tabsAffected })}
            </div>`;
        }).join('');
    }

    /* =========================================================================
       TAB 3 — UX DESIGN · three sub-tabs
         Information Architecture — jobs → screens, over the DERIVED site map
         User Flow               — the wireflow + stories/test cases (unchanged)
         Logic                   — declared Rules | derived Ripple

       Everything the IA and Logic views draw beyond the two authored slices
       (`registry.ia` and the rules) is DERIVED at render time into `PB_LOGIC`
       by pb/tools/logic_extract.py. When that data is absent — an older
       project, or a hand-off rendered before it existed — each view renders an
       honest empty state rather than a broken one.
       ========================================================================= */
    const UX_SUBTABS = [['logic', 'Logic'], ['ia', 'Information Architecture'], ['flow', 'User Flow'], ['tests', 'Test Cases'], ['content', 'Content']];

    function pbUxDefaultView() {
      const L = window.PB_LOGIC;
      // IA leads when there are jobs to show; otherwise the flow, which is the
      // long-standing content of this tab and should not be displaced by an empty state.
      return (L && L.ia && L.ia.jobs && L.ia.jobs.length) ? 'ia' : 'flow';
    }
    function pbUxView() {
      if (!state.uxView) state.uxView = pbUxDefaultView();
      return state.uxView;
    }
    function pbSetUxView(v) { state.uxView = v; renderMetaFlow(); }

    function pbUxSubtabs() {
      const L = window.PB_LOGIC || {};
      const tc = pbTestCounts();
      const C = PB_DATA.content || {};
      const counts = {
        ia: (L.ia && L.ia.jobs) ? L.ia.jobs.length : 0,
        flow: (PB_DATA.flow && PB_DATA.flow.flows) ? PB_DATA.flow.flows.length : 0,
        logic: (L.rules || []).length,
        tests: tc.total + tc.manual,
        content: (C.terms || []).length + (C.strings || []).length,
      };
      const cur = pbUxView();
      return `<div class="meta-subtabs ux-subtabs">` + UX_SUBTABS.map(([id, label]) =>
        `<button class="meta-subtab ${cur === id ? 'active' : ''}" onclick="pbSetUxView('${id}')">`
        + `${label}${counts[id] ? ` <span class="meta-subtab-count">${counts[id]}</span>` : ''}</button>`
      ).join('') + `</div>`;
    }

    /* ── shared bits ─────────────────────────────────────────────────────── */
    const pbLgChip = (t, cls) => `<span class="lg-chip ${cls || ''}">${pbEscape(t)}</span>`;
    const pbLgBase = f => String(f || '').split('/').pop();
    const pbLgLink = (type, id, label, cls) =>
      `<a class="lg-link ${cls || ''}" href="#" onclick="pbLogicGo('${pbEscape(type)}','${pbEscape(id)}');return false">${pbEscape(label || id)}</a>`;
    function pbRoleName(id) {
      const r = (((PB_REGISTRY || {}).meta || {}).roles || []).find(x => x.id === id);
      return r ? (r.name || r.id) : id;
    }
    const PB_ROLE_HUE = {};
    (function () {
      const hues = [214, 152, 28, 282, 340, 190, 60];
      ((((PB_REGISTRY || {}).meta || {}).roles) || []).forEach((r, i) => { PB_ROLE_HUE[r.id] = hues[i % hues.length]; });
    })();
    const pbRoleDot = id =>
      `<i class="ia-dot" style="background:hsl(${PB_ROLE_HUE[id] || 0} 70% 45%)" title="${pbEscape(pbRoleName(id))}"></i>`;

    function pbUxEmpty(title, body, ctaLabel, command) {
      return `<div class="pb-content">${renderEmptyState({
        icon: EMPTY_STATE_ICONS.flow, title, body, ctaLabel, command,
      })}</div>`;
    }

    /* ── Information Architecture ─────────────────────────────────────────── */
    function pbSetIaRole(r) { state.iaRole = r; renderMetaFlow(); }
    function pbToggleIaOverlays() { state.iaOverlaysOpen = state.iaOverlaysOpen === false; renderMetaFlow(); }

    const pbJtbd = j =>
      `When <em>${pbEscape(j.when || '…')}</em>, I want to <strong>${pbEscape(j.want || j.job || '')}</strong>, so I can <em>${pbEscape(j.so || '…')}</em>`;
    const pbJobPill = j =>
      `<span class="ia-job ${(j.screens || []).length ? '' : 'ia-job--new'}" title="${pbEscape('When ' + (j.when || '') + ', I want to ' + (j.want || '') + ', so I can ' + (j.so || ''))}">`
      + `${(j.roles || []).map(pbRoleDot).join('')}${pbEscape(j.want || j.job || '')}</span>`;
    /* An unhandled job stays IN the list, flagged — it is not a different kind of thing, it is the
       same job missing a screen, and lifting it into a separate callout meant reading it twice and
       losing its place in the list. Its evidence and the two actions ride the row. */
    const pbJobRow = j => {
      const n = (j.screens || []).length;
      const actions = (n || VIEW_ONLY) ? '' : `<span class="ia-new-actions">`
        + `<button class="sync-button" onclick="openCopyPopover('/pb:plan --job ${pbEscape(j.id)}', this)">Plan a screen</button>`
        + `<button class="lg-view" onclick="openCopyPopover('/pb:build --job ${pbEscape(j.id)} --into &lt;screen-id&gt;', this)">Fold into…</button>`
        + `</span>`;
      return `<div class="ia-jrow ${n ? '' : 'ia-jrow--new'}">`
        + `<span class="ia-jrow-roles">${(j.roles || []).map(pbRoleDot).join('')}</span>`
        + `<span class="ia-jrow-text">${pbJtbd(j)}`
        + (n ? '' : `<div class="ia-jrow-why">${j.source ? `<span class="lg-dim">${pbEscape(j.source)}</span>` : ''}${actions}</div>`)
        + `</span>`
        + `<span class="lg-dim ia-jrow-meta">${pbEscape(j.priority || '')} · `
        + (n ? `${n} screen${n > 1 ? 's' : ''}` : `<span class="lg-warn">no screen</span>`)
        + `</span></div>`;
    };

    function pbRenderIA() {
      const L = window.PB_LOGIC;
      const ia = (L && L.ia) || null;
      const allJobs = (ia && ia.jobs) || [];
      // The site map is DERIVED (the nav graph); the job list is AUTHORED. Gating both on the
      // authored half threw away a map that was already built — a real project with 10 screens
      // placed still showed "No jobs yet". Each column now answers for itself.
      const N = L && L.nav;
      const hasMap = !!(N && N.depth && Object.keys(N.depth).length);
      if (!allJobs.length && !hasMap) {
        return pbUxEmpty('No jobs yet',
          'List what each role needs done, as "when … I want to … so I can …". Each job maps to the screens that serve it, so a job with no screen shows up as unfinished work and a screen with no job as a question worth asking.',
          'Capture the jobs', '/pb:init');
      }
      const roles = (((PB_REGISTRY || {}).meta || {}).roles) || [];
      const rf = state.iaRole || 'all';
      const jobs = allJobs.filter(j => rf === 'all' || (j.roles || []).includes(rf));
      const unassigned = jobs.filter(j => !(j.screens || []).length);

      // Role chips count jobs, so they only mean something once jobs exist.
      const chips = allJobs.length ? `<div class="ia-roles">
          <button class="lg-view ${rf === 'all' ? 'active' : ''}" onclick="pbSetIaRole('all')">All <span class="meta-subtab-count">${allJobs.length}</span></button>
          ${roles.map(r => `<button class="lg-view ${rf === r.id ? 'active' : ''}" onclick="pbSetIaRole('${pbEscape(r.id)}')">${pbRoleDot(r.id)}${pbEscape(r.name || r.id)} <span class="meta-subtab-count">${allJobs.filter(j => (j.roles || []).includes(r.id)).length}</span></button>`).join('')}
        </div>` : '';
      // Counts the "All jobs" heading already carries are gone; only the one that is a FINDING
      // stays, and only while it is non-zero — a green "0 not handled" is noise on every render.
      const stats = unassigned.length
        ? `<div class="ia-stats"><span class="lg-warn">${unassigned.length} not handled by anything</span></div>`
        : '';

      // Every job with no screen is flagged twice: the callout below, and the "no screen"
      // badge on its row in the All jobs list — the site map flags the inverse (a screen with
      // no job) per node, so screen-side coverage never needs its own separate summary here.
      const jobsBody = allJobs.length
        ? `<div class="ia-card ia-card--flat">
            <div class="meta-h3">All jobs <span class="meta-subtab-count">${jobs.length}</span></div>
            ${jobs.map(pbJobRow).join('')}
          </div>`
        : renderEmptyState({
            icon: EMPTY_STATE_ICONS.flow,
            title: 'No jobs yet',
            body: 'The site map beside this is derived from the code and needs nothing from you. The jobs do: list what each role needs done, as "when … I want to … so I can …". Once they exist, every screen shows which jobs it serves — and every job with no screen is flagged as unfinished work.',
            ctaLabel: 'Capture the jobs', command: '/pb:init',
          });

      // Site map first, job list second. The section heading is lifted OUT of the columns and
      // spans both — left in the job column it would have ridden along to the right-hand side,
      // which is the one place a section title must never sit.
      return `<div class="ia-head">
          <div class="meta-h2">3.2 Information Architecture</div>
        </div>
        <div class="ia-layout">
        <div class="ia-map-col">
          ${pbRenderSiteMap(ia, jobs, rf)}
        </div>
        <div class="ia-jobs-col">
          ${chips}
          ${stats}
          ${jobsBody}
        </div>
      </div>`;
    }

    /* The site map, drawn as an org chart. Layer membership and every edge are DERIVED — layer 0
       is each screen a sidebar item targets, deeper layers come from data-nav / data-go /
       setProtoScreen in the render bodies, and overlays are the drawer/modal/dialog components a
       screen composes. Only each layer's PURPOSE is authored; asking an author to redraw a
       hierarchy the code already encodes is how the two drift apart.

       It used to be a grid of columns, one per depth, which read as a table rather than a
       structure: you could see WHICH layer a screen sat in but not WHAT reaches it. A tidy tree
       answers the second question, which is the one the words "site map" promise. */
    const IA_NW = 220, IA_HGAP = 22, IA_VGAP = 56, IA_GUT = 96, IA_PAD = 20;
    /* Node height is DERIVED from the longest title and id in the chart, not fixed: a card grows
       to hold its text rather than clipping it. One height for every card keeps the row grid and
       the edge maths exact — only the tallest card decides it. */
    const IA_NH_BASE = 72, IA_TITLE_LH = 19, IA_ID_LH = 15;
    const pbIaLines = (s, charsPerLine) => Math.max(1, Math.ceil(String(s || '').length / charsPerLine));

    /* Leaving the whole card clickable made every attempt to READ the chart a navigation away from
       it — you cannot drag past a node, or point at one while talking, without being thrown into
       the Logic tab. The jump is an explicit affordance now; the card is just a card. */
    const pbIaGoBtn = id =>
      `<button class="ia-node-go" title="Open ${pbEscape(id)} in the Logic ripple"
        onclick="event.stopPropagation();pbLogicGo('item','${pbEscape(id)}')">ripple →</button>`;

    /* Tidy-tree layout: leaves take the next free column, a parent centres over its children.
       Returns post-order nodes (position is absolute, so order is irrelevant) + parent→child edges. */
    function pbIaTreeLayout(N, S, visible) {
      const placed = new Set();
      const nodes = [], edges = [];
      let cursor = 0, maxRow = 0;
      const kidsOf = id => ((N.children || {})[id] || []).filter(c => S[c] && visible(c) && !placed.has(c));

      const layout = (id, row) => {
        placed.add(id);
        maxRow = Math.max(maxRow, row);
        const cs = kidsOf(id);
        // Claim the whole child set BEFORE recursing: two siblings that share a child must not
        // both place it, and the graph is a DAG, not a tree.
        cs.forEach(c => placed.add(c));
        const centers = cs.map(c => layout(c, row + 1));
        let x;
        if (centers.length) {
          x = (centers[0] + centers[centers.length - 1]) / 2;
        } else {
          x = cursor + IA_NW / 2;
          cursor += IA_NW + IA_HGAP;
        }
        nodes.push({ id, row, x });
        centers.forEach(cx => edges.push({ x1: x, r1: row, x2: cx, r2: row + 1 }));
        return x;
      };

      // Roots in sidebar order — the hub list IS the product's own entry order — then any other
      // depth-0 screen, then whatever the walk never reached (a cycle, a stray parent).
      const roots = [];
      const push = id => { if (S[id] && visible(id) && roots.indexOf(id) === -1) roots.push(id); };
      (N.hubs || []).forEach(h => {
        [h.key].concat((h.children || []).map(c => c.key)).forEach(k => { if ((N.depth || {})[k] === 0) push(k); });
      });
      Object.keys(N.depth || {}).forEach(id => { if (N.depth[id] === 0) push(id); });
      roots.forEach(r => { if (!placed.has(r)) { layout(r, 0); cursor += IA_HGAP; } });
      Object.keys(N.depth || {}).forEach(id => {
        if (!placed.has(id) && S[id] && visible(id)) { layout(id, N.depth[id] || 0); cursor += IA_HGAP; }
      });

      return { nodes, edges, maxRow, width: Math.max(IA_NW, cursor - IA_HGAP) };
    }

    function pbRenderSiteMap(ia, jobs, rf) {
      const N = (window.PB_LOGIC || {}).nav;
      if (!N || !N.depth) return '';
      const S = {};
      (PB_REGISTRY.screens || []).forEach(s => { S[s.id] = s; });
      const title = id => (S[id] && (S[id].title || S[id].name)) || id;
      const jobsOf = id => jobs.filter(j => (j.screens || []).includes(id));
      const visible = id => rf === 'all' || (S[id] && (S[id].roles || []).includes(rf)) || jobsOf(id).length;

      // `ia` may be absent entirely — the map is derived and stands on its own; only the
      // layer NAMES and purposes are authored, and those fall back to "Layer <n>".
      const layers = (ia && ia.layers) || [];
      const declared = layers.filter(l => l.depth !== 'overlay').sort((a, b) => a.depth - b.depth);
      const overlayLayer = layers.find(l => l.depth === 'overlay');
      const layerAt = d => declared.find(l => l.depth === d) || { name: 'Layer ' + d, purpose: '' };

      const T = pbIaTreeLayout(N, S, visible);
      if (!T.nodes.length) return '';

      // ~26 chars of 13px title and ~32 of 11px mono id fit one line of a 220px card.
      const IA_NH = IA_NH_BASE
        + (Math.max(...T.nodes.map(n => pbIaLines(title(n.id), 26))) - 1) * IA_TITLE_LH
        + (Math.max(...T.nodes.map(n => pbIaLines(n.id, 32))) - 1) * IA_ID_LH;

      /* Overlays are part of the structure, not a footnote — they are the drawers and modals a
         screen opens in place, and `ia.layers` declares a layer for them. They get their own rail
         at the foot of the chart: each overlay sits under the mean x of the screens that open it,
         with one dashed edge per owner, so a SHARED overlay reads as several edges converging.
         That convergence is the reuse signal, and a count inside the node could never show it. */
      const OV_W = 190, OV_GAP = 16;
      const ovOpen = state.iaOverlaysOpen !== false;
      const nodeX = {}, nodeRow = {};
      T.nodes.forEach(n => { nodeX[n.id] = n.x; nodeRow[n.id] = n.row; });
      const ovOwners = {};
      T.nodes.forEach(n => ((N.overlays || {})[n.id] || []).forEach(o => {
        (ovOwners[o] = ovOwners[o] || []).push(n.id);
      }));
      const meanX = o => ovOwners[o].reduce((s, i) => s + nodeX[i], 0) / ovOwners[o].length;
      const ovAll = Object.keys(ovOwners).sort((a, b) => meanX(a) - meanX(b));
      // Collapsed, the rail keeps its label and count but places nothing — this is the busiest
      // row on the chart (one edge per owner), and it is not always what you came to read.
      const ovIds = ovOpen ? ovAll : [];
      // Place at the preferred x, then push right just enough to clear the previous one. Sorting
      // by preference first is what keeps the edges from criss-crossing.
      const ovX = {};
      let ovCursor = OV_W / 2 - OV_W - OV_GAP;
      ovIds.forEach(o => { ovCursor = ovX[o] = Math.max(meanX(o), ovCursor + OV_W + OV_GAP); });
      const ovWidth = ovIds.length ? ovX[ovIds[ovIds.length - 1]] + OV_W / 2 : 0;
      // Same rule as the screen cards: the tallest id decides the row's height, nothing is cut.
      const OV_H = 56 + (ovAll.length ? Math.max(...ovAll.map(o => pbIaLines(o, 30))) - 1 : 0) * IA_ID_LH;

      const W = IA_GUT + Math.max(T.width, ovWidth) + IA_PAD * 2;
      const H = IA_PAD * 2 + (T.maxRow + 1) * (IA_NH + IA_VGAP) - IA_VGAP
        + (ovAll.length ? IA_VGAP + (ovOpen ? OV_H : 24) : 0);
      const cx = x => IA_GUT + IA_PAD + x;
      const ry = r => IA_PAD + r * (IA_NH + IA_VGAP);
      const ovY = IA_PAD + (T.maxRow + 1) * (IA_NH + IA_VGAP);

      // Orthogonal elbows: down out of the parent, across the gutter between rows, down into the
      // child. Straight segments read as hierarchy in a way curves do not.
      const edges = T.edges.map(e => {
        const y1 = ry(e.r1) + IA_NH, y2 = ry(e.r2), my = y1 + IA_VGAP / 2;
        return `<path class="ia-edge" d="M${cx(e.x1)} ${y1} V${my} H${cx(e.x2)} V${y2}"/>`;
      }).join('')
      + ovIds.map(o => ovOwners[o].map(owner => {
        const y1 = ry(nodeRow[owner]) + IA_NH, my = ovY - IA_VGAP / 2;
        return `<path class="ia-edge ia-edge--ov" d="M${cx(nodeX[owner])} ${y1} V${my} H${cx(ovX[o])} V${ovY}"/>`;
      }).join('')).join('');

      const rowLines = [], rowLabs = [];
      const rail = (top, label, count, purpose) =>
        `<div class="ia-rowlab" style="top:${top}px;width:${IA_GUT - 14}px" title="${pbEscape(purpose || 'No purpose authored for this layer — /pb:init asks for one sentence each')}">`
        + `${pbEscape(label)}<span class="ia-rowlab-n">${count}</span></div>`;
      for (let r = 0; r <= T.maxRow; r++) {
        const l = layerAt(r), n = T.nodes.filter(x => x.row === r).length;
        rowLines.push(`<line class="ia-rowline" x1="0" y1="${ry(r) - 16}" x2="${W}" y2="${ry(r) - 16}"/>`);
        rowLabs.push(rail(ry(r), 'L' + r + ' · ' + l.name, n, l.purpose));
      }
      if (ovAll.length) {
        rowLines.push(`<line class="ia-rowline ia-rowline--ov" x1="0" y1="${ovY - 16}" x2="${W}" y2="${ovY - 16}"/>`);
        rowLabs.push(`<div class="ia-rowlab ia-rowlab--ov" style="top:${ovY}px;width:${IA_GUT - 14}px"
            title="${pbEscape((overlayLayer && overlayLayer.purpose) || 'The drawers and modals a screen opens in place')}">
            <button class="ia-rail-toggle" onclick="pbToggleIaOverlays()" title="${ovOpen ? 'Collapse' : 'Expand'} the overlay layer">${ovOpen ? '▾' : '▸'}</button>
            Overlay · ${pbEscape((overlayLayer && overlayLayer.name) || 'Drawer & modal')}<span class="ia-rowlab-n">${ovAll.length}</span>
          </div>`);
      }

      const nodeEls = T.nodes.map(n => {
        const js = jobsOf(n.id), ov = (N.overlays || {})[n.id] || [];
        const ovBit = ov.length ? ` · ${ov.length} overlay${ov.length > 1 ? 's' : ''}` : '';
        const meta = (js.length ? `${js.length} job${js.length > 1 ? 's' : ''}` : '<span class="lg-warn">no job</span>') + ovBit;
        const tip = (js.length ? js.map(j => '• ' + (j.want || j.job || '')).join('\n') : 'No job maps to this screen')
          + (ov.length ? '\n\noverlays: ' + ov.join(', ') : '');
        return `<div class="ia-node ia-node--card ${js.length ? '' : 'ia-node--empty'}"
            style="left:${cx(n.x) - IA_NW / 2}px;top:${ry(n.row)}px;width:${IA_NW}px;height:${IA_NH}px"
            title="${pbEscape(tip)}">
            <div class="ia-node-t"><strong>${pbEscape(title(n.id))}</strong>${((S[n.id] || {}).roles || []).map(pbRoleDot).join('')}</div>
            <div class="lg-dim ia-node-id">${pbEscape(n.id)}</div>
            <div class="ia-node-m"><span>${meta}</span>${pbIaGoBtn(n.id)}</div>
          </div>`;
      }).join('')
      + ovIds.map(o => {
        const owners = ovOwners[o];
        return `<div class="ia-node ia-node--card ia-node--ov"
            style="left:${cx(ovX[o]) - OV_W / 2}px;top:${ovY}px;width:${OV_W}px;height:${OV_H}px"
            title="${pbEscape('Opened by: ' + owners.map(id => title(id)).join(', '))}">
            <div class="ia-node-t">${pbEscape(o)}</div>
            <div class="ia-node-m"><span>${owners.length} screen${owners.length > 1 ? 's' : ''}</span>${pbIaGoBtn(o)}</div>
          </div>`;
      }).join('');

      const orphans = Object.keys(S).filter(id => N.depth[id] == null && visible(id));
      const ovCount = ovIds.length;

      return `<div class="meta-h3 ia-map-title">Site map <span class="meta-subtab-count">${T.nodes.length} screens · ${T.maxRow + 1} layer${T.maxRow ? 's' : ''}${ovCount ? ` · ${ovCount} overlays` : ''}</span></div>
        <div class="flow-canvas ia-canvas" id="iamap-canvas">
          <div class="flow-viewport" id="iamap-viewport">
            <div class="flow-stage ia-stage" id="iamap-stage" data-w="${W}" data-h="${H}"
                 style="width:${W}px;height:${H}px;margin-top:${-H / 2}px;margin-left:${-W / 2}px">
              <svg class="ia-edges" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${rowLines.join('')}${edges}</svg>
              ${rowLabs.join('')}
              ${nodeEls}
            </div>
          </div>
          <div class="flow-zoom-controls">
            <button class="flow-zoom-btn" id="iamap-zoom-in"  title="Zoom in">+</button>
            <button class="flow-zoom-btn" id="iamap-zoom-out" title="Zoom out">−</button>
            <button class="flow-zoom-btn" id="iamap-zoom-fit" title="Fit / reset">⊙</button>
          </div>
          <div class="flow-zoom-readout" id="iamap-zoom-readout">100%</div>
          <div class="flow-hint">Scroll to zoom · drag to pan · click a screen for its ripple</div>
        </div>
        ${orphans.length ? `<div class="ia-orphans"><span class="lg-warn">Reachable from no hub:</span> ${orphans.map(id => `<span class="ia-ov">${pbEscape(id)}</span>`).join(' ')}</div>` : ''}`;
    }

    /* ── Logic · Rules | Ripple ───────────────────────────────────────────── */
    function pbSetLogicView(v) { state.logicView = v; renderMetaFlow(); }
    function pbLogicGo(type, id) {
      state.logicFocus = { type, id };
      state.logicView = 'ripple';
      state.uxView = 'logic';
      renderMetaFlow();
    }
    /* Jump to a DECLARED rule, not a derived node — pbLogicGo lands in the ripple, which has no
       rule to land on. Content's glossary links here, so a term and the rule that governs it are
       one click apart. */
    function pbLogicGoRule(id) {
      state.logicView = 'rules';
      state.uxView = 'logic';
      renderMetaFlow();
      const el = document.getElementById('rule-' + id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function pbLogicFilter(inp) {
      const q = (inp.value || '').toLowerCase();
      document.querySelectorAll('#logic-list .logic-row').forEach(r => { r.hidden = q && r.dataset.k.indexOf(q) === -1; });
      document.querySelectorAll('#logic-list .logic-group').forEach(g => { g.hidden = !g.querySelector('.logic-row:not([hidden])'); });
    }

    function pbRenderLogic() {
      const L = window.PB_LOGIC;
      if (!L || !L.stats) {
        return pbUxEmpty('No logic graph yet',
          'The ripple view is derived from your render bodies at render time — what each handler reads, which store slice it touches, what it re-renders — and rules you declare are linked to the code that implements them. Re-render to generate it.',
          'Render', '/pb:build --render');
      }
      // Land on Rules when there is anything to read there — including decisions a project has
      // not migrated yet, which would otherwise open on Ripple and look like nothing was recorded.
      if (!state.logicView) {
        state.logicView = ((L.rules || []).length + pbLegacyTradeoffs().length) ? 'rules' : 'ripple';
      }
      const v = state.logicView;
      const S = L.stats;
      return `<div class="meta-section">
          <div class="meta-h2">3.1 Logic</div>
          <p class="meta-p" style="color:var(--text-tertiary)">Declared <strong>rules</strong> — state machines, permission matrices, constraint sets, and the decisions behind them — linked to the code that implements them; and the derived <strong>ripple</strong> of every handler: what it reads, which store slice it touches, what it re-renders.</p>
          <div class="lg-views">
            <button class="lg-view ${v === 'rules' ? 'active' : ''}" onclick="pbSetLogicView('rules')">Rules <span class="meta-subtab-count">${(L.rules || []).length + pbLegacyTradeoffs().length}</span></button>
            <button class="lg-view ${v === 'ripple' ? 'active' : ''}" onclick="pbSetLogicView('ripple')">Ripple <span class="meta-subtab-count">${S.handlers}</span></button>
            <span class="lg-stats">${S.handlers} handlers · ${S.exported} shared · ${S.saves} saves · ${S.slices} store slices · <span class="${S.deadReads ? 'lg-warn' : ''}">${S.deadReads} dead read${S.deadReads === 1 ? '' : 's'}</span></span>
          </div>
          ${v === 'rules' ? pbRenderLogicRules(L) : pbRenderLogicRipple(L)}
        </div>`;
    }

    function pbRenderLogicRules(L) {
      const legacy = pbRenderLegacyTradeoffs();
      const rules = L.rules || [];
      if (!rules.length) {
        // "No rules declared yet" under a rendered decision reads as a contradiction; the banner
        // above it already says what those cards are and what to run.
        if (legacy) return legacy;
        return `<p class="meta-p lg-dim">No rules declared yet. A rule is a state machine, a matrix, a constraint — or a <code>decision</code>, one you have made but not yet expressed as any of those. The lifecycle of a cycle, who may edit what, why validation is inline: written down once, so the diagram, the code that implements it and the screens that display it stay linked.</p>`;
      }
      return legacy + rules.map(r => {
        const raw = r.title || '';
        const sup = PB_SUPERSEDED.exec(raw);
        const d = r.decision || {};
        const dead = !!sup || d.status === 'superseded';
        const when = sup ? (sup[1] || '') : (d.supersededOn ? ' ' + d.supersededOn : '');
        return `
        <div class="lg-card ${dead ? 'lg-card--sup' : ''}" id="rule-${pbEscape(r.id)}">
          <div class="meta-h3">${pbEscape(sup ? raw.replace(PB_SUPERSEDED, '') : raw)} ${pbLgChip(r.kind, 'lg-chip--kind')}
            ${dead ? `<span class="lg-chip lg-chip--dead" style="text-decoration:none">superseded${pbEscape(when)}</span>` : ''}</div>
          ${r.summary && r.summary !== (d.chose || '') ? `<p class="meta-p">${pbEscape(r.summary)}</p>` : ''}
          ${r.kind === 'state-machine' ? pbRuleStateMachine(r) : r.kind === 'matrix' ? pbRuleMatrix(r) : r.kind === 'constraint' ? pbRuleConstraint(r) : ''}
          ${pbRuleDecision(d)}
        </div>`;
      }).join('');
    }

    /* A state machine, drawn. The overlay states are bands ABOVE the stages they cover rather
       than nodes in the chain, because that is what they are: a deadline overlay sits on top of
       whatever stage the thing is in. No Mermaid state diagram can express that, which is why
       this is hand-drawn SVG. */
    /* Rough width of a string at a given font size. SVG <text> neither wraps nor ellipsises, so
       this sizes the SHAPE to the text — the box grows, the label is never cut. */
    const pbSvgTextW = (s, perChar) => String(s || '').length * (perChar || 6.2);

    /* Declared states that no code puts the system into. The answer is only sound when the rule
       named the property holding the state (`stateField`) and marked its computed states
       `derived` — without that, a scan cannot tell a domain state from a UI variant sharing the
       word, nor an assigned machine from one derived from dates. So: no stateField, no claim. */
    function pbRuleUnreachable(r) {
      const sw = ((window.PB_LOGIC || {}).stateWriters || {})[r.id];
      if (!sw || sw.unscoped || !r.stateField) return [];
      return Object.keys(sw).filter(k => !sw[k].derived && !(sw[k].assigns || []).length);
    }

    /* Two things are drawn here and they are not the same kind of thing. The STATES are a timeline:
       left to right is progression, and an arrow is a move. The OVERLAYS are scope: a condition that
       holds across a SPAN of that timeline. Drawn as look-alike pills floating above the row, they
       read as more states — and with three of them the last band collided with the boxes, because
       the state baseline was a constant while the band stack grows.

       So: the bands get their own zone with a caption and a rule under it, each band is aligned
       EXACTLY to the boxes it spans with solid end caps (a span has ends; a pill does not), its
       label sits at the start of the span rather than floating in the middle, and the baseline is
       computed from the stack instead of guessed. */
    function pbRuleStateMachine(r) {
      const H = 54, GAP = 46, x0 = 12;
      const OV_TOP = 22, OV_H = 20, OV_GAP = 5;
      const states = r.states || [], overlays = r.overlays || [];
      if (!states.length) return '';
      // One width for every box, taken from the longest label or key in the machine.
      const W = Math.ceil(Math.max(190, ...states.map(s =>
        Math.max(pbSvgTextW(s.label, 7.3), pbSvgTextW(s.key, 6.2)) + 28)));
      const idx = {};
      states.forEach((s, i) => { idx[s.key] = i; });
      // Only overlays that actually land on a state in this machine take a row in the zone — an
      // unresolvable `over` must not reserve height it never draws into.
      const spans = overlays.map(o => {
        const cols = (o.over || []).map(k => idx[k]).filter(i => i != null);
        return cols.length ? { o, a: Math.min.apply(null, cols), b: Math.max.apply(null, cols) } : null;
      }).filter(Boolean)
        // Widest scope on top, narrowest nearest the timeline: a narrower span sitting inside a
        // wider one then LOOKS contained by it, which is what "scope" means here. In declaration
        // order the same two bands read as an arbitrary stack.
        .sort((p, q) => (q.b - q.a) - (p.b - p.a) || p.a - q.a);
      // The baseline follows the stack instead of being a constant that three bands overflow.
      const y = spans.length ? OV_TOP + spans.length * (OV_H + OV_GAP) + 20 : 14;
      const axisY = y - 14;
      // A state nothing can put the system into. Only claimed when the rule declared a
      // `stateField`; see pbRuleUnreachable.
      const unreachable = pbRuleUnreachable(r);
      const box = (s, i) => {
        const x = x0 + i * (W + GAP);
        const dead = unreachable.indexOf(s.key) !== -1;
        return `<g><title>${pbEscape(s.label)} — ${pbEscape(s.condition || '')}${dead ? '\n\nNothing assigns ' + r.stateField + " = '" + s.key + "' — no action reaches this state" : ''}</title>`
          + `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10" class="lg-st ${dead ? 'lg-st--dead' : ''}"/>`
          + `<text x="${x + W / 2}" y="${y + 23}" class="lg-st-t">${pbEscape(s.label)}</text>`
          + `<text x="${x + W / 2}" y="${y + 41}" class="lg-st-k">${pbEscape(s.key)}</text></g>`;
      };
      const arrows = (r.transitions || []).map(t => {
        const ia = idx[t[0]], ib = idx[t[1]];
        if (ia == null || ib == null) return '';
        if (ib === ia + 1) {
          const x1 = x0 + ia * (W + GAP) + W, x2 = x0 + ib * (W + GAP);
          return `<line x1="${x1}" y1="${y + H / 2}" x2="${x2 - 2}" y2="${y + H / 2}" class="lg-arrow" marker-end="url(#lgArr)"/>`;
        }
        const xa = x0 + ia * (W + GAP) + W / 2, xb = x0 + ib * (W + GAP) + W / 2, yy = y + H + 34;
        return `<path d="M${xa} ${y + H} C ${xa} ${yy}, ${xb} ${yy}, ${xb} ${y + H + 2}" class="lg-arrow lg-arrow--back" marker-end="url(#lgArr)"/>`;
      }).join('');
      const total = x0 * 2 + states.length * (W + GAP) - GAP;
      const bands = spans.map((sp, j) => {
        // Exactly the boxes it covers — same left edge as the first, same right edge as the last.
        // An overshoot of a few pixels is what made "spans all five" and "spans three" look alike.
        const x = x0 + sp.a * (W + GAP);
        const w = (sp.b - sp.a) * (W + GAP) + W;
        const oy = OV_TOP + j * (OV_H + OV_GAP);
        // The band carries the LABEL only. Its condition is printed verbatim one row down in the
        // table — putting it here too made the longest overlay spill out BOTH ends of its pill,
        // because a band is sized by the states it spans and never by its text.
        return `<g><title>${pbEscape(sp.o.label)} — ${pbEscape(sp.o.condition || '')}</title>`
          + `<rect x="${x}" y="${oy}" width="${w}" height="${OV_H}" rx="4" class="lg-ov${j % 2 ? ' lg-ov--alt' : ''}"/>`
          + `<line x1="${x + .5}" y1="${oy}" x2="${x + .5}" y2="${oy + OV_H}" class="lg-ov-cap"/>`
          + `<line x1="${x + w - .5}" y1="${oy}" x2="${x + w - .5}" y2="${oy + OV_H}" class="lg-ov-cap"/>`
          + `<text x="${x + 10}" y="${oy + 14}" class="lg-ov-t">${pbEscape(sp.o.label)}</text></g>`;
      }).join('');
      // The zone caption and the rule under it are what separate "scope" from "timeline". Without
      // them the bands are just more boxes that happen to be wider.
      const zone = spans.length
        ? `<text x="${x0}" y="14" class="lg-zone">Scope</text>`
          + `<line x1="${x0}" y1="${axisY}" x2="${total - x0}" y2="${axisY}" class="lg-axis"/>`
          + `<text x="${x0}" y="${axisY + 12}" class="lg-zone">Timeline</text>`
        : '';
      const rows = states.map(s => `<tr class="${unreachable.indexOf(s.key) !== -1 ? 'lg-tr-dead' : ''}"><td><strong>${pbEscape(s.label)}</strong> <span class="lg-dim">${pbEscape(s.key)}</span></td><td>${pbEscape(s.condition || '')}${unreachable.indexOf(s.key) !== -1 ? ` <span class="lg-warn">— nothing assigns ${pbEscape(r.stateField)} = '${pbEscape(s.key)}'</span>` : ''}</td></tr>`).join('')
        // Same order as the bands above, so the third row down is the third band down. An overlay
        // whose `over` resolves to nothing has no band; it still gets its row, at the end.
        + spans.map(sp => sp.o).concat(overlays.filter(o => !spans.some(sp => sp.o === o)))
            .map(o => `<tr class="lg-tr-ov"><td><strong>${pbEscape(o.label)}</strong> <span class="lg-dim">overlay · ${pbEscape(o.key)}</span></td><td>${pbEscape(o.condition || '')}</td></tr>`).join('');
      // Height follows the content: the band stack, the boxes, and the loop-back arcs under them.
      const totalH = y + H + 46;
      return `<div class="lg-svg-wrap"><svg viewBox="0 0 ${total} ${totalH}" width="100%" style="max-width:${total}px;display:block">
          <defs><marker id="lgArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="lg-arrow-head"/></marker></defs>
          ${zone}${bands}${states.map(box).join('')}${arrows}
        </svg></div>
        <table class="lg-table"><thead><tr><th>State</th><th>Condition</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    /* The third rule shape: a set of invariants, each with the ONE function that enforces it.
       Scoring rules are neither a machine nor a matrix — "every weight pool totals 100", "the final
       score is clamped 0–100 at the single commit point" — and before this kind existed they could
       only render as a title over a paragraph, with the enforcement point left unnamed. An invariant
       with no `enforcedBy` is drawn as a warning, because a rule nothing enforces is the finding. */
    function pbRuleConstraint(r) {
      const inv = r.invariants || [];
      if (!inv.length) return '';
      return `<table class="lg-table"><thead><tr><th>Must hold</th><th>Enforced by</th><th>When</th></tr></thead><tbody>`
        + inv.map(i => `<tr>
            <td>${pbEscape(i.must || '')}${i.message ? `<div class="lg-dim">${pbEscape(i.message)}</div>` : ''}</td>
            <td>${i.enforcedBy ? pbLgLink('handler', i.enforcedBy, i.enforcedBy + '()') : '<span class="lg-warn">nothing</span>'}</td>
            <td class="lg-dim">${pbEscape(i.when || '')}</td>
          </tr>`).join('')
        + `</tbody></table>`;
    }

    function pbRuleMatrix(r) {
      const cell = v => v === true ? pbLgChip('✓', 'lg-c-yes')
        : v === false ? pbLgChip('—', 'lg-c-no')
        : pbLgChip(v, 'lg-c-' + String(v).replace(/[^a-z]/gi, ''));
      return `<table class="lg-table lg-matrix">
