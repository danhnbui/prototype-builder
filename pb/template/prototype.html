                <span class="ci-val"><select class="ci-select pb-cm-select" onchange="setPlaygroundTheme(this.value)">
                  <option value="light" ${theme === 'light' ? 'selected' : ''}>Light</option>
                  <option value="dark" ${theme === 'dark' ? 'selected' : ''}>Dark</option>
                </select></span></div></div>
            </div>
          </aside>
        </div></div>`;
    }
    /* Theme only affects the preview canvas — toggle it in place (no full re-render, keeps scroll). */
    function setPlaygroundTheme(t) {
      state.pgTheme = t;
      document.querySelectorAll('.pb-pg-canvas').forEach(c => c.setAttribute('data-theme', t));
      document.querySelectorAll('.pb-pg-theme button').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-theme-val') === t));
      document.querySelectorAll('select.pb-cm-select').forEach(s => { s.value = t; });
    }
    function pbResetPlaygroundProps(orgId) {
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === orgId);
      if (!org) return;
      const seed = {};
      (org.properties || []).forEach(p => { seed[p.id] = p.default; });
      handoffProps[orgId] = seed;
      renderHandoff();
    }

    /* v0.3.13 — Auto-position handoff hit overlays from rendered elements. */
    function recomputeHandoffBounds() {
      const frame = document.querySelector('.handoff-screen-frame');
      if (!frame) return;
      const overlay = frame.querySelector('.handoff-element-overlay');
      if (!overlay) return;
      const frameRect = frame.getBoundingClientRect();
      frame.querySelectorAll('[data-handoff-el]').forEach(target => {
        const id = target.getAttribute('data-handoff-el');
        const hit = overlay.querySelector(`.handoff-element-hit[onclick*="'${id}'"]`);
        if (!hit) return;
        const r = target.getBoundingClientRect();
        hit.style.top    = (r.top    - frameRect.top)  + 'px';
        hit.style.left   = (r.left   - frameRect.left) + 'px';
        hit.style.width  = r.width  + 'px';
        hit.style.height = r.height + 'px';
        hit.style.right  = 'auto';
        hit.style.bottom = 'auto';
      });
    }
    window.addEventListener('resize', function(){
      if (state && state.metaView === 'handoff' && PB_DATA.handoff.view === 'screen') {
        requestAnimationFrame(recomputeHandoffBounds);
      }
    });

    /* v0.3.0 — Component view as vertical card list. Click card → spec drawer. */
    /* The component card list for the active scope (Global/Local). Selection + Push live
       in the page header / tab control now — this returns just the cards. */
    function pbRenderHandoffCards(shown) {
      const orgs = (PB_DATA.handoff.organisms || []);
      if (!shown || !shown.length) {
        const scope = state.handoffScope || 'local';
        return `<p class="meta-p" style="color:var(--text-tertiary);font-style:italic">No ${scope} components.${scope === 'global' ? ' Global components are shared design-system refs reused across prototypes.' : ' Local components are built for this project.'}</p>`;
      }
      const cardHtml = (org) => {
        const i = orgs.indexOf(org);
        const props = pbActiveProps(org);
        const layout = org.codeLayout === 'side-by-side' ? 'side-by-side' : 'stacked';
        const selected = state.handoffDrawerOpenFor === org.id;
        const levelBadge = org.level ? `<span class="handoff-level-badge">${pbEscape(org.level)}</span>` : '';
        return `
          <div class="handoff-card ${selected ? 'is-selected' : ''}" onclick="openHandoffDrawer('${pbEscape(org.id)}')">
            <div class="handoff-card-header">
              <span class="handoff-card-title">${i+1} · ${pbEscape(org.name)}</span>
              ${levelBadge}
              <div class="handoff-card-header-actions" onclick="event.stopPropagation()">${pbRenderHandoffCode(org)}</div>
            </div>
            ${org.meta ? `<p class="handoff-card-meta">${pbEscape(org.meta)}</p>` : ''}
            <div class="handoff-card-controls" onclick="event.stopPropagation()">
              ${(org.properties || []).filter(prop => (prop.options || []).length).map(prop => `
                <label class="prop-field">
                  <span class="prop-label">${pbEscape(prop.label || prop.id)}</span>
                  <select class="prop-select" onchange="setHandoffProp('${pbEscape(org.id)}','${pbEscape(prop.id)}',this.value)">
                    ${(prop.options || []).map(o => `<option value="${pbEscape(o.value)}" ${props[prop.id]===o.value?'selected':''}>${pbEscape(o.label)}</option>`).join('')}
                  </select>
                </label>`).join('')}
            </div>
            <div class="handoff-card-body handoff-card-body--${layout}">
              <div>${pbRenderComponentDemo(org, props)}</div>
            </div>
          </div>`;
      };
      // Sort by level order (atom → molecule → organism), then flat list.
      const LEVEL_ORDER = ['atom', 'molecule', 'organism'];
      const sorted = shown.slice().sort((a, b) => {
        const ia = LEVEL_ORDER.indexOf(a.level), ib = LEVEL_ORDER.indexOf(b.level);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      return `<div class="handoff-card-list">${sorted.map(cardHtml).join('')}</div>`;
    }

    // Component demo (v1.5): a single live preview of the currently-selected variant. The
    // variant (incl. `state`) is chosen via the card's dropdowns — changing one re-renders
    // this demo through setHandoffProp, so the demo stays interactive.
    function pbRenderComponentDemo(org, props) {
      const body = (typeof window[org.renderFn] === 'function')
        ? window[org.renderFn](props)
        : `<div style="padding:14px;color:var(--text-tertiary);font-style:italic;font-size: var(--font-size-xs)">Renderer <code>${pbEscape(org.renderFn || '(none)')}</code> not defined.</div>`;
      return `<div class="handoff-card-preview" data-component-preview="${pbEscape(org.id)}">${body}</div>`;
    }

    const PB_CLIPBOARD_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    function pbRenderHandoffCode(org) {
      if (!org.code || !org.code.snippet)
        return `<div class="handoff-code handoff-code--empty">No code recorded.</div>`;
      return `<div class="handoff-code">
          <button class="handoff-copy-code-btn" onclick="event.stopPropagation(); openCodeDialog('${pbEscape(org.id)}')">
            ${PB_CLIPBOARD_ICON} Copy code
          </button>
        </div>`;
    }

    /* v1.5 — code review dialog: shows the snippet, auto-copies on open, "Copy again" button. */
    function pbCopyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
      } catch (e) { /* fall through */ }
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) { /* silent */ }
      document.body.removeChild(ta);
    }
    function openCodeDialog(orgId) {
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === orgId);
      if (!org || !org.code || !org.code.snippet) return;
      closeCodeDialog();
      const back = document.createElement('div');
      back.className = 'pb-dialog-backdrop';
      back.id = 'pb-code-dialog';
      back.innerHTML = `
        <div class="pb-dialog pb-code-dialog" role="dialog" aria-modal="true">
          <div class="pb-dialog-head">
            <h2 class="pb-dialog-title">${pbEscape(org.name)} — code</h2>
            <button class="pb-dialog-close" aria-label="Close" onclick="closeCodeDialog()">×</button>
          </div>
          <div class="pb-code-dialog-bar">
            <span class="handoff-code-lang">${pbEscape(org.code.lang || 'html')}</span>
            <button class="handoff-copy-code-btn" onclick="pbCopyCode(this)">${PB_CLIPBOARD_ICON} Copy again</button>
          </div>
          <pre class="pb-code-dialog-pre"><code>${pbEscape(org.code.snippet)}</code></pre>
          <p class="pb-code-dialog-note flash" id="pb-code-note">✓ Copied to clipboard</p>
        </div>`;
      back.addEventListener('click', e => { if (e.target === back) closeCodeDialog(); });
      document.body.appendChild(back);
      document.addEventListener('keydown', pbCodeDialogEsc);
      pbCopyText(org.code.snippet); // auto-copy on open
      setTimeout(() => { const n = document.getElementById('pb-code-note'); if (n) n.classList.remove('flash'); }, 700);
    }
    function closeCodeDialog() {
      const el = document.getElementById('pb-code-dialog');
      if (el) el.remove();

    function pbRenderTokenCell(t) {

    function pbRenderHandoffAnatomy(org) {
      const a = org.anatomy;

      // inline-styled or authored-parts — gets the SAME rich, per-element, all-tokens breakdown from

      const desc = (typeof a === 'string') ? a : (a && typeof a === 'object' && a.description) || '';

      }

      const preview = '';
      return `
        <div class="anatomy-stage" data-anatomy-for="${pbEscape(org.id)}">

    function pbAutoAnatomy(org) {
      const props = pbActiveProps(org);
      const html = (typeof window[org.renderFn] === 'function') ? window[org.renderFn](props) : '';
      if (!html) return '<p class="handoff-spec-note">No render body to auto-derive anatomy from.</p>';
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      // Build tokenMap: cssClass → [tokens] from <style> tags in the render body
      const tokenMap = {};
      tmp.querySelectorAll('style').forEach(function(s) {
        const text = s.textContent;
        const ruleRe = /\.([a-zA-Z0-9_-]+)[^{]*\{([^}]*)\}/g;
        let m;
        while ((m = ruleRe.exec(text)) !== null) {
          const cls = m[1], body = m[2];
          const tokens = [];
          const varRe = /var\(--([\w-]+)\)/g;
          let v;
          while ((v = varRe.exec(body)) !== null) {
            const t = '--' + v[1];
            if (tokens.indexOf(t) < 0) tokens.push(t);
          }
          if (tokens.length) {
            if (!tokenMap[cls]) tokenMap[cls] = [];
            tokens.forEach(function(t) { if (tokenMap[cls].indexOf(t) < 0) tokenMap[cls].push(t); });
          }
        }
      });
      // Walk DOM tree (max depth 4, skip style/script) — tag each element with data-anatomy-n
      const elements = [];
      const nestedIds = (PB_DATA.handoff.organisms || []).map(function(o) { return o.id; });
      function walk(el, depth) {
        if (depth > 4 || el.nodeType !== 1) return;
        if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') return;
        const classes = Array.from(el.classList);
        const tokens = [];
        classes.forEach(function(cls) {
          (tokenMap[cls] || []).forEach(function(t) { if (tokens.indexOf(t) < 0) tokens.push(t); });
        });
        const desc = classes.length > 0 ? classes[0] : el.tagName.toLowerCase();
        const isNested = classes.some(function(c) { return nestedIds.indexOf(c) >= 0; });
        const n = elements.length + 1;
        el.setAttribute('data-anatomy-n', n);
        elements.push({ depth: depth, desc: desc, tokens: tokens, isNested: isNested });
        Array.from(el.children).forEach(function(child) { walk(child, depth + 1); });
      }
      Array.from(tmp.children).forEach(function(child) {
        if (child.tagName !== 'STYLE') walk(child, 0);
      });
      if (!elements.length) return `<div class="anatomy-stage"><div class="anatomy-render">${html}</div></div><p class="handoff-spec-note">No elements found.</p>`;
      const prev = `<div class="anatomy-stage" data-anatomy-for="${pbEscape(org.id)}" data-anatomy-auto="1"><div class="anatomy-render">${tmp.innerHTML}</div></div>`;
      const rows = elements.map(function(el, i) {
        const tokenHtml = el.tokens.length
          ? el.tokens.map(function(t) { return `<code style="font-size:10px;background:var(--neutral-10);padding:1px 4px;border-radius:3px;font-family:'SF Mono',monospace">${pbEscape(t)}</code>`; }).join(' ')
          : '<span style="color:var(--text-tertiary)">—</span>';
        const name = el.isNested
          ? `${pbEscape(el.desc)} <em style="color:var(--brand);font-size:var(--font-size-xs)">↗ nested component</em>`
          : pbEscape(el.desc);
        return `<tr><td><span class="anatomy-badge">${i+1}</span></td><td>${name}</td><td>${tokenHtml}</td></tr>`;
      }).join('');
      return `${prev}
        <p class="handoff-spec-note" style="margin-top:10px;color:var(--text-tertiary)">Auto-derived — add <code>anatomy.parts[]</code> to override.</p>
        <table class="anatomy-table" style="margin-top:10px">
          <thead><tr><th>#</th><th>Element</th><th>Tokens</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function pbRenderHandoffSpec(org) {

    function pbAutoSpec(org) {

      const preview = html ? `<div class="spec-stage"><div class="spec-render">${html}</div></div>` : '';
      // Find the live preview element in the card to measure computed styles

      const root = previewEl && previewEl.firstElementChild;
      if (!root) return preview + '<p class="handoff-spec-note" style="margin-top:12px">Render the card to measure — click the component card first.</p>';

        ['Width', cs.width, ''],
        ['Height', cs.height, ''],
      ].filter(function(r) { return r[1] && r[1] !== '0px' && r[1] !== 'normal' && r[1] !== 'auto' && r[1] !== 'none' && r[1] !== ''; });
      const pt = parseInt(cs.paddingTop)||0, pr = parseInt(cs.paddingRight)||0,
            pb2 = parseInt(cs.paddingBottom)||0, pl = parseInt(cs.paddingLeft)||0,
            mt = parseInt(cs.marginTop)||0, mb = parseInt(cs.marginBottom)||0;
      const boxDiagram = `<div style="margin:16px 0 12px;padding:12px;background:var(--neutral-5);border:1px solid var(--border);border-radius:8px;display:inline-block;font-family:'SF Mono',Menlo,monospace;font-size:10px;line-height:1.5">
        <div style="font-size:var(--font-size-xxs);font-weight:var(--font-weight-bold);text-transform:uppercase;letter-spacing:0.05em;color:var(--text-tertiary);margin-bottom:8px">Box model</div>
        ${mt ? `<div style="background:rgba(255,165,0,0.18);border:1px dashed #b45309;border-radius:4px 4px 0 0;padding:3px 12px;text-align:center;color:#b45309;margin-bottom:-1px">↑ margin-top: ${cs.marginTop}</div>` : ''}
        <div style="display:inline-flex;align-items:stretch;background:rgba(0,128,0,0.10);border:1px solid #16a34a;border-radius:${mt?'0':'4px'} ${mt?'0':'4px'} ${mb?'0':'4px'} ${mb?'0':'4px'}">
          ${pl ? `<span style="padding:10px 6px;color:#166534;background:rgba(0,128,0,0.08);font-size:9px;writing-mode:vertical-lr;text-orientation:mixed;text-align:center">← ${cs.paddingLeft}</span>` : ''}
          <div style="display:flex;flex-direction:column;align-items:stretch">
            ${pt ? `<div style="background:rgba(0,128,0,0.08);padding:3px 16px;text-align:center;color:#166534;font-size:9px;border-bottom:1px dashed #16a34a">padding-top: ${cs.paddingTop}</div>` : ''}
            <div style="background:rgba(100,149,237,0.15);border:1px dashed #2196f3;border-radius:4px;padding:12px 20px;text-align:center;color:#1e3a8a;min-width:80px;margin:4px">content</div>
            ${pb2 ? `<div style="background:rgba(0,128,0,0.08);padding:3px 16px;text-align:center;color:#166534;font-size:9px;border-top:1px dashed #16a34a">padding-bottom: ${cs.paddingBottom}</div>` : ''}
          </div>
          ${pr ? `<span style="padding:10px 6px;color:#166534;background:rgba(0,128,0,0.08);font-size:9px;writing-mode:vertical-rl;text-orientation:mixed;text-align:center">${cs.paddingRight} →</span>` : ''}
        </div>
        ${mb ? `<div style="background:rgba(255,165,0,0.18);border:1px dashed #b45309;border-radius:0 0 4px 4px;padding:3px 12px;text-align:center;color:#b45309;margin-top:-1px">margin-bottom: ${cs.marginBottom} ↓</div>` : ''}
      </div>`;
      const tableRows = rows.map(function(r) {
        return `<tr><td style="color:var(--text-active-secondary);font-size:var(--font-size-xs);padding:7px 10px">${pbEscape(r[0])}</td><td style="padding:7px 10px"><code style="font-size:var(--font-size-xs)">${pbEscape(r[1])}</code></td><td style="padding:7px 10px;color:var(--brand);font-size:var(--font-size-xs);font-family:'SF Mono',monospace">${pbEscape(r[2])}</td></tr>`;
      }).join('');

        ${boxDiagram}
        ${tableRows ? `<table class="anatomy-table" style="margin-top:4px">
          <thead><tr><th>Property</th><th>Computed</th><th>Token</th></tr></thead>
          <tbody>${tableRows}</tbody>

    function pbRenderHandoffUiLogic(org) {

        ? `<div class="usage-demo"><span class="usage-demo-tag">Demo</span><div class="usage-demo-render">${window[org.renderFn](u.demoProps)}</div></div>`

    /* v0.3.17 — Anatomy: gutter badges + dashed leader lines, measured post-render. */
    function pbPlaceAnatomyBadges() {
      const stage = document.querySelector('.anatomy-stage');
      if (!stage) return;
      stage.querySelectorAll('.anatomy-badge--pin, .anatomy-leader').forEach(b => b.remove());
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === stage.getAttribute('data-anatomy-for'));
      if (!org || !org.anatomy) return;
      const stageRect = stage.getBoundingClientRect();
      const gutterX = 22;   /* badge centre-x, inside the stage's left gutter */
      (org.anatomy.parts || []).forEach(p => {
        const target = stage.querySelector(p.anchor);
        if (!target) return;
        const r = target.getBoundingClientRect();
        const cy = r.top - stageRect.top + r.height / 2;          /* element vertical centre */
        const elLeft = r.left - stageRect.left;
        /* dashed leader line from the gutter badge across to the element edge */
        const line = document.createElement('div');
        line.className = 'anatomy-leader';
        line.dataset.anatomyPin = p.n;
        line.style.top   = cy + 'px';
        line.style.left  = (gutterX + 10) + 'px';
        line.style.width = Math.max(0, elLeft - gutterX - 10) + 'px';
        stage.appendChild(line);
        /* numbered badge parked in the gutter, aligned to the element */
        const badge = document.createElement('span');
        badge.className = 'anatomy-badge anatomy-badge--pin';
        badge.textContent = p.n;
        badge.dataset.anatomyPin = p.n;
        badge.style.top  = (cy - 10) + 'px';
        badge.style.left = (gutterX - 10) + 'px';
        stage.appendChild(badge);
      });
    }
    function pbPlaceAutoAnatomyPins() {
      var stage = document.querySelector('.anatomy-stage[data-anatomy-auto]');
      if (!stage) return;
      stage.querySelectorAll('.anatomy-pin-auto, .anatomy-leader, .anatomy-leader-v, .anatomy-leader-dot, .anatomy-frame-outline').forEach(function(e) { e.remove(); });
      var prevTable = stage.parentNode && stage.parentNode.querySelector('.anatomy-auto-table');
      if (prevTable) prevTable.remove();
      var container = stage.querySelector('.anatomy-render');
      if (!container) return;
      var stageRect = stage.getBoundingClientRect();
      // Find root component element (first non-style child of render)
      var root = null;
      for (var i = 0; i < container.children.length; i++) {
        var c = container.children[i];
        if (c.tagName !== 'STYLE' && c.tagName !== 'SCRIPT') { root = c; break; }
      }
      if (!root) return;
      // Scale a too-wide preview down so the component always sits inside the box with its
      // ≥24px padding intact (never clipped against the right edge). Anchored top-left at the
      // left gutter; element anchors below are measured AFTER the scale, so callouts stay true.
      container.style.transform = ''; container.style.transformOrigin = 'left top';
      var availW = stage.clientWidth - 72 - 72;   // stage padding: 72 left · 72 right
      var natW = root.getBoundingClientRect().width;
      if (natW > availW && availW > 0) { container.style.transform = 'scale(' + (availW / natW).toFixed(4) + ')'; }
      // Build className→tokens map from <style> tag inside render
      var tokenMap = {};
      var styleEl = container.querySelector('style');
      if (styleEl) {
        var css = styleEl.textContent;
        var ruleRe = /([^{}]+)\{([^}]+)\}/g;
        var rm;
        while ((rm = ruleRe.exec(css)) !== null) {
          var selector = rm[1].trim();
          var body = rm[2];
          var ruleTokens = [];
          var varRe = /var\((--[^,)]+)/g;
          var vm;
          while ((vm = varRe.exec(body)) !== null) {
            var tn = vm[1].trim();
            if (ruleTokens.indexOf(tn) === -1) ruleTokens.push(tn);
          }
          if (ruleTokens.length) {
            var classes = selector.match(/\.[a-zA-Z0-9_-]+/g) || [];
            classes.forEach(function(cls) {
              var key = cls.slice(1);
              if (!tokenMap[key]) tokenMap[key] = [];
              ruleTokens.forEach(function(t) { if (tokenMap[key].indexOf(t) === -1) tokenMap[key].push(t); });
            });
          }
        }
      }
      // Parse numbered element names from adjacent prose paragraph
      var proseEl = stage.nextElementSibling;
      if (proseEl && !proseEl.classList.contains('handoff-spec-prose')) proseEl = null;
      var proseNames = [];
      if (proseEl) {
        var pRe = /(\d+)[.)]\s+([\s\S]+?)(?=\s*\d+[.)]|$)/g;
        var pm;
        while ((pm = pRe.exec(proseEl.textContent)) !== null) {
          proseNames[parseInt(pm[1]) - 1] = pm[2].trim().split(/\n/)[0].trim();
        }
      }
      // Known organisms for nested component detection
      var orgs = (PB_DATA.handoff && PB_DATA.handoff.organisms) || [];
      function findOrg(el) {
        for (var k = 0; k < orgs.length; k++) {
          if (el.classList.contains(orgs[k].id)) return orgs[k];
        }
        return null;
      }
      function autoDesc(el) {
        var cls = Array.from(el.classList)[0] || '';
        var label = cls.replace(/^[a-z0-9]+-/, '').replace(/-/g, ' ');
        return (label.charAt(0).toUpperCase() + label.slice(1)) || el.tagName.toLowerCase();
      }
      function getTokenChips(el) {
        var tokens = [];
        // 1 — class-based tokens (from a <style> block's rules)
        Array.from(el.classList).forEach(function(cls) {
          if (tokenMap[cls]) tokenMap[cls].forEach(function(t) { if (tokens.indexOf(t) === -1) tokens.push(t); });
        });
        // 2 — inline-style tokens: every var(--x) in the element's own style="" attribute
        var inline = el.getAttribute('style') || '';
        var ivar = /var\((--[^,)\s]+)/g, im;
        while ((im = ivar.exec(inline)) !== null) { if (tokens.indexOf(im[1]) === -1) tokens.push(im[1]); }
        return tokens;
      }
      // A rich, typed chip: kind-appropriate swatch + token name + its value (from the registry).
      function pbAnatomyChip(varName) {
        var key = varName.replace(/^--/, '');
        var t = pbTokensByName()[key] || null;
        var kind = t ? (t.displayKind || 'other') : 'other', val = t ? (t.value || '') : '';
        var sw;
        if (kind === 'color') sw = '<span class="atk-sw" style="background:' + pbEscape(val) + '"></span>';
        else if (kind === 'radius') sw = '<span class="atk-sw" style="border-radius:' + pbEscape(val) + '"></span>';
        else if (kind === 'type' || kind === 'fontSize' || kind === 'font') sw = '<span class="atk-sw">Aa</span>';
        else if (kind === 'space' || kind === 'size') sw = '<span class="atk-sw">↔</span>';
        else sw = '<span class="atk-sw"></span>';
        return '<code class="anatomy-token-chip" title="' + pbEscape(kind) + '">' + sw +
               pbEscape(varName) + (val ? '<span class="atk-val">' + pbEscape(val) + '</span>' : '') + '</code>';
      }
      function chipsHtml(names) {
        return names.length ? names.map(pbAnatomyChip).join('') : '<span class="anatomy-token-note">—</span>';
      }
      // Split an element's tokens into container aspects (bg/border/radius/size/space) vs the label/text
      // aspects (color/font/text/line-height), by the CSS property each var() is assigned to.
      function pbClassifyTokens(el) {
        var cont = [], lab = [];
        (el.getAttribute('style') || '').split(';').forEach(function(decl) {
          var i = decl.indexOf(':'); if (i < 0) return;
          var prop = decl.slice(0, i).trim().toLowerCase(), val = decl.slice(i + 1);
          var vars = [], m, re = /var\((--[^,)\s]+)/g;
          while ((m = re.exec(val)) !== null) vars.push(m[1]);
          if (!vars.length) return;
          var isText = prop === 'color' || prop.indexOf('font') === 0 || prop.indexOf('text') === 0 || prop === 'line-height' || prop === 'letter-spacing';
          var bucket = isText ? lab : cont;
          vars.forEach(function(v) { if (cont.indexOf(v) === -1 && lab.indexOf(v) === -1) bucket.push(v); });
        });
        Array.from(el.classList).forEach(function(cls) {
          if (tokenMap[cls]) tokenMap[cls].forEach(function(t) { if (cont.indexOf(t) === -1 && lab.indexOf(t) === -1) cont.push(t); });
        });
        return { container: cont, label: lab };
      }
      function pbHasDirectText(el) {
        for (var i = 0; i < el.childNodes.length; i++) {
          if (el.childNodes[i].nodeType === 3 && el.childNodes[i].textContent.trim()) return true;
        }
        return false;
      }
      // Build the numbered parts: the container (composed components) + each visual child element +
      // a "Label" part for any element carrying its own text (background vs label = two elements).
      var targets = Array.from(root.children).filter(function(el) {
        if (el.tagName === 'STYLE' || el.tagName === 'SCRIPT') return false;
        var r = el.getBoundingClientRect();
        return r.width > 0 || r.height > 0;
      });
      if (!targets.length) targets = [root];
      var isLeaf = (targets.length === 1 && targets[0] === root);
      var parts = [];
      if (!isLeaf) parts.push({ el: root, name: 'Container', tokens: pbClassifyTokens(root).container, isContainer: true });
      targets.forEach(function(el, idx) {
        var nested = findOrg(el);
        if (nested) { parts.push({ el: el, name: (nested.name || nested.id), link: nested.id }); return; }
        var cl = pbClassifyTokens(el);
        parts.push({ el: el, name: (proseNames[idx] || autoDesc(el)), tokens: (cl.container.length ? cl.container : cl.label), edge: 'top' });
        if (cl.container.length && cl.label.length && pbHasDirectText(el)) {
          parts.push({ el: el, name: 'Label', tokens: cl.label, isLabel: true, edge: 'mid' });
        }
      });
      parts.forEach(function(p, i) { p.n = i + 1; });

      // The precise text box of an element's own text (so a Label leader lands ON the text, not the edge).
      function pbTextRect(el) {
        for (var i = 0; i < el.childNodes.length; i++) {
          var nn = el.childNodes[i];
          if (nn.nodeType === 3 && nn.textContent.trim()) {
            var rg = document.createRange(); rg.selectNodeContents(nn);
            var rr = rg.getBoundingClientRect();
            if (rr.width || rr.height) return rr;
          }
        }
        return el.getBoundingClientRect();
      }
      // Each badge parks in a gutter OUTSIDE the component and draws ONE straight dashed leader
      // (no corners) to the part's anchor: horizontal for left/right, vertical for top/bottom.
      // Element parts anchor at their CENTER (so label/input/error fall on their own rows) and take
      // the first free direction in the fixed ladder — LEFT, RIGHT, TOP, BOTTOM. The Container is the
      // exception: it points at the FRAME's top border, never onto a child's text. The 72px gutter
      // keeps every badge >=24px off both the object edge and the box edge.
      function hLine(x, y, w) { var d = document.createElement('div'); d.className = 'anatomy-leader'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.width = Math.max(4, w) + 'px'; stage.appendChild(d); }
      function vLine(x, y, h) { var d = document.createElement('div'); d.className = 'anatomy-leader-v'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.height = Math.max(4, h) + 'px'; stage.appendChild(d); }
      function dotAt(x, y) { var d = document.createElement('div'); d.className = 'anatomy-leader-dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; stage.appendChild(d); }
      function badgeAt(n, x, y) { var b = document.createElement('span'); b.className = 'anatomy-badge anatomy-badge--pin anatomy-pin-auto'; b.textContent = n; b.style.left = (x - 10) + 'px'; b.style.top = (y - 10) + 'px'; stage.appendChild(b); }
      // Gutters hug the COMPONENT's bounding box (not the stage), so a left-aligned or narrow
      // component still gets short leaders on every side. 38px out = badge 28px off the object edge;
      // the 72px stage padding keeps that same gutter >=24px off the box edge.
      var rootRect = root.getBoundingClientRect();
      var cL = rootRect.left - stageRect.left, cR = rootRect.right - stageRect.left;
      var cT = rootRect.top - stageRect.top, cB = rootRect.bottom - stageRect.top;
      var leftX = cL - 38, rightX = cR + 38, topY = cT - 38, botY = cB + 38;
      var usedL = [], usedR = [], usedT = [], usedB = [];
      function free(arr, v) { return !arr.some(function (u) { return Math.abs(u - v) < 26; }); }
      parts.forEach(function (p) {
        var rect = p.isLabel ? pbTextRect(p.el) : p.el.getBoundingClientRect();
        var L = rect.left - stageRect.left, R = rect.right - stageRect.left;
        var T = rect.top - stageRect.top, B = rect.bottom - stageRect.top;
        var ay = T + rect.height / 2;   // CENTER of the label/element — parts land on their own rows
        var ax = L + rect.width / 2;
        // The whole-component Container points at the FRAME's top border (the empty band above the
        // first child), never onto a child's text — it owns the top gutter so element rows stay clean.
        if (p.isContainer) {
          // The frame has no border of its own, so draw one: a dashed bounding-box outline sitting
          // 8px outside the component (clear of the input's own border). Badge 1's leader then lands
          // on that real, drawn top edge — never on empty air or a child's text.
          var op = 8;
          var ol = document.createElement('div');
          ol.className = 'anatomy-frame-outline';
          ol.style.left = (cL - op) + 'px'; ol.style.top = (cT - op) + 'px';
          ol.style.width = (cR - cL + op * 2) + 'px'; ol.style.height = (cB - cT + op * 2) + 'px';
          stage.appendChild(ol);
          var fx = cL + rect.width / 2;   // centred on the frame's top edge, clear of the left label
          while (!free(usedT, fx)) fx += 26; usedT.push(fx);
          dotAt(fx, cT - op); vLine(fx, topY + 12, (cT - op) - topY - 12); badgeAt(p.n, fx, topY); return;
        }
        if (free(usedL, ay)) {                    // 1 · LEFT — horizontal to the left edge
          usedL.push(ay); dotAt(L, ay); hLine(leftX + 12, ay, L - leftX - 12); badgeAt(p.n, leftX, ay);
        } else if (free(usedR, ay)) {             // 2 · RIGHT — horizontal to the right edge
          usedR.push(ay); dotAt(R, ay); hLine(R, ay, rightX - 12 - R); badgeAt(p.n, rightX, ay);
        } else if (free(usedT, ax)) {             // 3 · TOP — vertical down to the top edge
          usedT.push(ax); dotAt(ax, T); vLine(ax, topY + 12, T - topY - 12); badgeAt(p.n, ax, topY);
        } else if (free(usedB, ax)) {             // 4 · BOTTOM — vertical up to the bottom edge
          usedB.push(ax); dotAt(ax, B); vLine(ax, B, botY - 12 - B); badgeAt(p.n, ax, botY);
        } else {                                  // last resort: stack in the left gutter, nudged down
          var y = ay; while (!free(usedL, y)) y += 26; usedL.push(y);
          dotAt(L, ay); hLine(leftX + 12, ay, L - leftX - 12); badgeAt(p.n, leftX, y);
        }
      });

      // Build the breakdown table from the SAME parts (row numbers match the badges).
      var rows = parts.map(function(p) {
        var nameTd = p.link
          ? '<a class="anatomy-component-link" href="#" onclick="event.preventDefault();openHandoffDrawer(\'' + pbEscape(p.link) + '\')">' + pbEscape(p.name) + ' ↗</a>'
          : (p.isLabel ? '<span class="anatomy-el-sub">↳ ' + pbEscape(p.name) + '</span>' : pbEscape(p.name));
        var tokensTd = p.link ? '<span class="anatomy-token-note">see component</span>' : chipsHtml(p.tokens || []);
        return '<tr' + (p.isLabel ? ' class="anatomy-sub-row"' : '') + '><td><span class="anatomy-badge">' + p.n + '</span></td>' +
               '<td class="anatomy-el-name">' + nameTd + '</td>' +
               '<td class="anatomy-el-tokens">' + tokensTd + '</td></tr>';
      }).join('');
      if (!rows) return;
      if (proseEl) proseEl.style.display = 'none';
      var wrapper = document.createElement('div');
      wrapper.className = 'anatomy-auto-table';
      wrapper.innerHTML = '<table class="anatomy-table"><thead><tr>' +
        '<th>#</th><th>Element</th><th>Tokens used</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
      stage.parentNode.insertBefore(wrapper, stage.nextSibling);
    }

    /* v0.3.17 — Specification redline: measure the live component and inject
       dimension lines (line + end-cap ticks), the value chip placed directly
       beside the line — no leader lines. Element heights run down the LEFT of
       the component (orange); inter-element gaps run down the RIGHT (blue);
       the declared margin sits in dotted bands flanking the component (pink). */
    function pbPlaceSpecAnnotations() {
      const stage = document.querySelector('.spec-stage');
      if (!stage) return;
      stage.querySelectorAll('.spec-anno').forEach(e => e.remove());
      stage.style.minHeight = '';
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === stage.getAttribute('data-spec-for'));
      if (!org || !org.spec || !org.spec.stack) return;
      const s = org.spec;
      const sr = stage.getBoundingClientRect();
      const els = s.stack.map(it => {
        const t = stage.querySelector(it.anchor);
        return t ? { name: it.name, r: t.getBoundingClientRect() } : null;
      }).filter(Boolean);
      if (!els.length) return;

      const mk = (cls, css, txt) => {
        const d = document.createElement('div');
        d.className = 'spec-anno ' + cls;
        d.style.cssText = css;
        if (txt != null) d.textContent = txt;
        stage.appendChild(d);
        return d;
      };
      /* a measurement line carrying an end-cap tick at each end. axis 'v' | 'h' */
      const dimLine = (kind, axis, x, y, len) => {
        const m = ' spec-mark--' + kind;
        if (axis === 'v') {
          mk('spec-dline' + m, `left:${x - 1}px;top:${y}px;width:2px;height:${len}px`);
          mk('spec-cap' + m,   `left:${x - 5}px;top:${y - 1}px;width:10px;height:2px`);
          mk('spec-cap' + m,   `left:${x - 5}px;top:${y + len - 1}px;width:10px;height:2px`);
        } else {
          mk('spec-dline' + m, `left:${x}px;top:${y - 1}px;width:${len}px;height:2px`);
          mk('spec-cap' + m,   `left:${x - 1}px;top:${y - 5}px;width:2px;height:10px`);
          mk('spec-cap' + m,   `left:${x + len - 1}px;top:${y - 5}px;width:2px;height:10px`);
        }
      };
      /* a spacing chip in plain pixels, centred on x via a transform (auto width) */
      const spaceChip = (cls, x, y, v) =>
        mk('spec-chip ' + cls, `left:${x}px;top:${y - chipH / 2}px;height:${chipH}px;transform:translateX(-50%)`, Math.round(v));

      let minL = Infinity, maxR = 0, maxW = 0;
      els.forEach(e => { minL = Math.min(minL, e.r.left); maxR = Math.max(maxR, e.r.right); maxW = Math.max(maxW, e.r.width); });
      const compL = minL - sr.left, compR = maxR - sr.left;
      const compTop = els[0].r.top - sr.top, compBot = els[els.length - 1].r.bottom - sr.top;
      const chipH = 18, chipW = 30;

      /* the component's OUTER box (its wrapping element). Anchoring the width + gap lines here — rather
         than to the content bounds — is what keeps witnesses short: on a card the content sits well
         inside the box, so a content-anchored gap line trailed halfway across the card. */
      const _wc = stage.querySelector(s.stack[0].anchor);
      const _wp = _wc && _wc.parentElement;
      const owr = (_wp && stage.contains(_wp)) ? _wp.getBoundingClientRect() : null;
      const owL = owr ? owr.left - sr.left : compL;
      const owR = owr ? owr.right - sr.left : compR;
      const owTop = owr ? owr.top - sr.top : compTop;

      /* element heights + inter-element gaps */
      const heights = [], gaps = [];
      els.forEach((e, i) => {
        const top = e.r.top - sr.top, bot = e.r.bottom - sr.top;
        heights.push({ value: Math.round(bot - top), top: top, bot: bot });
        if (i < els.length - 1) {
          const gTop = bot, gBot = els[i + 1].r.top - sr.top;
          if (gBot - gTop > 0.5) gaps.push({ value: Math.round(gBot - gTop), top: gTop, bot: gBot });
        }
      });
      /* subtle band marking each gap region across the component */
      gaps.forEach(g => mk('spec-band spec-band--gap',
        `left:${compL}px;top:${g.top}px;width:${compR - compL}px;height:${g.bot - g.top}px`));

      /* LEFT — one orange dimension line per element height, witness to the element's left edge */
      const xL = Math.max(compL - 26, chipW + 12);
      heights.forEach(h => {
        mk('spec-witness', `left:${xL}px;top:${h.top}px;width:${compL - xL}px`);
        mk('spec-witness', `left:${xL}px;top:${h.bot}px;width:${compL - xL}px`);
        dimLine('dimension', 'v', xL, h.top, h.bot - h.top);
        mk('spec-chip spec-chip--dimension',
          `left:${xL - 7 - chipW}px;top:${(h.top + h.bot) / 2 - chipH / 2}px;height:${chipH}px`, h.value);
      });

      /* RIGHT — one blue dimension line per gap, mirrored just outside the box's OUTER right edge */
      const xR = owR + 26;
      gaps.forEach(g => {
        mk('spec-witness', `left:${owR}px;top:${g.top}px;width:${xR - owR}px`);
        mk('spec-witness', `left:${owR}px;top:${g.bot}px;width:${xR - owR}px`);
        dimLine('gap', 'v', xR, g.top, g.bot - g.top);
        mk('spec-chip spec-chip--gap',
          `left:${xR + 8}px;top:${(g.top + g.bot) / 2 - chipH / 2}px;height:${chipH}px`, g.value);
      });

      /* overall width — spans the component's OUTER box, above everything */
      const wY = owTop - 15;
      dimLine('dimension', 'h', owL, wY, owR - owL);
      mk('spec-chip spec-chip--dimension',
        `left:${(owL + owR) / 2 - chipW / 2}px;top:${wY - chipH - 3}px;height:${chipH}px`, Math.round(owR - owL));

      /* declared horizontal margin — dotted-edge bands flanking the component;
         one labelled dimension line below the left band (margin is symmetric) */
      const m = s.marginX || 0;
      let bottomY = compBot;
      if (m > 0) {
        const bH = compBot - compTop;
        mk('spec-band spec-band--margin', `left:${compL - m}px;top:${compTop}px;width:${m}px;height:${bH}px`);
        mk('spec-band spec-band--margin', `left:${compR}px;top:${compTop}px;width:${m}px;height:${bH}px`);
        const mY = compBot + 17;
        dimLine('margin', 'h', compL - m, mY, m);
        spaceChip('spec-chip--margin', compL - m / 2, mY + 6 + chipH / 2, m);
        bottomY = mY + 6 + chipH;
      }

      /* container padding — green bands between the component's box edge and its contents,
         measured from the wrapping element's computed padding (top + left labelled). */
      const firstEl = stage.querySelector(s.stack[0].anchor);
      const container = firstEl ? firstEl.parentElement : null;
      if (container && stage.contains(container)) {
        const cs = getComputedStyle(container);
        const pad = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
        const cr = container.getBoundingClientRect();
        const cL = cr.left - sr.left, cR = cr.right - sr.left, cT = cr.top - sr.top, cB = cr.bottom - sr.top;
        /* shaded bands on every padded side show WHERE the padding sits */
        if (pad.t > 0) mk('spec-band spec-band--pad', `left:${cL}px;top:${cT}px;width:${cR - cL}px;height:${pad.t}px`);
        if (pad.b > 0) mk('spec-band spec-band--pad', `left:${cL}px;top:${cB - pad.b}px;width:${cR - cL}px;height:${pad.b}px`);
        if (pad.l > 0) mk('spec-band spec-band--pad', `left:${cL}px;top:${cT + pad.t}px;width:${pad.l}px;height:${cB - cT - pad.t - pad.b}px`);
        if (pad.r > 0) mk('spec-band spec-band--pad', `left:${cR - pad.r}px;top:${cT + pad.t}px;width:${pad.r}px;height:${cB - cT - pad.t - pad.b}px`);
        /* numeric labels — kept OFF the content. Uniform padding → one chip in the top band; otherwise
           top/bottom labels sit centred in their (full-width, empty) bands and left/right in the top
           corners, clear of left-aligned body text. */
        const padChip = (x, y, v) => spaceChip('spec-chip--pad', x, y, v);
        const uniform = pad.t > 0 && pad.t === pad.b && pad.t === pad.l && pad.t === pad.r;
        if (uniform) {
          padChip((cL + cR) / 2, cT + pad.t / 2, pad.t);
        } else {
          if (pad.t > 0) padChip((cL + cR) / 2, cT + pad.t / 2, pad.t);
          if (pad.b > 0) padChip((cL + cR) / 2, cB - pad.b / 2, pad.b);
          if (pad.l > 0) padChip(cL + pad.l / 2, cT + Math.min(pad.t / 2 || 11, 11), pad.l);
          if (pad.r > 0) padChip(cR - pad.r / 2, cT + Math.min(pad.t / 2 || 11, 11), pad.r);
        }
      }

      /* grow the stage so nothing in the bottom margin row is clipped */
      stage.style.minHeight = Math.ceil(bottomY + 16) + 'px';
    }

    /* Badge ↔ table-row hover sync (one delegated pair of listeners). */
    function pbAnatomyHoverToggle(e, on) {
      const hit = e.target.closest('[data-anatomy-row], [data-anatomy-pin]');
      if (!hit) return;
      const n = hit.getAttribute('data-anatomy-row') || hit.getAttribute('data-anatomy-pin');
      ['[data-anatomy-row="' + n + '"]', '[data-anatomy-pin="' + n + '"]'].forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.classList.toggle('is-highlit', on);
      });
    }

    /* Patch renderHandoff so bounds + anatomy badges + spec redline recompute every draw. */
    (function patchRenderHandoff(){
      const orig = window.renderHandoff;
      const after = function(){ recomputeHandoffBounds(); pbPlaceAnatomyBadges(); pbPlaceAutoAnatomyPins(); pbPlaceSpecAnnotations(); pbPlaceBoxModel(); };
      window.renderHandoff = function() {
        /* Preserve the left card-list scroll across re-renders so opening a
           component / switching a dropdown doesn't jump it back to the top.
           The drawer body is a fresh element each render, so it naturally
           loads at its starting point — which is the intended behavior. */
        const prevList = (document.querySelector('.uidesign-list') || {}).scrollTop || 0;
        const prevDetail = (document.querySelector('.uidesign-detail') || {}).scrollTop || 0;
        orig.apply(this, arguments);
        const list = document.querySelector('.uidesign-list'); if (list) list.scrollTop = prevList;
        const detail = document.querySelector('.uidesign-detail'); if (detail) detail.scrollTop = prevDetail;
        requestAnimationFrame(function(){ requestAnimationFrame(after); });
      };
      window.addEventListener('resize', function(){
        if (state && state.metaView === 'handoff') requestAnimationFrame(function(){ requestAnimationFrame(after); });
      });
      document.addEventListener('mouseover', function(e){ pbAnatomyHoverToggle(e, true); });
      document.addEventListener('mouseout',  function(e){ pbAnatomyHoverToggle(e, false); });
    })();

    function pbRenderHandoffScreen() {
      const screens = PB_DATA.handoff.screens || [];
      if (!screens.length) {
        return renderEmptyState({
          icon: EMPTY_STATE_ICONS.handoff,
          title: 'No screen handoffs yet',
          body: 'Generate the 7:3 annotated layout for each screen in the prototype. Left panel = render + click-able regions, right panel = design tokens + sizing (no code).',
          ctaLabel: 'Generate screen handoff',
          command: '/pb:build',
          label: 'Handoff command copied',
        });
      }
      const selectedId = PB_DATA.handoff.selectedScreenId || screens[0].id;
      const selectedScreen = screens.find(s => s.id === selectedId) || screens[0];
      const elements = selectedScreen.elements || [];

      return `
        <div class="handoff-screen-pick">
          <label class="handoff-screen-label">Screen:</label>
          <select class="handoff-screen-select" onchange="setHandoffScreen(this.value)">
            ${screens.map(s => `<option value="${pbEscape(s.id)}" ${s.id === selectedScreen.id ? 'selected' : ''}>${pbEscape(s.name)}</option>`).join('')}
          </select>
        </div>

        <div class="handoff-screen-frame">
          ${typeof window[selectedScreen.renderFn] === 'function'
            ? window[selectedScreen.renderFn]()
            : `<div style="padding:32px;background:#fff8e1;border:1px dashed #c1c9d2;border-radius:12px">
                 <em>Screen renderer <code>${pbEscape(selectedScreen.renderFn || '')}</code> not defined.</em>
               </div>`}
          <div class="handoff-element-overlay">
            ${elements.map(el => `
              <button class="handoff-element-hit ${el.id === state.screenDrawerOpenFor ? 'active' : ''}"
                      onclick="openScreenDrawer('${pbEscape(el.id)}')"
                      style="${pbEscape(el.bounds || '')}"
                      title="${pbEscape(el.label || el.id)}"></button>
            `).join('')}
          </div>
        </div>
        ${selectedScreen.logicNotes && selectedScreen.logicNotes.length ? `
          <div class="handoff-logic-notes" style="margin-top:12px">
            <div class="handoff-spec-section-title" style="margin-bottom:8px">Logic notes</div>
            <ul>${selectedScreen.logicNotes.map(n => `<li>${pbEscape(n)}</li>`).join('')}</ul>
          </div>
        ` : ''}
      `;
    }

    /* Screen-tab default aside (no element selected): the screen's spec overview + the list of
       components used inside it (click to open in the Component tab). */
    function pbRenderScreenOverviewAside() {
      const screens = PB_DATA.handoff.screens || [];
      const sel = screens.find(s => s.id === (PB_DATA.handoff.selectedScreenId || (screens[0] && screens[0].id))) || screens[0];
      if (!sel) return pbHandoffAsideHint('No screens yet.');
      const orgs = PB_DATA.handoff.organisms || [];
      const dot = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>';
      const used = (sel.elements || []).filter(el => el.orgId);
      const list = used.length
        ? used.map(el => {
            const o = orgs.find(x => x.id === el.orgId);
            return `<li class="pb-tree-node" style="cursor:pointer" ${o ? `onclick="openComponentTab('${pbEscape(el.orgId)}')"` : ''}>
              <span class="pb-tree-node-label">${pbEscape(el.label || el.id)}</span>
              <span class="pb-tree-node-org ${o ? '' : 'is-missing'}">${pbEscape(o ? o.name : el.orgId)}</span>
            </li>`;
          }).join('')
        : '<li class="pb-tree-node"><span class="pb-tree-node-label" style="color:var(--text-tertiary)">No mapped components.</span></li>';
      const sizing = sel.layout ? Object.entries(sel.layout).map(([k, v]) =>
        `<div class="handoff-spec-row"><span class="handoff-spec-key">${pbEscape(k)}</span><span class="handoff-spec-val">${pbEscape(String(v))}</span></div>`).join('') : '';
      return `
        <div class="pb-tree-screen-name" style="margin-bottom:6px">${dot}<span>${pbEscape(sel.name)}</span></div>
        <p class="pb-aside-sub" style="font-size: var(--font-size-xs);color:var(--text-tertiary);margin:0 0 14px">Components used in this screen — click one to open it in the Component tab.</p>
        <p class="pb-dialog-h">Components</p>
        <ul class="pb-tree-list" style="margin-bottom:18px">${list}</ul>
        ${sizing ? `<p class="pb-dialog-h">Layout</p><div class="handoff-spec-section">${sizing}</div>` : ''}
        ${(sel.logicNotes && sel.logicNotes.length) ? `<p class="pb-dialog-h" style="margin-top:16px">Logic notes</p><ul style="margin:8px 0 0;padding-left:18px;font-size: var(--font-size-xs); line-height: var(--line-height-p-xs);color:var(--text-active-secondary)">${sel.logicNotes.map(n => `<li>${pbEscape(n)}</li>`).join('')}</ul>` : ''}
        <p class="pb-aside-empty" style="text-align:left;margin-top:16px;padding:12px 0 0;border-top:1px solid var(--border)">Click an element on the screen to inspect its tokens, sizing, UI logic, and live demo.</p>`;
    }

    function pbRenderScreenDrawer() {
      const id = state.screenDrawerOpenFor;
      const screens = PB_DATA.handoff.screens || [];
      const selScreenId = PB_DATA.handoff.selectedScreenId || (screens[0] && screens[0].id);
      const screen = screens.find(s => s.id === selScreenId) || screens[0];
      const elements = (screen && screen.elements) || [];
      const el = elements.find(e => e.id === id);
      if (!el) return '';
      const org = el.orgId ? (PB_DATA.handoff.organisms || []).find(o => o.id === el.orgId) : null;
      const tab = state.screenDrawerSegment || 'spec';
      return `
        <div class="handoff-drawer-header">
          <div class="handoff-drawer-title">${pbEscape(el.label || el.id)}</div>
          <button class="handoff-drawer-close" onclick="closeScreenDrawer()" aria-label="Close">×</button>
        </div>
        <div class="handoff-drawer-tabs">
          ${[['spec','Specification'],['uiLogic','UI Logic'],['demo','Demo']].map(([tid,tlabel]) => `
            <button class="handoff-drawer-tab ${tab === tid ? 'active' : ''}"
                    onclick="setScreenDrawerSegment('${tid}')">${tlabel}</button>
          `).join('')}
        </div>
        <div class="handoff-drawer-body">
          ${tab === 'spec'    ? pbRenderScreenSpec(el) : ''}
          ${tab === 'uiLogic' ? pbRenderScreenUiLogic(el, org) : ''}
          ${tab === 'demo'    ? pbRenderScreenDemo(el, org) : ''}
        </div>`;
    }

    function pbRenderScreenSpec(el) {
      return `
        ${el.dsOverride ? `<div class="handoff-spec-warning">⚠ DS override logged</div>` : ''}
        <div class="handoff-spec-section">
          <div class="handoff-spec-section-title">Tokens</div>
          ${(el.tokens && el.tokens.length)
            ? el.tokens.map(t => `
                <div class="handoff-spec-row">
                  <span class="handoff-spec-key">${pbEscape(t.name)}</span>
                  <span class="handoff-spec-val">${pbEscape(t.value)}</span>
                </div>
              `).join('')
            : '<div class="handoff-spec-empty">No tokens recorded.</div>'}
        </div>
        <div class="handoff-spec-section">
          <div class="handoff-spec-section-title">Sizing</div>
          ${el.sizing
            ? Object.entries(el.sizing).map(([k, v]) => `
                <div class="handoff-spec-row">
                  <span class="handoff-spec-key">${pbEscape(k)}</span>
                  <span class="handoff-spec-val">${pbEscape(v)}</span>
                </div>
              `).join('')
            : '<div class="handoff-spec-empty">No sizing recorded.</div>'}
        </div>
        ${el.state ? `
          <div class="handoff-spec-section">
            <div class="handoff-spec-section-title">State</div>
            <div class="handoff-spec-row"><span class="handoff-spec-val">${pbEscape(el.state)}</span></div>
          </div>
        ` : ''}
        <div class="handoff-spec-footer">Screen context — tokens + sizing from the spec snapshot. For the full annotated redline, open the Component tab.</div>`;
    }

    function pbRenderScreenUiLogic(el, org) {
      const notes = el.uiLogic || (org && org.uiLogic) || null;
      if (!notes || (Array.isArray(notes) && !notes.length)) {
        return '<div class="handoff-spec-empty" style="padding:20px 0">No UI logic notes for this element yet.</div>';
      }
      if (typeof notes === 'string') {
        return `<div class="uilogic-section"><p style="font-size: var(--font-size-s); line-height: var(--line-height-p-s);margin:0">${pbEscape(notes)}</p></div>`;
      }
      return `<div class="uilogic-section"><ul style="margin:0;padding-left:20px;font-size: var(--font-size-s); line-height: var(--line-height-p-s)">${
        notes.map(n => `<li>${pbEscape(typeof n === 'string' ? n : (n.rule || JSON.stringify(n)))}</li>`).join('')
      }</ul></div>`;
    }

    function pbRenderScreenDemo(el, org) {
      if (!org) {
        return `<div class="handoff-spec-empty" style="padding:20px 0">No component linked — add <code>orgId</code> to this screen element to enable the live demo.</div>`;
      }
      const activeProps = pbActiveProps(org);
      const propControls = (org.properties || []).map(p => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <label style="font-size: var(--font-size-xs);font-weight: var(--font-weight-bold);color:var(--text-active-secondary);min-width:72px;flex-shrink:0">${pbEscape(p.label || p.id)}</label>
          <select style="font-size: var(--font-size-xs);padding:4px 8px;border:1px solid var(--border);border-radius:6px;flex:1;background:white"
                  onchange="setHandoffProp('${pbEscape(org.id)}', '${pbEscape(p.id)}', this.value)">
            ${(p.options || []).map(opt => {
              const v = typeof opt === 'string' ? opt : (opt.value || opt.label || opt);
              const l = typeof opt === 'string' ? opt : (opt.label || opt.value || opt);
              return `<option value="${pbEscape(v)}" ${activeProps[p.id] === v ? 'selected' : ''}>${pbEscape(l)}</option>`;
            }).join('')}
          </select>
        </div>
      `).join('');
      const preview = typeof window[org.renderFn] === 'function'
        ? window[org.renderFn](activeProps)
        : `<em style="font-size: var(--font-size-xs);color:var(--text-tertiary)">${pbEscape(org.renderFn || 'renderFn not defined')}</em>`;
      return `
        ${propControls ? `<div class="handoff-spec-section"><div class="handoff-spec-section-title">Variant Controls</div>${propControls}</div>` : ''}
        <div class="screen-demo-stage">${preview}</div>
        <button class="screen-comp-link-btn" onclick="openComponentTab('${pbEscape(org.id)}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l10-10M17 17V7H7"/></svg>
          Open in Component tab
        </button>`;
    }

    /* =========================================================================
       TAB 5 — ERD (Entity Relationship Diagram)
       Mermaid `erDiagram` rendered inside the same zoomable canvas.
       Edit the Mermaid source below to model your domain.
       ========================================================================= */
    function renderMetaERD() {
      const populated = !!(PB_DATA.erd && PB_DATA.erd.populated);
      const header = pbPageHeader({ title: 'Data', infoKey: 'erd' });

      if (!populated) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.erd,
                title: 'No data model yet',
                body: 'Build the entity-relationship diagram from your spec. Claude generates a Mermaid `erDiagram` with PK/FK/cardinality guardrails — for a future production implementation.',
                ctaLabel: 'Generate ERD', command: '/pb:plan --data',
              })}
            </div>
          </div>`;
        return;
      }

      const e = (PB_DATA && PB_DATA.erd) || {};
      const rows = e.table || [];
      const byEntity = {};
      rows.forEach(r => { (byEntity[r.entity] = byEntity[r.entity] || []).push(r); });
      if (!state.erdView) state.erdView = 'diagram';

      // v1.5 — Data is single-column now (4.2): the table view carries the variants (4.4),
      // the diagram view carries the relationship legend (4.5). No right aside.
      $('#app').innerHTML = `
        <div class="pb-page">
          ${header}
          <div class="pb-content">
            <div class="pb-main">${pbErdMain(e, byEntity)}</div>
          </div>
        </div>`;

      if (state.erdView !== 'table' && e.mermaid && window.mermaid) {
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
        mermaid.run({ querySelector: '#erd-diagram' }).then(function () {
          var stage = document.getElementById('erd-stage');
          if (!stage) return;
          var svg = stage.querySelector('svg');
          if (!svg) return;
          svg.style.maxWidth = 'none';
          svg.removeAttribute('width'); svg.removeAttribute('height');
          // erDiagram SVGs carry only a viewBox (no pixel width), so a bare bounding-box read
          // collapses the height. Pin a concrete target width first, measure the aspect-correct
          // height, size the stage to that, then release the SVG to fill the stage. initCanvas
          // re-fits the result into the viewport.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var vp = document.getElementById('erd-viewport');
              var targetW = Math.min(Math.max(((vp && vp.clientWidth) || 900) - 48, 320), 1100);
              svg.style.width = targetW + 'px';
              svg.style.height = 'auto';
              var bbox = svg.getBoundingClientRect();
              var W = Math.ceil(bbox.width)  || targetW;
              var H = Math.ceil(bbox.height) || 600;
              svg.style.width = ''; svg.style.height = '';
              stage.style.width = W + 'px';
              stage.style.height = H + 'px';
              stage.style.marginLeft = -(W/2) + 'px';
              stage.style.marginTop  = -(H/2) + 'px';
              initCanvas('erd', W, H);
            });
          });
        }).catch(function(){ /* silent */ });
      }
    }

    /* Data-tab (v1.5, single column): Diagram | Table toggle + relationship-legend button
       (diagram) / data-set variant chips (table). */
    /* A notes cell, clamped. On a real ERD 50 of 200 notes run past 120 characters and the
       longest is 1,444 — which is what turns this tab into 15,911px of scroll and makes one
       entity fill a screen. Clamped to a few lines with an inline expand; the full text stays
       in the DOM (and in `title`) so search and copy still see all of it. */
    function pbErdNote(text) {
      if (!text) return '';
      const esc = pbEscape(text);
      if (text.length <= 140) return esc;
      return `<span class="erd-note is-clamped" title="${esc}"
                onclick="this.classList.toggle('is-clamped')">${esc}</span>`;
    }

    /* The origin legend, rendered only for the values actually present. A chip for a value no
       row carries is a dead control. */
    function pbErdOriginLegend(byEntity) {
      const LABEL = { keep: 'Kept from the current system', rename: 'Renamed', adopt: 'Newly adopted' };
      const seen = new Set();
      Object.keys(byEntity).forEach(ent => byEntity[ent].forEach(r => {
        const o = (r.origin || '').toLowerCase();
        if (LABEL[o]) seen.add(o);
      }));
      if (!seen.size) return '';
      return `<div class="erd-origin-legend">` + ['keep', 'rename', 'adopt'].filter(o => seen.has(o)).map(o =>
        `<span class="erd-origin-key"><i class="erd-origin-swatch erd-origin-swatch--${o}"></i>${LABEL[o]}</span>`
      ).join('') + `</div>`;
    }

    /* Filter the table view. Repaints ONLY the rows — never the input, which lives in the
       toolbar outside this subtree. Empty query restores everything. */
    function pbErdFilter(q) {
      state.erdQuery = q || '';
      const needle = state.erdQuery.trim().toLowerCase();
      const host = document.getElementById('erd-tables');
      if (!host) return;
      host.querySelectorAll('.erd-entity').forEach(function (block) {
        let shown = 0;
        block.querySelectorAll('tbody tr').forEach(function (tr) {
          const hit = !needle || tr.textContent.toLowerCase().indexOf(needle) !== -1;
          tr.hidden = !hit;
          if (hit) shown++;
        });
        // An entity with no surviving row is hidden whole — a bare heading over an empty table
        // reads as a rendering bug.
        block.hidden = needle && shown === 0;
      });
    }

    function pbErdMain(e, byEntity) {
      const subtabs = [['diagram', 'Diagram'], ['table', 'Table']].map(([id, label]) =>
        `<button class="meta-subtab ${state.erdView === id ? 'active' : ''}" onclick="setErdView('${id}')">${label}</button>`).join('');
      // The search input lives in the toolbar's right slot — empty in Table view, so it costs no
      // new layout — and is rendered ONCE. Filtering repaints `#erd-tables` only, never the input.
      //
      // This is not a micro-optimisation. Every view setter here does `$('#app').innerHTML = …`,
      // so an input rendered inside the repainted region loses focus on every keystroke. With a
      // Vietnamese keyboard that breaks IME composition mid-word, not merely the caret, and
      // focus restoration cannot fix it — by the time focus returns the composition is gone.
      // Keeping the input outside the repainted subtree is the only correct answer.
      const search = state.erdView === 'table'
        ? `<input id="erd-search" class="erd-search" type="search" autocomplete="off"
                  placeholder="Filter fields, types, notes…" value="${pbEscape(state.erdQuery || '')}"
                  oninput="pbErdFilter(this.value)">`
        : erdLegendButton();
      const toolbar = `<div class="erd-toolbar">
          <div class="meta-subtabs">${subtabs}</div>
          ${search}
        </div>`;

      if (state.erdView === 'table') {
        const ents = Object.keys(byEntity);
        if (!ents.length) return toolbar + `<p class="meta-p" style="color:var(--text-tertiary);font-style:italic">No table data.</p>`;
        // 4.4 — **per-entity** data-set variants: each table that has multiple data treatments
        // (erd.mock sets for that entity) gets its own switcher — "Schema" (the field/type/example
        // definition) + one chip per label. Selecting one swaps just that table's Example column.
        if (!state.erdVariant || typeof state.erdVariant !== 'object') state.erdVariant = {};
        // 4.3 — fixed column widths (.erd-fixed) so every entity table lines up.
        const tables = `<div class="erd-tables" id="erd-tables">` + ents.map(ent => {
          const sets = ((e && e.mock) || []).filter(m => m.entity === ent);
          const variants = [{ key: 'schema', label: 'Schema' }].concat(sets.map(m => ({ key: m.label, label: m.label })));
          let v = state.erdVariant[ent] || 'schema';
          if (!variants.some(x => x.key === v)) v = 'schema';
          const switcher = sets.length ? `<div class="erd-entity-variants">`
            + variants.map(opt => `<button class="pb-mock-chip ${v === opt.key ? 'is-active' : ''}" onclick="setErdVariant('${pbEscape(ent)}','${pbEscape(opt.key)}')">${pbEscape(opt.label)}</button>`).join('')
            + `</div>` : '';
          const exHead = v === 'schema' ? 'Example' : v;
          // `pbSortTable(th)` has shipped in this shell for versions and was wired to nothing.
          // It is numeric-aware and needs no new JS — the <th>s just had to call it.
          const th = (label) =>
            `<th onclick="pbSortTable(this)" title="Sort by ${pbEscape(label)}">${pbEscape(label)}</th>`;
          return `<div class="erd-entity" data-entity="${pbEscape(ent)}">
              <div class="erd-entity-head"><h3 class="erd-entity-title">${pbEscape(ent)}</h3>${switcher}</div>
              <table class="erd-entity-table erd-fixed">
                <thead><tr>${th('Field')}${th('Type')}${th(exHead)}${th('Notes')}</tr></thead>
                <tbody>${byEntity[ent].map(r => {
                  const ex = v === 'schema' ? (r.example || '') : pbErdExampleFor(e, ent, r.field, v);
                  // `origin` is authored on nearly every row of a real ERD and the shell ignored
                  // it — which is why one real project forked this file to get it back. It rides
                  // as a row tint + a legend rather than a fifth column: four columns already use
                  // the width, and origin is a property OF the row, not another fact about it.
                  const org = (r.origin || '').toLowerCase();
                  const cls = ['keep', 'rename', 'adopt'].indexOf(org) >= 0 ? ` class="erd-row--${org}"` : '';
                  const notes = String(r.notes || '');
                  return `<tr${cls} data-origin="${pbEscape(org)}">`
                    + `<td>${pbEscape(r.field||'')}</td>`
                    + `<td><code class="erd-type-chip">${pbEscape(r.type||'')}</code></td>`
                    + `<td>${pbEscape(ex || '—')}</td>`
                    + `<td>${pbErdNote(notes)}</td></tr>`;
                }).join('')}</tbody>
              </table>
            </div>`;
        }).join('') + `</div>`;
        return toolbar + pbErdOriginLegend(byEntity) + tables;
      }

      const diagramView = `
        <div class="flow-canvas" id="erd-canvas">
          <div class="flow-viewport" id="erd-viewport">
            <div class="flow-stage flow-stage-erd" id="erd-stage">
              <div class="mermaid" id="erd-diagram">${e.mermaid || ''}</div>
            </div>
          </div>
          <div class="flow-zoom-controls">
            <button class="flow-zoom-btn" id="erd-zoom-in"  title="Zoom in">+</button>
            <button class="flow-zoom-btn" id="erd-zoom-out" title="Zoom out">−</button>
            <button class="flow-zoom-btn" id="erd-zoom-fit" title="Fit / reset">⊙</button>
          </div>
          <div class="flow-zoom-readout" id="erd-zoom-readout">100%</div>
          <div class="flow-hint">Scroll to zoom · drag to pan</div>
        </div>`;
      return toolbar + diagramView;
    }

    /* The ordered data-set list for the Table view — "Schema" first, then each distinct
       erd.mock label in first-seen order. */
    function pbErdVariants(e) {
      const labels = [];
      ((e && e.mock) || []).forEach(m => { if (m.label && labels.indexOf(m.label) < 0) labels.push(m.label); });
      return [{ key: 'schema', label: 'Schema' }].concat(labels.map(l => ({ key: l, label: l })));
    }
    /* The example value for a field under a given data-set variant (rows[0] is representative;
       an absent/empty set → '' so the column reads as the no-data state). */
    function pbErdExampleFor(e, entity, field, variantKey) {
      const set = ((e && e.mock) || []).find(m => m.entity === entity && m.label === variantKey);
      if (!set || !(set.rows || []).length) return '';
      const row = set.rows[0];
      return (row && row[field] != null) ? String(row[field]) : '';
    }

    /* 4.5 — relationship legend in the diagram canvas (mirrors the UX-flow legend button). */
    function erdLegendButton() {
      return `<button class="flow-doc-legend-btn" type="button" aria-label="Show relationship legend" onclick="openErdLegendPopover(this)">
          <span class="erd-legend-mini">${erdRelSvg('one-many')}</span>
          <span class="flow-doc-legend-label">Legend</span>
          <span class="flow-doc-legend-q" aria-hidden="true">?</span>
        </button>`;
    }
    function openErdLegendPopover(anchorBtn) {
      document.querySelectorAll('.copy-popover, .copy-popover-backdrop').forEach(el => el.remove());
      window.removeEventListener('keydown', copyPopoverKeyHandler);
      window.removeEventListener('resize', repositionCopyPopover);
      const backdrop = document.createElement('div');
      backdrop.className = 'copy-popover-backdrop';
      backdrop.addEventListener('click', closeCopyPopover);
      const pop = document.createElement('div');
      pop.className = 'copy-popover';
      pop.setAttribute('role', 'dialog');
      pop.setAttribute('aria-label', 'Relationship legend');
      pop.style.width = '300px';
      const rel = (kind, lbl, desc) => `
        <div class="legend-popover-row">
          <span class="erd-legend-svgwrap">${erdRelSvg(kind)}</span>
          <div class="legend-popover-text">
            <div class="legend-popover-name">${lbl}</div>
            <div class="legend-popover-desc">${desc}</div>
          </div>
        </div>`;
      pop.innerHTML = `
        <button class="copy-popover-close" type="button" aria-label="Close" onclick="closeCopyPopover()">${COPY_POPOVER_ICONS.close}</button>
        <div class="copy-popover-cmd-label" style="margin-bottom:8px"><span>Relationship legend</span></div>
        <div class="legend-popover-body">
          ${rel('one-one', '1 : 1', 'One-to-one')}
          ${rel('one-many', '1 : N', 'One-to-many')}
          ${rel('many-many', 'N : N', 'Many-to-many')}
        </div>
        <div class="legend-popover-footer">Crow's-foot notation: bars = exactly one · split foot = many · circle = optional (zero).</div>`;
      document.body.appendChild(backdrop);
      document.body.appendChild(pop);
      positionCopyPopover(pop, anchorBtn);
      setTimeout(() => { pop.classList.add('is-visible'); positionCopyPopover(pop, anchorBtn); }, 10);
      window.addEventListener('keydown', copyPopoverKeyHandler);
      window.addEventListener('resize', repositionCopyPopover);
    }

    /* ERD legend cardinality symbols (Crow's-foot notation) */
    function erdRelSvg(kind) {
      var line = '<line x1="14" y1="7" x2="46" y2="7" stroke="#374151" stroke-width="1.5"/>';
      function bars(x, dx) {
        return '<line x1="'+x+'" y1="2" x2="'+x+'" y2="12" stroke="#374151" stroke-width="1.5"/>'
             + '<line x1="'+(x+dx)+'" y1="2" x2="'+(x+dx)+'" y2="12" stroke="#374151" stroke-width="1.5"/>';
      }
      function foot(x, dir) {
        var dx = 6 * dir;
        return '<line x1="'+x+'" y1="7" x2="'+(x+dx)+'" y2="2"  stroke="#374151" stroke-width="1.5"/>'
             + '<line x1="'+x+'" y1="7" x2="'+(x+dx)+'" y2="12" stroke="#374151" stroke-width="1.5"/>'
             + '<line x1="'+x+'" y1="7" x2="'+(x+dx)+'" y2="7"  stroke="#374151" stroke-width="1.5"/>';
      }
      function circle(x) {
        return '<circle cx="'+x+'" cy="7" r="2.5" fill="white" stroke="#374151" stroke-width="1.5"/>';
      }
      var lEnd = '', rEnd = '';
      if (kind === 'one-one')      { lEnd = bars(8, 4);                       rEnd = bars(48, 4); }
      else if (kind === 'one-many'){ lEnd = bars(8, 4);                       rEnd = circle(50) + foot(46, +1); }
      else                          { lEnd = foot(14, -1) + circle(10);        rEnd = circle(50) + foot(46, +1); }
      return '<svg viewBox="0 0 60 14" xmlns="http://www.w3.org/2000/svg">'
        + line + lEnd + rEnd + '</svg>';
    }

    /* =========================================================================
       SHARED CANVAS — generalised pan/zoom for the User Flow + ERD tabs
       ========================================================================= */
    /* `minFit` (optional): a readable floor for the INITIAL fit. A wide, shallow org chart fits a
       620px box at ~0.3, where the labels are 4px of noise — showing everything is worthless if
       none of it can be read. Below the floor the canvas opens at the floor and stays pannable;
       zooming out to the true fit is still allowed, because minS is taken from the raw value. */
    function initCanvas(prefix, contentW, contentH, minFit) {
      var viewport = document.getElementById(prefix + '-viewport');
      var stage    = document.getElementById(prefix + '-stage');
      var readout  = document.getElementById(prefix + '-zoom-readout');
      if (!viewport || !stage) return;

      var minS = 0.4, maxS = 3;
      var scale = 1, tx = 0, ty = 0;
      var dragging = false, lastX = 0, lastY = 0;

      function apply() {
        stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
        if (readout) readout.textContent = Math.round(scale * 100) + '%';
      }
      function fitToViewport() {
        var vw = viewport.clientWidth, vh = viewport.clientHeight;
        var pad = 32;
        var raw = Math.min((vw - pad * 2) / contentW, (vh - pad * 2) / contentH);
        if (raw < minS) minS = Math.max(0.1, raw * 0.9);
        var s = (minFit && raw < minFit) ? minFit : raw;
        scale = Math.max(minS, Math.min(maxS, s));
        // Centred is right when everything fits. When a `minFit` floor leaves the content wider
        // than the box, centring hides BOTH ends — including the left gutter, where a chart puts
        // the thing you read first. Anchor the overflowing axis to its start instead.
        tx = 0; ty = 0;
        if (contentW * scale > vw - pad * 2) tx = pad - vw / 2 + contentW * scale / 2;
        if (contentH * scale > vh - pad * 2) ty = pad - vh / 2 + contentH * scale / 2;
        stage.style.transition = 'transform 0.25s ease-out';
        apply();
      }
      function zoomBy(delta, cx, cy) {
        var prev = scale;
        var next = Math.max(minS, Math.min(maxS, scale * (1 + delta)));
        if (next === prev) return;
        if (cx !== undefined && cy !== undefined) {
          var rect = viewport.getBoundingClientRect();
          var px = cx - rect.left - rect.width / 2;
          var py = cy - rect.top  - rect.height / 2;
          tx = px - (px - tx) * (next / prev);
          ty = py - (py - ty) * (next / prev);
        }
        scale = next;
        stage.style.transition = 'none';
        apply();
      }

      viewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        zoomBy(-e.deltaY * 0.0015, e.clientX, e.clientY);
      }, { passive: false });
      viewport.addEventListener('mousedown', function (e) {
        dragging = true;
        lastX = e.clientX; lastY = e.clientY;
        viewport.style.cursor = 'grabbing';
        stage.style.transition = 'none';
        e.preventDefault();
      });
      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        tx += e.clientX - lastX;
        ty += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        apply();
      });
      window.addEventListener('mouseup', function () {
        if (!dragging) return;
        dragging = false;
        viewport.style.cursor = '';
      });

      document.getElementById(prefix + '-zoom-in').onclick  = function () { zoomBy(0.18); };
      document.getElementById(prefix + '-zoom-out').onclick = function () { zoomBy(-0.18); };
      document.getElementById(prefix + '-zoom-fit').onclick = function () { fitToViewport(); };

      requestAnimationFrame(function () { requestAnimationFrame(fitToViewport); });
    }

    /* Boot */
    applyRegistryTokens(PB_REGISTRY);
    if (VIEW_ONLY) {
      document.body.classList.add('view-only');
      const _c = (PB_REGISTRY.config && PB_REGISTRY.config.cover) || null;
      if (_c) {
        const _cov = document.createElement('div');
        _cov.className = 'pb-cover';
        _cov.innerHTML = `<strong>${_c.title || ''}</strong><span>${_c.summary || ''}</span>`
          + (_c.by || _c.date ? `<em>${[_c.by, _c.date].filter(Boolean).join(' · ')}</em>` : '');
        document.body.insertBefore(_cov, document.body.firstChild);
      }
    }
    render();
  </script>
</body>
</html>
