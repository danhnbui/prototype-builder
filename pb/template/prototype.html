       it opens straight to content. Standalone (no `o`) it keeps its header — title and status badges
       — and a superseded rule folds to it. */
    function pbLogicCard(r, n, o) {
      o = o || {};
      const st = pbRuleState(r);
      const { d, title, supBy, supOn, sup, supersedes, loop, open, invariants, unchecked, blocks, matrix, states, unreachable, todo, reds } = st;
      const status = sup
        ? lgcBadge('n', 'superseded' + (supBy ? ` → <code>${pbEscape(supBy)}</code>` : ''), supOn ? 'on ' + supOn : '')
        : todo.length ? lgcBadge(reds ? 'bad' : 'warn', todo.length + ' to resolve') : lgcBadge('ok', '✓ settled');
      const todoHtml = todo.length && !sup ? `<div class="lgc-pad"><ul class="lgc-todo">${todo.map(t => `<li class="lgc-todo-${t[0]}"><span class="lgc-tdi" aria-hidden="true">${t[0] === 'bad' ? '!' : '?'}</span><div><div class="lgc-tdw">${t[1]}</div><div class="lgc-tdf">${t[2]} ${t[3]}</div></div></li>`).join('')}</ul></div>` : '';

      // The lead is the summary's first sentence; the rest of the summary opens the rule body.
      const sumS = lgcSentences(r.summary);
      let lead = sumS.length ? sumS[0] : lgcStr(d.chose);
      let rule = sumS.length > 1 ? `<ul class="lgc-ul lgc-sum">${sumS.slice(1).map(x => `<li>${pbEmph(x)}</li>`).join('')}</ul>` : '';
      if (states.length) rule += lgcLifecycle(r, unreachable);
      if (matrix) rule += `<section class="lgc-sec">${LGC_BLOCKS.matrix(matrix)}</section>`;
      if (invariants.length) rule += `<section class="lgc-sec">${lgcHead('Invariants', `<span class="lgc-hn">${invariants.length - unchecked} of ${invariants.length} checked</span>`)}${lgcInvariants(invariants)}</section>`;
      blocks.forEach(b => { if (!LGC_VALUE_TYPES[b.type]) rule += lgcBlock(b); });
      const values = blocks.filter(b => LGC_VALUE_TYPES[b.type]).map(lgcBlock).join('');
      // A rule that is nothing but a decision shows the decision itself — question, what was weighed,
      // the choice marked, why — not a closed History that holds it.
      const decided = lgcDecided(r, d);
      const decisionOnly = !rule && !values && !!decided.html;
      if (decisionOnly) {
        rule = `<section class="lgc-sec lgc-decided">${lgcHead('Decision', decided.meta ? `<span class="lgc-hn">${decided.meta}</span>` : '')}${decided.html}</section>`;
        if (lead === lgcStr(d.chose)) lead = '';       // the marked choice says it
      } else if (!rule && d.chose && lead !== d.chose) {
        // A rule with no structure yet still states what was decided — a card is never only prose.
        rule = `<section class="lgc-sec">${lgcHead('Rule')}<div class="lgc-chose">${pbEmph(lgcStr(d.chose))}</div></section>`;
      }
      const history = lgcHistory(r, d, { open, sup, supBy, supOn, loop, supersedes }, { skipDecided: decisionOnly });

      const uid = 'lgc-' + n + '-' + lgcStr(r.id || 'rule').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const tabs = [['values', 'Values', values, ''], ['history', 'History', history, open.length ? 'warn' : loop ? 'bad' : '']].filter(t => t[2]);
      // Two sections (Values + History) are tabs. One alone is just drawn, open, below the rule.
      const lone = tabs.length === 1 ? lgcLone(tabs[0][0], tabs[0][1], tabs[0][2], tabs[0][3]) : '';
      const tabsHtml = tabs.length > 1 ? `<div class="lgc-tabs">${tabs.map((t, i) => `<input type="radio" class="lgc-r lgc-r-${t[0]}" name="${uid}" id="${uid}-${t[0]}"${i === 0 ? ' checked' : ''}>`).join('')}`
        + `<div class="lgc-bar" role="tablist">${tabs.map(t => `<label class="lgc-l lgc-l-${t[0]}" for="${uid}-${t[0]}" role="tab">${t[1]}${t[3] ? `<span class="lgc-tdot lgc-tdot-${t[3]}"></span>` : ''}</label>`).join('')}</div>`
        + tabs.map(t => `<div class="lgc-p lgc-p-${t[0]}" role="tabpanel">${t[2]}</div>`).join('') + '</div>' : '';
      // The id the rule is cited by: shown wherever the card is, and copyable.
      const rid = r.id ? `<div class="lgc-rid"><span>Rule id</span> <code>${pbEscape(r.id)}</code>`
        + `<button class="pb-btn pb-btn--ghost pb-btn--sm" type="button" data-id="${escapeHtmlAttr(r.id)}" onclick="pbCopyRuleId(this)" title="Copy the rule id" aria-label="Copy rule id ${escapeHtmlAttr(r.id)}">${pbUiIcon('copy')}Copy</button></div>` : '';

      const attrs = `id="rule-${pbEscape(r.id)}" data-rule="${escapeHtmlAttr(r.id || '')}"`;
      if (o.bare) {
        // The row above carries the title, status and kind; the card starts at the point of it.
        const note = sup ? `<div class="lgc-supnote">${status}</div>` : '';
        const body = note + (lead ? `<p class="lgc-lead">${pbEmph(lead)}</p>` : '') + todoHtml + (rule ? `<div class="lgc-rule">${rule}</div>` : '') + lone + tabsHtml + rid;
        return `<article class="lg-card lgc lgc--bare${sup ? ' lg-card--sup' : ''}" ${attrs}>${body}</article>`;
      }
      const head = `<div class="lgc-tl"><h3 class="lgc-ti">${pbEmph(title)}</h3>${sup ? '<span class="lgc-show"></span>' : ''}</div>`
        + `<div class="lgc-bs">${status}<span class="lgc-meta">${r.kind ? lgcBadge('k', pbEscape(r.kind)) : ''}</span></div>`;
      const body = (lead ? `<p class="lgc-lead">${pbEmph(lead)}</p>` : '') + todoHtml + (rule ? `<div class="lgc-rule">${rule}</div>` : '') + lone + tabsHtml + rid;
      return sup
        ? `<details class="lg-card lgc lg-card--sup" ${attrs}><summary class="lgc-hd">${head}</summary>${body}</details>`
        : `<article class="lg-card lgc" ${attrs}><div class="lgc-hd">${head}</div>${body}</article>`;
    }

    /* Copy the id a rule is cited by (the ID column may be hidden), and say so. The clipboard API can
       refuse (no focus, no permission); then the old textarea route does it. */
    function pbCopyRuleId(btn) {
      const id = btn && btn.getAttribute('data-id');
      if (!id) return;
      const done = () => pbUiToast('Copied ' + id);
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = id; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) { /* the toast still names what was meant */ }
        document.body.removeChild(ta);
        done();
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(id).then(done, fallback); return; }
      } catch (e) { /* fall through */ }
      fallback();
    }

    /* Ripple. Pick a handler, a store slice or a component; see what it touches and what
       touches it. Every fact here is derived from the bodies — nothing is authored. */
    function pbRenderLogicRipple(L) {
      if (!state.logicFocus) {
        const firstSave = (L.handlers || []).find(h => h.isSave);
        state.logicFocus = firstSave ? { type: 'handler', id: firstSave.name } : { type: 'none', id: '' };
      }
      const f = state.logicFocus;
      const H = {}; (L.handlers || []).forEach(h => { H[h.name] = h; });
      const I = {}; (L.items || []).forEach(i => { I[i.id] = i; });
      const row = (type, id, label, meta) =>
        `<div class="logic-row ${f.type === type && f.id === id ? 'active' : ''}" data-k="${pbEscape((id + ' ' + (label || '')).toLowerCase())}" data-lg-type="${escapeHtmlAttr(type)}" data-lg-id="${escapeHtmlAttr(id)}" onclick="pbLogicGo(this.dataset.lgType,this.dataset.lgId)">`
        + `<span>${pbEscape(label || id)}</span>${meta ? `<span class="lg-dim">${pbEscape(meta)}</span>` : ''}</div>`;
      const group = (title, rows) => rows.length
        ? `<div class="logic-group"><div class="lg-group-h">${title} <span class="meta-subtab-count">${rows.length}</span></div>${rows.join('')}</div>` : '';

      const saves = (L.handlers || []).filter(h => h.isSave);
      const shared = (L.handlers || []).filter(h => h.exported && !h.isSave);
      const withLogic = (L.items || []).filter(i => (i.ownLogic || []).length || (i.wires || []).length);
      const list = `<div class="lg-list-wrap">
          <input class="lg-search" placeholder="Filter…" oninput="pbLogicFilter(this)" autocomplete="off">
          <div id="logic-list">
            ${group('Screens', (L.items || []).filter(i => i.kind === 'screen').map(i => row('item', i.id, i.id, (i.composes || []).length + ' parts')))}
            ${group('Shared data', Object.keys(L.slices || {}).map(k => row('slice', k, k, `${(L.slices[k].writers || []).length}w · ${(L.slices[k].readers || []).length}r`)))}
            ${group('Save handlers', saves.map(h => row('handler', h.name, h.name + '()', pbLgBase(h.file))))}
            ${group('Parts with behaviour', withLogic.filter(i => i.kind === 'component').map(i => row('item', i.id, i.id, (i.composedBy || []).length + ' uses')))}
            ${group('Shared helpers', shared.map(h => row('handler', h.name, h.name + '()', `${(h.calledFrom || []).length} files`)))}
          </div></div>`;

      let detail = `<p class="meta-p lg-dim">Pick something on the left.</p>`;
      if (f.type === 'handler' && H[f.id]) detail = pbRippleHandler(H[f.id], H, I, L);
      else if (f.type === 'slice' && (L.slices || {})[f.id]) detail = pbRippleSlice(f.id, L.slices[f.id], H);
      else if (f.type === 'item' && I[f.id]) detail = pbRippleItem(I[f.id], H, L);
      return `<div class="lg-ripple">${list}<div class="lg-detail">${detail}</div></div>`;
    }

    function pbLgSec(title, body) {
      return body ? `<div class="lg-sec"><div class="lg-sec-h">${title}</div><div>${body}</div></div>` : '';
    }

    function pbRippleHandler(h, H, I, L) {
      const byProd = {};
      (h.reads || []).forEach(r => {
        const k = (r.producers || []).length ? r.producers.join(', ') : '∅ nothing emits this';
        (byProd[k] = byProd[k] || []).push(r);
      });
      const reads = Object.keys(byProd).map(prod => {
        const rs = byProd[prod];
        const who = prod.charAt(0) === '∅'
          ? `<span class="lg-warn">${pbEscape(prod)}</span>`
          : prod.split(', ').map(p => I[p] ? pbLgLink('item', p) : pbEscape(p)).join(', ');
        return `<div class="lg-line">${who} <span class="lg-dim">→</span> `
          + rs.map(r => pbLgChip((r.kind === 'id' ? '#' : r.kind === 'class' ? '.' : 'data-') + r.token,
              (r.producers || []).length ? '' : 'lg-chip--dead')).join(' ') + `</div>`;
      }).join('');
      const calls = Object.keys(h.calls || {}).map(n =>
        pbLgLink('handler', n, n + '()') + `<span class="lg-dim"> ${pbEscape(H[n] ? pbLgBase(H[n].file) : '')}${h.calls[n] > 1 ? ' ×' + h.calls[n] : ''}</span>`).join(', ');
      const then = (h.toast ? ['toast'] : []).concat((h.nav || []).map(n => 'go → ' + n), h.rerender || []);
      const rules = (L.rules || []).filter(r => (r.implementedBy || []).includes(h.name) || (r.readers || []).includes(h.name));
      return `<div class="meta-h3">${pbEscape(h.name)}() ${h.isSave ? pbLgChip('save', 'lg-chip--save') : h.exported ? pbLgChip('shared helper', 'lg-chip--kind') : pbLgChip('local')}</div>
        <p class="meta-p lg-dim">${pbEscape(h.file)}:${h.line} · ${h.length} lines · owned by ${(h.owners || []).map(o => pbLgLink('item', o.id, o.id)).join(', ') || '<span class="lg-dim">—</span>'}</p>
        ${pbLgSec('Rules', rules.map(r => `<a class="lg-link" href="#" onclick="pbSetLogicView('rules');return false">${pbEscape(r.title)}</a> <span class="lg-dim">${(r.implementedBy || []).includes(h.name) ? 'implements' : 'reads'}</span>`).join('<br>'))}
        ${pbLgSec('Guards', (h.guards || []).map(g => pbLgLink('handler', g, g + '()')).join(' → '))}
        ${pbLgSec('Reads from the DOM', reads)}
        ${pbLgSec('Store', (h.slices || []).map(s => pbLgLink('slice', s, s, (h.writes || []).includes(s) ? 'lg-link--write' : '')
            + ` <span class="lg-dim">${(h.writes || []).includes(s) ? 'write' : 'read'}`
            + ((h.via || {})[s] ? ' via ' + pbEscape(h.via[s].join(', ')) + '()' : '') + `</span>`).join('<br>'))}
        ${pbLgSec('Calls (other files)', calls)}
        ${pbLgSec('Then', then.map(t => pbLgChip(t)).join(' '))}
        ${pbLgSec('Wired from markup in', (h.wiredInline || []).map(x => pbEscape(pbLgBase(x))).join(', '))}
        ${pbLgSec('Called from', (h.calledFrom || []).map(x => pbEscape(pbLgBase(x))).join(', '))}`;
    }

    function pbRippleSlice(name, s, H) {
      const li = ns => ns.map(n => `<div class="lg-line">${pbLgLink('handler', n, n + '()')} <span class="lg-dim">${pbEscape(H[n] ? pbLgBase(H[n].file) : '')}</span> ${H[n] && (H[n].rerender || []).length ? pbLgChip(H[n].rerender[0]) : ''}</div>`).join('');
      const owners = [...new Set((s.writers || []).concat(s.readers || []).flatMap(n => ((H[n] || {}).owners || []).map(o => o.id)).filter(Boolean))];
      return `<div class="meta-h3">store.${pbEscape(name)} ${pbLgChip('slice', 'lg-chip--kind')}</div>
        <p class="meta-p lg-dim">A session-store slice. Change its shape and every writer and reader below is affected.</p>
        ${pbLgSec(`Writers (${(s.writers || []).length})`, li(s.writers || []))}
        ${pbLgSec(`Readers (${(s.readers || []).length})`, li(s.readers || []))}
        ${pbLgSec('Surfaces touched', owners.map(o => pbLgLink('item', o)).join(', '))}`;
    }

    // The AUTHORED half of the schema-11 logic contract (logic/<kind>/<id>.json). Derivation
    // traces which slices a file READS, but not which it MUTATES — the mutation happens inside
    // a store helper — so `writes[]` is the one thing a human has to state, and this is where
    // stating it pays off. Absent (no contract, nothing authored) renders nothing at all.
    function pbContract(it) {
      const C = (window.PB_LOGIC || {}).contracts || {};
      return C[(it.kind === 'screen' ? 'screens/' : 'components/') + it.id] || null;
    }

    /* A screen is pure composition by pb's own atomic law, so "logic defined in this file" is
       legitimately 0 for a well-built one — and the item card then had nothing to say about it.
       The behaviour is a level down, in what it composes. Walk that tree and name it, so a screen
       answers "what can happen here?" instead of listing component names.
       Deliberately NOT the same as counting nested functions: a file's private markup helpers
       (esc, stack, subHeading) are not behaviour, and promoting them would bury the signal. */
    function pbComposedLogic(it, L) {
      const I = {};
      (L.items || []).forEach(i => { I[i.id] = i; });
      const seen = new Set([it.id]);
      const out = [];
      (function walk(id, depth) {
        if (depth > 4) return;
        ((I[id] || {}).composes || []).forEach(cid => {
          if (seen.has(cid)) return;
          seen.add(cid);
          if ((I[cid] || {}).ownLogic && I[cid].ownLogic.length) out.push(I[cid]);
          walk(cid, depth + 1);
        });
      })(it.id, 0);
      return out;
    }

    /* "What changes if I change this?" — the question Ripple exists to answer, said in plain words.
       Every figure is derived from the same graph the technical sections below draw on:
         · screens that use a part  = walk `composedBy` upward until a screen
         · shared data it touches   = the slices its handlers read/write, and who else uses them
         · where people arrive from = handlers that navigate here, up to the screen that owns them */
    function pbImpact(it, H, I, L, composedLogic) {
      const screensOf = id => {
        const out = new Set(), seen = new Set([id]), q = [id];
        while (q.length) {
          const c = q.shift();
          ((I[c] || {}).composedBy || []).forEach(p => {
            if (seen.has(p)) return;
            seen.add(p);
            if ((I[p] || {}).kind === 'screen') out.add(p);
            q.push(p);
          });
        }
        return [...out];
      };
      const asScreens = id => (I[id] || {}).kind === 'screen' ? [id] : screensOf(id);
      const link = id => pbLgLink('item', id);
      const list = ids => ids.map(link).join(', ');
      const isScreen = it.kind === 'screen';
      const rows = [];
      const row = (label, body, cls) => body ? `<div class="lgi-row ${cls || ''}"><div class="lgi-k">${label}</div><div class="lgi-v">${body}</div></div>` : '';

      // A part: where it is used. A screen: where people come from.
      if (!isScreen) {
        const used = screensOf(it.id);
        const direct = (it.composedBy || []).filter(c => (I[c] || {}).kind !== 'screen');
        rows.push(row('Used on', used.length
          ? `<b>${used.length} screen${used.length === 1 ? '' : 's'}</b> — ${list(used)}<div class="lg-dim">Change this part and every one of them changes with it.</div>`
          : '<b>No screen</b> <span class="lg-dim">— nothing displays it yet, so changing it affects nothing.</span>', used.length > 3 ? 'lgi-wide' : ''));
        if (direct.length) rows.push(row('Built into', `${direct.length} other part${direct.length === 1 ? '' : 's'} — ${list(direct)}`));
      } else {
        const from = new Set();
        Object.keys(H).forEach(n => { if ((H[n].nav || []).includes(it.id)) (H[n].owners || []).forEach(o => asScreens(o.id).forEach(x => from.add(x))); });
        from.delete(it.id);
        rows.push(row('People arrive from', from.size ? list([...from]) : '<span class="lg-dim">no navigation into this screen was found in the code — it may be the entry screen, or reached by a link the scan cannot see.</span>'));
      }

      // What this item is made of — and how far each shared piece reaches.
      const parts = (it.composes || []).map(c => ({ id: c, others: screensOf(c).filter(x => x !== it.id) }))
        .sort((a, b) => b.others.length - a.others.length);
      if (parts.length) {
        const shared = parts.filter(p => p.others.length);
        rows.push(row(isScreen ? 'Built from' : 'Contains',
          `<b>${parts.length} part${parts.length === 1 ? '' : 's'}</b>${shared.length ? ` — ${shared.length} shared with other screens` : ' — none shared'}`
          + `<div class="lgi-parts">${parts.map(p => `<span class="lgi-part ${p.others.length ? 'is-shared' : ''}">${link(p.id)}<span class="lgi-n">${p.others.length ? 'also on ' + p.others.length + ' other screen' + (p.others.length === 1 ? '' : 's') : 'only here'}</span></span>`).join('')}</div>`
          + (shared.length ? '<div class="lg-dim">Editing a shared part changes every screen listed against it, not just this one. Editing this screen\'s own layout changes only this screen.</div>' : '')));
      }

      // Rules this surface displays.
      const rules = (L.rules || []).filter(r => (r.displayedIn || []).includes(it.id));
      rows.push(row('Rules shown here', rules.map(r => `<a class="lg-link" href="#" onclick="pbSetLogicView('rules');return false">${pbEscape(r.title)}</a>`).join('<br>')
        + (rules.length ? '<div class="lg-dim">If you change what is shown, check these still hold.</div>' : '')));

      // Shared data it reads or changes, and who else leans on it.
      const fnNames = new Set([].concat(it.ownLogic || [], it.wires || [], it.readBy || [], ...(composedLogic || []).map(c => c.ownLogic || [])));
      const mine = {};
      fnNames.forEach(n => ((H[n] || {}).slices || []).forEach(sl => { mine[sl] = mine[sl] || ((H[n].writes || []).includes(sl)); mine[sl] = mine[sl] || (H[n].writes || []).includes(sl); }));
      const data = Object.keys(mine).map(sl => {
        const sd = (L.slices || {})[sl] || {};
        const users = new Set();
        (sd.writers || []).concat(sd.readers || []).forEach(n => ((H[n] || {}).owners || []).forEach(o => asScreens(o.id).forEach(x => users.add(x))));
        users.delete(it.id);
        return `<div class="lgi-line">${pbLgLink('slice', sl, sl, mine[sl] ? 'lg-link--write' : '')} <span class="lg-dim">${mine[sl] ? 'this changes it' : 'this reads it'}</span>`
          + (users.size ? `<div class="lg-dim">Also used by ${list([...users])}</div>` : '') + '</div>';
      }).join('');
      rows.push(row('Shared data', data));

      const body = rows.join('');
      return `<div class="lgi"><div class="lgi-h">If you change this ${isScreen ? 'screen' : 'part'}</div>${body || '<div class="lg-dim">Nothing else in the prototype depends on it.</div>'}</div>`;
    }

    function pbRippleItem(it, H, L) {
      const I = {};
      (L.items || []).forEach(x => { I[x.id] = x; });
      const rules = (L.rules || []).filter(r => (r.displayedIn || []).includes(it.id));
      const li = ns => ns.map(n => pbLgLink('handler', n, n + '()')).join(', ');
      const composedLogic = pbComposedLogic(it, L);
      const composedSec = composedLogic.map(c => {
        const fns = c.ownLogic || [];
        return `<div class="lg-line">${pbLgLink('item', c.id)} `
          + `<span class="lg-dim">${fns.length} fn${fns.length === 1 ? '' : 's'}</span> `
          + fns.slice(0, 6).map(n => pbLgLink('handler', n, n + '()')).join(', ')
          + (fns.length > 6 ? ` <span class="lg-dim">+${fns.length - 6}</span>` : '')
          + `</div>`;
      }).join('');
      // An item with no logic of its own AND none in anything it composes is a real finding, not
      // an empty panel — say so rather than rendering nothing.
      const inert = !(it.ownLogic || []).length && !composedLogic.length && (it.composes || []).length
        ? `<div class="lg-line lg-dim">Composes ${it.composes.length} component${it.composes.length === 1 ? '' : 's'}, none of which define behaviour — this surface is presentational. Any action here is passed in by whatever renders it.</div>`
        : '';
      const c = pbContract(it) || {};
      const declared = (c.writes || []).map(w => pbLgChip('store.' + w, 'lg-chip--kind')).join(' ');
      const affords = (c.affordances || []).map(a =>
        `<div class="lg-line"><b>${pbEscape(a.id || a.name || '')}</b> <span class="lg-dim">${pbEscape(a.why || '')}</span></div>`).join('');
      // The item's own logic prose. A sidecar's notes[] are a COPY of these (render.load_contracts
      // carries only writes/affordances), so they are read from the registry, where they live.
      const regItem = ((PB_REGISTRY.screens || []).concat(PB_REGISTRY.components || [])).find(x => x && x.id === it.id) || {};
      const prose = [].concat(regItem.logicNotes || [], regItem.uiLogic || [])
        .map(n => typeof n === 'string' ? n : (n && (n.rule || n.text || n.note)) ? ((n.target ? n.target + ' — ' : '') + (n.rule || n.text || n.note)) : '')
        .filter(Boolean);
      const notesSec = prose.length
        ? `<details class="lg-fold lgi-tech"><summary><span class="lg-sec-h">Notes the team wrote about it</span> <span class="lg-dim">${prose.length}</span></summary>${prose.map(n => `<div class="lg-prose lg-note">${pbProseHTML(n)}</div>`).join('')}</details>` : '';
      // The code-level inventory is still here — for the person building — but folded: a reader who
      // wants to know what a change touches should not have to read function names to find out.
      const tech = `${pbLgSec('Declared writes', declared)}
        ${pbLgSec('Affordances — and why', affords)}
        ${pbLgSec(`Behaviour reachable through what it composes (${composedLogic.length})`, composedSec)}
        ${inert}
        ${pbLgSec('Handlers wired in its markup', li(it.wires || []))}
        ${pbLgSec('Handlers that read its DOM', li(it.readBy || []))}
        ${pbLgSec(`Logic defined in this file (${(it.ownLogic || []).length})`, li(it.ownLogic || []))}`;
      return `<div class="meta-h3">${pbEscape(it.id)} ${pbLgChip(it.kind === 'screen' ? 'screen' : 'part', 'lg-chip--kind')}</div>
        ${pbImpact(it, H, I, L, composedLogic)}
        ${notesSec}
        <details class="lg-fold lgi-tech"><summary><span class="lg-sec-h">Technical details</span> <span class="lg-dim">${pbEscape(it.file || '')} · ${it.lines} lines · for whoever builds it</span></summary>${tech}</details>`;
    }

    /* Escapes a value for HTML text and for a quoted HTML ATTRIBUTE (title="…", data-x="…").
       It does NOT make a value safe inside a JS string in an inline handler — onclick="f('" + pbEscape(v) + "')"
       is injectable: the HTML parser decodes &#39; back to ' before the JS parser sees the attribute,
       so a value containing ');alert(1);// ends the string and runs. Carry a value to a handler as DATA
       (a data-x attribute through escapeHtmlAttr, read back as this.dataset.x); tests/handler_escape.py guards it. */
    function pbEscape(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* =========================================================================
       TAB 3 — USER FLOW
       Zoomable canvas with a custom SVG diagram. Edit `buildFlowSvg()` below
       to add your prototype's screens, decisions, and transitions.
       ========================================================================= */
    /* QA test-case lenses — categories a scenario / coverage-gap can be tagged with. */
    const QA_CAT_LABEL = { ux: 'UX', ui: 'UI', function: 'Function', business: 'Business', 'system-edge': 'System edge' };
    /* A scenario comes in two shapes, and a project may use either:
         · {text, category, test:{start, steps[], expect[], roles, seed}, lastResult:{status, inputs, …}}
           — written by /pb:plan --flow, run and recorded by /pb:test;
         · {id, test:"the label", steps:"…", expect:"…", category, lastResult:{result, at, note}}
           — written by hand, recorded by a headless run (`test` is the case's name, not a block);
       or a bare string — a check made by hand. Everything below reads both. */
    const pbScObj = sc => !!sc && typeof sc === 'object';
    /* What a scenario is called: its text, else its test (when that is a string), else its title. */
    function pbScLabel(sc) {
      if (typeof sc === 'string') return sc;
      if (!pbScObj(sc)) return '';
      return sc.text || (typeof sc.test === 'string' && sc.test) || sc.title || '';
    }
    /* The row's one-line head, and the longer text that goes under it. A `text` is a paragraph, so its
       head is its opening claim; a test name or a title is already a head and is never cut. */
    function pbScHead(sc) {
      const text = typeof sc === 'string' ? sc : pbScObj(sc) ? (sc.text || '') : '';
      return { head: text ? (pbGapHead(text) || text) : pbScLabel(sc), text };
    }
    /* The verdict, written either way: `status` (a /pb:test run) or `result` (a headless run). */
    const pbScResult = lr => String((lr && (lr.status || lr.result)) || '').trim().toLowerCase();
    /* How a scenario is told apart from a case checked by hand: it has a test, or a recorded result. */
    const pbScTracked = sc => pbScObj(sc) && !!(sc.test || sc.lastResult);
    /* The glyph and words for each verdict. `ubd` = untested by design. */
    const PB_SC_VERDICT = {
      pass:     ['✓', 'Passed'],
      fail:     ['✗', 'Failed'],
      blocked:  ['⊘', 'Blocked — it could not be run'],
      retired:  ['–', 'Retired — it no longer applies'],
      ubd:      ['◇', 'Untested by design'],
      untested: ['○', 'Not run yet'],
      stale:    ['⟳', 'Stale'],
      manual:   ['☐', 'Manual'],
    };
    /* The verdict of one scenario, as the glyph and the words behind it. Shared by the Test Cases tab
       and the sub-tab badge count. */
    function pbScStatus(sc) {
      if (!pbScTracked(sc)) return { st: 'manual', glyph: PB_SC_VERDICT.manual[0], label: 'Manual' };
      const lr = sc.lastResult || {};
      const v = pbScResult(lr);
      const stale = pbResultStale(lr);
      const st = stale ? 'stale' : v === 'pass' ? 'pass' : v === 'fail' ? 'fail' : v === 'blocked' ? 'blocked' : v === 'retired' ? 'retired'
        : /^untested[\s_-]*by[\s_-]*design$/.test(v) ? 'ubd' : 'untested';
      return {
        st, stale, lr,
        glyph: PB_SC_VERDICT[st][0],
        label: st === 'stale' ? (stale === 'unknown'
              ? 'Ran before input tracking existed — re-run to confirm'
              : 'Stale — the code changed since this ran: ' + stale)
          : PB_SC_VERDICT[st][1]
      };
    }

    /* Is this verdict still about the code that is here now? Returns '' when it is current, or
       a reason string when it is not — the screens whose bodies moved, or 'unknown' for a result
       written before inputs were recorded, which cannot be shown as green without asserting
       something nobody checked. Only a /pb:test result (`status`: pass | fail) records the inputs it
       ran against; a recorded `result`, a retirement or a "by design" claims nothing about today's
       code, so there is nothing to be stale. */
    function pbResultStale(lr) {
      const v = lr && lr.status;
      if (v !== 'pass' && v !== 'fail') return '';
      const live = (window.PB_LOGIC || {}).itemHash;
      if (!live) return '';                       // no derived graph — claim nothing
      if (!lr.inputs) return 'unknown';
      const moved = Object.keys(lr.inputs).filter(id => (live[id] || '') !== lr.inputs[id]);
      return moved.length ? moved.join(', ') : '';
    }

    /* How many scenarios are in each state. `total` counts the ones that have a test (or a recorded
       result); `manual` the ones checked by hand — together every scenario. */
    function pbTestCounts() {
      const fStories = (PB_DATA.flow && PB_DATA.flow.stories) || [];
      const c = { total: 0, pass: 0, fail: 0, blocked: 0, retired: 0, ubd: 0, untested: 0, stale: 0, manual: 0 };
      fStories.forEach(s => (s.scenarios || []).forEach(sc => {
        const v = pbScStatus(sc).st;
        if (v === 'manual') c.manual++; else { c.total++; c[v]++; }
      }));
      return c;
    }
    // A coverage warning may declare it is no longer an open gap. Anything else — including no
    // status at all — is `open`, so a project that never authored the field is unchanged.
    const GAP_SETTLED = { resolved: 'Resolved', accepted: 'Accepted' };
    /* Esc folds the test case you are in — unless something on top of it (a menu, a dialog, a filter
       menu) is what the key was for. Test cases open together, so it is the one holding focus. */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || e.defaultPrevented || pbUiModalOpen()) return;
      if (state.metaView !== 'flow' || pbUxView() !== 'tests' || pbFilterPopIsOpen()) return;
      const row = document.activeElement && document.activeElement.closest && document.activeElement.closest('.pb-scan-tr.is-open[data-fb-list="tc"]');
      if (!row) return;
      pbScanToggle('tc', row.getAttribute('data-key'));
      const t = row.querySelector(':scope > .pb-disc-t'); if (t) t.focus();
    });

    /* A gap note is a paragraph — 2,000 characters on a real project — and 22 paragraphs is not a
       list, it is an essay. The row needs a LABEL, so derive the note's opening claim: the earliest
       strong break at least 24 characters in. The minimum matters: breaking at the first delimiter
       yields "Cổng trọng số" or "Tình huống", fragments that identify nothing. Delimiters are
       punctuation, not words, so this holds in any language. An authored `title` always wins. */
    const GAP_DELIMS = [' — ', ' – ', '. ', ': ', ' (', ', ', '; '];
    function pbGapHead(note) {
      const n = (note || '').trim();
      const ps = GAP_DELIMS.map(d => n.indexOf(d)).filter(p => p > 0).sort((a, b) => a - b);
      let h = null;
      for (let k = 0; k < ps.length; k++) { if (ps[k] >= 24) { h = n.slice(0, ps[k]); break; } }
      if (h === null) h = n.length > 110 ? n.slice(0, 110) : n;
      // Never end mid-parenthesis: close it when the end is near, else drop the parenthetical.
      if ((h.match(/\(/g) || []).length > (h.match(/\)/g) || []).length) {
        const c = n.indexOf(')', h.length);
        h = (c > 0 && c - h.length < 60) ? n.slice(0, c + 1) : h.slice(0, h.lastIndexOf('('));
      }
      return h.replace(/[\s,;:—–.]+$/, '');
    }
    // The one field in a findings list that differs row to row and needs no translation.
    function pbGapDate(note) { const m = /\d{4}-\d{2}-\d{2}/.exec(note || ''); return m ? m[0] : ''; }

    /* ── Reading a test case ───────────────────────────────────────────────────
       An author writing a 2,400-character note is not writing badly; they are
       recording a requirement, the cases it covers, what was measured and why.
       That structure is already in the text — newlines separate the blocks, `·`
       opens a bullet, backticks mark code, and ALL-CAPS is how this author says
       "look here". The panel renders that structure instead of flattening it.

       Emphasis is REPORTED, never invented: a run is bold because the author
       capitalised it. Single short caps words are left alone — HR, KPI, UI and
       PRD are nouns, not shouting, and bolding them would drown the real
       emphasis in the same paragraph. */
    function pbEmph(t) {
      let h = pbEscape(t);
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');   // the author's own bold, honoured
      // A caps RUN of 2+ words, or a single caps word of 4+ letters. The hyphen guards keep it out
      // of identifiers — `T-ROLE-EL` and `KHÔNG-admin` are names, and bolding half a name is noise.
      h = h.replace(/(?<![\p{L}\p{M}\d-])\p{Lu}[\p{Lu}\p{M}\d]+(?:[  ]\p{Lu}[\p{Lu}\p{M}\d]*)*(?![\p{L}\p{M}\d-])/gu, m => {
        const words = m.trim().split(/\s+/);
        const letters = m.replace(/[^\p{L}]/gu, '').length;
        return (words.length > 1 || letters >= 4) ? '<strong>' + m + '</strong>' : m;
      });
      return h;
    }
    /* Not every author uses newlines — on the reference project all 22 coverage notes are one
       unbroken run of up to 2,057 characters. But they DO mark their sections: a sentence that
       opens with an ALL-CAPS run ("CẬP NHẬT 2026-08-10", "MỨC ĐỘ KIỂM:") is a new thought. Break
       long blocks there, so a note that was written as one paragraph still reads as several. */
    const TC_SECTION = /(?<=[.:])\s+(?=\p{Lu}[\p{Lu}\p{M}\d]+(?:[  ]\p{Lu}[\p{Lu}\p{M}\d]*)*[\s:,])/gu;
    function pbProseHTML(s) {
      const out = []; let bul = [];
      const flush = () => { if (bul.length) { out.push('<ul class="tc-ul">' + bul.join('') + '</ul>'); bul = []; } };
      (s || '').split(/\n+/).forEach(ln => {
        const t = ln.trim();
        if (!t) return;
        if (/^[·•▪–-]\s+/.test(t)) { bul.push('<li>' + pbEmph(t.replace(/^[·•▪–-]\s+/, '')) + '</li>'); return; }
        flush();
        (t.length > 400 ? t.split(TC_SECTION) : [t]).forEach(p => {
          if (p.trim()) out.push('<p>' + pbEmph(p.trim()) + '</p>');
        });
      });
      flush();
      return out.join('');
    }
    /* A step and an expect are data. Said as sentences they are a test plan someone can read
       without learning the vocabulary first — and the bold is the part being asserted. */
    const TC_STEP_VERB = { fill: 'Fill', click: 'Click', nav: 'Navigate via', submit: 'Submit',
                           'toggle-password': 'Toggle the password on', back: 'Go back' };
    function pbStepText(s) {
      const v = TC_STEP_VERB[s && s.do] || pbEscape((s && s.do) || '');
      if (s && s.do === 'back') return v;
      const tgt = s && s.target ? ` <strong>${pbEscape(s.target)}</strong>` : '';
      const val = s && s.value != null ? ` with <strong>"${pbEscape(String(s.value))}"</strong>` : '';
      return v + tgt + val;
    }
    function pbExpectText(e) {
      if (!e || typeof e !== 'object') return pbEscape(String(e));
      if (e.screen) return `Lands on screen <strong>${pbEscape(e.screen)}</strong>`;
      if (e.text) return `The frame reads <strong>"${pbEscape(e.text)}"</strong>`;
      if (e.toast) return `A toast says <strong>"${pbEscape(e.toast)}"</strong>`;
      if (e.present) return `<strong>${pbEscape(e.present)}</strong> is present`;
      if (e.absent) return `<strong>${pbEscape(e.absent)}</strong> is absent`;
      if (e['no-console-error']) return 'No console error fires';
      if (e.errors) return e.errors.count != null
        ? `Exactly <strong>${pbEscape(String(e.errors.count))}</strong> field errors show`
        : `At least <strong>${pbEscape(String(e.errors.min))}</strong> field errors show`;
      return pbEscape(JSON.stringify(e));
    }
    function pbRenderTestCases() {
      const f = (PB_DATA && PB_DATA.flow) || {};
      const fStories = f.stories || [];
      if (!fStories.length) {
        return `<div class="summary-scroll"><div class="meta-section">`
          + pbFbarHTML('tc', { label: 'Filter test cases', placeholder: 'Search test cases', noun: 'test cases',
              off: 'Nothing to filter yet — the filters switch on once test cases exist.',
              facets: [{ k: 'result', label: 'Result', opts: [] }, { k: 'story', label: 'Story', opts: [] }] })
          + `</div>` + pbUxEmpty('No test cases yet',
          'Test cases ride the user flow — each story carries a checklist of scenarios across the UX, UI, Function, Business and System-edge lenses. Generate the user flow first.',
          'Generate user flow', '/pb:plan --flow') + `</div>`;
      }
      const tc = pbTestCounts();
      const runTestsBtn = VIEW_ONLY ? '' :
        `<button class="pb-btn pb-btn--sm pb-test-run-btn" type="button" onclick="openCopyPopover('/pb:test', this)" title="Copy the /pb:test command">Run tests</button>`;
      const warns = (f.coverageWarnings || []).map(w => GAP_SETTLED[(w && w.status) || ''] ? 'settled' : 'open');
      const open = warns.filter(w => w === 'open'), settled = warns.filter(w => w !== 'open');
      // The tally, in the order a reader asks: what passed, then what did not, then what was set aside.
      // Zero is not said, except the passes — "0 pass" is the first thing a new project should read.
      const tally = [[tc.pass, 'pass', true], [tc.fail, 'fail', 'warn'], [tc.blocked, 'blocked', 'warn'], [tc.stale, 'stale', 'warn'],
        [tc.retired, 'retired'], [tc.ubd, 'untested by design'], [tc.untested, 'not run'], [tc.manual, 'manual']]
        .filter(x => x[0] || x[2] === true)
        .map(x => `<span class="pb-test-n${x[2] === 'warn' ? ' lg-warn' : ''}"><b>${x[0]}</b> ${x[1]}</span>`);
      if (open.length) tally.push(`<span class="pb-test-n lg-warn"><b>${open.length}</b> coverage gap${open.length === 1 ? '' : 's'}</span>`);
      if (settled.length) tally.push(`<span class="pb-test-n"><b>${settled.length}</b> settled</span>`);
      const testsHeader = `<div class="pb-test-head"><span class="pb-test-summary">${tally.join(' · ')}</span>${runTestsBtn}</div>`;
      // One line per test case — the stories' scenarios, then the coverage gaps — that opens in
      // place into the whole case: the verdict and why, the run as sentences, the author's notes.
      return `<div class="summary-scroll tc-list">
          <div class="meta-section">
            <div class="meta-h2">3.4 Test Cases</div>
            ${testsHeader}
            ${pbTcScanHTML()}
          </div>
        </div>`;
    }

    /* The run, as a reader sees it. A `test{}` block is said as sentences; a hand-written case has its
       steps and what it expects as plain text — an array is a list, a string is shown as written. */
    function pbTcRun(sc) {
      if (!pbScObj(sc)) return '';
      const t = pbScObj(sc.test) ? sc.test : null;
      const part = (label, v, tag) => {
        if (Array.isArray(v) ? !v.length : !v) return '';
        return `<h5>${label}</h5>` + (Array.isArray(v) ? `<${tag} class="tc-${tag}">${v.map(x => `<li>${x}</li>`).join('')}</${tag}>`
          : `<div class="tc-prose">${pbProseHTML(String(v))}</div>`);
      };
      const steps = t ? (t.steps || []).map(pbStepText) : (Array.isArray(sc.steps) ? sc.steps.map(x => pbEmph(String(x))) : sc.steps);
      const expect = t ? (t.expect || []).map(pbExpectText) : (Array.isArray(sc.expect) ? sc.expect.map(x => pbEmph(String(x))) : sc.expect);
      const facts = t ? `<dl class="tc-dl">
            ${t.start ? `<dt>Starts on</dt><dd><strong>${pbEscape(t.start)}</strong></dd>` : ''}
            ${(t.roles || []).length ? `<dt>As role</dt><dd><strong>${pbEscape(t.roles.join(', '))}</strong></dd>` : ''}
            ${t.seed ? `<dt>Seed data</dt><dd><strong>${pbEscape(t.seed)}</strong></dd>` : ''}
          </dl>` : '';
      const body = facts + part('Steps', steps, 'ol') + part('Passes when', expect, 'ul');
      if (body.trim()) return `<div class="tc-sec"><h4>How it runs</h4>${body}</div>`;
      return `<div class="tc-sec"><h4>How it runs</h4>`
        + (pbScTracked(sc) ? `<p class="tc-none">Nothing is recorded about the steps — only the verdict.</p>`
          : `<p class="tc-none">No <code>test</code> — this one is <strong>checked by hand</strong>, so it never reports a pass.</p>`) + `</div>`;
    }

    /* The detail of one test case — what a row opens into. It is the one place the whole authored text
       appears, structured rather than dumped: the verdict and why it is the verdict, then the run
       said as sentences, then the author's own notes with their own emphasis kept. The row above is
       its title. */
    function pbTcPanel(key) {
      const k = key;
      if (!k) return '';
      const f = (PB_DATA && PB_DATA.flow) || {};
      let cat = null, text = '', story = '', sc = null, badge = '';
      if (k[0] === 'g') {
        const w = (f.coverageWarnings || [])[+k.slice(1)];
        const o = (typeof w === 'string') ? { note: w } : (w || {});
        text = o.note || ''; cat = o.category || null;
        badge = GAP_SETTLED[o.status] || '';
      } else {
        const m = /^s(\d+)-(\d+)$/.exec(k); if (!m) return '';
        const st = (f.stories || [])[+m[1]] || {};
        sc = (st.scenarios || [])[+m[2]];
        text = pbScHead(sc).text;
        cat = pbScObj(sc) ? sc.category : null;
        story = st.title || '';
      }
      const s = sc ? pbScStatus(sc) : { st: 'gap', glyph: '⚑', label: 'Coverage gap' };
      const lr = pbScObj(sc) ? (sc.lastResult || null) : null;
      const chip = cat ? `<span class="pb-qa-cat pb-qa-cat--${pbEscape(cat)}">${pbEscape(QA_CAT_LABEL[cat] || cat)}</span>` : '';

      // What the row does not already say. The row has the verdict, the story and the claim, so the
      // detail opens with WHY the verdict is what it is (a retirement's note), then how the case runs,
      // then what it covers, and ends on the small facts. A verdict is repeated only when its words
      // explain something (stale, blocked); the story stays because a phone's list drops that column.
      const why = [];
      if (lr && lr.detail) why.push(`<div class="tc-prose">${pbProseHTML(String(lr.detail))}</div>`);
      if (lr && lr.note) why.push(`<div class="tc-prose">${pbProseHTML(String(lr.note))}</div>`);
      const whyHead = { retired: 'Why it is retired', ubd: 'Why it is untested by design', blocked: 'Why it is blocked', fail: 'Why it failed' }[s.st] || 'Note';
      const meta = [];
      if (story) meta.push(['Story', pbEscape(story)]);
      if (chip) meta.push(['Lens', chip]);
      if (badge) meta.push(['Status', `<strong>${pbEscape(badge)}</strong>`]);
      if (sc && (s.st === 'stale' || s.st === 'blocked')) meta.push(['Verdict', `<strong class="tc-v tc-v--${s.st}">${s.glyph} ${pbEscape(s.label)}</strong>`]);
      const when = lr && (lr.ranAt || lr.at);
      if (when) meta.push([lr.ranAt || /\d{4}-\d{2}-\d{2}/.test(String(when)) ? 'Last run' : 'Run in', pbEscape(when)]);

      return `<div class="tc-panel">
          ${why.length ? `<div class="tc-sec"><h4>${whyHead}</h4>${why.join('')}</div>` : ''}
          ${sc ? pbTcRun(sc) : ''}
          ${text ? `<div class="tc-sec"><h4>${sc ? 'What it covers' : 'The finding'}</h4>
            <div class="tc-prose">${pbProseHTML(text)}</div>
          </div>` : ''}
          ${meta.length ? `<dl class="tc-dl tc-dl--meta">${meta.map(([k2, v]) => `<dt>${pbEscape(k2)}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
        </div>`;
    }

    /* =====================================================================================
       FILTER BAR + SCAN LINES (wave 2, T2.6; round 3). A list you can read in one pass: one line per
       item in fixed columns, a sticky header, and a click (or Enter) that opens the item in place.
       Each line is a runtime.js pbDisclosure row — a 20px chevron first, MULTI-OPEN (opening one
       never closes another), arrows / Home / End move between rows, Expand all / Collapse all is the
       disclosure group's own bar. Above it: the shared filter bar (pbFilterBar: search · chips with
       counts · Clear · "N of M" · Expand all). The filter state lives in the runtime, per bar id, so
       it survives the tab being rebuilt; the filtering itself is a DOM pass, so typing never loses
       the caret. A row the filter hides keeps its open state.
       Rows opt in with data-fb-list / data-fb-hay / data-fb-<facet>; pbFbarHTML / pbFbarApply are
       this shell's adapter onto pbFilterBar / pbFilterApply (round 3 moved the implementation out).
       A row's open state is the runtime's (PB_DISC_STATE, keyed by pbScanId); `state.scanOpen` is a
       Set mirroring it, which a deep link adds to before the page is built.
       ===================================================================================== */
    state.scanOpen = new Set();   // pbScanId()s of the rows that are open
    state.scanForce = new Set();  // archived rows a link opened on purpose: shown even while archived rows are hidden
    function pbCountBy(arr, f) { const m = {}; arr.forEach(x => { const k = f(x); m[k] = (m[k] || 0) + 1; }); return m; }
    /* cfg: { label, placeholder, noun, facets: [{ k, label, opts: [{ v, l, n }] }], off, expandAll, archived }
       `archived: { n, label }` — rows that are history, not work (a superseded rule, a retired test case)
       are hidden until the quick chip `label` ("Show superseded") is pressed. The chip only appears when
       there are some; the count and "N of M" are of what is shown, so 42 rules + 1 superseded reads
       "42 of 42" until it is asked for. */
    function pbFbarHTML(list, cfg) {
      const arch = cfg.archived && cfg.archived.n ? [{ id: 'archived', label: cfg.archived.label, count: cfg.archived.n }] : [];
      return pbFilterBar({
        id: list, label: cfg.label, placeholder: cfg.placeholder, countLabel: cfg.noun, off: cfg.off, quick: arch,
        chips: (cfg.facets || []).map(f => ({ id: f.k, label: f.label, options: f.opts.map(o => ({ value: o.v, label: o.l, count: o.n })) })),
        // Expand all / Collapse all is the disclosure group's own bar (group = the list id); it
        // labels itself from the rows that are on screen, so a filtered list expands what it shows.
        slot: cfg.expandAll ? pbDiscGroupBarHTML(list) : '',
      });
    }
    function pbFbarNoneHTML(list) { return pbFilterNoneHTML(list); }
    function pbFbarApply(list) {
      const bar = document.querySelector('.pb-fbar[data-fbar="' + list + '"]');
      if (!bar) return;
      const ks = Array.from(bar.querySelectorAll('[data-pb-chip]')).map(c => c.getAttribute('data-pb-chip'));
      // a function, not an array: the runtime re-collects the rows on every keystroke. An archived row
      // is left out (and hidden) until the bar's "Show …" chip is on — or a link opened it on purpose.
      // With the chip on, every row says yes to it, so the chip widens the list instead of narrowing it.
      return pbFilterApply(list, () => {
        const show = !!(pbFilterState(list).quick || {}).archived;
        return Array.from(document.querySelectorAll('[data-fb-list="' + list + '"]')).filter(r => {
          const keep = show || !r.hasAttribute('data-fb-archived') || state.scanForce.has(pbScanId(list, r.getAttribute('data-key')));
          if (!keep) r.hidden = true;
          return keep;
        }).map(r => {
          const facets = {}; ks.forEach(k => { facets[k] = r.getAttribute('data-fb-' + k); });
          return { el: r, text: r.getAttribute('data-fb-hay') || '', facets, quick: { archived: true } };
        });
      });
    }
    function pbFbarApplyAll() { document.querySelectorAll('.pb-fbar[data-fbar]').forEach(b => pbFbarApply(b.getAttribute('data-fbar'))); }

    /* The disclosure id of one scan row — the key its open state is remembered under. */
    const pbScanId = (list, key) => 'scan-' + list + '-' + String(key).replace(/[^\w-]/g, '_');
    /* Open a row on purpose (a deep link, ⌘K, a glossary link): remembered before the page is built,
       so it is drawn open — whatever the viewer last did to it. */
    function pbScanOpenKey(list, key) {
      const id = pbScanId(list, key);
      state.scanOpen.add(id);
      state.scanForce.add(id);
      pbDiscSet(id, true, true);
    }
    /* Scroll an opened row to the top of the list (under the sticky header) and outline it a moment. */
    function pbScanReveal(list, key) {
      const el = document.querySelector('.pb-scan-tr[data-fb-list="' + list + '"][data-key="' + CSS.escape(String(key)) + '"]');
      if (!el) return;
      el.scrollIntoView({ block: 'start', behavior: 'smooth' });
      el.classList.remove('pb-flash'); void el.offsetWidth; el.classList.add('pb-flash');
    }
    /* Ids that are only the slug of a title ("ward-picker-scope") say nothing the title does not, so
       a list whose every id is one drops its ID column; the id stays in the opened detail, with a
       copy button. A code ("R-12", "rule-3", "S1.1") is information and keeps its column. */
    const pbScanIsSlug = id => /^[a-z][a-z0-9]*(?:-[a-z0-9]+)+$/.test(id) && !/^[a-z]{1,4}-\d+$/.test(id) || /^[a-z]{4,}$/.test(id);
    function pbScanIdsAreSlugs(ids) { return ids.length > 0 && ids.every(id => pbScanIsSlug(String(id == null ? '' : id))); }
    /* the open state of a row is the runtime's; the shell keeps a Set of what is open, and a
       test case's panel is drawn the first time its row opens (204 of them is not a first paint) */
    document.addEventListener('pb:disclosure', e => {
      const d = e.detail, root = d && d.root;
      if (!root || !root.classList || !root.classList.contains('pb-scan-tr')) return;
      if (d.open) state.scanOpen.add(d.id); else state.scanOpen.delete(d.id);
      if (d.open && root.getAttribute('data-fb-list') === 'tc' && d.body && !d.body.hasChildNodes()) {
        d.body.innerHTML = pbTcPanel(root.getAttribute('data-key'), true);
      }
    });

    /* A scan row — a pbDisclosure row (chevron, then the cells), in the group `list`.
       cells = the columns' HTML, in order; detail = what it opens into ('' to fill it on first open
       from `pb:disclosure`). o = { dim, hay, vals, label, archived }: hay is what the filter's search reads,
       vals become data-fb-<facet> for the filter's chips, archived hides the row until the bar's
       "Show …" chip is on (pbFbarHTML cfg.archived). Any number of cells. */
    function pbScanRowHTML(list, key, cells, detail, o) {
      o = o || {};
      const attrs = { role: 'listitem', 'data-key': key, 'data-fb-list': list, 'data-fb-hay': String(o.hay || '').toLowerCase() };
      if (o.archived) attrs['data-fb-archived'] = '1';
      Object.keys(o.vals || {}).forEach(k => { attrs['data-fb-' + k] = o.vals[k]; });
      const id = pbScanId(list, key);
      return pbDiscHTML({ id, level: 'row', group: list, open: state.scanOpen.has(id), cls: 'pb-scan-tr' + (o.dim ? ' is-dim' : ''),
        attrs, summary: cells.join(''), body: detail });
    }
    /* kdIdx: which column is the secondary one a phone-width list drops (default the third) */
    function pbScanHTML(list, cls, heads, label, rowsHtml, kdIdx) {
      const k = kdIdx == null ? 2 : kdIdx;
      return `<div class="pb-scan ${cls}">
          <div class="pb-scan-h" aria-hidden="true">${heads.map((h, i) => `<span${i === k ? ' class="kd-h"' : ''}>${h}</span>`).join('')}</div>
          <div class="pb-scan-body" role="list" aria-label="${escapeHtmlAttr(label)}">${rowsHtml}</div>
          ${pbFbarNoneHTML(list)}
        </div>`;
    }
    function pbScanToggle(list, key) { pbDiscToggle(pbScanId(list, key)); }

    /* ── the three lists ────────────────────────────────────────────────────────────────── */
    /* A rule's status, title and kind — what its row, its search entry and its card say. The status
       is the card's own (pbRuleState): "N to resolve" counts everything the card lists as wrong — open
       questions AND an unconfirmed ASSUMPTION among them — so a row can never say Settled over a card
       that says 1 to resolve. `reds` = how many of those are red (the rule contradicts itself). */
    function pbRuleFacts(r) {
      const s = pbRuleState(r), n = s.todo.length;
      const status = s.sup ? 'Superseded' : n ? 'To resolve' : 'Settled';
      return { title: s.title, status, label: status === 'To resolve' ? n + ' to resolve' : status, todo: n, reds: s.sup ? 0 : s.reds, kind: r.kind || 'decision' };
    }
    function pbLogicFbar(rules) {
      const facts = rules.map(pbRuleFacts);
      const stat = pbCountBy(facts, x => x.status), kinds = pbCountBy(facts.filter(x => x.status !== 'Superseded'), x => x.kind);
      // a superseded rule is history, not work: hidden behind "Show superseded", so Status lists the live states
      return pbFbarHTML('logic', {
        label: 'Filter rules', placeholder: 'Search rules', noun: 'rules', expandAll: true,
        archived: { n: stat.Superseded || 0, label: 'Show superseded' },
        facets: [
          { k: 'status', label: 'Status', opts: ['To resolve', 'Settled'].filter(v => stat[v]).map(v => ({ v, l: v, n: stat[v] })) },
          { k: 'kind', label: 'Kind', opts: Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a] || a.localeCompare(b)).map(v => ({ v, l: v, n: kinds[v] })) },
        ],
      });
    }

    /* The jobs as scan rows. The filter bar is NOT here: IA draws ONE bar above the site map and the list
       (pbIaFilterBar) and it filters both, so the list is only the list. A row carries the job's `title`
       when it has one ("J1 · Cut zones along a drawn path"), else its want; the row opens into the
       job-to-be-done sentence, the roles (one a job cites but meta.roles never declared says so), the
       screens, and the authored `gap` and `source`. */
    function pbJobsScanHTML(jobs) {
      const scr = pbIaScreenName;
      const declared = new Set((((PB_REGISTRY || {}).meta || {}).roles || []).map(r => r.id));
      const rows = jobs.map(j => {
        const n = (j.screens || []).length;
        const label = j.title || pbCap(j.want || j.job || '');
        const actions = (n || VIEW_ONLY) ? '' : `<div class="pb-tags">`
          + `<button class="pb-btn pb-btn--sm" type="button" data-cmd="${escapeHtmlAttr('/pb:plan --ia ' + j.id)}" onclick="openCopyPopover(this.dataset.cmd, this)">Plan a screen</button>`
          + `<button class="pb-btn pb-btn--sm pb-btn--ghost" type="button" data-cmd="${escapeHtmlAttr('/pb:plan --ia ' + j.id + ' --into <screen-id>')}" onclick="openCopyPopover(this.dataset.cmd, this)">Fold into…</button></div>`;
        const roleList = (j.roles || []).map(r => `${pbRoleDot(r)}${pbEscape(pbRoleName(r))}${declared.has(r) ? '' : ' <span class="lg-dim" title="No entry in meta.roles — declare it there, or fix the job">(undeclared)</span>'}`).join(' · ');
        const detail = `<p class="meta-p ia-jtbd">${pbJtbd(j)}</p>
          <dl class="pb-kv">
            ${roleList ? `<dt>Roles</dt><dd>${roleList}</dd>` : ''}
            ${j.priority ? `<dt>Priority</dt><dd>${pbEscape(j.priority)}</dd>` : ''}
            <dt>Screens</dt><dd>${n ? `<span class="pb-tags">${j.screens.map(s => `<span class="pb-tag">${pbEscape(scr(s))}</span>`).join('')}</span>`
              : `<span class="pb-dot pb-dot--open"></span> No screen yet <span class="lg-dim">— place it with <code>/pb:plan --ia ${pbEscape(j.id)} --into &lt;screen-id&gt;</code></span>`}</dd>
            ${j.gap ? `<dt>Gap</dt><dd>${pbRichText(j.gap)}</dd>` : ''}
            ${j.source ? `<dt>Source</dt><dd class="lg-dim">${pbEscape(j.source)}</dd>` : ''}
          </dl>${actions}`;
        return pbScanRowHTML('ia', j.id, [
          `<span class="id">${pbEscape(j.id)}</span>`,
          `<span class="ti" title="${escapeHtmlAttr([j.title, j.want].filter(Boolean).join(' — '))}">${(j.roles || []).map(pbRoleDot).join('')}${pbEscape(label)}</span>`,
          `<span class="kd">${pbEscape(j.priority || '—')}</span>`,
          `<span class="st">${n ? `<span class="pb-dot"></span><span class="w">${n} screen${n > 1 ? 's' : ''}</span>`
            : `<span class="pb-dot pb-dot--open" title="No screen yet"></span><span class="w">No screen</span>`}</span>`,
        ], detail, { hay: pbIaHay(j), vals: { priority: j.priority || '—', screens: n ? 'has' : 'none' }, label: j.title || j.want });
      }).join('');
      return pbScanHTML('ia', 'pb-scan--jobs', ['ID', 'Job', 'Priority', 'Screens'], 'Jobs', rows);
    }

    /* Every test case as one row: the stories' scenarios, then the coverage gaps. `text` is everything
       the search should read (the steps and what is expected as well as the claim); the panel
       re-reads the scenario for what it shows. */
    function pbTcRows() {
      const f = (PB_DATA && PB_DATA.flow) || {};
      const out = [];
      (f.stories || []).forEach((s, si) => (s.scenarios || []).forEach((sc, j) => {
        const h = pbScHead(sc), v = pbScStatus(sc), o = pbScObj(sc) ? sc : {};
        const run = pbScObj(o.test) ? [].concat(o.test.steps || [], o.test.expect || []).map(x => typeof x === 'string' ? x : JSON.stringify(x))
          : [].concat(o.steps || [], o.expect || []).map(String);
        out.push({ key: 's' + si + '-' + j, id: o.id || ('S' + (si + 1) + '.' + (j + 1)),
                   head: h.head, text: [h.text, h.head === h.text ? '' : h.head].concat(run).filter(Boolean).join(' '),
                   story: s.title || '', st: v.st, glyph: v.glyph, label: v.label });
      }));
      (f.coverageWarnings || []).forEach((w, i) => {
        const o = (typeof w === 'string') ? { note: w } : (w || {});
        const settled = GAP_SETTLED[o.status];
        out.push({ key: 'g' + i, id: 'G' + (i + 1), head: o.title || pbGapHead(o.note || ''), text: o.note || '',
                   story: 'Coverage gap', st: settled ? 'settled' : 'gap', glyph: '⚑', label: settled || 'Coverage gap' });
      });
      return out;
    }
    // The result column's words, in the order the chip lists them.
    const PB_TC_RESULT = { pass: 'Passed', fail: 'Failed', blocked: 'Blocked', stale: 'Stale', retired: 'Retired', ubd: 'Untested by design',
      untested: 'Not run', manual: 'Manual', gap: 'Gap', settled: 'Settled' };
    function pbTcScanHTML() {
      const rows = pbTcRows();
      const res = pbCountBy(rows, r => PB_TC_RESULT[r.st] || r.st), stories = pbCountBy(rows.filter(r => r.st !== 'retired'), r => r.story || '—');
      const resOrder = Object.keys(PB_TC_RESULT).map(k => PB_TC_RESULT[k]).filter(v => res[v]);
      const body = rows.map(r => pbScanRowHTML('tc', r.key, [
          `<span class="id">${pbEscape(r.id)}</span>`,
          `<span class="ti" title="${escapeHtmlAttr(r.head)}">${pbEscape(r.head)}</span>`,
          `<span class="kd" title="${escapeHtmlAttr(r.story)}">${pbEscape(r.story)}</span>`,
          `<span class="st" title="${escapeHtmlAttr(r.label)}"><span class="pb-test-glyph pb-test-glyph--${r.st}" aria-hidden="true">${r.glyph}</span><span class="w">${pbEscape(PB_TC_RESULT[r.st] || r.label)}</span></span>`,
        // a test case's detail is the long part of the page, so it is drawn when its row first opens
        ], pbDiscIsOpen(pbScanId('tc', r.key)) ? pbTcPanel(r.key) : '',
        { hay: [r.id, r.head, r.text, r.story, r.label].join(' '), vals: { result: PB_TC_RESULT[r.st] || r.st, story: r.story || '—' }, label: r.head,
          dim: r.st === 'settled' || r.st === 'retired', archived: r.st === 'retired' })).join('');
      // the bar after the rows: the group's Expand all names what it will do from the rows built above.
      // A retired case no longer applies: hidden behind "Show retired", so Result lists the live results.
      const fbar = pbFbarHTML('tc', {
        label: 'Filter test cases', placeholder: 'Search test cases', noun: 'test cases', expandAll: true,
        archived: { n: res[PB_TC_RESULT.retired] || 0, label: 'Show retired' },
        facets: [
          { k: 'result', label: 'Result', opts: resOrder.filter(v => v !== PB_TC_RESULT.retired).map(v => ({ v, l: v, n: res[v] })) },
          { k: 'story', label: 'Story', opts: Object.keys(stories).map(v => ({ v, l: v, n: stories[v] })) },
        ],
      });
      return fbar + pbScanHTML('tc', 'pb-scan--tc', ['ID', 'Scenario', 'Story', 'Last result'], 'Test cases', body);
    }

    /* ── Content ──────────────────────────────────────────────────────────────
       Two authored halves of one thing: the words the product uses.

       `terms` is the glossary — what a domain word means, what else the team says for
       it (`aka`), and what it is deliberately never called (`avoid`). `strings` is the
       wording deck — the canonical text for an action, a status, a message, so two
       screens never phrase the same thing two ways.

       BOTH halves are hand-authored; nothing derives them. So the only check this view
       can honestly run is authored-vs-authored (D-08 Kind A): a wording that uses a word
       another term banned, and a term pointing at a rule Logic does not declare. Usage
       ("which screen actually says this") would have to come from the render bodies via
       logic_extract.py; until it does, this view does not pretend to know it.
       ───────────────────────────────────────────────────────────────────────── */
    const CT_KINDS = [
      ['action', 'Actions'], ['status', 'Statuses'], ['label', 'Labels'], ['title', 'Titles'],
      ['empty', 'Empty states'], ['toast', 'Toasts'], ['error', 'Errors'],
    ];

    function pbSetContentView(v) { state.contentView = v; renderMetaFlow(); }
    function pbContentFilter(inp) {
      const q = (inp.value || '').toLowerCase();
      document.querySelectorAll('#content-body [data-ck]').forEach(r => { r.hidden = q && r.dataset.ck.indexOf(q) === -1; });
      document.querySelectorAll('#content-body .ct-group').forEach(g => { g.hidden = !g.querySelector('[data-ck]:not([hidden])'); });
    }

    function pbContentDrift(C) {
      const terms = C.terms || [], strings = C.strings || [];
      const rules = (window.PB_LOGIC || {}).rules || [];
      const out = [];
      // Every banned word, once, with the term that banned it.
      const banned = [];
      terms.forEach(t => (t.avoid || []).forEach(a => {
        if (a) banned.push({ word: String(a), lc: String(a).toLowerCase(), term: t.term || t.id || '' });
      }));
      const scan = (text, label) => {
        const lc = String(text || '').toLowerCase();
        banned.forEach(b => {
          if (lc.indexOf(b.lc) !== -1) {
            out.push(`${label} says “${pbEscape(text)}” — <strong>${pbEscape(b.word)}</strong> is on ${pbEscape(b.term)}’s do-not-use list`);
          }
        });
      };
      strings.forEach(s => scan(s.text, `<code>${pbEscape(s.key || '')}</code>`));
      // A rule's state labels are user-visible wording too, and they are the wording most likely
      // to drift: a rule is transcribed from a spec once and then nothing re-reads it. Checking
      // them here is what makes the glossary load-bearing rather than a second place to look.
      rules.forEach(r => {
        (r.states || []).forEach(s => scan(s.label, `Rule <strong>${pbEscape(r.title || r.id)}</strong> · state <code>${pbEscape(s.key || '')}</code>`));
        (r.overlays || []).forEach(o => scan(o.label, `Rule <strong>${pbEscape(r.title || r.id)}</strong> · overlay <code>${pbEscape(o.key || '')}</code>`));
      });
      // Only meaningful once rules exist; a project with none would otherwise flag every link.
      if (rules.length) {
        const ruleIds = rules.map(r => r.id);
        terms.forEach(t => {
          if (t.rule && ruleIds.indexOf(t.rule) === -1) {
            out.push(`<strong>${pbEscape(t.term || t.id || '')}</strong> points at rule <code>${pbEscape(t.rule)}</code>, which Logic does not declare`);
          }
        });
      }
      return out;
    }

    function pbRenderContentTerms(C) {
      const terms = C.terms || [];
      if (!terms.length) {
        return `<p class="meta-p lg-dim">No definitions yet. A definition fixes what one domain word means — and what it is never called — so the rules, the screens and the spec all say the same thing.</p>`;
      }
      const ruleTitle = id => ((((window.PB_LOGIC || {}).rules) || []).find(r => r.id === id) || {}).title;
      return `<div class="ct-terms">` + terms.map(t => {
        const key = [t.term, t.en, t.definition, (t.aka || []).join(' ')].join(' ').toLowerCase();
        return `<div class="ct-term" data-ck="${pbEscape(key)}">
          <div class="ct-term-h">
            <strong>${pbEscape(t.term || t.id || '')}</strong>
            ${t.en ? `<span class="ct-en">${pbEscape(t.en)}</span>` : ''}
          </div>
          <p class="ct-def">${pbEscape(t.definition || '')}</p>
          ${(t.aka || []).length ? `<div class="ct-line"><span class="lg-dim">also called</span> ${t.aka.map(a => `<span class="ct-aka">${pbEscape(a)}</span>`).join('')}</div>` : ''}
          ${(t.avoid || []).length ? `<div class="ct-line"><span class="lg-dim">never</span> ${t.avoid.map(a => `<span class="ct-avoid">${pbEscape(a)}</span>`).join('')}</div>` : ''}
          ${t.rule ? `<div class="ct-line ct-rule-line"><span class="lg-dim">rule</span> <a class="lg-link ct-rule" href="#" data-lg-rule="${escapeHtmlAttr(t.rule)}" onclick="pbLogicGoRule(this.dataset.lgRule);return false">${pbEscape(ruleTitle(t.rule) || t.rule)} →</a></div>` : ''}
        </div>`;
      }).join('') + `</div>`;
    }

    function pbRenderContentStrings(C) {
      const strings = C.strings || [];
      if (!strings.length) {
        return `<p class="meta-p lg-dim">No wordings yet. A wording is the canonical text for one action, status or message — write it once here and every screen that needs it reads the same string.</p>`;
      }
      const seen = {};
      strings.forEach(s => { seen[s.kind || 'other'] = 1; });
      // Known kinds first, in the order above; anything else keeps its own name rather than
      // being dropped — an unknown kind is an authoring choice, not an error.
      const groups = CT_KINDS.filter(([k]) => seen[k])
        .concat(Object.keys(seen).filter(k => !CT_KINDS.some(([c]) => c === k)).map(k => [k, k]));
      return groups.map(([kind, label]) => {
        const rows = strings.filter(s => (s.kind || 'other') === kind);
        return `<div class="ct-group">
          <div class="ct-group-h">${pbEscape(label)} <span class="meta-subtab-count">${rows.length}</span></div>
          <table class="lg-table ct-table"><tbody>${rows.map(s => `
            <tr data-ck="${pbEscape(((s.key || '') + ' ' + (s.text || '') + ' ' + (s.note || '')).toLowerCase())}">
              <td class="ct-key"><code>${pbEscape(s.key || '')}</code></td>
              <td class="ct-text">${pbEscape(s.text || '')}</td>
              <td class="ct-note">${pbEscape(s.note || '')}</td>
            </tr>`).join('')}</tbody></table>
        </div>`;
      }).join('');
    }

    function pbRenderContent() {
      const C = (PB_DATA && PB_DATA.content) || {};
      const terms = C.terms || [], strings = C.strings || [];
      if (!terms.length && !strings.length) {
        return pbUxEmpty('No content yet',
          'One place for the words the product uses: what each domain term means, and the canonical wording for every action, status and message — so the same thing never gets called two names across screens.',
          'Define the vocabulary', '/pb:clarify');
      }
      if (!state.contentView) state.contentView = terms.length ? 'terms' : 'strings';
      const v = state.contentView;
      const drift = pbContentDrift(C);
      return `<div class="meta-section">
          <div class="meta-h2">3.5 Content</div>
          <p class="meta-p" style="color:var(--text-tertiary)">The words the product uses, written down once. <strong>Definitions</strong> fix what each domain term means — and what it is never called. <strong>Wordings</strong> hold the canonical text for every action, status and message, so two screens never phrase the same thing two ways.</p>
          <div class="lg-views">
            <button class="lg-view ${v === 'terms' ? 'active' : ''}" onclick="pbSetContentView('terms')">Definitions <span class="meta-subtab-count">${terms.length}</span></button>
            <button class="lg-view ${v === 'strings' ? 'active' : ''}" onclick="pbSetContentView('strings')">Wordings <span class="meta-subtab-count">${strings.length}</span></button>
            <input class="ct-filter" type="search" placeholder="Filter…" oninput="pbContentFilter(this)">
          </div>
          ${drift.length ? `<div class="pb-qa-warn">
            <div class="pb-qa-warn-head">⚠ Wording conflicts (${drift.length})</div>
            <ul class="pb-qa-warn-list">${drift.map(d => `<li>${d}</li>`).join('')}</ul>
          </div>` : ''}
          <div id="content-body">${v === 'terms' ? pbRenderContentTerms(C) : pbRenderContentStrings(C)}</div>
        </div>`;
    }

    function renderMetaFlow() {
      const populated = !!(PB_DATA.flow && PB_DATA.flow.populated);
      const header = pbPageHeader({ title: 'UX Design', infoKey: 'flow' });
      const uxTabs = pbUxSubtabs();
      const view = pbUxView();

      if (view === 'ia' || view === 'logic' || view === 'tests' || view === 'content') {
        // Tests owns its own height like IA does: the split's two columns scroll independently, so
        // reading a 2,400-character case never drags the list you are working through out of view.
        const body = view === 'ia' ? pbRenderIA()
          : view === 'logic' ? `<div class="summary-scroll">${pbRenderLogic()}</div>`
          : view === 'content' ? `<div class="summary-scroll">${pbRenderContent()}</div>`
          : pbRenderTestCases();
        $('#app').innerHTML = `
          <div class="pb-page pb-page--viewport">
            ${header}
            <div class="pb-content pb-content--fill ux-scroll-wrap">
              ${uxTabs}
              ${body}
            </div>
          </div>`;
        pbFbarApplyAll();
        // The site map is a pan/zoom canvas like the flow and the ERD, so it needs the same init.
        // Dimensions ride on the stage rather than being recomputed here — the layout that knows
        // them is the only thing that should own them.
        const st = view === 'ia' && document.getElementById('iamap-stage');
        if (st) initCanvas('iamap', parseInt(st.dataset.w, 10) || 1200, parseInt(st.dataset.h, 10) || 600, 0.45, { modWheel: true });
        return;
      }

      if (!populated) {
        $('#app').innerHTML = `
          <div class="pb-page pb-page--viewport">
            ${header}
            <div class="pb-content pb-content--fill ux-scroll-wrap">
              ${uxTabs}
              <div class="summary-scroll">${renderEmptyState({
                icon: EMPTY_STATE_ICONS.flow,
                title: 'No user flow yet',
                body: 'Build your user flow from the project spec. Claude generates one combined left-to-right Mermaid flowchart that covers every job in Information Architecture (including edge cases).',
                ctaLabel: 'Generate user flow', command: '/pb:plan --flow',
              })}</div>
            </div>
          </div>`;
        return;
      }

      $('#app').innerHTML = `
        <div class="pb-page pb-page--viewport">
          ${header}
          <div class="pb-content pb-content--fill ux-scroll-wrap">
            ${uxTabs}
            <div class="ux-flow-body">${renderFlowPopulated()}</div>
          </div>
        </div>
      `;
      // v0.3.9 — once /pb:plan --flow rewrites renderFlowPopulated
      // to stack multiple Mermaid flows inside #flow-stage, this init renders them all,
      // strips intrinsic widths, measures the natural content size of the stage, and
      // hands off to initCanvas('flow', W, H) so the user gets pan + zoom over every
      // flow at once. Falls back to the legacy buildFlowSvg() init for pre-v0.3.9 templates.
      if (populated && window.mermaid && document.querySelector('#flow-stage .mermaid')) {
        mermaid.initialize(pbMermaidConfig('flow'));
        mermaid.run({ querySelector: '#flow-stage .mermaid' }).then(function () {
          var stage = document.getElementById('flow-stage');
          if (!stage) return;
          stage.classList.add('flow-stage-flow');
          Array.from(stage.querySelectorAll('svg')).forEach(function(svg){
            svg.style.maxWidth = 'none';
            svg.removeAttribute('width');
            svg.removeAttribute('height');
            svg.style.width = '';
            svg.style.height = '';
          });
          // v0.3.12 — apply 24px corner radius to rectangle shapes (Action, Subprocess).
          // Mermaid's classDef rx/ry isn't honored on rectangles in current versions —
          // set the SVG attribute directly post-render. Stadiums (Start/End) keep
          // their fully-rounded ends; polygons (Decision/Input) can't be rounded.
          stage.querySelectorAll('.node.cAction > rect, .node.cSubprocess > rect').forEach(function(rect){
            rect.setAttribute('rx', '24');
            rect.setAttribute('ry', '24');
          });
          // Recolor nodes by detected shape to the wireflow legend palette (start/end black ·
          // decision yellow · input purple · action blue · subprocess grey).
          pbStyleFlowNodes(stage);
          // Re-route connectors as straight orthogonal lines anchored at node side-centers.
          pbOrthogonalizeFlowEdges(stage);
          // v0.3.14 — Wireflow decorations: click-to-preview + numbered note badges.
          stage.style.width = 'auto';
          stage.style.height = 'auto';
          stage.style.marginLeft = '0';
          stage.style.marginTop = '0';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var bbox = stage.getBoundingClientRect();
              var W = Math.max(1024, Math.ceil(bbox.width));
              var H = Math.max(720,  Math.ceil(bbox.height));
              stage.style.width = W + 'px';
              stage.style.height = H + 'px';
              stage.style.marginLeft = -(W/2) + 'px';
              stage.style.marginTop  = -(H/2) + 'px';
              initCanvas('flow', W, H);
            });
          });
        }).catch(function(){ /* silent */ });
      } else if (populated && document.getElementById('flow-canvas')) {
        initCanvas('flow', 1200, 380);
      }
    }

    function renderFlowPopulated() {
      const f = (PB_DATA && PB_DATA.flow) || {};
      const fStories = f.stories || [];
      if (!f.mermaid && !(f.flows && f.flows.length) && f.html) {
        return `<div class="pb-main">${f.html}</div><aside class="pb-aside"><p class="pb-aside-empty">Legacy flow.</p></aside>`;
      }
      // Multi-flow: prefer f.flows[]; fall back to the single f.mermaid.
      const flows = (f.flows && f.flows.length) ? f.flows
                  : (f.mermaid ? [{ name: 'Main flow', mermaid: f.mermaid }] : []);
      const idx = Math.min(state.flowIndex || 0, Math.max(0, flows.length - 1));
      const current = flows[idx];
      const dropdown = flows.length > 1
        ? `<select class="pb-flow-select" onchange="setFlowIndex(this.value)">`
          + flows.map((fl, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${pbEscape(fl.name || ('Flow ' + (i + 1)))}</option>`).join('')
          + `</select>`
        : `<span class="pb-flow-name">${pbEscape((current && current.name) || 'User flow')}</span>`;
      const stage = current ? `<div class="mermaid">${current.mermaid}</div>` : buildFlowSvg();

      // 2.2 — hovering a story highlights the flow path that satisfies it (and dims the rest).
      // Stories are phrased as JTBDs (s.jtbd) — the same jobs Information Architecture lists —
      // so this panel is that job list, filtered down to "which flow satisfies it".
      const storiesList = fStories.length
        ? '<ol class="flow-doc-stories flow-doc-stories--interactive">' + fStories.map((s, i) =>
            `<li data-story-idx="${i}" onmouseenter="pbFlowHighlight(${i}, true)" onmouseleave="pbFlowHighlight(${i}, false)">`
            + `<strong>${pbEscape(s.title||'')}${s.priority?' ('+pbEscape(s.priority)+')':''}</strong>`
            + (s.jtbd ? ` — ${pbEscape(s.jtbd)}` : '')
            + (s.path ? `<div class="flow-doc-path"><em>Path:</em> ${pbEscape(s.path)}</div>` : '') + '</li>').join('') + '</ol>'
        : '<p class="flow-doc-side-sub">No user stories yet.</p>';

      const legendBtn = `
        <button class="flow-doc-legend-btn" type="button" aria-label="Show legend" onclick="openLegendPopover(this)">
          <span class="flow-doc-legend-swatch flow-doc-swatch-start"></span>
          <span class="flow-doc-legend-swatch flow-doc-swatch-decision"></span>
          <span class="flow-doc-legend-swatch flow-doc-swatch-action"></span>
          <span class="flow-doc-legend-swatch flow-doc-swatch-subprocess"></span>
          <span class="flow-doc-legend-label">Legend</span>
          <span class="flow-doc-legend-q" aria-hidden="true">?</span>
        </button>`;

      const main = `
        <div class="pb-main flow-main-col">
          <div class="flow-canvas flow-canvas--fill" id="flow-canvas">
            <div class="flow-main-bar">
              <div class="flow-main-bar-left">${dropdown}</div>
              ${legendBtn}
            </div>
            <div class="flow-viewport" id="flow-viewport">
              <div class="flow-stage" id="flow-stage">${stage}</div>
            </div>
            <div class="flow-zoom-controls">
              <button class="flow-zoom-btn" id="flow-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
              <button class="flow-zoom-btn" id="flow-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
              <button class="flow-zoom-btn" id="flow-zoom-fit" title="Fit / reset" aria-label="Fit / reset">⊙</button>
            </div>
            <div class="flow-zoom-readout" id="flow-zoom-readout">100%</div>
            <div class="flow-hint">Scroll to zoom · drag to pan</div>
          </div>
        </div>`;

      const aside = `
        <aside class="pb-aside">
          <div class="meta-h3" style="margin:0 0 12px">User stories <span class="meta-subtab-count">${fStories.length}</span></div>
          ${storiesList}
        </aside>`;

      return main + aside;
    }

    /* 2.2 — story → flow-path highlight. Resolve the story's node ids (explicit story.nodes,
       else parse story.path tokens) and match them against the rendered Mermaid node labels,
       then emphasise those nodes + the edges between them and dim everything else. */
    function pbFlowStoryTokens(story) {
      if (story.nodes && story.nodes.length) return story.nodes.map(String);
      return (story.path || '').split(/\s*(?:→|->|,|·|>|\/)\s*/).map(s => s.trim()).filter(Boolean);
    }
    function pbFlowHighlight(idx, on) {
      const stage = document.getElementById('flow-stage');
      if (!stage) return;
      if (!on) {
        stage.classList.remove('flow-dim');
        stage.querySelectorAll('.flow-hl').forEach(e => e.classList.remove('flow-hl'));
        return;
      }
