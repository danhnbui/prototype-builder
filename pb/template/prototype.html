      const stories = (PB_DATA.flow && PB_DATA.flow.stories) || [];
      const story = stories[idx];
      if (!story) return;
      const tokens = pbFlowStoryTokens(story).map(t => t.toLowerCase());
      if (!tokens.length) return;
      const matchedIds = {};
      let any = false;
      stage.querySelectorAll('g.node').forEach(n => {
        const txt = (n.textContent || '').trim().toLowerCase();
        if (!txt) return;
        const hit = tokens.some(t => t === txt || t.indexOf(txt) >= 0 || txt.indexOf(t) >= 0);
        if (hit) {
          n.classList.add('flow-hl'); any = true;
          const id = (n.id || '').replace(/^flowchart-/, '').replace(/-\d+$/, '');
          if (id) matchedIds[id] = 1;
        }
      });
      if (!any) return;
      stage.classList.add('flow-dim');
      // Highlight edges connecting two matched nodes (Mermaid tags edge paths LS-<from> LE-<to>).
      stage.querySelectorAll('path.flowchart-link, .edgePaths path, .edgePath path').forEach(p => {
        const cl = p.getAttribute('class') || '';
        const from = (cl.match(/LS-([^\s]+)/) || [])[1];
        const to   = (cl.match(/LE-([^\s]+)/) || [])[1];
        if (from && to && matchedIds[from] && matchedIds[to]) p.classList.add('flow-hl');
      });
    }

    /* Wireflow node colours. There is no table here any more: the diagram's palette is the tool's own
       canvas tokens (chrome.css --pb-node-*, --pb-edge-*, --pb-erd-*; a light-dark() pair each), resolved
       to plain colours by pbCanvasPalette() once per paint — a script cannot read a pair back from
       getComputedStyle. The flow paints from it and repaints on the window event `pb:themechange`, so it
       follows the theme exactly as the rest of the tool does. The shape names are the legend's:
       start (start/end) · process (the purple parallelogram) · decision · screen · external (subprocess,
       external, data). */
    function pbIsDiamond(poly) {
      const pts = (poly.getAttribute('points') || '').trim().split(/\s+/).map(p => {
        const xy = p.split(','); return { x: parseFloat(xy[0]), y: parseFloat(xy[1]) };
      }).filter(p => !isNaN(p.x) && !isNaN(p.y));
      if (pts.length < 3) return false;
      const minY = Math.min.apply(null, pts.map(p => p.y));
      // A diamond has a single vertex at the top edge; a parallelogram has two.
      return pts.filter(p => Math.abs(p.y - minY) < 1).length === 1;
    }
    /* Which of the five shapes is this Mermaid node? Reads the geometry, and — for a subprocess and a
       rounded screen — reshapes it. It runs once per node: the answer is kept on the node as
       data-pb-shape, because the reshaping destroys what the question reads (a subprocess's outer
       bracket points are stripped, after which it looks like a plain parallelogram). */
    function pbFlowClassify(node) {
      const circle = node.querySelector('circle, ellipse');
      const poly   = node.querySelector('polygon');
      const rect   = node.querySelector('rect');
      const path   = node.querySelector('path');
      const lines  = node.querySelectorAll('line').length;
      let key = null;
      if (poly) {
        key = pbIsDiamond(poly) ? 'decision' : 'process';
        // Subprocess [[...]] renders as a 10-point double-rectangle polygon — strip the outer bracket
        // points so only the clean inner rect remains (removes the vertical "lines" on both sides).
        // The point count is also the only thing telling subprocess apart from a real input:
        // Mermaid emits [[ ]] as 10 points and [/ /] as 4, both as a <polygon> with no <line>s,
        // so the `rect && lines >= 2` branch below never fires and a subprocess node would be
        // painted input-purple while the legend promises subprocess-grey.
        if (key === 'process') {
          const pts = (poly.getAttribute('points') || '').trim().split(/\s+/);
          if (pts.length >= 8) { key = 'external'; poly.setAttribute('points', pts.slice(0, 4).join(' ')); }
        }
      }
      else if (circle) key = 'start';
      else if (rect) {
        if (lines >= 2) key = 'external'; // subroutine [[ ]]
        else {
          const h  = parseFloat(rect.getAttribute('height')) || 0;
          const rx = parseFloat(rect.getAttribute('rx')) || 0;
          if (rx > 0 && rx >= h / 2 - 2) key = 'start';       // stadium ([ ])
          else { key = 'screen'; rect.setAttribute('rx', '16'); rect.setAttribute('ry', '16'); }
        }
      } else if (path) key = 'external'; // cylinder / other
      return key;
    }
    /* Paint every classified node from a palette. Idempotent: a theme change calls it again. */
    function pbPaintFlowNodes(stage, pal) {
      stage.querySelectorAll('g.node[data-pb-shape]').forEach(node => {
        const c = pal.node[node.getAttribute('data-pb-shape')];
        if (!c) return;
        node.querySelectorAll('rect, polygon, circle, ellipse, path').forEach(el => {
          el.style.fill = c.fill; el.style.stroke = c.stroke;
        });
        node.querySelectorAll('line').forEach(el => { el.style.display = 'none'; });
        node.querySelectorAll('.nodeLabel, .nodeLabel *, foreignObject div, text, text tspan').forEach(t => {
          t.style.color = c.text; t.style.fill = c.text;
        });
      });
    }
    /* Recolor each Mermaid node by its detected shape so the flow matches the legend regardless of
       whether classDefs were authored. */
    function pbStyleFlowNodes(stage) {
      if (!stage) return;
      stage.querySelectorAll('g.node').forEach(node => {
        if (node.hasAttribute('data-pb-shape')) return;
        const key = pbFlowClassify(node);
        if (key) node.setAttribute('data-pb-shape', key);
      });
      pbPaintFlowNodes(stage, pbCanvasPalette());
    }
    /* Mermaid bakes its theme into each SVG's own <style> when it renders, so a theme change needs the
       NEXT render to be configured from the current palette. Variables are resolved colours, never
       var(): Mermaid derives its other shades from them (lighten / darken) and has to parse them.
       'flow' and 'erd' differ only in which canvas tokens they read. */
    /* The size of a --pb-t-* step as a resolved length ("14px"): Mermaid does arithmetic on it, so it cannot take var(). */
    function pbTypePx(step) {
      const probe = document.createElement('i');
      probe.setAttribute('aria-hidden', 'true');
      probe.style.cssText = 'display:none;font-size:var(--pb-t-' + step + ')';
      document.documentElement.appendChild(probe);
      const px = getComputedStyle(probe).fontSize;
      probe.remove();
      return px;
    }
    function pbMermaidConfig(kind) {
      const pal = pbCanvasPalette();
      const tv = { fontFamily: 'var(--pb-font)', fontSize: pbTypePx('md'), darkMode: pal.dark, background: pal.canvas.bg };
      if (kind === 'erd') {
        Object.assign(tv, {
          primaryColor: pal.erd.head, primaryTextColor: pal.erd.headText, primaryBorderColor: pal.erd.stroke,
          secondaryColor: pal.erd.fill, tertiaryColor: pal.canvas.bg,
          mainBkg: pal.erd.head, nodeBorder: pal.erd.stroke, lineColor: pal.erd.line, textColor: pal.erd.text,
          attributeBackgroundColorOdd: pal.erd.fill, attributeBackgroundColorEven: pal.erd.rowAlt
        });
        return { startOnLoad: false, theme: 'base', themeVariables: tv };
      }
      Object.assign(tv, {
        primaryColor: pal.node.external.fill, primaryTextColor: pal.node.external.text, primaryBorderColor: pal.node.external.stroke,
        secondaryColor: pal.node.screen.fill, tertiaryColor: pal.canvas.bg,
        lineColor: pal.edge.def, textColor: pal.canvas.ink
      });
      return {
        startOnLoad: false, theme: 'base',
        flowchart: { curve: 'linear', htmlLabels: true, padding: 18, useMaxWidth: false, nodeSpacing: 50, rankSpacing: 90 },
        themeVariables: tv
      };
    }
    /* Repaint the open flow in place — no re-layout, so the pan and zoom you had are kept. */
    function pbRepaintFlow() {
      const stage = document.getElementById('flow-stage');
      if (!stage || !stage.querySelector('svg')) return;
      const pal = pbCanvasPalette();
      pbPaintFlowNodes(stage, pal);
      pbPaintFlowEdges(stage, pal);
    }
    /* The ERD is different: its colours live in the SVG's own <style>, so it is rendered again, from the
       same source, under the new theme. Only when the diagram is on screen. */
    window.addEventListener('pb:themechange', function () {
      try {
        if (state.metaView === 'flow') pbRepaintFlow();
        else if (state.metaView === 'erd' && document.getElementById('erd-diagram')) renderMetaERD();
      } catch (e) { /* a repaint never takes the page down */ }
    });

    /* Blueprint-style edges: re-route every connector as straight orthogonal segments anchored at
       the 4 side-centers (left/right/top/bottom) of each node — like a Figma/FigJam board. Forward
       edges run straight (or a right-angle Z when ranks differ); back-edges route under both nodes. */
    function pbFlowNodeGeom(stage) {
      const geom = {};
      stage.querySelectorAll('g.node').forEach(node => {
        const id = (node.id || '').replace(/^flowchart-/, '').replace(/-\d+$/, '');
        if (!id) return;
        const tr = (node.getAttribute('transform') || '').match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
        const shape = node.querySelector('rect, polygon, circle, ellipse, path');
        if (!tr || !shape) return;
        let bb; try { bb = shape.getBBox(); } catch (e) { return; }
        geom[id] = { cx: parseFloat(tr[1]), cy: parseFloat(tr[2]), hw: bb.width / 2, hh: bb.height / 2 };
      });
      return geom;
    }
    function pbOrthoRoute(S, T) {
      const gap = 28;
      const dx = T.cx - S.cx;
      if (dx >= 0) {
        // forward — exit source right-center, enter target left-center
        const sx = S.cx + S.hw, sy = S.cy, tx = T.cx - T.hw, ty = T.cy;
        if (Math.abs(sy - ty) < 2) return { d: `M${sx},${sy} L${tx},${ty}`, lx: (sx + tx) / 2, ly: sy - 12 };
        const mx = (sx + tx) / 2;
        return { d: `M${sx},${sy} L${mx},${sy} L${mx},${ty} L${tx},${ty}`, lx: mx, ly: (sy + ty) / 2 - 10 };
      }
      // back-edge — exit source bottom-center, run under both, enter target bottom-center
      const sx = S.cx, sy = S.cy + S.hh, tx = T.cx, ty = T.cy + T.hh;
      const ry = Math.max(sy, ty) + gap;
      return { d: `M${sx},${sy} L${sx},${ry} L${tx},${ry} L${tx},${ty}`, lx: (sx + tx) / 2, ly: ry - 10 };
    }
    /* Decision-branch edge colors: Yes → green, No → red, everything else → the default connector ink.
       Solid lines. The colours are the canvas tokens (--pb-edge-yes / -no / -def, and -label for an
       unnamed edge's text) — Yes/No keep their green and red in both themes, re-grounded for the dark paper. */
    const PB_FLOW_MARK = { yes: 'pb-arrow-green', no: 'pb-arrow-red', def: 'pb-arrow-dark' };
    function pbFlowMarker(svg, key, color) {
      const NS = 'http://www.w3.org/2000/svg', id = PB_FLOW_MARK[key];
      let m = svg.querySelector('#' + id);
      if (!m) {
        let defs = svg.querySelector('defs');
        if (!defs) { defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
        m = document.createElementNS(NS, 'marker');
        m.setAttribute('id', id); m.setAttribute('viewBox', '0 0 10 10');
        m.setAttribute('refX', '8'); m.setAttribute('refY', '5');
        m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7'); m.setAttribute('orient', 'auto');
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', 'M0,1 L9,5 L0,9 z');
        m.appendChild(path); defs.appendChild(m);
      }
      m.firstElementChild.setAttribute('fill', color);
      return 'url(#' + id + ')';
    }
    /* Paint every routed edge, its arrowhead and its label from a palette. Idempotent, like the nodes. */
    function pbPaintFlowEdges(stage, pal) {
      const svg = stage.querySelector('svg'); if (!svg) return;
      ['yes', 'no', 'def'].forEach(k => pbFlowMarker(svg, k, pal.edge[k]));
      stage.querySelectorAll('[data-pb-edge]').forEach(p => { p.style.stroke = pal.edge[p.getAttribute('data-pb-edge')]; });
      stage.querySelectorAll('[data-pb-edge-label]').forEach(lab => {
        const k = lab.getAttribute('data-pb-edge-label'), col = k === 'def' ? pal.edge.label : pal.edge[k];
        lab.querySelectorAll('text, tspan, foreignObject div, span').forEach(t => { t.style.fill = col; t.style.color = col; });
      });
    }
    function pbOrthogonalizeFlowEdges(stage) {
      if (!stage) return;
      const svg = stage.querySelector('svg'); if (!svg) return;
      const geom = pbFlowNodeGeom(stage);
      const paths = Array.prototype.slice.call(stage.querySelectorAll('.edgePaths path'));
      const labels = Array.prototype.slice.call(stage.querySelectorAll('.edgeLabels .edgeLabel'));
      // Match each non-empty label to its edge by ORIGINAL proximity (before we rewrite paths) —
      // Mermaid emits multiple label nodes in an order that doesn't track the path order.
      const pmid = paths.map(p => { const r = p.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; });
      const labelsByPath = {}, textByPath = {};
      labels.forEach(lab => {
        const t = (lab.textContent || '').trim(); if (!t) return;
        const r = lab.getBoundingClientRect(); const lx = r.left + r.width / 2, ly = r.top + r.height / 2;
        let best = 0, bd = Infinity;
        pmid.forEach((m, idx) => { const dd = (m.x - lx) * (m.x - lx) + (m.y - ly) * (m.y - ly); if (dd < bd) { bd = dd; best = idx; } });
        (labelsByPath[best] = labelsByPath[best] || []).push(lab);
        if (!textByPath[best]) textByPath[best] = t;
      });
      const pal = pbCanvasPalette();
      const mk = { yes: pbFlowMarker(svg, 'yes', pal.edge.yes), no: pbFlowMarker(svg, 'no', pal.edge.no), def: pbFlowMarker(svg, 'def', pal.edge.def) };
      paths.forEach((p, i) => {
        const cl = p.getAttribute('class') || '';
        const from = (cl.match(/LS-([^\s"]+)/) || [])[1];
        const to   = (cl.match(/LE-([^\s"]+)/) || [])[1];
        const S = geom[from], T = geom[to];
        if (!S || !T) return;
        const r = pbOrthoRoute(S, T);
        const lt = (textByPath[i] || '').toLowerCase();
        const key = lt === 'yes' ? 'yes' : lt === 'no' ? 'no' : 'def';
        // Hide unlabeled back-edges (black lines routing backward) — keep Yes/No decision branches
        if (T.cx - S.cx < 0 && key === 'def') {
          p.style.display = 'none';
          (labelsByPath[i] || []).forEach(lab => { lab.style.display = 'none'; });
          return;
        }
        p.setAttribute('d', r.d);
        p.setAttribute('data-pb-edge', key);       // what the theme repaint reads
        p.style.strokeWidth = '2';
        p.style.fill = 'none'; p.style.strokeDasharray = 'none';
        p.setAttribute('marker-end', mk[key]);
        (labelsByPath[i] || []).forEach(lab => {
          lab.setAttribute('transform', `translate(${r.lx},${r.ly})`);
          lab.setAttribute('data-pb-edge-label', key);
          lab.querySelectorAll('rect').forEach(r2 => { r2.style.fill = 'transparent'; r2.setAttribute('fill', 'transparent'); });
          lab.querySelectorAll('text, tspan, foreignObject div, span').forEach(t => {
            t.style.fontWeight = '700';
            t.style.backgroundColor = 'transparent';
          });
        });
      });
      pbPaintFlowEdges(stage, pal);
      // Back-edges route below the nodes, often past Mermaid's original viewBox (which clips,
      // since the SVG is overflow:hidden) — grow the viewBox to fit the full rerouted geometry.
      try {
        const bb = svg.getBBox();
        const pad = 14;
        svg.setAttribute('viewBox', `${bb.x - pad} ${bb.y - pad} ${bb.width + pad * 2} ${bb.height + pad * 2}`);
      } catch (e) { /* getBBox can throw if detached — ignore */ }
    }

    /* Tiny example flow: START → SCREEN → DECISION → END.
       Replace this with your prototype's actual flow. */
    function buildFlowSvg() {
      var W=1200, H=380, Y=190;
      var xS=80, xScr=350, xD=620, xEndScr=900, xE=1140;
      var RW=140, RH=50, DW=72, DH=46, CR=24;
      // Every colour is a canvas token (chrome.css), so the fallback follows the theme like the flow it stands in for.
      var C_SCR='var(--pb-node-screen-fill)', T_SCR='var(--pb-node-screen-text)',
          C_DEC='var(--pb-node-decision-fill)', T_DEC='var(--pb-node-decision-text)',
          C_TRM='var(--pb-node-start-fill)', T_TRM='var(--pb-node-start-text)',
          C_GRN='var(--pb-edge-yes)', C_LN='var(--pb-edge-def)', C_BG='var(--pb-canvas-bg)';

      function R(x,y,w,h,fill,lbl) {
        return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="10" fill="'+fill+'"/>'
          + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle"'
          + ' font-family="Poppins,sans-serif" font-size="13" font-weight="600" fill="'+T_SCR+'">'+lbl+'</text>';
      }
      function D(x,y,lines) {
        var pts = x+','+(y-DH)+' '+(x+DW)+','+y+' '+x+','+(y+DH)+' '+(x-DW)+','+y;
        var s = '<polygon points="'+pts+'" fill="'+C_DEC+'"/>';
        lines.forEach(function(l,i){
          var ty = y + (i - (lines.length-1)/2) * 14;
          s += '<text x="'+x+'" y="'+ty+'" text-anchor="middle" dominant-baseline="middle"'
            + ' font-family="Poppins,sans-serif" font-size="11" font-weight="600" fill="'+T_DEC+'">'+l+'</text>';
        });
        return s;
      }
      function T(x,y,lbl) {
        return '<circle cx="'+x+'" cy="'+y+'" r="'+CR+'" fill="'+C_TRM+'"/>'
          + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle"'
          + ' font-family="Poppins,sans-serif" font-size="10" font-weight="700" fill="'+T_TRM+'">'+lbl+'</text>';
      }
      function Ln(x1,y1,x2,y2,clr){
        return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(clr||C_LN)+'" stroke-width="1.5" marker-end="url(#fm-ah)"/>';
      }
      function Bg(x,y,t,bg){
        var tw = t.length*7+14;
        return '<rect x="'+(x-tw/2)+'" y="'+(y-9)+'" width="'+tw+'" height="18" rx="9" fill="'+bg+'"/>'
          + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle"'
          + ' font-family="Poppins,sans-serif" font-size="10" font-weight="700" fill="'+C_BG+'">'+t+'</text>';
      }

      var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
      s += '<defs>'
        + '<marker id="fm-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1L9,5L0,9z" fill="'+C_LN+'"/></marker>'
        + '<marker id="fm-gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1L9,5L0,9z" fill="'+C_GRN+'"/></marker>'
        + '</defs>';
      s += '<rect width="'+W+'" height="'+H+'" fill="'+C_BG+'" rx="12"/>';

      // Connections
      s += Ln(xS+CR, Y, xScr-RW/2-3, Y);
      s += Ln(xScr+RW/2+3, Y, xD-DW-3, Y);
      s += '<line x1="'+(xD+DW+3)+'" y1="'+Y+'" x2="'+(xEndScr-RW/2-3)+'" y2="'+Y+'" stroke="'+C_GRN+'" stroke-width="1.5" marker-end="url(#fm-gr)"/>';
      s += Bg((xD+DW+xEndScr-RW/2)/2, Y-14, 'Yes', C_GRN);
      s += Ln(xEndScr+RW/2+3, Y, xE-CR-3, Y);

      // Nodes
      s += T(xS,  Y, 'START');
      s += R(xScr, Y, RW, RH, C_SCR, 'Example Screen');
      s += D(xD,   Y, ['Continue?']);
      s += R(xEndScr, Y, RW, RH, C_SCR, 'Done Screen');
      s += T(xE,   Y, 'END');

      s += '</svg>';
      return s;
    }

    /* =========================================================================
       TAB 4 — DESIGN HANDOFF
       Dual-view per 02-architecture.md §7 Addition B:
         - Component view (default, auto-syncs on /pb:build)
         - Screen view    (manual, /pb:handoff)
                          uses 7:3 grid: 7fr render + 3fr spec panel
       Right panel emits DS tokens + sizing ONLY — never code.
       ========================================================================= */
    /* v0.3.17 — per-organism active property combo, keyed by org id.
       Lazy-seeded from each organism's property defaults by pbActiveProps(). */
    const handoffProps = {};
    function setHandoffProp(orgId, propId, value) {
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === orgId);
      if (!org) return;
      pbActiveProps(org)[propId] = value;
      renderHandoff();
    }
    function setHandoffView(v) {
      PB_DATA.handoff.view = v;
      renderHandoff();
    }
    function setHandoffScreen(id) {
      PB_DATA.handoff.selectedScreenId = id;
      PB_DATA.handoff.selectedElementId = null;
      renderHandoff();
    }
    function setHandoffElement(id) {
      PB_DATA.handoff.selectedElementId = id;
      renderHandoff();
    }

    /* v1.2 — UI Design: page chrome + DS bar + 3-way Global|Local|Screen tabs over a split
       layout (left = component cards / screen frame · right = persistent detail aside). */
    function setHandoffTab(t) {
      state.handoffTab = t;
      if (t === 'screen') { PB_DATA.handoff.view = 'screen'; state.handoffDrawerOpenFor = null; }
      else { PB_DATA.handoff.view = 'component'; state.handoffScope = t; state.screenDrawerOpenFor = null; }
      renderHandoff();
    }

    function renderHandoff() {
      const orgs = PB_DATA.handoff.organisms || [];
      const screens = PB_DATA.handoff.screens || [];
      const hasAny = orgs.length || screens.length;
      const cta = hasAny ? `<button class="sync-button" onclick="openFigmaPushPanel(this)">Push to Figma →</button>` : '';
      const header = pbPageHeader({ title: 'UI Design', infoKey: 'handoff', cta, headerAside: pbRenderDsBar() });

      if (!hasAny) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.handoff,
                title: 'No components yet',
                body: 'Run /pb:build to populate the design system — every reusable component (with property controls, a code panel, and a spec drawer) and every screen handoff. Components here are the same ones the Prototype renders, never duplicated.',
                ctaLabel: 'Generate components', command: '/pb:build', label: 'Build command copied',
              })}
            </div>
          </div>`;
        return;
      }

      const isGlobal = o => o.scope === 'global' || !!o.dsMatch;
      const global = orgs.filter(isGlobal), local = orgs.filter(o => !isGlobal(o));
      PB_DATA.handoff.view = 'component';
      // default selection: first component, else first screen
      if (!state.handoffDrawerOpenFor && !state.uidScreenSel) {
        if (orgs.length) state.handoffDrawerOpenFor = orgs[0].id;
        else if (screens.length) state.uidScreenSel = screens[0].id;
      }

      $('#app').innerHTML = `
        <div class="pb-page">
          ${header}
          <div class="pb-content pb-content--fill uidesign-split">
            <div class="uidesign-list" id="uidesign-list">${pbHandoffNameList(global, local, screens)}</div>
            <div class="uidesign-detail" id="uidesign-detail">${pbHandoffDetail(orgs, screens)}</div>
          </div>
        </div>`;
    }

    /* Left rail — one scrollable list, sectioned Global · Local · Screens (MUI-docs style). */
    function pbHandoffNameList(global, local, screens) {
      // `fn` is the code-side handler name; `arg` is the registry's id, carried as data and read back off the element.
      const row = (name, meta, active, fn, arg) =>
        `<button class="uid-row ${active ? 'is-active' : ''}" data-ho-id="${escapeHtmlAttr(arg)}" onclick="${fn}(this.dataset.hoId)">
           <span class="uid-row-name">${pbEscape(name)}</span>${meta ? `<span class="uid-row-meta">${pbEscape(meta)}</span>` : ''}
         </button>`;
      const section = (label, rows) => rows.length
        ? `<div class="uid-section"><div class="uid-section-head">${label}</div>${rows.join('')}</div>` : '';
      const comp = arr => arr.map(o => row(o.name, o.level, state.handoffDrawerOpenFor === o.id, 'pbSelectHandoffComponent', o.id));
      const scr = screens.map(s => row(s.name, 'screen', state.uidScreenSel === s.id, 'pbSelectHandoffScreen', s.id));
      return (section('Global', comp(global)) + section('Local', comp(local)) + section('Screens', scr))
        || `<p class="pb-aside-empty">No components.</p>`;
    }
    function pbSelectHandoffComponent(id) { state.handoffDrawerOpenFor = id; state.uidScreenSel = null; renderHandoff(); }
    function pbSelectHandoffScreen(id) { state.uidScreenSel = id; state.handoffDrawerOpenFor = null; renderHandoff(); }

    /* Right pane — the selected item's full detail, stacked top→down (no tab switcher). */
    function pbHandoffDetail(orgs, screens) {
      if (state.handoffDrawerOpenFor) {
        const org = orgs.find(o => o.id === state.handoffDrawerOpenFor);
        if (org) return pbHandoffComponentDetail(org);
      }
      if (state.uidScreenSel) {
        const s = screens.find(x => x.id === state.uidScreenSel);
        if (s) return pbHandoffScreenDetail(s);
      }
      return `<p class="pb-aside-empty">Select a component to see its demo, anatomy, specification, UI logic, and usage.</p>`;
    }
    function pbUidSection(heading, content) {
      return `<section class="uid-detail-section"><h3 class="uid-detail-h">${heading}</h3><div class="uid-detail-body">${content}</div></section>`;
    }
    function pbHandoffComponentDetail(org) {
      const props = pbActiveProps(org);
      return `
        <div class="uid-detail-head">
          <div><h2 class="uid-detail-title">${pbEscape(org.name)}</h2>${org.meta ? `<p class="uid-detail-sub">${pbEscape(org.meta)}</p>` : ''}</div>
          <div class="uid-detail-actions">${pbRenderHandoffCode(org)}</div>
        </div>
        ${pbComponentPlaygroundInline(org, props)}
        ${pbUidSection('Anatomy', pbRenderHandoffAnatomy(org))}
        ${pbUidSection('Specification', pbRenderHandoffSpec(org))}
        ${pbUidSection('Layer properties', pbRenderBoxModel(org))}
        ${pbUidSection('UI Logic', pbRenderHandoffUiLogic(org))}
        ${pbUidSection('Usage', pbRenderHandoffUsage(org))}`;
    }
    function pbHandoffScreenDetail(s) {
      const preview = (typeof window[s.renderFn] === 'function') ? window[s.renderFn]() : '';
      const els = s.elements || [];
      const elList = els.length
        ? els.map(el => `<div class="uid-el-row"><span class="uid-el-name">${pbEscape(el.label || el.id)}</span>${el.orgId ? `<span class="handoff-level-badge">${pbEscape(el.orgId)}</span>` : (el.placeholder ? '<span class="handoff-level-badge">placeholder</span>' : '')}</div>`).join('')
        : `<p class="handoff-spec-note">No elements.</p>`;
      return `
        <div class="uid-detail-head"><div><h2 class="uid-detail-title">${pbEscape(s.name)}</h2><p class="uid-detail-sub">Screen</p></div></div>
        ${preview ? `<div class="handoff-card-body handoff-card-body--stacked"><div class="handoff-card-preview">${preview}</div></div>` : ''}
        ${pbUidSection('Elements', elList)}`;
    }

    function pbHandoffAsideHint(msg) { return `<p class="pb-aside-empty">${msg}</p>`; }

    /* Design-system bar under the UI Design title (meta.designSystem; tolerated-absent). */
    function pbRenderDsBar() {
      const ds = (PB_REGISTRY && PB_REGISTRY.meta && PB_REGISTRY.meta.designSystem) || null;
      if (!ds || !ds.name) {
        if (VIEW_ONLY) return '';
        return `<div class="pb-ds-bar pb-ds-bar--empty" onclick="openCopyPopover('/pb:build', this)" title="Link a design system">+ No design system linked — click to add one</div>`;
      }
      const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
      const codeIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
      const design = ds.designLink
        ? `<a class="pb-ds-link" href="${pbEscape(ds.designLink)}" target="_blank" rel="noopener">${linkIcon} Design</a>`
        : `<span class="pb-ds-link pb-ds-link--missing">No design link</span>`;
      let code;
      if (ds.codeLibrary && /^https?:/.test(ds.codeLibrary)) {
        code = `<a class="pb-ds-link" href="${pbEscape(ds.codeLibrary)}" target="_blank" rel="noopener">${codeIcon} Code library</a>`;
      } else if (ds.codeLibrary) {
        code = `<span class="pb-ds-link" title="${pbEscape(ds.codeLibrary)}">${codeIcon} <code>${pbEscape(ds.codeLibrary)}</code></span>`;
      } else {
        code = `<span class="pb-ds-link pb-ds-link--missing">No code library</span>`;
      }
      return `<div class="pb-ds-bar"><span class="pb-ds-name">${pbEscape(ds.name)}</span><span class="pb-ds-sep">·</span>${design}<span class="pb-ds-sep">·</span>${code}</div>`;
    }

    /* Resolve the active property combo for an organism (lazy-seeded from defaults). */
    function pbActiveProps(org) {
      if (!handoffProps[org.id]) {
        const seed = {};
        (org.properties || []).forEach(p => { seed[p.id] = p.default; });
        handoffProps[org.id] = seed;
      }
      return handoffProps[org.id];
    }

    function pbTitleCase(s) { s = String(s == null ? '' : s); return s.charAt(0).toUpperCase() + s.slice(1); }

    /* Component information — the props/variants as a Figma-style inspect list. Option props read as a
       diamond-marked variant (inline select); free-text props as an editable value. Both stay live. */
    function pbComponentInfoList(org, props) {
      const DIAMOND = '<svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l6 6-6 6-6-6z" fill="currentColor"/></svg>';
      const rows = (org.properties || []).map(p => {
        const label = pbTitleCase(p.label || p.id);
        const opts = p.options || [];
        if (opts.length) {
          const sel = `<select class="ci-select" data-ho-org="${escapeHtmlAttr(org.id)}" data-ho-prop="${escapeHtmlAttr(p.id)}" onchange="setHandoffProp(this.dataset.hoOrg,this.dataset.hoProp,this.value)">`
            + opts.map(o => `<option value="${pbEscape(o.value)}" ${props[p.id] === o.value ? 'selected' : ''}>${pbEscape(pbTitleCase(o.label || o.value))}</option>`).join('')
            + `</select>`;
          return `<div class="ci-row"><span class="ci-label">${pbEscape(label)}</span><span class="ci-val"><span class="ci-ic">${DIAMOND}</span>${sel}</span></div>`;
        }
        const val = props[p.id] != null ? props[p.id] : '';
        return `<div class="ci-row"><span class="ci-label">${pbEscape(label)}</span><span class="ci-val"><span class="ci-ic"><b>Aa</b></span>`
          + `<input class="ci-input" value="${pbEscape(val)}" data-ho-org="${escapeHtmlAttr(org.id)}" data-ho-prop="${escapeHtmlAttr(p.id)}" onchange="setHandoffProp(this.dataset.hoOrg,this.dataset.hoProp,this.value)"></span></div>`;
      }).join('');
      return rows ? `<div class="ci-list">${rows}</div>` : '<p class="handoff-spec-note">No properties.</p>';
    }

    /* Layer properties — a Figma-style box-model diagram. Renders the component off-screen so
       pbPlaceBoxModel can measure its real margin/border/padding/content box, then draws it. */
    function pbRenderBoxModel(org) {
      const props = pbActiveProps(org);
      const html = (typeof window[org.renderFn] === 'function') ? window[org.renderFn](props) : '';
      if (!html) return '<p class="handoff-spec-note">Nothing to measure.</p>';
      return `<div class="boxmodel-stage" data-boxmodel-for="${pbEscape(org.id)}"><div class="bm-measure" style="position:absolute;left:-9999px;top:0;visibility:hidden">${html}</div></div>`;
    }

    function pbPlaceBoxModel() {
      const stage = document.querySelector('.boxmodel-stage[data-boxmodel-for]');
      if (!stage) return;
      const measure = stage.querySelector('.bm-measure');
      const root = measure && measure.firstElementChild;
      if (!root) return;
      const cs = getComputedStyle(root);
      const n = v => Math.round(parseFloat(v) || 0);
      const mg = { t: n(cs.marginTop), r: n(cs.marginRight), b: n(cs.marginBottom), l: n(cs.marginLeft) };
      const bd = { t: n(cs.borderTopWidth), r: n(cs.borderRightWidth), b: n(cs.borderBottomWidth), l: n(cs.borderLeftWidth) };
      const pd = { t: n(cs.paddingTop), r: n(cs.paddingRight), b: n(cs.paddingBottom), l: n(cs.paddingLeft) };
      const cw = Math.max(0, Math.round(root.clientWidth - pd.l - pd.r));
      const ch = Math.max(0, Math.round(root.clientHeight - pd.t - pd.b));
      const edges = (kind, v) => ['t', 'r', 'b', 'l'].map(s =>
        `<span class="bm-e bm-e--${s} bm-e--${kind}${v[s] ? '' : ' bm-e--zero'}">${v[s] || '–'}</span>`).join('');
      stage.innerHTML =
        `<div class="bm-ring bm-margin"><span class="bm-tag">Margin</span>${edges('margin', mg)}`
        + `<div class="bm-ring bm-border"><span class="bm-tag">Border</span>${edges('border', bd)}`
        + `<div class="bm-ring bm-padding"><span class="bm-tag">Padding</span>${edges('pad', pd)}`
        + `<div class="bm-content">${cw} × ${ch}</div></div></div></div>`;
    }

    /* Component playground — a full-screen modal to preview a component large with its prop controls
       and a light/dark canvas toggle. Props share handoffProps, so changes reflect back in the detail. */
    const PB_PG_ICONS = {
      sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
      reset: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
    };
    function pbComponentPlaygroundInline(org, props) {
      const preview = (typeof window[org.renderFn] === 'function') ? window[org.renderFn](props) : '';
      const theme = state.pgTheme || 'light';
      return `<div class="pb-pg-inline"><div class="pb-pg-body">
          <div class="pb-pg-canvas" data-theme="${theme}">
            <div class="pb-pg-preview">${preview}</div>
            <div class="pb-pg-theme">
              <button data-theme-val="light" class="${theme === 'light' ? 'is-active' : ''}" title="Light" aria-label="Light" onclick="setPlaygroundTheme('light')">${PB_PG_ICONS.sun}</button>
              <button data-theme-val="dark" class="${theme === 'dark' ? 'is-active' : ''}" title="Dark" aria-label="Dark" onclick="setPlaygroundTheme('dark')">${PB_PG_ICONS.moon}</button>
            </div>
          </div>
          <aside class="pb-pg-panel">
            <div class="pb-pg-section">
              <div class="pb-pg-sec-head"><span class="pb-pg-sec-title">${pbEscape(org.name)}</span>
                <button class="pb-pg-reset" title="Reset properties" aria-label="Reset properties" data-ho-org="${escapeHtmlAttr(org.id)}" onclick="pbResetPlaygroundProps(this.dataset.hoOrg)">${PB_PG_ICONS.reset}</button></div>
              ${pbComponentInfoList(org, props)}
            </div>
            <div class="pb-pg-section">
              <div class="pb-pg-sec-head"><span class="pb-pg-sec-title">Display</span></div>
              <div class="ci-list"><div class="ci-row"><span class="ci-label">Color Mode</span>
                <span class="ci-val"><select class="ci-select pb-cm-select" onchange="setPlaygroundTheme(this.value)">
                  <option value="light" ${theme === 'light' ? 'selected' : ''}>Light</option>
                  <option value="dark" ${theme === 'dark' ? 'selected' : ''}>Dark</option>
                </select></span></div></div>
            </div>
          </aside>
        </div></div>`;
    }
    /* Theme only affects the preview canvas — toggle it in place (no full re-render, keeps scroll). */
    function setPlaygroundTheme(t) {
      state.pgTheme = t;
      document.querySelectorAll('.pb-pg-canvas').forEach(c => c.setAttribute('data-theme', t));
      document.querySelectorAll('.pb-pg-theme button').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-theme-val') === t));
      document.querySelectorAll('select.pb-cm-select').forEach(s => { s.value = t; });
    }
    function pbResetPlaygroundProps(orgId) {
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === orgId);
      if (!org) return;
      const seed = {};
      (org.properties || []).forEach(p => { seed[p.id] = p.default; });
      handoffProps[orgId] = seed;
      renderHandoff();
    }

    /* v0.3.13 — Auto-position handoff hit overlays from rendered elements. */
    function recomputeHandoffBounds() {
      const frame = document.querySelector('.handoff-screen-frame');
      if (!frame) return;
      const overlay = frame.querySelector('.handoff-element-overlay');
      if (!overlay) return;
      const frameRect = frame.getBoundingClientRect();
      frame.querySelectorAll('[data-handoff-el]').forEach(target => {
        const id = target.getAttribute('data-handoff-el');
        const hit = Array.from(overlay.querySelectorAll('.handoff-element-hit')).find(h => h.dataset.hoEl === id);
        if (!hit) return;
        const r = target.getBoundingClientRect();
        hit.style.top    = (r.top    - frameRect.top)  + 'px';
        hit.style.left   = (r.left   - frameRect.left) + 'px';
        hit.style.width  = r.width  + 'px';
        hit.style.height = r.height + 'px';
        hit.style.right  = 'auto';
        hit.style.bottom = 'auto';
      });
    }
    window.addEventListener('resize', function(){
      if (state && state.metaView === 'handoff' && PB_DATA.handoff.view === 'screen') {
        requestAnimationFrame(recomputeHandoffBounds);
      }
    });

    /* v0.3.0 — Component view as vertical card list. Click card → spec drawer. */
    /* The component card list for the active scope (Global/Local). Selection + Push live
       in the page header / tab control now — this returns just the cards. */
    function pbRenderHandoffCards(shown) {
      const orgs = (PB_DATA.handoff.organisms || []);
      if (!shown || !shown.length) {
        const scope = state.handoffScope || 'local';
        return `<p class="meta-p" style="color:var(--text-tertiary);font-style:italic">No ${scope} components.${scope === 'global' ? ' Global components are shared design-system refs reused across prototypes.' : ' Local components are built for this project.'}</p>`;
      }
      const cardHtml = (org) => {
        const i = orgs.indexOf(org);
        const props = pbActiveProps(org);
        const layout = org.codeLayout === 'side-by-side' ? 'side-by-side' : 'stacked';
        const selected = state.handoffDrawerOpenFor === org.id;
        const levelBadge = org.level ? `<span class="handoff-level-badge">${pbEscape(org.level)}</span>` : '';
        return `
          <div class="handoff-card ${selected ? 'is-selected' : ''}" data-ho-org="${escapeHtmlAttr(org.id)}" onclick="openHandoffDrawer(this.dataset.hoOrg)">
            <div class="handoff-card-header">
              <span class="handoff-card-title">${i+1} · ${pbEscape(org.name)}</span>
              ${levelBadge}
              <div class="handoff-card-header-actions" onclick="event.stopPropagation()">${pbRenderHandoffCode(org)}</div>
            </div>
            ${org.meta ? `<p class="handoff-card-meta">${pbEscape(org.meta)}</p>` : ''}
            <div class="handoff-card-controls" onclick="event.stopPropagation()">
              ${(org.properties || []).filter(prop => (prop.options || []).length).map(prop => `
                <label class="prop-field">
                  <span class="prop-label">${pbEscape(prop.label || prop.id)}</span>
                  <select class="prop-select" data-ho-org="${escapeHtmlAttr(org.id)}" data-ho-prop="${escapeHtmlAttr(prop.id)}" onchange="setHandoffProp(this.dataset.hoOrg,this.dataset.hoProp,this.value)">
                    ${(prop.options || []).map(o => `<option value="${pbEscape(o.value)}" ${props[prop.id]===o.value?'selected':''}>${pbEscape(o.label)}</option>`).join('')}
                  </select>
                </label>`).join('')}
            </div>
            <div class="handoff-card-body handoff-card-body--${layout}">
              <div>${pbRenderComponentDemo(org, props)}</div>
            </div>
          </div>`;
      };
      // Sort by level order (atom → molecule → organism), then flat list.
      const LEVEL_ORDER = ['atom', 'molecule', 'organism'];
      const sorted = shown.slice().sort((a, b) => {
        const ia = LEVEL_ORDER.indexOf(a.level), ib = LEVEL_ORDER.indexOf(b.level);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      return `<div class="handoff-card-list">${sorted.map(cardHtml).join('')}</div>`;
    }

    // Component demo (v1.5): a single live preview of the currently-selected variant. The
    // variant (incl. `state`) is chosen via the card's dropdowns — changing one re-renders
    // this demo through setHandoffProp, so the demo stays interactive.
    function pbRenderComponentDemo(org, props) {
      const body = (typeof window[org.renderFn] === 'function')
        ? window[org.renderFn](props)
        : `<div style="padding:14px;color:var(--text-tertiary);font-style:italic;font-size: var(--font-size-xs)">Renderer <code>${pbEscape(org.renderFn || '(none)')}</code> not defined.</div>`;
      return `<div class="handoff-card-preview" data-component-preview="${pbEscape(org.id)}">${body}</div>`;
    }

    const PB_CLIPBOARD_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    function pbRenderHandoffCode(org) {
      if (!org.code || !org.code.snippet)
        return `<div class="handoff-code handoff-code--empty">No code recorded.</div>`;
      return `<div class="handoff-code">
          <button class="handoff-copy-code-btn" data-ho-org="${escapeHtmlAttr(org.id)}" onclick="event.stopPropagation(); openCodeDialog(this.dataset.hoOrg)">
            ${PB_CLIPBOARD_ICON} Copy code
          </button>
        </div>`;
    }

    /* v1.5 — code review dialog: shows the snippet, auto-copies on open, "Copy again" button. */
    function pbCopyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
      } catch (e) { /* fall through */ }
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) { /* silent */ }
      document.body.removeChild(ta);
    }
    function openCodeDialog(orgId) {
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === orgId);
      if (!org || !org.code || !org.code.snippet) return;
      closeCodeDialog();
      const back = document.createElement('div');
      back.className = 'pb-dialog-backdrop';
      back.id = 'pb-code-dialog';
      back.innerHTML = `
        <div class="pb-dialog pb-code-dialog" role="dialog" aria-modal="true">
          <div class="pb-dialog-head">
            <h2 class="pb-dialog-title">${pbEscape(org.name)} — code</h2>
            <button class="pb-dialog-close" aria-label="Close" title="Close" onclick="closeCodeDialog()">×</button>
          </div>
          <div class="pb-code-dialog-bar">
            <span class="handoff-code-lang">${pbEscape(org.code.lang || 'html')}</span>
            <button class="handoff-copy-code-btn" onclick="pbCopyCode(this)">${PB_CLIPBOARD_ICON} Copy again</button>
          </div>
          <pre class="pb-code-dialog-pre"><code>${pbEscape(org.code.snippet)}</code></pre>
          <p class="pb-code-dialog-note flash" id="pb-code-note">✓ Copied to clipboard</p>
        </div>`;
      back.addEventListener('click', e => { if (e.target === back) closeCodeDialog(); });
      document.body.appendChild(back);
      document.addEventListener('keydown', pbCodeDialogEsc);
      pbCopyText(org.code.snippet); // auto-copy on open
      setTimeout(() => { const n = document.getElementById('pb-code-note'); if (n) n.classList.remove('flash'); }, 700);
    }
    function closeCodeDialog() {
      const el = document.getElementById('pb-code-dialog');
      if (el) el.remove();
      document.removeEventListener('keydown', pbCodeDialogEsc);
    }
    function pbCodeDialogEsc(e) { if (e.key === 'Escape') closeCodeDialog(); }
    function pbCopyCode(btn) {
      const pre = document.querySelector('#pb-code-dialog .pb-code-dialog-pre');
      pbCopyText(pre ? pre.textContent : '');
      const note = document.getElementById('pb-code-note');
      if (note) { note.textContent = '✓ Copied to clipboard'; note.classList.add('flash'); setTimeout(() => note.classList.remove('flash'), 700); }
    }

    /* ---- Drawer: push-content, 4 tabs ---- */
    const HANDOFF_TABS = [
      ['anatomy', 'Anatomy'], ['spec', 'Specification'],
      ['uiLogic', 'UI Logic'], ['usage', 'Usage'],
    ];
    function pbRenderHandoffDrawer() {
      const id = state.handoffDrawerOpenFor;
      if (!id) return '';
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === id);
      if (!org) return '';
      const tab = state.handoffDrawerSegment || 'anatomy';
      return `
        <div class="handoff-drawer" role="dialog" aria-label="${pbEscape(org.name)} spec">
          <div class="handoff-drawer-header">
            <div class="handoff-drawer-title-wrap">
              <h2 class="handoff-drawer-title">${pbEscape(org.name)}</h2>
              ${org.meta ? `<p class="handoff-drawer-sub">${pbEscape(org.meta)}</p>` : ''}
            </div>
          </div>
          <div class="handoff-drawer-segments">
            ${HANDOFF_TABS.map(([tid, label]) =>
              `<button class="handoff-drawer-segment ${tab === tid ? 'active' : ''}" data-ho-seg="${escapeHtmlAttr(tid)}" onclick="setHandoffDrawerSegment(this.dataset.hoSeg)">${label}</button>`
            ).join('')}
          </div>
          <div class="handoff-drawer-content">${pbRenderHandoffDrawerTab(org, tab)}</div>
        </div>`;
    }
    function pbRenderHandoffDrawerTab(org, tab) {
      if (tab === 'spec')    return pbRenderHandoffSpec(org);
      if (tab === 'uiLogic') return pbRenderHandoffUiLogic(org);
      if (tab === 'usage')   return pbRenderHandoffUsage(org);
      return pbRenderHandoffAnatomy(org);
    }

    function pbRenderTokenCell(t) {
      if (!t) return '<span class="token-cell token-cell--none">—</span>';
      let demo = '';

    /* ── Schema-13 spec sidecars (wave 4's shape), read beside the legacy one ─────────────────

       hand-off drawer, the redlines and ⌥-click name a component's parts the same way /pb:test,

         legacy   anatomy: { parts: [ {n, name, anchor?, orgId?, required} ] }

    function pbIsNewAnatomy(a) {
      return !!a && typeof a === 'object' && !Array.isArray(a) && !('parts' in a) && !('renderProps' in a)

      const seen = {}; order.forEach(k => { seen[k] = 1; });

        const spec = a[name] || {}, el = (els[name] && typeof els[name] === 'object') ? els[name] : {};

    /* The props a schema-13 part map was measured on — the ones that make every part render. */
    function pbSpecDemoProps(org) {

    }
    /* A part's element on a stage: its data-part first, then the anchor the sidecar recorded. */
    function pbPartEl(stage, p) {

    function pbSpecStyleRows(org) {

      const order = ['root'].concat(pbSpecParts(org).map(p => p.name)).filter(k => els[k]);

      order.forEach(name => {

        if (st.backgroundColor) rows.push([name, 'Background', v(st.backgroundColor.value), st.backgroundColor.token]);

      const partEl = el.closest && el.closest('[data-part]');

          const a = c.anatomy;

    function pbAutoAnatomy(org) {
      const props = pbActiveProps(org);
      const html = (typeof window[org.renderFn] === 'function') ? window[org.renderFn](props) : '';
      if (!html) return '<p class="handoff-spec-note">No render body to auto-derive anatomy from.</p>';

    /* v0.3.17 — Anatomy: gutter badges + dashed leader lines, measured post-render. */
    function pbPlaceAnatomyBadges() {

      if (!stage) return;

      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === stage.getAttribute('data-anatomy-for'));

        const target = pbPartEl(stage, p);

        if (pad.b > 0) mk('spec-band spec-band--pad', `left:${cL}px;top:${cB - pad.b}px;width:${cR - cL}px;height:${pad.b}px`);
        if (pad.l > 0) mk('spec-band spec-band--pad', `left:${cL}px;top:${cT + pad.t}px;width:${pad.l}px;height:${cB - cT - pad.t - pad.b}px`);
        if (pad.r > 0) mk('spec-band spec-band--pad', `left:${cR - pad.r}px;top:${cT + pad.t}px;width:${pad.r}px;height:${cB - cT - pad.t - pad.b}px`);
        /* numeric labels — kept OFF the content. Uniform padding → one chip in the top band; otherwise
           top/bottom labels sit centred in their (full-width, empty) bands and left/right in the top
           corners, clear of left-aligned body text. */
        const padChip = (x, y, v) => spaceChip('spec-chip--pad', x, y, v);
        const uniform = pad.t > 0 && pad.t === pad.b && pad.t === pad.l && pad.t === pad.r;
        if (uniform) {
          padChip((cL + cR) / 2, cT + pad.t / 2, pad.t);
        } else {
          if (pad.t > 0) padChip((cL + cR) / 2, cT + pad.t / 2, pad.t);
          if (pad.b > 0) padChip((cL + cR) / 2, cB - pad.b / 2, pad.b);
          if (pad.l > 0) padChip(cL + pad.l / 2, cT + Math.min(pad.t / 2 || 11, 11), pad.l);
          if (pad.r > 0) padChip(cR - pad.r / 2, cT + Math.min(pad.t / 2 || 11, 11), pad.r);
        }
      }

      /* grow the stage so nothing in the bottom margin row is clipped */
      stage.style.minHeight = Math.ceil(bottomY + 16) + 'px';
    }

    /* Badge ↔ table-row hover sync (one delegated pair of listeners). */
    function pbAnatomyHoverToggle(e, on) {
      const hit = e.target.closest('[data-anatomy-row], [data-anatomy-pin]');
      if (!hit) return;
      const n = hit.getAttribute('data-anatomy-row') || hit.getAttribute('data-anatomy-pin');
      ['[data-anatomy-row="' + n + '"]', '[data-anatomy-pin="' + n + '"]'].forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.classList.toggle('is-highlit', on);
      });
    }

    /* Patch renderHandoff so bounds + anatomy badges + spec redline recompute every draw. */
    (function patchRenderHandoff(){
      const orig = window.renderHandoff;
      const after = function(){ recomputeHandoffBounds(); pbPlaceAnatomyBadges(); pbPlaceAutoAnatomyPins(); pbPlaceSpecAnnotations(); pbPlaceBoxModel(); };
      window.renderHandoff = function() {
        /* Preserve the left card-list scroll across re-renders so opening a
           component / switching a dropdown doesn't jump it back to the top.
           The drawer body is a fresh element each render, so it naturally
           loads at its starting point — which is the intended behavior. */
        const prevList = (document.querySelector('.uidesign-list') || {}).scrollTop || 0;
        const prevDetail = (document.querySelector('.uidesign-detail') || {}).scrollTop || 0;
        orig.apply(this, arguments);
        const list = document.querySelector('.uidesign-list'); if (list) list.scrollTop = prevList;
        const detail = document.querySelector('.uidesign-detail'); if (detail) detail.scrollTop = prevDetail;
        requestAnimationFrame(function(){ requestAnimationFrame(after); });
      };
      window.addEventListener('resize', function(){
        if (state && state.metaView === 'handoff') requestAnimationFrame(function(){ requestAnimationFrame(after); });
      });
      document.addEventListener('mouseover', function(e){ pbAnatomyHoverToggle(e, true); });
      document.addEventListener('mouseout',  function(e){ pbAnatomyHoverToggle(e, false); });
    })();
