    .ia-node.is-dim { opacity: .55; }
    .ia-node.is-dim .ia-node-t, .ia-node.is-dim .ia-node-id, .ia-node.is-dim .ia-node-m { color: var(--pb-ink); }
    .ia-edge.is-dim { opacity: .14; }
    .ia-edge--ov.is-dim { opacity: .1; }
    /* flex:0 0 auto — a role dot lives in a flex row (.ia-node-t); with the default
       shrink a long title squashes it into an ellipse instead of truncating the title. */
    .ia-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; flex: 0 0 auto; }
    .ia-dot--1 { background: var(--pb-role-1); }
    .ia-dot--2 { background: var(--pb-role-2); }
    .ia-dot--3 { background: var(--pb-role-3); }
    .ia-dot--4 { background: var(--pb-role-4); }
    .ia-dot--5 { background: var(--pb-role-5); }
    .ia-dot--6 { background: var(--pb-role-6); }
    .ia-dot--7 { background: var(--pb-role-7); }
    .ia-dot--8 { background: var(--pb-role-8); }
    .ia-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
    /* A flagged row stays in the list; the warning rail is what marks it, not a separate box. */
    .ia-new-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .ia-map-head, .ia-map-row { display: grid; gap: 12px; align-items: start; }
    .ia-map-head { margin: 10px 0 6px; }
    .ia-map-row { position: relative; border-top: 1px dashed var(--border); padding: 14px 0 8px; }
    .ia-map-group { position: absolute; top: -9px; left: 0; background: var(--pb-page); padding: 0 6px 0 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); }
    .ia-node { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; cursor: pointer; background: var(--pb-surface); }
    .ia-node:hover { border-color: var(--pb-ink); }
    .ia-node--empty { border-style: dashed; border-color: var(--pb-warn); background: var(--pb-warn-bg); }
    .ia-node-t { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-s); }
    .ia-node-j { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .ia-mini { font-size: 11px; line-height: 16px; padding: 1px 7px; border-radius: 999px; background: var(--pb-wash); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ia-node-ov { margin-top: 6px; font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .ia-ov { font-size: 11px; padding: 0 6px; border-radius: 6px; border: 1px dashed var(--pb-warn); color: var(--pb-warn); cursor: pointer; }
    .ia-ov:hover { background: var(--pb-warn-bg); }
    .ia-from { font-size: 11px; margin: 0 0 2px 4px; }
    .ia-orphans { margin-top: 8px; font-size: var(--font-size-xs); }
    /* Site map as an org chart: a fixed-height canvas the user pans/zooms inside, so a deep tree
       never stretches the column. HTML nodes over an SVG edge layer — the nodes keep their styling,
       hover and click, which is what a pure-SVG chart would have cost. */
    .ia-map-title { margin-bottom: var(--pb-s2); }
    /* full width, half the viewport tall (user ruling): the map is an overview, the job list under it
       is the work, so the list starts in the first screen. A deep tree pans/zooms inside, never
       stretching the page. */
    .ia-canvas { flex: none; height: 50vh; }
    /* A phone has no wheel and no mouse drag, and the pan/zoom canvas answers only to those. So below
       720px the chart is a plain box instead: the stage is laid out at a reduced size, as tall as it
       is (so a vertical swipe is always the PAGE's) and the finger pans it sideways, natively. The zoom
       controls have nothing left to do. */
    @media (max-width: 719px) {
      .ia-canvas { height: auto; }
      .ia-bar { position: static; }
      .ia-canvas .flow-viewport { position: relative; inset: auto; overflow-x: auto; overflow-y: hidden; cursor: auto; }
      .ia-canvas .ia-stage { position: relative !important; top: auto !important; left: auto !important;
        margin: 0 !important; transform: none !important; zoom: .65; }
      .ia-canvas .flow-zoom-controls, .ia-canvas .flow-zoom-readout, .ia-canvas .flow-hint { display: none; }
      .ia-pan-hint { display: block; }
    }
    .ia-stage { pointer-events: none; }
    .ia-edges { position: absolute; inset: 0; }
    .ia-edge { fill: none; stroke: var(--text-tertiary); stroke-width: 1.4; }
    .ia-rowline { stroke: var(--border); stroke-dasharray: 3 5; }
    .ia-rowlab { position: absolute; left: 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
                 color: var(--text-tertiary); line-height: 1.3; pointer-events: auto; cursor: help; }
    .ia-rowlab-n { display: block; font-size: 10px; opacity: .8; }
    .ia-node--card { position: absolute; margin: 0; box-sizing: border-box; overflow: hidden;
                     pointer-events: auto; background: var(--pb-surface); cursor: default; }
    .ia-node--card:hover { border-color: var(--border); }
    /* Text wraps; nothing is ever cut. The card's height is computed to hold it. */
    .ia-node--card .ia-node-t { align-items: flex-start; }
    .ia-node--card .ia-node-t > strong { min-width: 0; overflow-wrap: anywhere; }
    .ia-node--card .ia-node-t .ia-dot { margin-top: 5px; }
    .ia-node-id { font-size: 11px; overflow-wrap: anywhere; line-height: 1.35; }
    .ia-node--ov .ia-node-t { overflow-wrap: anywhere; line-height: 1.35; }
    .ia-node-m { font-size: 11px; color: var(--text-tertiary); margin-top: 4px;
                 display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ia-node-go { flex: 0 0 auto; font: inherit; font-size: 10px; line-height: 16px; padding: 0 7px;
                  border: 1px solid var(--border); border-radius: 999px; background: transparent;
                  color: var(--pb-ink); cursor: pointer; white-space: nowrap; opacity: 0; transition: opacity var(--pb-t); }
    .ia-node--card:hover .ia-node-go, .ia-node-go:focus-visible { opacity: 1; }
    .ia-node-go:hover { background: var(--pb-wash); border-color: var(--pb-ink); }
    /* a touch screen has no hover to reveal the ripple link */
    @media (hover: none) { .ia-node-go { opacity: 1; } }
    .ia-rail-toggle { font: inherit; font-size: 10px; line-height: 14px; padding: 0 4px; margin-right: 2px;
                      border: 1px solid var(--border); border-radius: 4px; background: transparent;
                      color: inherit; cursor: pointer; }
    .ia-rail-toggle:hover { border-color: var(--pb-warn); color: var(--pb-warn); }
    .ia-rowlab--ov { color: var(--pb-warn); }
    /* Overlays: dashed like the chips they replaced, so a drawer never reads as a screen. */
    .ia-edge--ov { stroke: var(--pb-warn); stroke-dasharray: 3 4; opacity: .65; }
    .ia-rowline--ov { stroke: var(--pb-warn); opacity: .45; }
    .ia-node--ov { border-style: dashed; border-color: var(--pb-warn); background: var(--pb-warn-bg); }
    .ia-node--ov .ia-node-t { color: var(--pb-warn); font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; }
    /* The job list carries its own heading; the frame around it was one border too many. */
    .ia-card--flat { border: 0; padding: 0; }
    /* Content — glossary + wording deck */
    .ct-filter { margin-left: auto; width: 200px; font: inherit; font-size: var(--font-size-s); padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; }
    .ct-terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    /* Flex column so the rule link can sit on the card's BOTTOM edge (margin-top:auto) rather
       than in the header, where a long rule title wrapped and shoved the term name around. */
    .ct-term { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; }
    .ct-term-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .ct-en { font-size: var(--font-size-xs); color: var(--text-tertiary); }
    .ct-def { margin: 6px 0 0; font-size: var(--font-size-s); line-height: 1.5; }
    .ct-line { margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .ct-rule-line { margin-top: auto; padding-top: 10px; }
    .ct-rule { font-size: var(--font-size-xs); }
    .ct-aka, .ct-avoid { font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 999px; }
    .ct-aka { background: var(--pb-wash); }
    .ct-avoid { background: var(--pb-warn-bg); color: var(--pb-warn); text-decoration: line-through; }
    .ct-group { margin-bottom: 18px; }
    .ct-group-h { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 2px; }
    .ct-table { table-layout: fixed; }
    .ct-key { width: 26%; }
    .ct-key code { font-size: var(--font-size-xs); color: var(--text-tertiary); }
    .ct-text { width: 40%; font-weight: var(--font-weight-bold); }
    .ct-note { color: var(--text-tertiary); font-size: var(--font-size-xs); }

    /* =====================================================================================
       Wave 2 (tool-chrome r2) — the inspector, the in-page run, device fit, the filter bar and
       scan lines, sparse pages. Tool chrome: --pb-* only.
       ===================================================================================== */
    /* The bar: the project button at the far left, a hairline, then the tabs. */
    .pb-bar-start { display: flex; align-items: center; flex: none; }
    .pb-bar-vr { width: 1px; height: 20px; background: var(--pb-hair); flex: none; align-self: center; margin: 0 -8px; }
    .pb-bar-end { gap: 4px; }
    /* the hairline between two bar items sits in the gap, not on the chip's own edge */
    .pb-bar-item + .pb-bar-item::before { left: -3px; }

    /* ---- The Sandbox inspector: a 20rem panel on the right, under the bar. Unpinned it floats
       over the stage; pinned it docks and the stage gives it the room (the stage's
       ResizeObserver refits the device). It carries .copy-popover and .proto-sandbox-menu for
       the hooks that drove the menu it replaced; .pb-insp is what styles it. Lengths are tokens
       or rem; the 720px breakpoint is the one in pbSandboxDocked(), and media queries cannot read a token. */
    .copy-popover.pb-insp {
      position: fixed; top: var(--pb-bar-h); right: 0; bottom: 0; left: auto; width: 20rem; max-width: 100vw;
      padding: 0; border: 0; border-left: var(--pb-hair-w) solid var(--pb-hair); border-radius: 0;
      background: var(--pb-page); color: var(--pb-ink); box-shadow: var(--pb-shadow);
      z-index: 1050; opacity: 1; transform: none; transition: none;
      overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      display: flex; flex-direction: column; font: var(--pb-w-reg) var(--pb-t-md)/var(--pb-lh) var(--pb-font);
    }
    .copy-popover.pb-insp.is-pinned { box-shadow: none; }
    .pb-insp > * { flex: none; }
    @media (min-width: 720px) {
      body:has(> .pb-insp.is-pinned) #app { margin-right: 20rem; }
    }
    @media (max-width: 719px) {
      /* a phone-width window: the inspector is a bottom sheet over the stage and never docks */
      .copy-popover.pb-insp { top: auto; left: 0; width: auto; height: min(62vh, 32.5rem);
        border-left: 0; border-top: var(--pb-hair-w) solid var(--pb-hair); box-shadow: var(--pb-shadow); }
      .pb-insp-pin { display: none !important; }
    }
    .pb-insp-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--pb-s1);
      height: var(--pb-bar-h); padding: 0 var(--pb-s2) 0 var(--pb-s4); background: var(--pb-page); border-bottom: var(--pb-hair-w) solid var(--pb-hair); }
    .pb-insp-t { flex: 1; margin: 0; font-size: var(--pb-t-md); font-weight: var(--pb-w-bold); }
    .pb-insp-t:focus { outline: none; }
    .pb-ib[aria-pressed="true"] { background: var(--pb-wash); color: var(--pb-ink); }
    .pb-ib[aria-pressed="true"]:hover { background: var(--pb-press); }
    .pb-insp-sec { display: flex; align-items: center; justify-content: space-between; gap: var(--pb-s2);
      min-height: var(--pb-hit-sm); margin: 0; padding: var(--pb-s4) var(--pb-s4) var(--pb-s1); border-top: var(--pb-hair-w) solid var(--pb-hair);
      font-size: var(--pb-t-sm); font-weight: var(--pb-w-bold); letter-spacing: var(--pb-track); text-transform: uppercase; color: var(--pb-ink-3); }
    .pb-insp-h + .pb-insp-sec { border-top: 0; }
    .pb-insp .sbx-row { padding: calc(var(--pb-s1) + var(--pb-s0)) var(--pb-s4); gap: var(--pb-s3); }
    .pb-insp .sbx-row-lbl { font: var(--pb-w-reg) var(--pb-t-sm)/1.3 var(--pb-font); text-transform: none; letter-spacing: 0; color: var(--pb-ink-2); }
    .pb-insp .sbx-select { height: var(--pb-hit); max-width: 10.5rem; min-width: 0; flex: 1 1 auto; border-color: var(--pb-hair-2); border-radius: var(--pb-r-md); font: var(--pb-t-sm)/1 var(--pb-font); color: var(--pb-ink); }
    /* Device and Chrome: one segmented control each, the same active state for both */
    .pb-insp .proto-toolbar, .pb-insp .proto-shell-toggle { display: inline-flex; gap: var(--pb-rule-w); padding: var(--pb-rule-w); border: 0;
      border-radius: var(--pb-r-md); background: var(--pb-wash); overflow: visible; }
    .pb-insp .proto-device-btn { width: 2.25rem; height: var(--pb-hit); border-radius: var(--pb-r); color: var(--pb-ink-2); }
    .pb-insp .proto-device-btn + .proto-device-btn { border-left: 0; }
    .pb-insp .proto-shell-btn { height: var(--pb-hit); padding: 0 var(--pb-s3); border-radius: var(--pb-r); color: var(--pb-ink-2);
      font: var(--pb-w-reg) var(--pb-t-sm)/1 var(--pb-font); }
    .pb-insp .proto-shell-btn + .proto-shell-btn { border-left: 0; }
    .pb-insp .proto-device-btn:hover:not(.active):not(.is-disabled), .pb-insp .proto-shell-btn:hover:not(.active) { background: var(--pb-press); color: var(--pb-ink); }
    .pb-insp .proto-shell-btn.active, .pb-insp .proto-device-btn.active {
      background: var(--pb-surface); color: var(--pb-ink); font-weight: var(--pb-w-bold); box-shadow: 0 0 0 var(--pb-hair-w) var(--pb-hair-2); }
    .pb-insp .proto-device-btn.is-disabled { opacity: .4; cursor: not-allowed; }
    /* a switch row */
    .pb-insp .pb-switch { justify-content: space-between; gap: var(--pb-s3); width: calc(100% - var(--pb-s4)); margin: 0 var(--pb-s2); min-height: var(--pb-hit);
      padding: 0 var(--pb-s2); border-radius: var(--pb-r-md); font: var(--pb-w-reg) var(--pb-t-md)/1.2 var(--pb-font); color: var(--pb-ink); }
    .pb-insp .pb-switch:hover:not(:disabled) { background: var(--pb-wash); }
    .pb-insp .pb-switch:disabled { opacity: .4; }
    .pb-insp .sbx-sw { width: 2rem; height: 1.125rem; background: var(--pb-press); box-shadow: inset 0 0 0 var(--pb-hair-w) var(--pb-hair-2); }
    .pb-insp .sbx-sw::after { top: var(--pb-rule-w); left: var(--pb-rule-w); width: .875rem; height: .875rem; background: var(--pb-surface); box-shadow: 0 0 0 var(--pb-hair-w) var(--pb-ink-3); }
    .pb-insp .sbx-sw.on { background: var(--pb-ink); box-shadow: none; }
    .pb-insp .sbx-sw.on::after { left: calc(2rem - .875rem - var(--pb-rule-w)); background: var(--pb-on-ink); box-shadow: none; }
    .pb-insp-note { margin: 0; padding: var(--pb-rule-w) var(--pb-s4) var(--pb-s2); color: var(--pb-ink-3); font-size: var(--pb-t-sm); }
    .pb-insp-note code { font-family: var(--pb-mono); font-size: .92em; color: var(--pb-ink-2); }
    /* Run: a section disclosure; story groups inside it, scenarios inside those — every level a pbDisc, so
       every level is multi-open. "Run all" rides the section's header as a SIBLING of the trigger (a button
       cannot hold a button), so it stays in reach while the section is closed. */
    .pb-run-sec { position: relative; margin-top: var(--pb-s2); padding-block: var(--pb-s2); border-top: var(--pb-hair-w) solid var(--pb-hair); }
    .pb-run-disc > .pb-disc-t { padding: 0 calc(var(--pb-s7) * 2) 0 var(--pb-s2); font-size: var(--pb-t-sm); letter-spacing: var(--pb-track); text-transform: uppercase; color: var(--pb-ink-3); }
    .pb-run-disc > .pb-disc-b { padding: 0; }
    .pb-run-count { margin-left: var(--pb-s2); font-weight: var(--pb-w-reg); letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .pb-run-all { position: absolute; top: var(--pb-s2); right: var(--pb-s2); }
    .pb-run-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--pb-s2); padding: 0 var(--pb-s2) var(--pb-s2) var(--pb-s4); }
    .pb-run-tally { display: block; min-width: 0; color: var(--pb-ink-3); font-size: var(--pb-t-sm); line-height: 1.3; }
    .pb-run-tl { white-space: nowrap; }
    .pb-run-tl--pass { color: var(--pb-pass); }
    .pb-run-tl--fail { color: var(--pb-fail); }
    .pb-run-tl--blocked, .pb-run-tl--stale { color: var(--pb-warn); }
    .pb-run-tl--running { color: var(--pb-ink); }
    /* a story group: its title and count, the tally under it */
    .pb-run-g > .pb-disc-t { align-items: flex-start; padding-block: var(--pb-s2); }
    .pb-run-g > .pb-disc-t .pb-disc-ch { margin-top: calc((var(--pb-t-md) * var(--pb-lh) - var(--pb-ico)) / 2); }
    .pb-run-g > .pb-disc-t .pb-disc-s { display: flex; flex-direction: column; gap: var(--pb-rule-w); }
    .pb-run-gh { display: flex; align-items: baseline; gap: var(--pb-s2); }
    .pb-run-gt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pb-run-g.is-open > .pb-disc-t .pb-run-gt { font-weight: var(--pb-w-bold); }
    .pb-run-gn { flex: none; color: var(--pb-ink-3); font-size: var(--pb-t-sm); font-variant-numeric: tabular-nums; }
    .pb-run-g > .pb-disc-b { padding: 0; }
    .pb-run-list { list-style: none; margin: 0; padding: 0 0 var(--pb-s1) var(--pb-s4); }
    /* a scenario: glyph · its sentence · ▶ (the ▶ sits over the trigger's right edge) */
    .pb-run-sc { position: relative; }
    .pb-run-d { border-bottom: 0; }
    .pb-run-d > .pb-disc-t { align-items: flex-start; padding: var(--pb-s1) calc(var(--pb-s5) + var(--pb-s3)) var(--pb-s1) var(--pb-s1); }
    .pb-run-d > .pb-disc-t .pb-disc-ch { margin-top: calc((var(--pb-t-md) * var(--pb-lh) - var(--pb-ico)) / 2); }
    .pb-run-d .pb-disc-s { display: flex; align-items: flex-start; gap: var(--pb-s2); }
    .pb-run-d .pb-disc-s > .pb-g { margin-top: calc((var(--pb-t-md) * var(--pb-lh) - var(--pb-ico-sm)) / 2); }
    .pb-run-d .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pb-run-d.is-open > .pb-disc-t .t { white-space: normal; overflow-wrap: anywhere; font-weight: var(--pb-w-bold); }
    .pb-run-d > .pb-disc-b { padding: var(--pb-s1) var(--pb-s2) var(--pb-s2) calc(var(--pb-s4) * 2); }
    .pb-run-go { position: absolute; top: var(--pb-rule-w); right: var(--pb-s1); }
    .pb-run-meta { margin: 0 0 var(--pb-s2); color: var(--pb-ink-3); font-size: var(--pb-t-sm); overflow-wrap: anywhere; }
    .pb-run-id { font-family: var(--pb-mono); }
    .pb-run-rec { display: grid; grid-template-columns: var(--pb-ico-sm) minmax(0, 1fr); gap: var(--pb-s2); margin: 0 0 var(--pb-s2); font-size: var(--pb-t-sm); }
    .pb-run-rec .pb-rt { margin-top: var(--pb-s1); max-height: 9rem; overflow: auto; color: var(--pb-ink-2); }
    .pb-run-when { color: var(--pb-ink-3); }
    .pb-run-steps { list-style: none; margin: 0; padding: 0; }
    .pb-run-step { display: grid; grid-template-columns: var(--pb-ico-sm) minmax(0, 1fr); gap: var(--pb-s2); padding: var(--pb-s1) 0; font-size: var(--pb-t-sm); color: var(--pb-ink); }
    .pb-run-step small { display: block; color: var(--pb-ink-3); }
    .pb-run-step .why { color: var(--pb-warn); }
    .pb-run-step .why.is-fail { color: var(--pb-fail); }
    .pb-run-step.is-tick { animation: pb-tick .2s ease-out; }
    @keyframes pb-tick { from { opacity: .3; transform: translateX(calc(var(--pb-s1) * -1)); } to { opacity: 1; transform: none; } }
    .pb-g { display: inline-flex; flex: none; color: var(--pb-ink-3); }
    .pb-g--pass { color: var(--pb-pass); } .pb-g--fail { color: var(--pb-fail); } .pb-g--blocked, .pb-g--stale { color: var(--pb-warn); }
    .pb-g--retired, .pb-g--ubd { color: var(--pb-ink-3); }
    .pb-g--running { color: var(--pb-ink); } .pb-g--running svg { animation: pb-spin .8s linear infinite; }
    @keyframes pb-spin { to { transform: rotate(360deg); } }
    .pb-insp-f { position: sticky; bottom: 0; z-index: 2; margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: var(--pb-s2);
      padding: calc(var(--pb-s1) + var(--pb-s0)) var(--pb-s2); background: var(--pb-page); border-top: var(--pb-hair-w) solid var(--pb-hair); }
    .pb-insp-f .proto-menu-item { width: auto; gap: var(--pb-s2); padding: 0 var(--pb-s2); min-height: var(--pb-hit); border-radius: var(--pb-r-md);
      font: var(--pb-w-reg) var(--pb-t-md)/1 var(--pb-font); color: var(--pb-ink-2); }

<body>
  <div id="meta-nav"></div>
  <div id="app"></div>

  <script>
    /* =========================================================================
       STATE LOADER (v1.1.1) — state lives in registry.json, NOT here.
       /pb:build --render inlines registry.json into PB_REGISTRY below (replacing
       the null between the markers). adaptRegistryToPBData() maps the registry
       schema onto the PB_DATA shape every render function already reads, so the
       render machinery is unchanged. A null registry → the empty default,
       identical to a blank template. Runtime UI mutations (view / selection) land
       on the in-memory PB_DATA only and never write back to registry.json.
       ========================================================================= */
    const PB_REGISTRY = /*__PB_REGISTRY_START__*/ null /*__PB_REGISTRY_END__*/;
    /* The derived logic graph (render.py's load_logic). Absent on an older project or a
       hand-off rendered before it existed — every view that reads it degrades to an empty
       state rather than breaking. */
    const PB_LOGIC = /*__PB_LOGIC_START__*/ null /*__PB_LOGIC_END__*/;
    window.PB_LOGIC = PB_LOGIC;
    const PB_SHELL_VERSION = "{{PB_SHELL_VERSION}}";   /* filled by render.build_html; 'unknown' if unfilled */

    function pbEmptyData() {
      return {
        overview: { objectives: null, principles: [] },
        userInsights: { quantitative: null, researchSummary: null, executiveSummary: null },
        handoff: { view: 'component', organisms: [], screens: [], selectedScreenId: null, selectedElementId: null },
        flow: { populated: false },
        erd: { populated: false },
        content: { terms: [], strings: [] },
      };
    }

    // registry.json schema → PB_DATA shape. `components` are the handoff organisms
    // (same object shape); `meta.*` carries the Project Summary content.
    function adaptRegistryToPBData(reg) {
      if (!reg) return pbEmptyData();
      const d = pbEmptyData();
      const m = reg.meta || {};
      if (m.overview)     d.overview     = m.overview;
      if (m.userInsights) d.userInsights = m.userInsights;
      d.handoff.organisms = reg.components || [];
      d.handoff.screens   = reg.screens || [];
      if (reg.flow) d.flow = reg.flow;
      if (reg.erd)  d.erd  = reg.erd;
      if (reg.content) d.content = reg.content;
      return d;
    }

    // ── W3C DTCG token resolver (mirrors pb/tools/tokens.py) ────────────────────────────
    // registry.tokens is a W3C Design Tokens document: each token is { $value, $type? };
    // a group is a nested object (no $value); "{a.b}" is an alias. The doc is usually flat
    // (name == CSS var), but a cloned DS may be nested with aliases. Legacy { value, kind }
    // tokens are still read (graceful degrade, NS6) so an un-migrated registry still styles.
    /* The shared runtime lives in pb/template/runtime.js — ONE copy, injected here and
       into design-system.html by render.py so both sites render components identically.
       It used to be pasted in below, 291 lines that had to be kept in step by hand. */
/*__PB_RUNTIME__*/

    const PB_DATA = adaptRegistryToPBData(PB_REGISTRY);

    /* =========================================================================
       STATE — minimal app state
       Add your prototype's state fields below the metaView line.
       ========================================================================= */
    const state = {
      metaView: 'prototype',          // 'prototype' | 'summary' | 'flow' | 'handoff' | 'erd'
      summarySubTab: 'overview',      // 'overview' | 'insights'
      handoffDrawerOpenFor: null,     // null | <organism.id> — opens right-side drawer (v0.3.0)
      handoffDrawerSegment: 'anatomy', // 'anatomy' | 'spec' | 'uiLogic' | 'usage' (v0.3.17)
      screenDrawerOpenFor: null,      // null | element.id — screen-view element drawer (v0.3.18)
      screenDrawerSegment: 'spec',    // 'spec' | 'uiLogic' | 'demo' (v0.3.18)
      protoDevice: null,              // 'monitor' | 'laptop' | 'tablet' | 'mobile' — defaults from meta.device
      protoShell: null,               // 'browser' | 'app' | 'none' — display chrome; defaults from meta.shell
      protoDeviceB: null,             // compare mode: a SECOND device showing the same screen (v2.0.0)
      protoHistory: [],               // screen-id stack for the browser back button
      protoDirty: false,              // renderPrototype() was asked for while another tab was open — repaint on return
      handoffScope: null,            // 'global' | 'local' — UI Design component sub-tab
      erdView: null,                 // 'diagram' | 'table' — Data tab view mode
      erdVariant: {},                // { <entity>: 'schema' | <mock label> } — per-table data set (4.4)
      contentView: null,             // Content sub-view: 'terms' | 'strings'
      iaOverlaysOpen: true,          // site map: show the overlay rail (collapsible — it is the busiest one)
      uxView: null,                  // UX Design sub-tab: 'ia' | 'flow' | 'logic' (D-14)
      logicView: null,               // 'rules' | 'ripple'
      logicFocus: null,              // { type: 'handler'|'slice'|'item', id }
      erdQuery: '',                  // the Data-tab filter text (D-24). Survives a view repaint
                                     // because the input is rendered into the toolbar, not the rows.
      flowIndex: 0,                  // index into flow.flows[] (multi-flow dropdown)
      activeRole: null,              // resolved meta.defaultRole — the role the sandbox previews as (v1.5)
      /* TODO: add your app state here, e.g.:
         user: null,
         currentScreen: 'home',
         items: [],
      */
    };

    const $  = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    /* Icon helper (DS-agnostic) — set the icon source via registry config.iconCdn (e.g. your
       design system's SVG CDN). Leave it unset to fall back to an inline SVG placeholder. */
    const ICON_CDN = (PB_REGISTRY && PB_REGISTRY.config && PB_REGISTRY.config.iconCdn) || '';
    /* View-only mode (set by /pb:handoff --people): hides every authoring CTA. */
    const VIEW_ONLY = !!(PB_REGISTRY && PB_REGISTRY.config && PB_REGISTRY.config.viewOnly);
    function safeIcon(name, size = 16) {
      if (ICON_CDN) {
        return `<img src="${ICON_CDN}${name}.svg" width="${size}" height="${size}" alt=""
          style="display:inline-block;vertical-align:middle;flex-shrink:0">`;
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true"
        style="display:inline-block;vertical-align:middle;flex-shrink:0">
        <rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
    }

    /* =========================================================================
       RENDER — top-level dispatcher
       ========================================================================= */
    function render() {
      // The Sandbox belongs to the Prototype tab. Leaving it puts the inspector away; coming back
      // to it brings a pinned one back, docked, as it was.
      if (state.metaView !== 'prototype') pbSandboxClose(false);
      renderMetaNav();
      if (state.metaView === 'prototype') {
        renderPrototype();
        if (pbSandboxDocked() && !pbSandboxIsOpen()) pbSandboxOpen(false);
      }
      else renderMetaPanel();
    }

    /* =========================================================================
       META-NAV — 4-tab bar at the top
       ========================================================================= */
    function renderMetaNav() {
      const tabs = [
        ['prototype', 'Prototype'],
        ['summary',   'Project Summary'],
        ['flow',      'UX Design'],
        ['erd',       'Data'],
      ];
      const el = document.getElementById('meta-nav');
      if (!el) return;
      el.className = 'meta-nav pb-bar';
      // Who this is: the project button names the project on every tab (so a screenshot of any of
      // them says which prototype it is) and opens the project's settings. Shared with the DS site
      // (runtime.js), so both sites carry the same thing in the same place.
      const onProto = state.metaView === 'prototype';
      const isMac = /Mac|iPhone|iPad/.test((navigator.platform || '') + ' ' + (navigator.userAgent || ''));
      const kbd = isMac ? '⌘K' : 'Ctrl K';
      el.innerHTML = `<div class="pb-bar-start" id="pb-pj-host"></div><span class="pb-bar-vr" aria-hidden="true"></span>`
        + `<nav class="pb-tabs" role="tablist" aria-label="Surfaces">`
        + tabs.map(([id, label]) =>
          `<button class="meta-tab pb-tab ${state.metaView === id ? 'active' : ''}" role="tab"
                   aria-selected="${state.metaView === id}" data-t="${label}"
                   data-meta-view="${escapeHtmlAttr(id)}" onclick="setMetaView(this.dataset.metaView)">${label}</button>`
        ).join('') + `</nav>`
        + `<div class="pb-bar-end">`
        + `<button class="meta-search pb-bar-item" type="button" onclick="pbOpenSearch()" aria-keyshortcuts="${isMac ? 'Meta+K' : 'Control+K'}"
                   aria-label="Search everything (${kbd})" title="Search rules, jobs, screens, components, test cases, terms and commands (${kbd})">`
        + `${pbUiIcon('search')}<span class="pb-bar-lb">Search</span><span class="pb-kbd" aria-hidden="true">${kbd}</span></button>`
        + (onProto ? `<button class="meta-sandbox pb-bar-item" type="button" onclick="pbSandboxToggle(true)"
                   aria-expanded="${pbSandboxIsOpen()}" aria-controls="pb-insp" aria-keyshortcuts="S"
                   aria-label="Sandbox" title="Sandbox (S) — device, chrome, compare, role, scenarios">`
          + `${pbUiIcon('hourglass', 'pb-ico--lg')}<span class="pb-bar-lb">Sandbox</span></button>` : '')
        + pbDsLink() + `</div>`;
      pbUiMountProjectButton(document.getElementById('pb-pj-host'), {
        meta: (PB_REGISTRY && PB_REGISTRY.meta) || {}, version: PB_SHELL_VERSION,
        onSettings: function (btn) { pbOpenProjectSettings(btn); },
      });
      pbTabsFit(el.querySelector('.pb-tabs'));
    }

    /* A narrow bar scrolls its tabs sideways (chrome.css). A scroller with no sign of more looked
       like a bar that only had two tabs, so the clipped edge fades, and the tab you are on is
       always scrolled into view. */
    function pbTabsFit(strip) {
      if (!strip) return;
      const mark = function () {
        const max = strip.scrollWidth - strip.clientWidth;
        strip.classList.toggle('is-clip-l', max > 1 && strip.scrollLeft > 1);
        strip.classList.toggle('is-clip-r', max > 1 && strip.scrollLeft < max - 1);
      };
      const act = strip.querySelector('.pb-tab.active');
      if (act && strip.scrollWidth > strip.clientWidth) {
        strip.scrollLeft = Math.max(0, act.offsetLeft - strip.offsetLeft - (strip.clientWidth - act.offsetWidth) / 2);
      }
      strip.addEventListener('scroll', mark, { passive: true });
      mark();
      if (!pbTabsFit._rs) {
        pbTabsFit._rs = true;
        window.addEventListener('resize', function () { pbTabsFit(document.querySelector('#meta-nav .pb-tabs')); });
      }
    }

    /* One registry, two sites — and until now only one of them was reachable. Links to the
       design-system site served beside this one by /pb:preview.

       Two constraints, both load-bearing:
       - It must NOT carry `.meta-tab`. Two tests assert that class appears exactly 4 times;
         this is a second SITE, not a fifth tab, so `.meta-ds-link` is the honest class anyway.
       - It is PROTOCOL-GATED. A `--people` hand-off is opened over file://, where there is no
         server and /design-system 404s. A link that is dead in the most-shared artifact pb
         produces is worse than no link. */
    function pbDsLink() {
      if (!/^https?:$/.test(location.protocol)) return '';
      /* Opens in a NEW TAB. The two sites are peers, not a flow: you go to the workbench to
         check a component and come back to the screen you were reading, and a same-tab jump
         costs you the tab, the scroll and the active role. `rel="noopener"` because
         `target="_blank"` otherwise hands the opened page a live `window.opener`. */
      return `<a class="meta-ds-link pb-bar-item" href="/design-system" target="_blank" rel="noopener"
            aria-label="Design system (opens in a new tab)"
            title="The component workbench — every component as a live demo + variant grid. Opens in a new tab.">
           <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
           <span class="pb-bar-lb">Design system</span>
           <svg class="meta-ds-out" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>
         </a>`;
    }

    /* Every tab remembers where you were in it. Switching away and back used to drop you at the top
       (setMetaView even asked for it), so reading something far down a long tab, checking another
       one, and returning meant scrolling to find your place again. A tab's position is keyed by
       every state field that picks a view; a tab not visited yet opens at the top. */
    const PB_SCROLL_SEL = ['.summary-scroll', '.lg-list-wrap', '.lg-detail', '.tc-list', '.tc-panel'];
    const PB_SCROLL_MEM = {};
    function pbScrollKey() {
      return [state.metaView, state.summarySubTab, state.metaView === 'flow' ? pbUxView() : '', state.logicView, state.erdView].join('|');
    }
    function pbScrollSnap() {
      const o = { y: window.scrollY };
      PB_SCROLL_SEL.forEach(sel => { const el = document.querySelector(sel); if (el) o[sel] = [el.scrollTop, el.scrollLeft]; });
      return o;
    }
    function pbScrollPut(o) {
      window.scrollTo({ top: o ? o.y : 0 });
      PB_SCROLL_SEL.forEach(sel => {
        const el = document.querySelector(sel), v = o && o[sel];
        if (el && v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; }
      });
    }
    function pbTabSwitch(fn) {
      PB_SCROLL_MEM[pbScrollKey()] = pbScrollSnap();
      fn();
      pbScrollPut(PB_SCROLL_MEM[pbScrollKey()]);
    }
    function setMetaView(v) { pbTabSwitch(() => { state.metaView = v; render(); }); }
    function setSummarySubTab(v) { pbTabSwitch(() => { state.summarySubTab = v; renderMetaSummary(); }); }
    function setHandoffScope(v) { state.handoffScope = v; renderHandoff(); }
    function setErdView(v) { pbTabSwitch(() => { state.erdView = v; renderMetaERD(); }); }
    function setErdVariant(entity, key) { state.erdVariant = state.erdVariant || {}; state.erdVariant[entity] = key; renderMetaERD(); }
    function setFlowIndex(i) { state.flowIndex = parseInt(i, 10) || 0; renderMetaFlow(); }
    function openHandoffDrawer(id) { state.handoffDrawerOpenFor = id; state.handoffDrawerSegment = 'anatomy'; renderHandoff(); }
    function closeHandoffDrawer() { state.handoffDrawerOpenFor = null; renderHandoff(); }
    function setHandoffDrawerSegment(s) { state.handoffDrawerSegment = s; renderHandoff(); }
    function openScreenDrawer(id) { state.screenDrawerOpenFor = id; state.screenDrawerSegment = 'spec'; renderHandoff(); }
    function closeScreenDrawer() { state.screenDrawerOpenFor = null; renderHandoff(); }
    function setScreenDrawerSegment(s) { state.screenDrawerSegment = s; renderHandoff(); }
    function openComponentTab(orgId) { state.screenDrawerOpenFor = null; setHandoffView('component'); setTimeout(function(){ openHandoffDrawer(orgId); }, 60); }

    /* Copy a command to clipboard + show a toast + flash the source button.
       `btn` is optional — pass the clicked button element for inline ✓ Copied feedback.
       `dest` is optional — 'claude' | 'terminal' | 'auto' (default). Auto-detect by
       command prefix: starts with '/' → Claude Code; else → Terminal. (v0.3.3) */
    function copyAndToast(command, label, btn, dest) {
      const destination = (function () {
        const d = (dest || 'auto').toLowerCase();
        if (d === 'claude') return 'Claude Code';
        if (d === 'terminal') return 'Terminal';
        return command.trim().startsWith('/') ? 'Claude Code' : 'Terminal';
      })();
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = command;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { /* silent */ }
        document.body.removeChild(ta);
      };
      const flashBtn = () => {
        if (!btn || btn._syncFlashing) return;
        btn._syncFlashing = true;
        const original = btn.innerHTML;
        btn.innerHTML = '✓ Copied';
        btn.classList.add('is-copied');
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = original;
          btn.classList.remove('is-copied');
          btn.disabled = false;
          btn._syncFlashing = false;
        }, 1500);
      };
      const showToast = (ok) => {
        document.querySelectorAll('.sync-toast').forEach(prev => prev.remove());
        const t = document.createElement('div');
        t.className = 'sync-toast';
        t.textContent = ok
          ? `Copied — paste with ⌘V to run "${command}"`
          : `Copy failed. Command: ${command}`;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add('is-visible'), 10);
        setTimeout(() => {
          t.classList.remove('is-visible');
          setTimeout(() => t.remove(), 220);
        }, 5000);
      };
      flashBtn();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(command).then(() => showToast(true), () => { fallback(); showToast(true); });
      } else {
        fallback(); showToast(true);
      }
    }

    /* Esc closes the handoff drawer. */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (state.handoffDrawerOpenFor) closeHandoffDrawer();
        else if (state.screenDrawerOpenFor) closeScreenDrawer();
      }
    });

    /* ===========================================================================
       v0.3.5 — Copy popover. Replaces the old fire-and-forget toast for sync /
       generate CTAs. Opens an anchored card with the command, a copy icon,
       a "✓ Copied" status line, and clear destination guidance (Claude Code
       conversation vs Terminal). Auto-copies on open; users can re-copy via
       the icon button. Close: × / click outside / Esc.
       =========================================================================== */
    const COPY_POPOVER_ICONS = {
      copy:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      claude:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
      terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="6 9 9 12 6 15"/><line x1="12" y1="15" x2="16" y2="15"/></svg>',
      close:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',

    /* v0.3.7 — One command, two representations.
       Terminal gets the slash form. Chat input gets a short natural-language
       prompt that mentions the command name as a keyword — Claude follows
       the routing rule in CLAUDE.md to find and execute the actual body. */

    const COMMAND_HINTS = {
      '/pb:init':        'Scaffold the project — PRD intake, stack + DS locks, seeds registry.json.',
      '/pb:specify':     'Write the spec — prototype-shaped user stories with JTBD and tab mapping.',
      '/pb:clarify':     'Capture user insights and UI-logic trade-offs into the Project Summary.',
      '/pb:plan':        'Generate the implementation plan and per-tab task breakdown.',
