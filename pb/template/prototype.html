          <thead><tr><th>${pbEscape(r.rowLabel || 'role')}</th>${(r.cols || []).map(c => `<th>${pbEscape(c)}</th>`).join('')}</tr></thead>
          <tbody>${(r.rows || []).map(row => `<tr><td><strong>${pbEscape(row)}</strong></td>${(r.cols || []).map(c => `<td>${cell((r.cells[row] || {})[c])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>`;
    }

    /* Ripple. Pick a handler, a store slice or a component; see what it touches and what
       touches it. Every fact here is derived from the bodies — nothing is authored. */
    function pbRenderLogicRipple(L) {
      if (!state.logicFocus) {
        const firstSave = (L.handlers || []).find(h => h.isSave);
        state.logicFocus = firstSave ? { type: 'handler', id: firstSave.name } : { type: 'none', id: '' };
      }
      const f = state.logicFocus;
      const H = {}; (L.handlers || []).forEach(h => { H[h.name] = h; });
      const I = {}; (L.items || []).forEach(i => { I[i.id] = i; });
      const row = (type, id, label, meta) =>
        `<div class="logic-row ${f.type === type && f.id === id ? 'active' : ''}" data-k="${pbEscape((id + ' ' + (label || '')).toLowerCase())}" onclick="pbLogicGo('${type}','${pbEscape(id)}')">`
        + `<span>${pbEscape(label || id)}</span>${meta ? `<span class="lg-dim">${pbEscape(meta)}</span>` : ''}</div>`;
      const group = (title, rows) => rows.length
        ? `<div class="logic-group"><div class="lg-group-h">${title} <span class="meta-subtab-count">${rows.length}</span></div>${rows.join('')}</div>` : '';

      const saves = (L.handlers || []).filter(h => h.isSave);
      const shared = (L.handlers || []).filter(h => h.exported && !h.isSave);
      const withLogic = (L.items || []).filter(i => (i.ownLogic || []).length || (i.wires || []).length);
      const list = `<div class="lg-list-wrap">
          <input class="lg-search" placeholder="Filter…" oninput="pbLogicFilter(this)" autocomplete="off">
          <div id="logic-list">
            ${group('Screens', (L.items || []).filter(i => i.kind === 'screen').map(i => row('item', i.id, i.id, `${(i.ownLogic || []).length} fns`)))}
            ${group('Store slices', Object.keys(L.slices || {}).map(k => row('slice', k, k, `${(L.slices[k].writers || []).length}w · ${(L.slices[k].readers || []).length}r`)))}
            ${group('Save handlers', saves.map(h => row('handler', h.name, h.name + '()', pbLgBase(h.file))))}
            ${group('Components with logic', withLogic.filter(i => i.kind === 'component').map(i => row('item', i.id, i.id, `${(i.ownLogic || []).length} fns`)))}
            ${group('Shared helpers', shared.map(h => row('handler', h.name, h.name + '()', `${(h.calledFrom || []).length} files`)))}
          </div></div>`;

      let detail = `<p class="meta-p lg-dim">Pick something on the left.</p>`;
      if (f.type === 'handler' && H[f.id]) detail = pbRippleHandler(H[f.id], H, I, L);
      else if (f.type === 'slice' && (L.slices || {})[f.id]) detail = pbRippleSlice(f.id, L.slices[f.id], H);
      else if (f.type === 'item' && I[f.id]) detail = pbRippleItem(I[f.id], H, L);
      return `<div class="lg-ripple">${list}<div class="lg-detail">${detail}</div></div>`;
    }

    function pbLgSec(title, body) {
      return body ? `<div class="lg-sec"><div class="lg-sec-h">${title}</div><div>${body}</div></div>` : '';
    }

    function pbRippleHandler(h, H, I, L) {
      const byProd = {};
      (h.reads || []).forEach(r => {
        const k = (r.producers || []).length ? r.producers.join(', ') : '∅ nothing emits this';
        (byProd[k] = byProd[k] || []).push(r);
      });
      const reads = Object.keys(byProd).map(prod => {
        const rs = byProd[prod];
        const who = prod.charAt(0) === '∅'
          ? `<span class="lg-warn">${pbEscape(prod)}</span>`
          : prod.split(', ').map(p => I[p] ? pbLgLink('item', p) : pbEscape(p)).join(', ');
        return `<div class="lg-line">${who} <span class="lg-dim">→</span> `
          + rs.map(r => pbLgChip((r.kind === 'id' ? '#' : r.kind === 'class' ? '.' : 'data-') + r.token,
              (r.producers || []).length ? '' : 'lg-chip--dead')).join(' ') + `</div>`;
      }).join('');
      const calls = Object.keys(h.calls || {}).map(n =>
        pbLgLink('handler', n, n + '()') + `<span class="lg-dim"> ${pbEscape(H[n] ? pbLgBase(H[n].file) : '')}${h.calls[n] > 1 ? ' ×' + h.calls[n] : ''}</span>`).join(', ');
      const then = (h.toast ? ['toast'] : []).concat((h.nav || []).map(n => 'go → ' + n), h.rerender || []);
      const rules = (L.rules || []).filter(r => (r.implementedBy || []).includes(h.name) || (r.readers || []).includes(h.name));
      return `<div class="meta-h3">${pbEscape(h.name)}() ${h.isSave ? pbLgChip('save', 'lg-chip--save') : h.exported ? pbLgChip('shared helper', 'lg-chip--kind') : pbLgChip('local')}</div>
        <p class="meta-p lg-dim">${pbEscape(h.file)}:${h.line} · ${h.length} lines · owned by ${(h.owners || []).map(o => pbLgLink('item', o.id, o.id)).join(', ') || '<span class="lg-dim">—</span>'}</p>
        ${pbLgSec('Rules', rules.map(r => `<a class="lg-link" href="#" onclick="pbSetLogicView('rules');return false">${pbEscape(r.title)}</a> <span class="lg-dim">${(r.implementedBy || []).includes(h.name) ? 'implements' : 'reads'}</span>`).join('<br>'))}
        ${pbLgSec('Guards', (h.guards || []).map(g => pbLgLink('handler', g, g + '()')).join(' → '))}
        ${pbLgSec('Reads from the DOM', reads)}
        ${pbLgSec('Store', (h.slices || []).map(s => pbLgLink('slice', s, s, (h.writes || []).includes(s) ? 'lg-link--write' : '')
            + ` <span class="lg-dim">${(h.writes || []).includes(s) ? 'write' : 'read'}`
            + ((h.via || {})[s] ? ' via ' + pbEscape(h.via[s].join(', ')) + '()' : '') + `</span>`).join('<br>'))}
        ${pbLgSec('Calls (other files)', calls)}
        ${pbLgSec('Then', then.map(t => pbLgChip(t)).join(' '))}
        ${pbLgSec('Wired from markup in', (h.wiredInline || []).map(x => pbEscape(pbLgBase(x))).join(', '))}
        ${pbLgSec('Called from', (h.calledFrom || []).map(x => pbEscape(pbLgBase(x))).join(', '))}`;
    }

    function pbRippleSlice(name, s, H) {
      const li = ns => ns.map(n => `<div class="lg-line">${pbLgLink('handler', n, n + '()')} <span class="lg-dim">${pbEscape(H[n] ? pbLgBase(H[n].file) : '')}</span> ${H[n] && (H[n].rerender || []).length ? pbLgChip(H[n].rerender[0]) : ''}</div>`).join('');
      const owners = [...new Set((s.writers || []).concat(s.readers || []).flatMap(n => ((H[n] || {}).owners || []).map(o => o.id)).filter(Boolean))];
      return `<div class="meta-h3">store.${pbEscape(name)} ${pbLgChip('slice', 'lg-chip--kind')}</div>
        <p class="meta-p lg-dim">A session-store slice. Change its shape and every writer and reader below is affected.</p>
        ${pbLgSec(`Writers (${(s.writers || []).length})`, li(s.writers || []))}
        ${pbLgSec(`Readers (${(s.readers || []).length})`, li(s.readers || []))}
        ${pbLgSec('Surfaces touched', owners.map(o => pbLgLink('item', o)).join(', '))}`;
    }

    // The AUTHORED half of the schema-11 logic contract (logic/<kind>/<id>.json). Derivation
    // traces which slices a file READS, but not which it MUTATES — the mutation happens inside
    // a store helper — so `writes[]` is the one thing a human has to state, and this is where
    // stating it pays off. Absent (no contract, nothing authored) renders nothing at all.
    function pbContract(it) {
      const C = (window.PB_LOGIC || {}).contracts || {};
      return C[(it.kind === 'screen' ? 'screens/' : 'components/') + it.id] || null;
    }

    /* A screen is pure composition by pb's own atomic law, so "logic defined in this file" is
       legitimately 0 for a well-built one — and the item card then had nothing to say about it.
       The behaviour is a level down, in what it composes. Walk that tree and name it, so a screen
       answers "what can happen here?" instead of listing component names.
       Deliberately NOT the same as counting nested functions: a file's private markup helpers
       (esc, stack, subHeading) are not behaviour, and promoting them would bury the signal. */
    function pbComposedLogic(it, L) {
      const I = {};
      (L.items || []).forEach(i => { I[i.id] = i; });
      const seen = new Set([it.id]);
      const out = [];
      (function walk(id, depth) {
        if (depth > 4) return;
        ((I[id] || {}).composes || []).forEach(cid => {
          if (seen.has(cid)) return;
          seen.add(cid);
          if ((I[cid] || {}).ownLogic && I[cid].ownLogic.length) out.push(I[cid]);
          walk(cid, depth + 1);
        });
      })(it.id, 0);
      return out;
    }

    function pbRippleItem(it, H, L) {
      const rules = (L.rules || []).filter(r => (r.displayedIn || []).includes(it.id));
      const li = ns => ns.map(n => pbLgLink('handler', n, n + '()')).join(', ');
      const composedLogic = pbComposedLogic(it, L);
      const composedSec = composedLogic.map(c => {
        const fns = c.ownLogic || [];
        return `<div class="lg-line">${pbLgLink('item', c.id)} `
          + `<span class="lg-dim">${fns.length} fn${fns.length === 1 ? '' : 's'}</span> `
          + fns.slice(0, 6).map(n => pbLgLink('handler', n, n + '()')).join(', ')
          + (fns.length > 6 ? ` <span class="lg-dim">+${fns.length - 6}</span>` : '')
          + `</div>`;
      }).join('');
      // An item with no logic of its own AND none in anything it composes is a real finding, not
      // an empty panel — say so rather than rendering nothing.
      const inert = !(it.ownLogic || []).length && !composedLogic.length && (it.composes || []).length
        ? `<div class="lg-line lg-dim">Composes ${it.composes.length} component${it.composes.length === 1 ? '' : 's'}, none of which define behaviour — this surface is presentational. Any action here is passed in by whatever renders it.</div>`
        : '';
      const c = pbContract(it) || {};
      const declared = (c.writes || []).map(w => pbLgChip('store.' + w, 'lg-chip--kind')).join(' ');
      const affords = (c.affordances || []).map(a =>
        `<div class="lg-line"><b>${pbEscape(a.id || a.name || '')}</b> <span class="lg-dim">${pbEscape(a.why || '')}</span></div>`).join('');
      return `<div class="meta-h3">${pbEscape(it.id)} ${pbLgChip(it.kind === 'screen' ? 'screen' : (it.level || '?') + ' · ' + (it.scope || '?'), 'lg-chip--kind')}</div>
        <p class="meta-p lg-dim">${pbEscape(it.file || '')} · ${it.lines} lines${it.hasRules ? ` · ${it.hasRules} :has() rules` : ''}</p>
        ${pbLgSec('Declared writes', declared)}
        ${pbLgSec('Affordances — and why', affords)}
        ${pbLgSec('Rules displayed here', rules.map(r => `<a class="lg-link" href="#" onclick="pbSetLogicView('rules');return false">${pbEscape(r.title)}</a>`).join('<br>'))}
        ${pbLgSec(`Composed by (${(it.composedBy || []).length})`, (it.composedBy || []).map(c => pbLgLink('item', c)).join(', '))}
        ${pbLgSec(`Composes (${(it.composes || []).length})`, (it.composes || []).map(c => pbLgLink('item', c)).join(', '))}
        ${pbLgSec(`Behaviour reachable through what it composes (${composedLogic.length})`, composedSec)}
        ${inert}
        ${pbLgSec('Handlers wired in its markup', li(it.wires || []))}
        ${pbLgSec('Handlers that read its DOM', li(it.readBy || []))}
        ${pbLgSec(`Logic defined in this file (${(it.ownLogic || []).length})`, li(it.ownLogic || []))}`;
    }

    function pbEscape(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')   // safe inside double-quoted attributes (title="…")
        .replace(/'/g, '&#39;');   // safe inside single-quoted onclick handlers (…('${pbEscape(id)}'))
    }

    /* =========================================================================
       TAB 3 — USER FLOW
       Zoomable canvas with a custom SVG diagram. Edit `buildFlowSvg()` below
       to add your prototype's screens, decisions, and transitions.
       ========================================================================= */
    /* QA test-case lenses — categories a scenario / coverage-gap can be tagged with. */
    const QA_CAT_LABEL = { ux: 'UX', ui: 'UI', function: 'Function', business: 'Business', 'system-edge': 'System edge' };
    // A scenario carrying a .test block shows its last-run status glyph (✓ pass · ✗ fail ·
    // ○ untested); a scenario without .test stays a manual ☐. Shared by the Test Cases tab
    // and the subtab badge count.
    /* The verdict of one scenario, as the glyph and the words behind it. */
    function pbScStatus(sc) {
      if (!(sc && typeof sc === 'object' && sc.test)) return { st: 'manual', glyph: '☐', label: 'Manual' };
      const lr = sc.lastResult || {};
      const stale = pbResultStale(lr);
      const st = !lr.status ? 'untested' : stale ? 'stale'
        : lr.status === 'pass' ? 'pass' : lr.status === 'fail' ? 'fail' : 'untested';
      return {
        st, stale, lr,
        glyph: st === 'pass' ? '✓' : st === 'fail' ? '✗' : st === 'stale' ? '⟳' : '○',
        label: st === 'pass' ? 'Passed' : st === 'fail' ? 'Failed'
          : st === 'stale' ? (stale === 'unknown'
              ? 'Ran before input tracking existed — re-run to confirm'
              : 'Stale — the code changed since this ran: ' + stale)
          : 'Not run yet'
      };
    }

    /* A scenario runs to 2,400 characters on a real project — the requirement, the steps, the
       measurement discipline and the reasoning, all in one string. So the list shows a CARD (the
       claim, the verdict, the shape of the run) and the whole thing opens in the detail panel. */
    const scenarioLi = (sc, key, story) => {
      const text = (typeof sc === 'string') ? sc : (sc && sc.text) || '';
      const cat = (sc && typeof sc === 'object') ? sc.category : null;
      const t = (sc && typeof sc === 'object' && sc.test) || null;
      const s = pbScStatus(sc);
      const n = (c, one) => c + ' ' + one + (c === 1 ? '' : 's');
      const sub = t
        ? [t.start ? 'from ' + t.start : '', n((t.steps || []).length, 'step'),
           n((t.expect || []).length, 'expect'), (t.roles || []).length ? 'as ' + t.roles.join(', ') : '']
            .filter(Boolean).join(' · ')
        : 'No test block — verified by hand';
      return pbTcCard({ key, cat, date: pbGapDate(text), head: pbGapHead(text),
                        glyph: s.glyph, st: s.st, title: s.label, sub, story });
    };

    /* One card: the verdict, the lens, the claim, and one dim line saying what running it involves.
       Everything else is in the panel — a card you cannot scan is just a paragraph with a border. */
    function pbTcCard(o) {
      const on = state.tcOpen === o.key;
      const chip = o.cat ? `<span class="pb-qa-cat pb-qa-cat--${pbEscape(o.cat)}">${pbEscape(QA_CAT_LABEL[o.cat] || o.cat)}</span>` : '';
      const badge = o.badge ? `<span class="gap-status">${pbEscape(o.badge)}</span>` : '';
      return `<li><button class="tc-card${on ? ' is-open' : ''}${o.settled ? ' is-settled' : ''}" type="button"
            onclick="pbOpenTc('${o.key}')" aria-expanded="${on}">
          <span class="tc-card-top">
            <span class="pb-test-glyph${o.st ? ' pb-test-glyph--' + o.st : ''}" title="${escapeHtmlAttr(o.title || '')}">${o.glyph || ''}</span>
            ${badge}${chip}
            ${o.date ? `<span class="gap-date">${pbEscape(o.date)}</span>` : ''}
          </span>
          <span class="tc-card-head">${pbEscape(o.head)}</span>
          ${o.sub ? `<span class="tc-card-sub">${pbEscape(o.sub)}</span>` : ''}
        </button></li>`;
    }
    /* Is this verdict still about the code that is here now? Returns '' when it is current, or
       a reason string when it is not — the screens whose bodies moved, or 'unknown' for a result
       written before inputs were recorded, which cannot be shown as green without asserting
       something nobody checked. */
    function pbResultStale(lr) {
      if (!lr || !lr.status || lr.status === 'untested') return '';
      const live = (window.PB_LOGIC || {}).itemHash;
      if (!live) return '';                       // no derived graph — claim nothing
      if (!lr.inputs) return 'unknown';
      const moved = Object.keys(lr.inputs).filter(id => (live[id] || '') !== lr.inputs[id]);
      return moved.length ? moved.join(', ') : '';
    }

    function pbTestCounts() {
      const fStories = (PB_DATA.flow && PB_DATA.flow.stories) || [];
      let total = 0, pass = 0, manual = 0, stale = 0;
      fStories.forEach(s => (s.scenarios || []).forEach(sc => {
        if (sc && typeof sc === 'object' && sc.test) {
          total++;
          if (pbResultStale(sc.lastResult)) stale++;
          else if (sc.lastResult && sc.lastResult.status === 'pass') pass++;
        }
        else manual++;
      }));
      return { total, pass, manual, stale };
    }
    // A coverage warning may declare it is no longer an open gap. Anything else — including no
    // status at all — is `open`, so a project that never authored the field is unchanged.
    const GAP_SETTLED = { resolved: 'Resolved', accepted: 'Accepted' };
    // One open card at a time — gaps key on 'g<i>', scenarios on 's<story>-<n>'. Clicking the open
    // card closes it, so the same control that opened the panel also dismisses it.
    function pbOpenTc(k) { state.tcOpen = (k && state.tcOpen === k) ? null : k; renderMetaFlow(); }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && state.tcOpen) { state.tcOpen = null; renderMetaFlow(); }
    });

    /* A gap note is a paragraph — 2,000 characters on a real project — and 22 paragraphs is not a
       list, it is an essay. The row needs a LABEL, so derive the note's opening claim: the earliest
       strong break at least 24 characters in. The minimum matters: breaking at the first delimiter
       yields "Cổng trọng số" or "Tình huống", fragments that identify nothing. Delimiters are
       punctuation, not words, so this holds in any language. An authored `title` always wins. */
    const GAP_DELIMS = [' — ', ' – ', '. ', ': ', ' (', ', ', '; '];
    function pbGapHead(note) {
      const n = (note || '').trim();
      const ps = GAP_DELIMS.map(d => n.indexOf(d)).filter(p => p > 0).sort((a, b) => a - b);
      let h = null;
      for (let k = 0; k < ps.length; k++) { if (ps[k] >= 24) { h = n.slice(0, ps[k]); break; } }
      if (h === null) h = n.length > 110 ? n.slice(0, 110) : n;
      // Never end mid-parenthesis: close it when the end is near, else drop the parenthetical.
      if ((h.match(/\(/g) || []).length > (h.match(/\)/g) || []).length) {
        const c = n.indexOf(')', h.length);
        h = (c > 0 && c - h.length < 60) ? n.slice(0, c + 1) : h.slice(0, h.lastIndexOf('('));
      }
      return h.replace(/[\s,;:—–.]+$/, '');
    }
    // The one field in a findings list that differs row to row and needs no translation.
    function pbGapDate(note) { const m = /\d{4}-\d{2}-\d{2}/.exec(note || ''); return m ? m[0] : ''; }

    /* ── Reading a test case ───────────────────────────────────────────────────
       An author writing a 2,400-character note is not writing badly; they are
       recording a requirement, the cases it covers, what was measured and why.
       That structure is already in the text — newlines separate the blocks, `·`
       opens a bullet, backticks mark code, and ALL-CAPS is how this author says
       "look here". The panel renders that structure instead of flattening it.

       Emphasis is REPORTED, never invented: a run is bold because the author
       capitalised it. Single short caps words are left alone — HR, KPI, UI and
       PRD are nouns, not shouting, and bolding them would drown the real
       emphasis in the same paragraph. */
    function pbEmph(t) {
      let h = pbEscape(t);
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');   // the author's own bold, honoured
      // A caps RUN of 2+ words, or a single caps word of 4+ letters. The hyphen guards keep it out
      // of identifiers — `T-ROLE-EL` and `KHÔNG-admin` are names, and bolding half a name is noise.
      h = h.replace(/(?<![\p{L}\p{M}\d-])\p{Lu}[\p{Lu}\p{M}\d]+(?:[  ]\p{Lu}[\p{Lu}\p{M}\d]*)*(?![\p{L}\p{M}\d-])/gu, m => {
        const words = m.trim().split(/\s+/);
        const letters = m.replace(/[^\p{L}]/gu, '').length;
        return (words.length > 1 || letters >= 4) ? '<strong>' + m + '</strong>' : m;
      });
      return h;
    }
    /* Not every author uses newlines — on the reference project all 22 coverage notes are one
       unbroken run of up to 2,057 characters. But they DO mark their sections: a sentence that
       opens with an ALL-CAPS run ("CẬP NHẬT 2026-08-10", "MỨC ĐỘ KIỂM:") is a new thought. Break
       long blocks there, so a note that was written as one paragraph still reads as several. */
    const TC_SECTION = /(?<=[.:])\s+(?=\p{Lu}[\p{Lu}\p{M}\d]+(?:[  ]\p{Lu}[\p{Lu}\p{M}\d]*)*[\s:,])/gu;
    function pbProseHTML(s) {
      const out = []; let bul = [];
      const flush = () => { if (bul.length) { out.push('<ul class="tc-ul">' + bul.join('') + '</ul>'); bul = []; } };
      (s || '').split(/\n+/).forEach(ln => {
        const t = ln.trim();
        if (!t) return;
        if (/^[·•▪–-]\s+/.test(t)) { bul.push('<li>' + pbEmph(t.replace(/^[·•▪–-]\s+/, '')) + '</li>'); return; }
        flush();
        (t.length > 400 ? t.split(TC_SECTION) : [t]).forEach(p => {
          if (p.trim()) out.push('<p>' + pbEmph(p.trim()) + '</p>');
        });
      });
      flush();
      return out.join('');
    }
    /* A step and an expect are data. Said as sentences they are a test plan someone can read
       without learning the vocabulary first — and the bold is the part being asserted. */
    const TC_STEP_VERB = { fill: 'Fill', click: 'Click', nav: 'Navigate via', submit: 'Submit',
                           'toggle-password': 'Toggle the password on', back: 'Go back' };
    function pbStepText(s) {
      const v = TC_STEP_VERB[s && s.do] || (s && s.do) || '';
      if (s && s.do === 'back') return v;
      const tgt = s && s.target ? ` <strong>${pbEscape(s.target)}</strong>` : '';
      const val = s && s.value != null ? ` with <strong>"${pbEscape(String(s.value))}"</strong>` : '';
      return v + tgt + val;
    }
    function pbExpectText(e) {
      if (!e || typeof e !== 'object') return pbEscape(String(e));
      if (e.screen) return `Lands on screen <strong>${pbEscape(e.screen)}</strong>`;
      if (e.text) return `The frame reads <strong>"${pbEscape(e.text)}"</strong>`;
      if (e.toast) return `A toast says <strong>"${pbEscape(e.toast)}"</strong>`;
      if (e.present) return `<strong>${pbEscape(e.present)}</strong> is present`;
      if (e.absent) return `<strong>${pbEscape(e.absent)}</strong> is absent`;
      if (e['no-console-error']) return 'No console error fires';
      if (e.errors) return e.errors.count != null
        ? `Exactly <strong>${pbEscape(String(e.errors.count))}</strong> field errors show`
        : `At least <strong>${pbEscape(String(e.errors.min))}</strong> field errors show`;
      return pbEscape(JSON.stringify(e));
    }
    function pbRenderTestCases() {
      const f = (PB_DATA && PB_DATA.flow) || {};
      const fStories = f.stories || [];
      if (!fStories.length) {
        return pbUxEmpty('No test cases yet',
          'Test cases ride the user flow — each story carries a checklist of scenarios across the UX, UI, Function, Business and System-edge lenses. Generate the user flow first.',
          'Generate user flow', '/pb:plan --flow');
      }
      const tc = pbTestCounts();
      const runTestsBtn = VIEW_ONLY ? '' :
        `<button class="pb-test-run-btn" type="button" onclick="openCopyPopover('/pb:test', this)" title="Copy the /pb:test command">Run tests</button>`;
      const warns = (f.coverageWarnings || []).map((w, i) => {
        const o = (typeof w === 'string') ? { note: w } : (w || {});
        const status = GAP_SETTLED[o.status] ? o.status : 'open';
        return { i, note: o.note || '', title: o.title || '', category: o.category || null, status };
      });
      const open = warns.filter(w => w.status === 'open');
      const settled = warns.filter(w => w.status !== 'open');
      const testsHeader = `<div class="pb-test-head"><span class="pb-test-summary">${tc.pass}/${tc.total} passing · ${tc.manual} manual${tc.stale ? ` · <span class="lg-warn">${tc.stale} stale</span>` : ''}${open.length ? ` · <span class="lg-warn">${open.length} coverage gaps</span>` : ''}${settled.length ? ` · ${settled.length} settled` : ''}</span>${runTestsBtn}</div>`;
      // A gap is a test case too — same card, same panel. It carries no run, so its sub-line says
      // what kind of record it is rather than how it would execute.
      const gapLi = w => pbTcCard({
        key: 'g' + w.i, cat: w.category, date: pbGapDate(w.note),
        head: w.title || pbGapHead(w.note), glyph: '⚑', st: 'gap',
        title: 'Coverage gap', settled: w.status !== 'open',
        badge: w.status !== 'open' ? GAP_SETTLED[w.status] : '',
        sub: w.status === 'open' ? 'Not covered by any scenario'
           : w.status === 'resolved' ? 'Resolved — kept as the record'
           : 'Accepted by decision — not a gap'
      });
      const warnBlock = (open.length ? `<ul class="tc-cards">${open.map(gapLi).join('')}</ul>` : '')
        + (settled.length ? `<div class="flow-doc-gaps-sep">Settled — resolved or accepted by decision</div>`
            + `<ul class="tc-cards">${settled.map(gapLi).join('')}</ul>` : '');
      const testsList = '<ol class="flow-doc-stories">' + fStories.map((s, si) =>
          `<li><strong>${pbEscape(s.title||'')}</strong><ul class="tc-cards">`
          + (s.scenarios||[]).map((sc, j) => scenarioLi(sc, 's' + si + '-' + j, s.title || '')).join('')
          + '</ul></li>').join('') + '</ol>';
      return `<div class="tc-split${state.tcOpen ? ' is-open' : ''}">
          <div class="meta-section tc-list">
            <div class="meta-h2">3.4 Test Cases</div>
            ${testsHeader}
            ${testsList}
            ${warnBlock}
          </div>
          ${pbTcPanel()}
        </div>`;
    }

    /* The detail panel — half the screen, because the thing it shows is half the work. It is the
       one place the whole authored text appears, structured rather than dumped: the verdict and
       why it is the verdict, then the run said as sentences, then the author's own notes with
       their own emphasis kept. */
    function pbTcPanel() {
      const k = state.tcOpen;
      if (!k) return '';
      const f = (PB_DATA && PB_DATA.flow) || {};
      let head = '', cat = null, text = '', story = '', sc = null, badge = '', kind = '';
      if (k[0] === 'g') {
        const w = (f.coverageWarnings || [])[+k.slice(1)];
        const o = (typeof w === 'string') ? { note: w } : (w || {});
        text = o.note || ''; cat = o.category || null; kind = 'Coverage gap';
        head = o.title || pbGapHead(text);
        badge = GAP_SETTLED[o.status] || '';
        if (o.title) text = o.note; else text = text;            // title authored → note is the body
      } else {
        const m = /^s(\d+)-(\d+)$/.exec(k); if (!m) return '';
        const st = (f.stories || [])[+m[1]] || {};
        sc = (st.scenarios || [])[+m[2]];
        text = (typeof sc === 'string') ? sc : (sc && sc.text) || '';
        cat = (sc && typeof sc === 'object') ? sc.category : null;
        story = st.title || ''; head = pbGapHead(text); kind = 'Test case';
      }
      const s = sc ? pbScStatus(sc) : { st: 'gap', glyph: '⚑', label: 'Coverage gap' };
      const t = (sc && typeof sc === 'object' && sc.test) || null;
      const lr = (sc && sc.lastResult) || null;
      const chip = cat ? `<span class="pb-qa-cat pb-qa-cat--${pbEscape(cat)}">${pbEscape(QA_CAT_LABEL[cat] || cat)}</span>` : '';

      const meta = [];
      if (story) meta.push(['Story', pbEscape(story)]);
      if (badge) meta.push(['Status', `<strong>${pbEscape(badge)}</strong>`]);
      if (sc) meta.push(['Verdict', `<strong class="tc-v tc-v--${s.st}">${s.glyph} ${pbEscape(s.label)}</strong>`]);
      if (lr && lr.detail) meta.push(['Detail', pbEscape(lr.detail)]);
      if (lr && lr.ranAt) meta.push(['Last run', pbEscape(lr.ranAt)]);

      const run = t ? `<div class="tc-sec"><h4>How it runs</h4>
          <dl class="tc-dl">
            ${t.start ? `<dt>Starts on</dt><dd><strong>${pbEscape(t.start)}</strong></dd>` : ''}
            ${(t.roles || []).length ? `<dt>As role</dt><dd><strong>${pbEscape(t.roles.join(', '))}</strong></dd>` : ''}
            ${t.seed ? `<dt>Seed data</dt><dd><strong>${pbEscape(t.seed)}</strong></dd>` : ''}
          </dl>
          ${(t.steps || []).length ? `<h5>Steps</h5><ol class="tc-ol">${t.steps.map(x => `<li>${pbStepText(x)}</li>`).join('')}</ol>` : ''}
          ${(t.expect || []).length ? `<h5>Passes when</h5><ul class="tc-ul">${t.expect.map(x => `<li>${pbExpectText(x)}</li>`).join('')}</ul>` : ''}
        </div>` : (sc ? `<div class="tc-sec"><h4>How it runs</h4>
          <p class="tc-none">No <code>test{}</code> block — this one is <strong>checked by hand</strong>, so it never reports a pass.</p></div>` : '');

      return `<div class="tc-panel" role="dialog" aria-label="${escapeHtmlAttr(head)}">
          <div class="tc-panel-head">
            <div class="tc-panel-kind">${chip}<span>${pbEscape(kind)}</span></div>
            <button class="pb-dialog-close" type="button" aria-label="Close" onclick="pbOpenTc(null)">✕</button>
          </div>
          <h3 class="tc-panel-title">${pbEscape(head)}</h3>
          ${meta.length ? `<dl class="tc-dl tc-dl--meta">${meta.map(([k2, v]) => `<dt>${pbEscape(k2)}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
          ${run}
          <div class="tc-sec"><h4>${sc ? 'What it covers' : 'The finding'}</h4>
            <div class="tc-prose">${pbProseHTML(text)}</div>
          </div>
        </div>`;
    }

    /* ── Content ──────────────────────────────────────────────────────────────
       Two authored halves of one thing: the words the product uses.

       `terms` is the glossary — what a domain word means, what else the team says for
       it (`aka`), and what it is deliberately never called (`avoid`). `strings` is the
       wording deck — the canonical text for an action, a status, a message, so two
       screens never phrase the same thing two ways.

       BOTH halves are hand-authored; nothing derives them. So the only check this view
       can honestly run is authored-vs-authored (D-08 Kind A): a wording that uses a word
       another term banned, and a term pointing at a rule Logic does not declare. Usage
       ("which screen actually says this") would have to come from the render bodies via
       logic_extract.py; until it does, this view does not pretend to know it.
       ───────────────────────────────────────────────────────────────────────── */
    const CT_KINDS = [
      ['action', 'Actions'], ['status', 'Statuses'], ['label', 'Labels'], ['title', 'Titles'],
      ['empty', 'Empty states'], ['toast', 'Toasts'], ['error', 'Errors'],
    ];

    function pbSetContentView(v) { state.contentView = v; renderMetaFlow(); }
    function pbContentFilter(inp) {
      const q = (inp.value || '').toLowerCase();
      document.querySelectorAll('#content-body [data-ck]').forEach(r => { r.hidden = q && r.dataset.ck.indexOf(q) === -1; });
      document.querySelectorAll('#content-body .ct-group').forEach(g => { g.hidden = !g.querySelector('[data-ck]:not([hidden])'); });
    }

    function pbContentDrift(C) {
      const terms = C.terms || [], strings = C.strings || [];
      const rules = (window.PB_LOGIC || {}).rules || [];
      const out = [];
      // Every banned word, once, with the term that banned it.
      const banned = [];
      terms.forEach(t => (t.avoid || []).forEach(a => {
        if (a) banned.push({ word: String(a), lc: String(a).toLowerCase(), term: t.term || t.id || '' });
      }));
      const scan = (text, label) => {
        const lc = String(text || '').toLowerCase();
        banned.forEach(b => {
          if (lc.indexOf(b.lc) !== -1) {
            out.push(`${label} says “${pbEscape(text)}” — <strong>${pbEscape(b.word)}</strong> is on ${pbEscape(b.term)}’s do-not-use list`);
          }
        });
      };
      strings.forEach(s => scan(s.text, `<code>${pbEscape(s.key || '')}</code>`));
      // A rule's state labels are user-visible wording too, and they are the wording most likely
      // to drift: a rule is transcribed from a spec once and then nothing re-reads it. Checking
      // them here is what makes the glossary load-bearing rather than a second place to look.
      rules.forEach(r => {
        (r.states || []).forEach(s => scan(s.label, `Rule <strong>${pbEscape(r.title || r.id)}</strong> · state <code>${pbEscape(s.key || '')}</code>`));
        (r.overlays || []).forEach(o => scan(o.label, `Rule <strong>${pbEscape(r.title || r.id)}</strong> · overlay <code>${pbEscape(o.key || '')}</code>`));
      });
      // Only meaningful once rules exist; a project with none would otherwise flag every link.
      if (rules.length) {
        const ruleIds = rules.map(r => r.id);
        terms.forEach(t => {
          if (t.rule && ruleIds.indexOf(t.rule) === -1) {
            out.push(`<strong>${pbEscape(t.term || t.id || '')}</strong> points at rule <code>${pbEscape(t.rule)}</code>, which Logic does not declare`);
          }
        });
      }
      return out;
    }

    function pbRenderContentTerms(C) {
      const terms = C.terms || [];
      if (!terms.length) {
        return `<p class="meta-p lg-dim">No definitions yet. A definition fixes what one domain word means — and what it is never called — so the rules, the screens and the spec all say the same thing.</p>`;
      }
      const ruleTitle = id => ((((window.PB_LOGIC || {}).rules) || []).find(r => r.id === id) || {}).title;
      return `<div class="ct-terms">` + terms.map(t => {
        const key = [t.term, t.en, t.definition, (t.aka || []).join(' ')].join(' ').toLowerCase();
        return `<div class="ct-term" data-ck="${pbEscape(key)}">
          <div class="ct-term-h">
            <strong>${pbEscape(t.term || t.id || '')}</strong>
            ${t.en ? `<span class="ct-en">${pbEscape(t.en)}</span>` : ''}
          </div>
          <p class="ct-def">${pbEscape(t.definition || '')}</p>
          ${(t.aka || []).length ? `<div class="ct-line"><span class="lg-dim">also called</span> ${t.aka.map(a => `<span class="ct-aka">${pbEscape(a)}</span>`).join('')}</div>` : ''}
          ${(t.avoid || []).length ? `<div class="ct-line"><span class="lg-dim">never</span> ${t.avoid.map(a => `<span class="ct-avoid">${pbEscape(a)}</span>`).join('')}</div>` : ''}
          ${t.rule ? `<div class="ct-line ct-rule-line"><span class="lg-dim">rule</span> <a class="lg-link ct-rule" href="#" onclick="pbLogicGoRule('${pbEscape(t.rule)}');return false">${pbEscape(ruleTitle(t.rule) || t.rule)} →</a></div>` : ''}
        </div>`;
      }).join('') + `</div>`;
    }

    function pbRenderContentStrings(C) {
      const strings = C.strings || [];
      if (!strings.length) {
        return `<p class="meta-p lg-dim">No wordings yet. A wording is the canonical text for one action, status or message — write it once here and every screen that needs it reads the same string.</p>`;
      }
      const seen = {};
      strings.forEach(s => { seen[s.kind || 'other'] = 1; });
      // Known kinds first, in the order above; anything else keeps its own name rather than
      // being dropped — an unknown kind is an authoring choice, not an error.
      const groups = CT_KINDS.filter(([k]) => seen[k])
        .concat(Object.keys(seen).filter(k => !CT_KINDS.some(([c]) => c === k)).map(k => [k, k]));
      return groups.map(([kind, label]) => {
        const rows = strings.filter(s => (s.kind || 'other') === kind);
        return `<div class="ct-group">
          <div class="ct-group-h">${pbEscape(label)} <span class="meta-subtab-count">${rows.length}</span></div>
          <table class="lg-table ct-table"><tbody>${rows.map(s => `
            <tr data-ck="${pbEscape(((s.key || '') + ' ' + (s.text || '') + ' ' + (s.note || '')).toLowerCase())}">
              <td class="ct-key"><code>${pbEscape(s.key || '')}</code></td>
              <td class="ct-text">${pbEscape(s.text || '')}</td>
              <td class="ct-note">${pbEscape(s.note || '')}</td>
            </tr>`).join('')}</tbody></table>
        </div>`;
      }).join('');
    }

    function pbRenderContent() {
      const C = (PB_DATA && PB_DATA.content) || {};
      const terms = C.terms || [], strings = C.strings || [];
      if (!terms.length && !strings.length) {
        return pbUxEmpty('No content yet',
          'One place for the words the product uses: what each domain term means, and the canonical wording for every action, status and message — so the same thing never gets called two names across screens.',
          'Define the vocabulary', '/pb:clarify');
      }
      if (!state.contentView) state.contentView = terms.length ? 'terms' : 'strings';
      const v = state.contentView;
      const drift = pbContentDrift(C);
      return `<div class="meta-section">
          <div class="meta-h2">3.5 Content</div>
          <p class="meta-p" style="color:var(--text-tertiary)">The words the product uses, written down once. <strong>Definitions</strong> fix what each domain term means — and what it is never called. <strong>Wordings</strong> hold the canonical text for every action, status and message, so two screens never phrase the same thing two ways.</p>
          <div class="lg-views">
            <button class="lg-view ${v === 'terms' ? 'active' : ''}" onclick="pbSetContentView('terms')">Definitions <span class="meta-subtab-count">${terms.length}</span></button>
            <button class="lg-view ${v === 'strings' ? 'active' : ''}" onclick="pbSetContentView('strings')">Wordings <span class="meta-subtab-count">${strings.length}</span></button>
            <input class="ct-filter" type="search" placeholder="Filter…" oninput="pbContentFilter(this)">
          </div>
          ${drift.length ? `<div class="pb-qa-warn">
            <div class="pb-qa-warn-head">⚠ Wording conflicts (${drift.length})</div>
            <ul class="pb-qa-warn-list">${drift.map(d => `<li>${d}</li>`).join('')}</ul>
          </div>` : ''}
          <div id="content-body">${v === 'terms' ? pbRenderContentTerms(C) : pbRenderContentStrings(C)}</div>
        </div>`;
    }

    function renderMetaFlow() {
      const populated = !!(PB_DATA.flow && PB_DATA.flow.populated);
      const header = pbPageHeader({ title: 'UX Design', infoKey: 'flow' });
      const uxTabs = pbUxSubtabs();
      const view = pbUxView();

      if (view === 'ia' || view === 'logic' || view === 'tests' || view === 'content') {
        // Tests owns its own height like IA does: the split's two columns scroll independently, so
        // reading a 2,400-character case never drags the list you are working through out of view.
        const body = view === 'ia' ? pbRenderIA()
          : view === 'logic' ? `<div class="summary-scroll">${pbRenderLogic()}</div>`
          : view === 'content' ? `<div class="summary-scroll">${pbRenderContent()}</div>`
          : pbRenderTestCases();
        $('#app').innerHTML = `
          <div class="pb-page pb-page--viewport">
            ${header}
            <div class="pb-content pb-content--fill ux-scroll-wrap">
              ${uxTabs}
              ${body}
            </div>
          </div>`;
        // The site map is a pan/zoom canvas like the flow and the ERD, so it needs the same init.
        // Dimensions ride on the stage rather than being recomputed here — the layout that knows
        // them is the only thing that should own them.
        const st = view === 'ia' && document.getElementById('iamap-stage');
        if (st) initCanvas('iamap', parseInt(st.dataset.w, 10) || 1200, parseInt(st.dataset.h, 10) || 600, 0.62);
        return;
      }

      if (!populated) {
        $('#app').innerHTML = `
          <div class="pb-page pb-page--viewport">
            ${header}
            <div class="pb-content pb-content--fill ux-scroll-wrap">
              ${uxTabs}
              <div class="summary-scroll">${renderEmptyState({
                icon: EMPTY_STATE_ICONS.flow,
                title: 'No user flow yet',
                body: 'Build your user flow from the project spec. Claude generates one combined left-to-right Mermaid flowchart that covers every job in Information Architecture (including edge cases).',
                ctaLabel: 'Generate user flow', command: '/pb:plan --flow',
              })}</div>
            </div>
          </div>`;
        return;
      }

      $('#app').innerHTML = `
        <div class="pb-page pb-page--viewport">
          ${header}
          <div class="pb-content pb-content--fill ux-scroll-wrap">
            ${uxTabs}
            <div class="ux-flow-body">${renderFlowPopulated()}</div>
          </div>
        </div>
      `;
      // v0.3.9 — once /pb:plan --flow rewrites renderFlowPopulated
      // to stack multiple Mermaid flows inside #flow-stage, this init renders them all,
      // strips intrinsic widths, measures the natural content size of the stage, and
      // hands off to initCanvas('flow', W, H) so the user gets pan + zoom over every
      // flow at once. Falls back to the legacy buildFlowSvg() init for pre-v0.3.9 templates.
      if (populated && window.mermaid && document.querySelector('#flow-stage .mermaid')) {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          flowchart: { curve: 'linear', htmlLabels: true, padding: 18, useMaxWidth: false, nodeSpacing: 50, rankSpacing: 90 },
          themeVariables: {
            fontFamily: 'var(--font-body, system-ui, sans-serif)',
            fontSize: '14px',
            primaryColor: '#F3E8FF',
            primaryTextColor: '#1f2937',
            primaryBorderColor: '#C084FC',
            lineColor: '#1f2937',
            tertiaryColor: '#ffffff',
          },
        });
        mermaid.run({ querySelector: '#flow-stage .mermaid' }).then(function () {
          var stage = document.getElementById('flow-stage');
          if (!stage) return;
          stage.classList.add('flow-stage-flow');
          Array.from(stage.querySelectorAll('svg')).forEach(function(svg){
            svg.style.maxWidth = 'none';
            svg.removeAttribute('width');
            svg.removeAttribute('height');
            svg.style.width = '';
            svg.style.height = '';
          });
          // v0.3.12 — apply 24px corner radius to rectangle shapes (Action, Subprocess).
          // Mermaid's classDef rx/ry isn't honored on rectangles in current versions —
          // set the SVG attribute directly post-render. Stadiums (Start/End) keep
          // their fully-rounded ends; polygons (Decision/Input) can't be rounded.
          stage.querySelectorAll('.node.cAction > rect, .node.cSubprocess > rect').forEach(function(rect){
            rect.setAttribute('rx', '24');
            rect.setAttribute('ry', '24');
          });
          // Recolor nodes by detected shape to the wireflow legend palette (start/end black ·
          // decision yellow · input purple · action blue · subprocess grey).
          pbStyleFlowNodes(stage);
          // Re-route connectors as straight orthogonal lines anchored at node side-centers.
          pbOrthogonalizeFlowEdges(stage);
          // v0.3.14 — Wireflow decorations: click-to-preview + numbered note badges.
          stage.style.width = 'auto';
          stage.style.height = 'auto';
          stage.style.marginLeft = '0';
          stage.style.marginTop = '0';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var bbox = stage.getBoundingClientRect();
              var W = Math.max(1024, Math.ceil(bbox.width));
              var H = Math.max(720,  Math.ceil(bbox.height));
              stage.style.width = W + 'px';
              stage.style.height = H + 'px';
              stage.style.marginLeft = -(W/2) + 'px';
              stage.style.marginTop  = -(H/2) + 'px';
              initCanvas('flow', W, H);
            });
          });
        }).catch(function(){ /* silent */ });
      } else if (populated && document.getElementById('flow-canvas')) {
        initCanvas('flow', 1200, 380);
      }
    }

    function renderFlowPopulated() {
      const f = (PB_DATA && PB_DATA.flow) || {};
      const fStories = f.stories || [];
      if (!f.mermaid && !(f.flows && f.flows.length) && f.html) {
        return `<div class="pb-main">${f.html}</div><aside class="pb-aside"><p class="pb-aside-empty">Legacy flow.</p></aside>`;
      }
      // Multi-flow: prefer f.flows[]; fall back to the single f.mermaid.
      const flows = (f.flows && f.flows.length) ? f.flows
                  : (f.mermaid ? [{ name: 'Main flow', mermaid: f.mermaid }] : []);
      const idx = Math.min(state.flowIndex || 0, Math.max(0, flows.length - 1));
      const current = flows[idx];
      const dropdown = flows.length > 1
        ? `<select class="pb-flow-select" onchange="setFlowIndex(this.value)">`
          + flows.map((fl, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${pbEscape(fl.name || ('Flow ' + (i + 1)))}</option>`).join('')
          + `</select>`
        : `<span class="pb-flow-name">${pbEscape((current && current.name) || 'User flow')}</span>`;
      const stage = current ? `<div class="mermaid">${current.mermaid}</div>` : buildFlowSvg();

      // 2.2 — hovering a story highlights the flow path that satisfies it (and dims the rest).
      // Stories are phrased as JTBDs (s.jtbd) — the same jobs Information Architecture lists —
      // so this panel is that job list, filtered down to "which flow satisfies it".
      const storiesList = fStories.length
        ? '<ol class="flow-doc-stories flow-doc-stories--interactive">' + fStories.map((s, i) =>
            `<li data-story-idx="${i}" onmouseenter="pbFlowHighlight(${i}, true)" onmouseleave="pbFlowHighlight(${i}, false)">`
            + `<strong>${pbEscape(s.title||'')}${s.priority?' ('+pbEscape(s.priority)+')':''}</strong>`
            + (s.jtbd ? ` — ${pbEscape(s.jtbd)}` : '')
            + (s.path ? `<div class="flow-doc-path"><em>Path:</em> ${pbEscape(s.path)}</div>` : '') + '</li>').join('') + '</ol>'
        : '<p class="flow-doc-side-sub">No user stories yet.</p>';

      const legendBtn = `
        <button class="flow-doc-legend-btn" type="button" aria-label="Show legend" onclick="openLegendPopover(this)">
          <span class="flow-doc-legend-swatch flow-doc-swatch-start"></span>
          <span class="flow-doc-legend-swatch flow-doc-swatch-decision"></span>
          <span class="flow-doc-legend-swatch flow-doc-swatch-action"></span>
          <span class="flow-doc-legend-swatch flow-doc-swatch-subprocess"></span>
          <span class="flow-doc-legend-label">Legend</span>
          <span class="flow-doc-legend-q" aria-hidden="true">?</span>
        </button>`;

      const main = `
        <div class="pb-main flow-main-col">
          <div class="flow-canvas flow-canvas--fill" id="flow-canvas">
            <div class="flow-main-bar">
              <div class="flow-main-bar-left">${dropdown}</div>
              ${legendBtn}
            </div>
            <div class="flow-viewport" id="flow-viewport">
              <div class="flow-stage" id="flow-stage">${stage}</div>
            </div>
            <div class="flow-zoom-controls">
              <button class="flow-zoom-btn" id="flow-zoom-in"  title="Zoom in">+</button>
              <button class="flow-zoom-btn" id="flow-zoom-out" title="Zoom out">−</button>
              <button class="flow-zoom-btn" id="flow-zoom-fit" title="Fit / reset">⊙</button>
            </div>
            <div class="flow-zoom-readout" id="flow-zoom-readout">100%</div>
            <div class="flow-hint">Scroll to zoom · drag to pan</div>
          </div>
        </div>`;

      const aside = `
        <aside class="pb-aside">
          <div class="meta-h3" style="margin:0 0 12px">User stories <span class="meta-subtab-count">${fStories.length}</span></div>
          ${storiesList}
        </aside>`;

      return main + aside;
    }

    /* 2.2 — story → flow-path highlight. Resolve the story's node ids (explicit story.nodes,
       else parse story.path tokens) and match them against the rendered Mermaid node labels,
       then emphasise those nodes + the edges between them and dim everything else. */
    function pbFlowStoryTokens(story) {
      if (story.nodes && story.nodes.length) return story.nodes.map(String);
      return (story.path || '').split(/\s*(?:→|->|,|·|>|\/)\s*/).map(s => s.trim()).filter(Boolean);
    }
    function pbFlowHighlight(idx, on) {
      const stage = document.getElementById('flow-stage');
      if (!stage) return;
      if (!on) {
        stage.classList.remove('flow-dim');
        stage.querySelectorAll('.flow-hl').forEach(e => e.classList.remove('flow-hl'));
        return;
      }
      const stories = (PB_DATA.flow && PB_DATA.flow.stories) || [];
      const story = stories[idx];
      if (!story) return;
      const tokens = pbFlowStoryTokens(story).map(t => t.toLowerCase());
      if (!tokens.length) return;
      const matchedIds = {};
      let any = false;
      stage.querySelectorAll('g.node').forEach(n => {
        const txt = (n.textContent || '').trim().toLowerCase();
        if (!txt) return;
        const hit = tokens.some(t => t === txt || t.indexOf(txt) >= 0 || txt.indexOf(t) >= 0);
        if (hit) {
          n.classList.add('flow-hl'); any = true;
          const id = (n.id || '').replace(/^flowchart-/, '').replace(/-\d+$/, '');
          if (id) matchedIds[id] = 1;
        }
      });
      if (!any) return;
      stage.classList.add('flow-dim');
      // Highlight edges connecting two matched nodes (Mermaid tags edge paths LS-<from> LE-<to>).
      stage.querySelectorAll('path.flowchart-link, .edgePaths path, .edgePath path').forEach(p => {
        const cl = p.getAttribute('class') || '';
        const from = (cl.match(/LS-([^\s]+)/) || [])[1];
        const to   = (cl.match(/LE-([^\s]+)/) || [])[1];
        if (from && to && matchedIds[from] && matchedIds[to]) p.classList.add('flow-hl');
      });
    }

    /* Wireflow node palette — recolor each Mermaid node by its detected shape so the flow
       matches the legend regardless of whether classDefs were authored. */
    const FLOW_NODE_PALETTE = {
      startEnd: { fill: '#1c1f22', stroke: '#1c1f22', text: '#ffffff' }, // stadium / circle
      decision: { fill: '#F6C000', stroke: '#D99E00', text: '#1f2937' }, // diamond
      input:    { fill: '#7C3AED', stroke: '#6D28D9', text: '#ffffff' }, // parallelogram
      action:   { fill: '#2196F3', stroke: '#1565C0', text: '#ffffff' }, // rectangle / screen
      sub:      { fill: '#E5E7EB', stroke: '#9CA3AF', text: '#1f2937' }, // subprocess / external / data
    };
    function pbIsDiamond(poly) {
      const pts = (poly.getAttribute('points') || '').trim().split(/\s+/).map(p => {
        const xy = p.split(','); return { x: parseFloat(xy[0]), y: parseFloat(xy[1]) };
      }).filter(p => !isNaN(p.x) && !isNaN(p.y));
      if (pts.length < 3) return false;
      const minY = Math.min.apply(null, pts.map(p => p.y));
      // A diamond has a single vertex at the top edge; a parallelogram has two.
      return pts.filter(p => Math.abs(p.y - minY) < 1).length === 1;
    }
    function pbStyleFlowNodes(stage) {
      if (!stage) return;
      stage.querySelectorAll('g.node').forEach(node => {
        const circle = node.querySelector('circle, ellipse');
        const poly   = node.querySelector('polygon');
        const rect   = node.querySelector('rect');
        const path   = node.querySelector('path');
        const lines  = node.querySelectorAll('line').length;
        let key = null;
        if (poly) {
          key = pbIsDiamond(poly) ? 'decision' : 'input';
          // Subprocess [[...]] renders as a 10-point double-rectangle polygon — strip the outer bracket
          // points so only the clean inner rect remains (removes the vertical "lines" on both sides).
          // The point count is also the only thing telling subprocess apart from a real input:
          // Mermaid emits [[ ]] as 10 points and [/ /] as 4, both as a <polygon> with no <line>s,
          // so the `rect && lines >= 2` branch below never fires and a subprocess node would be
          // painted input-purple while the legend promises subprocess-grey.
          if (key === 'input') {
            const pts = (poly.getAttribute('points') || '').trim().split(/\s+/);
            if (pts.length >= 8) { key = 'sub'; poly.setAttribute('points', pts.slice(0, 4).join(' ')); }
          }
        }
        else if (circle) key = 'startEnd';
        else if (rect) {
          if (lines >= 2) key = 'sub'; // subroutine [[ ]]
          else {
            const h  = parseFloat(rect.getAttribute('height')) || 0;
            const rx = parseFloat(rect.getAttribute('rx')) || 0;
            if (rx > 0 && rx >= h / 2 - 2) key = 'startEnd';       // stadium ([ ])
            else { key = 'action'; rect.setAttribute('rx', '16'); rect.setAttribute('ry', '16'); }
          }
        } else if (path) key = 'sub'; // cylinder / other
        if (!key) return;
        const c = FLOW_NODE_PALETTE[key];
        node.querySelectorAll('rect, polygon, circle, ellipse, path').forEach(el => {
          el.style.fill = c.fill; el.style.stroke = c.stroke;
        });
        node.querySelectorAll('line').forEach(el => { el.style.display = 'none'; });
        node.querySelectorAll('.nodeLabel, .nodeLabel *, foreignObject div, text, text tspan').forEach(t => {
          t.style.color = c.text; t.style.fill = c.text;
        });
      });
    }

    /* Blueprint-style edges: re-route every connector as straight orthogonal segments anchored at
       the 4 side-centers (left/right/top/bottom) of each node — like a Figma/FigJam board. Forward
       edges run straight (or a right-angle Z when ranks differ); back-edges route under both nodes. */
    function pbFlowNodeGeom(stage) {
      const geom = {};
      stage.querySelectorAll('g.node').forEach(node => {
        const id = (node.id || '').replace(/^flowchart-/, '').replace(/-\d+$/, '');
        if (!id) return;
        const tr = (node.getAttribute('transform') || '').match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
        const shape = node.querySelector('rect, polygon, circle, ellipse, path');
        if (!tr || !shape) return;
        let bb; try { bb = shape.getBBox(); } catch (e) { return; }
        geom[id] = { cx: parseFloat(tr[1]), cy: parseFloat(tr[2]), hw: bb.width / 2, hh: bb.height / 2 };
      });
      return geom;
    }
    function pbOrthoRoute(S, T) {
      const gap = 28;
      const dx = T.cx - S.cx;
      if (dx >= 0) {
        // forward — exit source right-center, enter target left-center
        const sx = S.cx + S.hw, sy = S.cy, tx = T.cx - T.hw, ty = T.cy;
        if (Math.abs(sy - ty) < 2) return { d: `M${sx},${sy} L${tx},${ty}`, lx: (sx + tx) / 2, ly: sy - 12 };
        const mx = (sx + tx) / 2;
        return { d: `M${sx},${sy} L${mx},${sy} L${mx},${ty} L${tx},${ty}`, lx: mx, ly: (sy + ty) / 2 - 10 };
      }
      // back-edge — exit source bottom-center, run under both, enter target bottom-center
      const sx = S.cx, sy = S.cy + S.hh, tx = T.cx, ty = T.cy + T.hh;
      const ry = Math.max(sy, ty) + gap;
      return { d: `M${sx},${sy} L${sx},${ry} L${tx},${ry} L${tx},${ty}`, lx: (sx + tx) / 2, ly: ry - 10 };
    }
    // Decision-branch edge colors: Yes → green, No → red, everything else → dark. Solid lines.
    const PB_FLOW_EDGE_COLORS = { yes: '#16a34a', no: '#dc2626', def: '#1f2937' };
    function pbFlowMarker(svg, id, color) {
      const NS = 'http://www.w3.org/2000/svg';
      if (svg.querySelector('#' + id)) return 'url(#' + id + ')';
      let defs = svg.querySelector('defs');
      if (!defs) { defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
      const m = document.createElementNS(NS, 'marker');
      m.setAttribute('id', id); m.setAttribute('viewBox', '0 0 10 10');
      m.setAttribute('refX', '8'); m.setAttribute('refY', '5');
      m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7'); m.setAttribute('orient', 'auto');
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M0,1 L9,5 L0,9 z'); path.setAttribute('fill', color);
      m.appendChild(path); defs.appendChild(m);
      return 'url(#' + id + ')';
    }
    function pbOrthogonalizeFlowEdges(stage) {
      if (!stage) return;
      const svg = stage.querySelector('svg'); if (!svg) return;
      const geom = pbFlowNodeGeom(stage);
      const paths = Array.prototype.slice.call(stage.querySelectorAll('.edgePaths path'));
      const labels = Array.prototype.slice.call(stage.querySelectorAll('.edgeLabels .edgeLabel'));
      // Match each non-empty label to its edge by ORIGINAL proximity (before we rewrite paths) —
      // Mermaid emits multiple label nodes in an order that doesn't track the path order.
      const pmid = paths.map(p => { const r = p.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; });
      const labelsByPath = {}, textByPath = {};
      labels.forEach(lab => {
        const t = (lab.textContent || '').trim(); if (!t) return;
        const r = lab.getBoundingClientRect(); const lx = r.left + r.width / 2, ly = r.top + r.height / 2;
        let best = 0, bd = Infinity;
        pmid.forEach((m, idx) => { const dd = (m.x - lx) * (m.x - lx) + (m.y - ly) * (m.y - ly); if (dd < bd) { bd = dd; best = idx; } });
        (labelsByPath[best] = labelsByPath[best] || []).push(lab);
        if (!textByPath[best]) textByPath[best] = t;
      });
      const mk = { yes: pbFlowMarker(svg, 'pb-arrow-green', PB_FLOW_EDGE_COLORS.yes),
                   no:  pbFlowMarker(svg, 'pb-arrow-red',   PB_FLOW_EDGE_COLORS.no),
                   def: pbFlowMarker(svg, 'pb-arrow-dark',  PB_FLOW_EDGE_COLORS.def) };
      paths.forEach((p, i) => {
        const cl = p.getAttribute('class') || '';
        const from = (cl.match(/LS-([^\s"]+)/) || [])[1];
        const to   = (cl.match(/LE-([^\s"]+)/) || [])[1];
        const S = geom[from], T = geom[to];
        if (!S || !T) return;
        const r = pbOrthoRoute(S, T);
        const lt = (textByPath[i] || '').toLowerCase();
        const key = lt === 'yes' ? 'yes' : lt === 'no' ? 'no' : 'def';
        // Hide unlabeled back-edges (black lines routing backward) — keep Yes/No decision branches
        if (T.cx - S.cx < 0 && key === 'def') {
          p.style.display = 'none';
          (labelsByPath[i] || []).forEach(lab => { lab.style.display = 'none'; });
          return;
        }
        p.setAttribute('d', r.d);
        p.style.stroke = PB_FLOW_EDGE_COLORS[key]; p.style.strokeWidth = '2';
        p.style.fill = 'none'; p.style.strokeDasharray = 'none';
        p.setAttribute('marker-end', mk[key]);
        (labelsByPath[i] || []).forEach(lab => {
          lab.setAttribute('transform', `translate(${r.lx},${r.ly})`);
          lab.querySelectorAll('rect').forEach(r2 => { r2.style.fill = 'transparent'; r2.setAttribute('fill', 'transparent'); });
          lab.querySelectorAll('text, tspan, foreignObject div, span').forEach(t => {
            t.style.fill = PB_FLOW_EDGE_COLORS[key];
            t.style.color = PB_FLOW_EDGE_COLORS[key];
            t.style.fontWeight = '700';
            t.style.backgroundColor = 'transparent';
          });
        });
      });
      // Back-edges route below the nodes, often past Mermaid's original viewBox (which clips,
      // since the SVG is overflow:hidden) — grow the viewBox to fit the full rerouted geometry.
      try {
        const bb = svg.getBBox();
        const pad = 14;
        svg.setAttribute('viewBox', `${bb.x - pad} ${bb.y - pad} ${bb.width + pad * 2} ${bb.height + pad * 2}`);
      } catch (e) { /* getBBox can throw if detached — ignore */ }
    }

    /* Tiny example flow: START → SCREEN → DECISION → END.
       Replace this with your prototype's actual flow. */
    function buildFlowSvg() {
      var W=1200, H=380, Y=190;
      var xS=80, xScr=350, xD=620, xEndScr=900, xE=1140;
      var RW=140, RH=50, DW=72, DH=46, CR=24;
      var C_SCR='#4A90D9', C_DEC='#F6C000', C_TRM='#1c1f22', C_GRN='#00A651', C_LN='#9ca3af';

      function R(x,y,w,h,fill,lbl) {
        return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="10" fill="'+fill+'"/>'
          + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle"'
          + ' font-family="Poppins,sans-serif" font-size="13" font-weight="600" fill="#fff">'+lbl+'</text>';
      }
      function D(x,y,lines) {
        var pts = x+','+(y-DH)+' '+(x+DW)+','+y+' '+x+','+(y+DH)+' '+(x-DW)+','+y;
        var s = '<polygon points="'+pts+'" fill="'+C_DEC+'"/>';
        lines.forEach(function(l,i){
          var ty = y + (i - (lines.length-1)/2) * 14;
          s += '<text x="'+x+'" y="'+ty+'" text-anchor="middle" dominant-baseline="middle"'
            + ' font-family="Poppins,sans-serif" font-size="11" font-weight="600" fill="'+C_TRM+'">'+l+'</text>';
        });
        return s;
      }
      function T(x,y,lbl) {
        return '<circle cx="'+x+'" cy="'+y+'" r="'+CR+'" fill="'+C_TRM+'"/>'
          + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle"'
          + ' font-family="Poppins,sans-serif" font-size="10" font-weight="700" fill="#fff">'+lbl+'</text>';
      }
      function Ln(x1,y1,x2,y2,clr){
        return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(clr||C_LN)+'" stroke-width="1.5" marker-end="url(#fm-ah)"/>';
      }
      function Bg(x,y,t,bg){
        var tw = t.length*7+14;
        return '<rect x="'+(x-tw/2)+'" y="'+(y-9)+'" width="'+tw+'" height="18" rx="9" fill="'+bg+'"/>'
          + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle"'
          + ' font-family="Poppins,sans-serif" font-size="10" font-weight="700" fill="#fff">'+t+'</text>';
      }

      var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
      s += '<defs>'
        + '<marker id="fm-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1L9,5L0,9z" fill="'+C_LN+'"/></marker>'
        + '<marker id="fm-gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1L9,5L0,9z" fill="'+C_GRN+'"/></marker>'
        + '</defs>';
      s += '<rect width="'+W+'" height="'+H+'" fill="#f8f9fb" rx="12"/>';

      // Connections
      s += Ln(xS+CR, Y, xScr-RW/2-3, Y);
      s += Ln(xScr+RW/2+3, Y, xD-DW-3, Y);
      s += '<line x1="'+(xD+DW+3)+'" y1="'+Y+'" x2="'+(xEndScr-RW/2-3)+'" y2="'+Y+'" stroke="'+C_GRN+'" stroke-width="1.5" marker-end="url(#fm-gr)"/>';
      s += Bg((xD+DW+xEndScr-RW/2)/2, Y-14, 'Yes', C_GRN);
      s += Ln(xEndScr+RW/2+3, Y, xE-CR-3, Y);

      // Nodes
      s += T(xS,  Y, 'START');
      s += R(xScr, Y, RW, RH, C_SCR, 'Example Screen');
      s += D(xD,   Y, ['Continue?']);
      s += R(xEndScr, Y, RW, RH, C_SCR, 'Done Screen');
      s += T(xE,   Y, 'END');

      s += '</svg>';
      return s;
    }

    /* =========================================================================
       TAB 4 — DESIGN HANDOFF
       Dual-view per 02-architecture.md §7 Addition B:
         - Component view (default, auto-syncs on /pb:build)
         - Screen view    (manual, /pb:handoff)
                          uses 7:3 grid: 7fr render + 3fr spec panel
       Right panel emits DS tokens + sizing ONLY — never code.
       ========================================================================= */
    /* v0.3.17 — per-organism active property combo, keyed by org id.
       Lazy-seeded from each organism's property defaults by pbActiveProps(). */
    const handoffProps = {};
    function setHandoffProp(orgId, propId, value) {
      const org = (PB_DATA.handoff.organisms || []).find(x => x.id === orgId);
      if (!org) return;
      pbActiveProps(org)[propId] = value;
      renderHandoff();
    }
    function setHandoffView(v) {
      PB_DATA.handoff.view = v;
      renderHandoff();
    }
    function setHandoffScreen(id) {
      PB_DATA.handoff.selectedScreenId = id;
      PB_DATA.handoff.selectedElementId = null;
      renderHandoff();
    }
    function setHandoffElement(id) {
      PB_DATA.handoff.selectedElementId = id;
      renderHandoff();
    }

    /* v1.2 — UI Design: page chrome + DS bar + 3-way Global|Local|Screen tabs over a split
       layout (left = component cards / screen frame · right = persistent detail aside). */
    function setHandoffTab(t) {
      state.handoffTab = t;
      if (t === 'screen') { PB_DATA.handoff.view = 'screen'; state.handoffDrawerOpenFor = null; }
      else { PB_DATA.handoff.view = 'component'; state.handoffScope = t; state.screenDrawerOpenFor = null; }
      renderHandoff();
    }

    function renderHandoff() {
      const orgs = PB_DATA.handoff.organisms || [];
      const screens = PB_DATA.handoff.screens || [];
      const hasAny = orgs.length || screens.length;
      const cta = hasAny ? `<button class="sync-button" onclick="openFigmaPushPanel(this)">Push to Figma →</button>` : '';
      const header = pbPageHeader({ title: 'UI Design', infoKey: 'handoff', cta, headerAside: pbRenderDsBar() });

      if (!hasAny) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.handoff,
                title: 'No components yet',
                body: 'Run /pb:build to populate the design system — every reusable component (with property controls, a code panel, and a spec drawer) and every screen handoff. Components here are the same ones the Prototype renders, never duplicated.',
                ctaLabel: 'Generate components', command: '/pb:build', label: 'Build command copied',
              })}
            </div>
          </div>`;
        return;
      }

      const isGlobal = o => o.scope === 'global' || !!o.dsMatch;
      const global = orgs.filter(isGlobal), local = orgs.filter(o => !isGlobal(o));
      PB_DATA.handoff.view = 'component';
      // default selection: first component, else first screen
      if (!state.handoffDrawerOpenFor && !state.uidScreenSel) {
        if (orgs.length) state.handoffDrawerOpenFor = orgs[0].id;
        else if (screens.length) state.uidScreenSel = screens[0].id;
      }

      $('#app').innerHTML = `
        <div class="pb-page">
          ${header}
          <div class="pb-content pb-content--fill uidesign-split">
            <div class="uidesign-list" id="uidesign-list">${pbHandoffNameList(global, local, screens)}</div>
            <div class="uidesign-detail" id="uidesign-detail">${pbHandoffDetail(orgs, screens)}</div>
          </div>
        </div>`;
    }

    /* Left rail — one scrollable list, sectioned Global · Local · Screens (MUI-docs style). */
    function pbHandoffNameList(global, local, screens) {
      const row = (name, meta, active, onclick) =>
        `<button class="uid-row ${active ? 'is-active' : ''}" onclick="${onclick}">
           <span class="uid-row-name">${pbEscape(name)}</span>${meta ? `<span class="uid-row-meta">${pbEscape(meta)}</span>` : ''}
         </button>`;
      const section = (label, rows) => rows.length
        ? `<div class="uid-section"><div class="uid-section-head">${label}</div>${rows.join('')}</div>` : '';
      const comp = arr => arr.map(o => row(o.name, o.level, state.handoffDrawerOpenFor === o.id, `pbSelectHandoffComponent('${pbEscape(o.id)}')`));
      const scr = screens.map(s => row(s.name, 'screen', state.uidScreenSel === s.id, `pbSelectHandoffScreen('${pbEscape(s.id)}')`));
      return (section('Global', comp(global)) + section('Local', comp(local)) + section('Screens', scr))
        || `<p class="pb-aside-empty">No components.</p>`;
    }
    function pbSelectHandoffComponent(id) { state.handoffDrawerOpenFor = id; state.uidScreenSel = null; renderHandoff(); }
    function pbSelectHandoffScreen(id) { state.uidScreenSel = id; state.handoffDrawerOpenFor = null; renderHandoff(); }

    /* Right pane — the selected item's full detail, stacked top→down (no tab switcher). */
    function pbHandoffDetail(orgs, screens) {
      if (state.handoffDrawerOpenFor) {
        const org = orgs.find(o => o.id === state.handoffDrawerOpenFor);
        if (org) return pbHandoffComponentDetail(org);
      }
      if (state.uidScreenSel) {
        const s = screens.find(x => x.id === state.uidScreenSel);
        if (s) return pbHandoffScreenDetail(s);
      }
      return `<p class="pb-aside-empty">Select a component to see its demo, anatomy, specification, UI logic, and usage.</p>`;
    }
    function pbUidSection(heading, content) {
      return `<section class="uid-detail-section"><h3 class="uid-detail-h">${heading}</h3><div class="uid-detail-body">${content}</div></section>`;
    }
    function pbHandoffComponentDetail(org) {
      const props = pbActiveProps(org);
      return `
        <div class="uid-detail-head">
          <div><h2 class="uid-detail-title">${pbEscape(org.name)}</h2>${org.meta ? `<p class="uid-detail-sub">${pbEscape(org.meta)}</p>` : ''}</div>
          <div class="uid-detail-actions">${pbRenderHandoffCode(org)}</div>
        </div>
        ${pbComponentPlaygroundInline(org, props)}
        ${pbUidSection('Anatomy', pbRenderHandoffAnatomy(org))}
        ${pbUidSection('Specification', pbRenderHandoffSpec(org))}
        ${pbUidSection('Layer properties', pbRenderBoxModel(org))}
        ${pbUidSection('UI Logic', pbRenderHandoffUiLogic(org))}
        ${pbUidSection('Usage', pbRenderHandoffUsage(org))}`;
    }
    function pbHandoffScreenDetail(s) {
      const preview = (typeof window[s.renderFn] === 'function') ? window[s.renderFn]() : '';
      const els = s.elements || [];
      const elList = els.length
        ? els.map(el => `<div class="uid-el-row"><span class="uid-el-name">${pbEscape(el.label || el.id)}</span>${el.orgId ? `<span class="handoff-level-badge">${pbEscape(el.orgId)}</span>` : (el.placeholder ? '<span class="handoff-level-badge">placeholder</span>' : '')}</div>`).join('')
        : `<p class="handoff-spec-note">No elements.</p>`;
      return `
        <div class="uid-detail-head"><div><h2 class="uid-detail-title">${pbEscape(s.name)}</h2><p class="uid-detail-sub">Screen</p></div></div>
        ${preview ? `<div class="handoff-card-body handoff-card-body--stacked"><div class="handoff-card-preview">${preview}</div></div>` : ''}
        ${pbUidSection('Elements', elList)}`;
    }

    function pbHandoffAsideHint(msg) { return `<p class="pb-aside-empty">${msg}</p>`; }

    /* Design-system bar under the UI Design title (meta.designSystem; tolerated-absent). */
    function pbRenderDsBar() {
      const ds = (PB_REGISTRY && PB_REGISTRY.meta && PB_REGISTRY.meta.designSystem) || null;
      if (!ds || !ds.name) {
        if (VIEW_ONLY) return '';
        return `<div class="pb-ds-bar pb-ds-bar--empty" onclick="openCopyPopover('/pb:build', this)" title="Link a design system">+ No design system linked — click to add one</div>`;
      }
      const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
      const codeIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
      const design = ds.designLink
        ? `<a class="pb-ds-link" href="${pbEscape(ds.designLink)}" target="_blank" rel="noopener">${linkIcon} Design</a>`
        : `<span class="pb-ds-link pb-ds-link--missing">No design link</span>`;
      let code;
      if (ds.codeLibrary && /^https?:/.test(ds.codeLibrary)) {
        code = `<a class="pb-ds-link" href="${pbEscape(ds.codeLibrary)}" target="_blank" rel="noopener">${codeIcon} Code library</a>`;
      } else if (ds.codeLibrary) {
        code = `<span class="pb-ds-link" title="${pbEscape(ds.codeLibrary)}">${codeIcon} <code>${pbEscape(ds.codeLibrary)}</code></span>`;
      } else {
        code = `<span class="pb-ds-link pb-ds-link--missing">No code library</span>`;
      }
      return `<div class="pb-ds-bar"><span class="pb-ds-name">${pbEscape(ds.name)}</span><span class="pb-ds-sep">·</span>${design}<span class="pb-ds-sep">·</span>${code}</div>`;
    }

    /* Resolve the active property combo for an organism (lazy-seeded from defaults). */
    function pbActiveProps(org) {
      if (!handoffProps[org.id]) {
        const seed = {};
        (org.properties || []).forEach(p => { seed[p.id] = p.default; });
        handoffProps[org.id] = seed;
      }
      return handoffProps[org.id];
    }

    function pbTitleCase(s) { s = String(s == null ? '' : s); return s.charAt(0).toUpperCase() + s.slice(1); }

    /* Component information — the props/variants as a Figma-style inspect list. Option props read as a
       diamond-marked variant (inline select); free-text props as an editable value. Both stay live. */
    function pbComponentInfoList(org, props) {
      const DIAMOND = '<svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l6 6-6 6-6-6z" fill="currentColor"/></svg>';
      const rows = (org.properties || []).map(p => {
        const label = pbTitleCase(p.label || p.id);
        const opts = p.options || [];
        if (opts.length) {
          const sel = `<select class="ci-select" onchange="setHandoffProp('${pbEscape(org.id)}','${pbEscape(p.id)}',this.value)">`
            + opts.map(o => `<option value="${pbEscape(o.value)}" ${props[p.id] === o.value ? 'selected' : ''}>${pbEscape(pbTitleCase(o.label || o.value))}</option>`).join('')
            + `</select>`;
          return `<div class="ci-row"><span class="ci-label">${pbEscape(label)}</span><span class="ci-val"><span class="ci-ic">${DIAMOND}</span>${sel}</span></div>`;
        }
        const val = props[p.id] != null ? props[p.id] : '';
        return `<div class="ci-row"><span class="ci-label">${pbEscape(label)}</span><span class="ci-val"><span class="ci-ic"><b>Aa</b></span>`
          + `<input class="ci-input" value="${pbEscape(val)}" onchange="setHandoffProp('${pbEscape(org.id)}','${pbEscape(p.id)}',this.value)"></span></div>`;
      }).join('');
      return rows ? `<div class="ci-list">${rows}</div>` : '<p class="handoff-spec-note">No properties.</p>';
    }

    /* Layer properties — a Figma-style box-model diagram. Renders the component off-screen so
       pbPlaceBoxModel can measure its real margin/border/padding/content box, then draws it. */
    function pbRenderBoxModel(org) {
      const props = pbActiveProps(org);
      const html = (typeof window[org.renderFn] === 'function') ? window[org.renderFn](props) : '';
      if (!html) return '<p class="handoff-spec-note">Nothing to measure.</p>';
      return `<div class="boxmodel-stage" data-boxmodel-for="${pbEscape(org.id)}"><div class="bm-measure" style="position:absolute;left:-9999px;top:0;visibility:hidden">${html}</div></div>`;
    }

    function pbPlaceBoxModel() {
      const stage = document.querySelector('.boxmodel-stage[data-boxmodel-for]');
      if (!stage) return;
      const measure = stage.querySelector('.bm-measure');
      const root = measure && measure.firstElementChild;
      if (!root) return;
      const cs = getComputedStyle(root);
      const n = v => Math.round(parseFloat(v) || 0);
      const mg = { t: n(cs.marginTop), r: n(cs.marginRight), b: n(cs.marginBottom), l: n(cs.marginLeft) };
      const bd = { t: n(cs.borderTopWidth), r: n(cs.borderRightWidth), b: n(cs.borderBottomWidth), l: n(cs.borderLeftWidth) };
      const pd = { t: n(cs.paddingTop), r: n(cs.paddingRight), b: n(cs.paddingBottom), l: n(cs.paddingLeft) };
      const cw = Math.max(0, Math.round(root.clientWidth - pd.l - pd.r));
      const ch = Math.max(0, Math.round(root.clientHeight - pd.t - pd.b));
      const edges = (kind, v) => ['t', 'r', 'b', 'l'].map(s =>
        `<span class="bm-e bm-e--${s} bm-e--${kind}${v[s] ? '' : ' bm-e--zero'}">${v[s] || '–'}</span>`).join('');
      stage.innerHTML =
        `<div class="bm-ring bm-margin"><span class="bm-tag">Margin</span>${edges('margin', mg)}`
        + `<div class="bm-ring bm-border"><span class="bm-tag">Border</span>${edges('border', bd)}`
        + `<div class="bm-ring bm-padding"><span class="bm-tag">Padding</span>${edges('pad', pd)}`
        + `<div class="bm-content">${cw} × ${ch}</div></div></div></div>`;
    }

    /* Component playground — a full-screen modal to preview a component large with its prop controls
       and a light/dark canvas toggle. Props share handoffProps, so changes reflect back in the detail. */
    const PB_PG_ICONS = {
      sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
      reset: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
    };
    function pbComponentPlaygroundInline(org, props) {
      const preview = (typeof window[org.renderFn] === 'function') ? window[org.renderFn](props) : '';
      const theme = state.pgTheme || 'light';
      return `<div class="pb-pg-inline"><div class="pb-pg-body">
          <div class="pb-pg-canvas" data-theme="${theme}">
            <div class="pb-pg-preview">${preview}</div>
            <div class="pb-pg-theme">
              <button data-theme-val="light" class="${theme === 'light' ? 'is-active' : ''}" title="Light" onclick="setPlaygroundTheme('light')">${PB_PG_ICONS.sun}</button>
              <button data-theme-val="dark" class="${theme === 'dark' ? 'is-active' : ''}" title="Dark" onclick="setPlaygroundTheme('dark')">${PB_PG_ICONS.moon}</button>
            </div>
          </div>
          <aside class="pb-pg-panel">
            <div class="pb-pg-section">
              <div class="pb-pg-sec-head"><span class="pb-pg-sec-title">${pbEscape(org.name)}</span>
                <button class="pb-pg-reset" title="Reset properties" onclick="pbResetPlaygroundProps('${pbEscape(org.id)}')">${PB_PG_ICONS.reset}</button></div>
              ${pbComponentInfoList(org, props)}
            </div>
            <div class="pb-pg-section">
              <div class="pb-pg-sec-head"><span class="pb-pg-sec-title">Display</span></div>
              <div class="ci-list"><div class="ci-row"><span class="ci-label">Color Mode</span>
