    };

    const CHAT_PROMPTS = {
      '/pb:init':        'Run /pb:init to scaffold this project — PRD intake, set the Stack + DS locks, seed registry.json + memory/.',
      '/pb:specify':     'Run /pb:specify to produce the spec/PRD — prototype-shaped user stories with JTBD and the tabs each affects.',
      '/pb:clarify':     'Run /pb:clarify to capture user insights + UI-logic trade-offs into the Project Summary and decisions.md.',
      '/pb:plan':        'Run /pb:plan to produce the implementation plan + a per-tab task breakdown (each task: acceptance + skill).',
      '/pb:build':       'Run /pb:build to apply a targeted registry.json patch (trio-gated); add --render to regenerate prototype.html.',
      '/pb:preview':     'Run /pb:preview to start the live dev server — it watches registry.json + render/*.js and reloads the browser.',
      '/pb:plan --flow':   'Run /pb:plan --flow to (re)generate the UX Design tab — a Mermaid wireflow plus a QA test checklist.',
      '/pb:plan --data':    'Run /pb:plan --data to (re)generate the Data tab — a field/type/example table plus a Mermaid erDiagram (PK/FK/cardinality guardrails).',
      '/pb:test --drift': 'Run /pb:test --drift to audit the trio (screens, components, logic) against the constitution (report-only, no writes).',
      '/pb:handoff':    'Run /pb:handoff --people for a view-only self-documenting prototype.html, or --context for a portable bundle.',
      '/pb:handoff --tier=host':    'Run /pb:handoff --tier=host to scaffold a runnable reference build from prototype.html.',
      '/pb:update-version': 'Run /pb:update-version to apply a versioned registry schema update (dry-run by default; --apply to execute).',
    };
    function chatPromptFor(slashCommand) {
      if (CHAT_PROMPTS[slashCommand]) return CHAT_PROMPTS[slashCommand];
      const bare = slashCommand.replace(/^\//, '');
      return `Run ${bare} in this Claude Code session.`;
    }

    function copyCommandToClipboard(command) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(command).catch(() => copyCommandFallback(command));
      }
      copyCommandFallback(command);
      return Promise.resolve();
    }
    function copyCommandFallback(command) {
      const ta = document.createElement('textarea');
      ta.value = command;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* silent */ }
      document.body.removeChild(ta);
    }
    function escapeHtmlAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function openCopyPopover(command, anchorBtn, dest) {
      const hint = COMMAND_HINTS[command.trim()];
      copyAndToast(command, hint || null, anchorBtn, dest);
    }

    function closeCopyPopover() {
      const pop = document.querySelector('.copy-popover:not(.pb-insp)');
      const bd  = document.querySelector('.copy-popover-backdrop');
      // The Sandbox inspector wears .copy-popover for the hooks the menu it replaced had. It is
      // closed here only when there is no ordinary popover to close and it is not pinned open.
      if (!pop && !bd && typeof pbSandboxIsOpen === 'function' && pbSandboxIsOpen() && !pbSandboxDocked()) pbSandboxClose(false);
      if (pop) {
        pop.classList.remove('is-visible');
        setTimeout(() => { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 180);
      }
      if (bd && bd.parentNode) bd.parentNode.removeChild(bd);
      window.removeEventListener('keydown', copyPopoverKeyHandler);
      window.removeEventListener('resize', repositionCopyPopover);
      copyPopoverAnchor = null;
    }
    function copyPopoverKeyHandler(e) {
      if (e.key === 'Escape') closeCopyPopover();
    }

    let copyPopoverAnchor = null;
    function positionCopyPopover(pop, anchorBtn) {
      copyPopoverAnchor = anchorBtn;
      if (!anchorBtn) {
        pop.style.top  = '90px';
        pop.style.left = (window.innerWidth / 2 - pop.offsetWidth / 2) + 'px';
        return;
      }
      const aRect = anchorBtn.getBoundingClientRect();
      const pW = pop.offsetWidth  || 360;
      const pH = pop.offsetHeight || 220;
      const gap = 10;
      const margin = 12;

      let top  = aRect.bottom + gap;
      if (top + pH > window.innerHeight - margin) {
        top = Math.max(margin, aRect.top - pH - gap);
      }
      let left = aRect.left + aRect.width / 2 - pW / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pW - margin));

      pop.style.top  = top + 'px';
      pop.style.left = left + 'px';
    }
    function repositionCopyPopover() {
      const pop = document.querySelector('.copy-popover:not(.pb-insp)');
      if (pop && copyPopoverAnchor) positionCopyPopover(pop, copyPopoverAnchor);
    }

    function recopyFromPopover(btn) {
      const pop = btn.closest('.copy-popover');
      if (!pop) return;
      const command = btn.dataset.cmd || pop.dataset.command || '';
      copyCommandToClipboard(command);
      const status = pop.querySelector('[data-popover-status]');
      if (status) {
        status.textContent = 'Copied to clipboard';
        status.classList.remove('is-flash');
        void status.offsetWidth;
        status.classList.add('is-flash');
      }
    }

    /* v0.3.8 — Legend popover for the User Flow canvas. Reuses the .copy-popover
       shell for anchored positioning + dismiss behavior. */
    const FLOW_LEGEND_SHAPES = [
      { cls: 'shape-start',      glyph: '( )',   name: 'Start',           desc: 'Stadium — the entry point of the flow' },
      { cls: 'shape-end',        glyph: '( )',   name: 'End',             desc: 'Stadium — a terminal state (success or hard fail)' },
      { cls: 'shape-action',     glyph: '[ ]',   name: 'Action',          desc: 'Rectangle — a screen or user action' },
      { cls: 'shape-decision',   glyph: '?',     name: 'Decision',        desc: 'Diamond — a branching question, ends with ?' },
      { cls: 'shape-input',      glyph: '/ /',   name: 'Input / Output',  desc: 'Parallelogram — data entering or leaving' },
      { cls: 'shape-subprocess', glyph: '[[ ]]', name: 'Subprocess',      desc: 'Reusable sub-flow — detail lives in the test checklist' },
      { cls: 'shape-cylinder',   glyph: '( )',   name: 'External system', desc: 'Cylinder — database, API, third party' },
    ];

    function openFigmaPushPanel(anchorBtn) {
      closeFigmaPushPanel();
      const organisms = (PB_DATA.handoff && PB_DATA.handoff.organisms) || [];
      const screens   = (PB_DATA.handoff && PB_DATA.handoff.screens)   || [];

      function statusBadge(org) {
        if (org.dsMatch) return '<span class="fp-badge fp-badge-reuse" title="Matched in the design system — pushed as an instance, not rebuilt">reuse</span>';
        if (!org.figmaId && !org.figmaComponentSetId) return '<span class="fp-badge fp-badge-new">new</span>';
        return '<span class="fp-badge fp-badge-update" title="Already in Figma — this push updates it">update</span>';
      }
      function screenStatus(s) {
        return s.figmaFrameId ? `<span class="fp-item-meta">frame ${s.figmaFrameId}</span>` : '<span class="fp-badge fp-badge-new">new</span>';
      }
      // Which screens reference this component (via elements[].orgId) — what an update affects.
      function screensUsing(orgId) {
        return screens.filter(s => (s.elements || []).some(e => e.orgId === orgId)).map(s => s.name);
      }

      const orgRows = organisms.map((o, i) => {
        const used = screensUsing(o.id);
        const isUpdate = !!(o.figmaId || o.figmaComponentSetId);
        const affected = used.length
          ? `<div class="fp-item-affected ${isUpdate ? 'is-warn' : ''}">${isUpdate ? '⚠ affects ' : 'Used in '}${used.length} screen${used.length !== 1 ? 's' : ''}: ${used.map(pbEscape).join(', ')}</div>`
          : `<div class="fp-item-affected fp-item-affected--muted">Not placed on any screen yet</div>`;
        return `
        <li class="fp-item fp-item--stacked" onclick="this.querySelector('input').click()">
          <div class="fp-item-row">
            <input type="checkbox" id="fp-org-${i}" data-fp-org="${pbEscape(o.id)}" checked onclick="event.stopPropagation();fpUpdateSummary()">
            <span class="fp-item-name">${pbEscape(o.name)}${statusBadge(o)}</span>
            <span class="fp-item-meta">${pbEscape(o.id)}</span>
          </div>
          ${affected}
        </li>`;
      }).join('');

      const scrRows = screens.map((s, i) => `
        <li class="fp-item" onclick="this.querySelector('input').click()">
          <input type="checkbox" id="fp-scr-${i}" data-fp-scr="${pbEscape(s.id)}" checked onclick="event.stopPropagation();fpUpdateSummary()">
          <span class="fp-item-name">${pbEscape(s.name)}</span>
          ${screenStatus(s)}
        </li>`).join('');

      const backdrop = document.createElement('div');
      backdrop.className = 'fp-backdrop';
      backdrop.onclick = closeFigmaPushPanel;

      const panel = document.createElement('div');
      panel.className = 'fp-panel';
      panel.id = 'fp-panel';
      panel.innerHTML = `
        <div class="fp-panel-head">
          <span class="fp-panel-title">Push to Figma</span>
          <button class="fp-panel-close" onclick="closeFigmaPushPanel()" aria-label="Close" title="Close">×</button>
        </div>
        <div class="fp-panel-body">
          ${organisms.length ? `
            <div class="fp-section-head">
              <span class="fp-section-label">Components (${organisms.length})</span>
              <button class="fp-select-all" onclick="fpToggleAll('org')">Deselect all</button>
            </div>
            <ul class="fp-list">${orgRows}</ul>
          ` : ''}
          ${screens.length ? `
            <div class="fp-section-head">
              <span class="fp-section-label">Screens (${screens.length})</span>
              <button class="fp-select-all" onclick="fpToggleAll('scr')">Deselect all</button>
            </div>
            <ul class="fp-list">${scrRows}</ul>
          ` : ''}
        </div>
        <div class="fp-panel-foot">
          <span class="fp-summary" id="fp-summary"></span>
          <button class="fp-push-btn" id="fp-push-btn" onclick="fpConfirmPush(this)">Push selected →</button>
        </div>`;

      document.body.appendChild(backdrop);
      document.body.appendChild(panel);
      setTimeout(() => { panel.classList.add('is-visible'); fpUpdateSummary(); }, 10);
    }

    function closeFigmaPushPanel() {
      const p = document.getElementById('fp-panel');
      const b = document.querySelector('.fp-backdrop');
      if (p) { p.classList.remove('is-visible'); setTimeout(() => p.remove(), 200); }
      if (b) b.remove();
    }

    function fpToggleAll(type) {
      const boxes = document.querySelectorAll(`[data-fp-${type}]`);
      const anyChecked = Array.from(boxes).some(b => b.checked);
      boxes.forEach(b => { b.checked = !anyChecked; });
      // update button label
      const head = type === 'org'
        ? document.querySelector('.fp-section-label:first-of-type + button')
        : null;
      document.querySelectorAll('.fp-select-all').forEach(btn => {
        const t = btn.getAttribute('onclick').includes("'org'") ? 'org' : 'scr';
        const bs = document.querySelectorAll(`[data-fp-${t}]`);
        const ac = Array.from(bs).some(b => b.checked);
        btn.textContent = ac ? 'Deselect all' : 'Select all';
      });
      fpUpdateSummary();
    }

    function fpUpdateSummary() {
      const orgBoxes = Array.from(document.querySelectorAll('[data-fp-org]'));
      const scrBoxes = Array.from(document.querySelectorAll('[data-fp-scr]'));
      const selOrg = orgBoxes.filter(b => b.checked).length;
      const selScr = scrBoxes.filter(b => b.checked).length;
      const sumEl = document.getElementById('fp-summary');
      const btnEl = document.getElementById('fp-push-btn');
      if (sumEl) sumEl.innerHTML = `<strong>${selOrg}</strong> component${selOrg!==1?'s':''} · <strong>${selScr}</strong> screen${selScr!==1?'s':''}`;
      if (btnEl) btnEl.disabled = (selOrg + selScr === 0);
      // update select-all btn labels
      document.querySelectorAll('.fp-select-all').forEach(btn => {
        const t = btn.getAttribute('onclick').includes("'org'") ? 'org' : 'scr';
        const bs = document.querySelectorAll(`[data-fp-${t}]`);
        const ac = Array.from(bs).some(b => b.checked);
        btn.textContent = ac ? 'Deselect all' : 'Select all';
      });
    }

    function fpConfirmPush(btn) {
      const orgIds = Array.from(document.querySelectorAll('[data-fp-org]:checked')).map(b => b.dataset.fpOrg);
      const scrIds = Array.from(document.querySelectorAll('[data-fp-scr]:checked')).map(b => b.dataset.fpScr);
      const allOrg = document.querySelectorAll('[data-fp-org]').length;
      const allScr = document.querySelectorAll('[data-fp-scr]').length;

      let scope = 'both';
      if (orgIds.length === 0) scope = 'screens';
      if (scrIds.length === 0) scope = 'components';

      let cmd = `/pb:handoff --mode=3 --scope=${scope} --batch`;
      if (orgIds.length > 0 && orgIds.length < allOrg) cmd += ` --organism=${orgIds.join(',')}`;
      if (scrIds.length > 0 && scrIds.length < allScr) cmd += ` --screen=${scrIds.join(',')}`;

      closeFigmaPushPanel();
      openCopyPopover(cmd, btn);

      // Show progress panel immediately after confirming
      pbShowProgress({ components: { done:0, total: orgIds.length }, screens: { done:0, total: scrIds.length } });
    }

    /* ── Push progress panel ─────────────────────────────────────────────── */
    let _fpProgress = null;

    function pbShowProgress(data) {
      pbHideProgress();
      _fpProgress = data || { components:{ done:0, total:0 }, screens:{ done:0, total:0 } };
      const el = document.createElement('div');
      el.className = 'fp-progress';
      el.id = 'fp-progress';
      el.innerHTML = `
        <div class="fp-progress-head">
          <span class="fp-progress-title">Figma push progress</span>
          <button class="fp-progress-close" onclick="pbHideProgress()" aria-label="Dismiss" title="Dismiss">×</button>
        </div>
        <div id="fp-progress-body"></div>
        <div class="fp-progress-hint">Run the copied command — <code>/pb:handoff</code> reports progress here as it pushes.</div>`;
      document.body.appendChild(el);
      setTimeout(() => el.classList.add('is-visible'), 10);
      _fpRenderProgress();
    }

    function pbSetPushProgress(data) {
      if (!document.getElementById('fp-progress')) pbShowProgress(data);
      _fpProgress = data;
      _fpRenderProgress();
    }
    window.pbSetPushProgress = pbSetPushProgress;

    function _fpRenderProgress() {
      const body = document.getElementById('fp-progress-body');
      if (!body || !_fpProgress) return;
      const rows = [];
      const types = [['components','Components'],['screens','Screens']];
      for (const [key, label] of types) {
        const d = _fpProgress[key];
        if (!d || d.total === 0) continue;
        const pct = d.total > 0 ? Math.round((d.done / d.total) * 100) : 0;
        const isDone = d.done >= d.total;
        rows.push(`
          <div class="fp-progress-row">
            <div class="fp-progress-rowlabel">
              <span class="fp-progress-rowname">${label}</span>
              <span class="fp-progress-rowcount">${d.done} / ${d.total}</span>
            </div>
            <div class="fp-bar-track"><div class="fp-bar-fill${isDone?' done':''}" style="width:${pct}%"></div></div>
            ${d.current ? `<div class="fp-progress-rowcurrent">${pbEscape(d.current)}</div>` : ''}
          </div>`);
      }
      body.innerHTML = rows.join('') || '<div style="font: var(--font-weight-medium) var(--font-size-xs)/var(--line-height-xs) var(--font-body);color:var(--text-tertiary);padding:4px 0">No active push.</div>';
    }

    function pbHideProgress() {
      const el = document.getElementById('fp-progress');
      if (!el) return;
      el.classList.remove('is-visible');
      setTimeout(() => el.remove(), 220);
      _fpProgress = null;
    }

    function openLegendPopover(anchorBtn) {
      document.querySelectorAll('.copy-popover:not(.pb-insp), .copy-popover-backdrop').forEach(el => el.remove());
      window.removeEventListener('keydown', copyPopoverKeyHandler);
      window.removeEventListener('resize', repositionCopyPopover);

      const backdrop = document.createElement('div');
      backdrop.className = 'copy-popover-backdrop';
      backdrop.addEventListener('click', closeCopyPopover);

      const pop = document.createElement('div');
      pop.className = 'copy-popover';
      pop.setAttribute('role', 'dialog');
      pop.setAttribute('aria-label', 'Flow legend');
      pop.style.width = '320px';
      pop.innerHTML = `
        <button class="copy-popover-close" type="button" aria-label="Close" title="Close" onclick="closeCopyPopover()">${COPY_POPOVER_ICONS.close}</button>
        <div class="copy-popover-cmd-label" style="margin-bottom:8px"><span>Flowchart legend</span></div>
        <div class="legend-popover-body">
          ${FLOW_LEGEND_SHAPES.map(s => `
            <div class="legend-popover-row">
              <span class="legend-popover-shape ${s.cls}">${s.glyph}</span>
              <div class="legend-popover-text">
                <div class="legend-popover-name">${s.name}</div>
                <div class="legend-popover-desc">${s.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="legend-popover-footer">Connectors: solid <code>→</code> standard flow · <code>-- label --&gt;</code> labeled decision branch · loops use two separate arrows.</div>
      `;

      document.body.appendChild(backdrop);
      document.body.appendChild(pop);
      positionCopyPopover(pop, anchorBtn);

      setTimeout(() => {
        pop.classList.add('is-visible');
        positionCopyPopover(pop, anchorBtn);
      }, 10);

      window.addEventListener('keydown', copyPopoverKeyHandler);
      window.addEventListener('resize', repositionCopyPopover);
    }

    /* =====================================================================================
       THE SANDBOX — a right-hand inspector (wave 2, tool-chrome r2). It replaced a popover menu
       anchored to the bar, which covered the very strip of page its own controls changed.
       Closed by default. The bar's hourglass or S opens it; Esc closes it unless it is pinned.
       Pinned, it docks: the stage gives up its width and the device refits (the stage's
       ResizeObserver does that, so pinning needs no fit call of its own). The pin is per viewer.
       Flat sections — Conditions · Run · Explore — and Reset session in the footer, last, after
       everything it resets.
       The element is created on open and removed on close, so "is it open" is "is it in the
       DOM". It carries `.copy-popover` + `.proto-sandbox-menu` for the hooks the menu had.
       ===================================================================================== */
    const PB_SBX_PIN_KEY = 'pb-sandbox-pinned';
    state.sbxPinned = pbUiStore(PB_SBX_PIN_KEY) === '1';
    state.sbxRun = {};          // in-page run results, by scenario index — shown, never written back
    function pbSandboxEl() { return document.getElementById('pb-insp'); }
    function pbSandboxIsOpen() { return !!pbSandboxEl(); }
    /* Docking needs room: a phone-width window shows the inspector as a sheet that never docks. */
    function pbSandboxDocked() { return !!state.sbxPinned && window.innerWidth >= 720 && !document.body.classList.contains('pb-embed'); }
    function pbSandboxTrigger() { return document.querySelector('.meta-sandbox'); }
    function pbSandboxSyncTrigger() {
      const t = pbSandboxTrigger();
      if (t) t.setAttribute('aria-expanded', String(pbSandboxIsOpen()));
    }
    function pbSandboxOpen(focus) {
      if (state.metaView !== 'prototype' || document.body.classList.contains('pb-embed')) return;
      let el = pbSandboxEl();
      if (!el) {
        el = document.createElement('aside');
        el.id = 'pb-insp';
        el.className = 'pb-insp copy-popover proto-sandbox-menu is-visible';
        el.setAttribute('aria-labelledby', 'pb-insp-t');
        document.body.appendChild(el);
      }
      el.classList.toggle('is-pinned', !!state.sbxPinned);
      el.innerHTML = pbSandboxHTML();
      pbSandboxSyncTrigger();
      if (focus) { const h = document.getElementById('pb-insp-t'); if (h) h.focus({ preventScroll: true }); }
    }
    function pbSandboxClose(refocus) {
      const el = pbSandboxEl();
      if (el) el.remove();
      pbSandboxSyncTrigger();
      if (refocus) { const t = pbSandboxTrigger(); if (t) t.focus(); }
    }
    function pbSandboxToggle(focus) { if (pbSandboxIsOpen()) pbSandboxClose(focus); else pbSandboxOpen(focus); }
    /* The close button: closing a pinned inspector also unpins it — the pin means "keep it open". */
    function pbSandboxDismiss() { if (state.sbxPinned) pbSandboxSetPin(false); pbSandboxClose(true); }
    function pbSandboxSetPin(on) {
      state.sbxPinned = !!on;
      pbUiStore(PB_SBX_PIN_KEY, on ? '1' : null);
      if (pbSandboxIsOpen()) {
        const sc = pbSandboxEl().scrollTop;
        pbSandboxOpen(false);
        pbSandboxEl().scrollTop = sc;
        const pin = document.querySelector('.pb-insp-pin'); if (pin) pin.focus();
      }
    }
    /* Rebuild the open inspector in place after a control inside it changes state. */
    function pbSandboxRerender() {
      const el = pbSandboxEl();
      if (!el) return;
      const sc = el.scrollTop, fid = document.activeElement && el.contains(document.activeElement) ? document.activeElement.getAttribute('data-sbx-f') : null;
      el.innerHTML = pbSandboxHTML();
      el.scrollTop = sc;
      if (fid) { const f = el.querySelector('[data-sbx-f="' + fid + '"]'); if (f) f.focus({ preventScroll: true }); }
    }
    /* Kept for anything that still calls the menu by its old name. */
    function openSandboxMenu() { pbSandboxOpen(true); }

    /* Conditions — device · chrome · compare · structure tree · role. */
    function pbSandboxPreviewControls() {
      const meta = (PB_REGISTRY && PB_REGISTRY.meta) || {};
      const supported = pbNormalizeDeviceList(meta.devices);
      const shell = state.protoShell || PB_SHELLS[meta.shell] || 'browser';
      const panel = document.getElementById('proto-struct-panel');
      const isStructOpen = panel && panel.classList.contains('is-open');
      const devBtn = (d, sel, ok, why, onclick, group) =>
        `<button class="proto-device-btn ${sel ? 'active' : ''} ${ok ? '' : 'is-disabled'}" type="button" role="radio"
           aria-checked="${sel}" data-sbx-f="${group}-${d.id}" aria-label="${d.label}${ok ? ` · ${d.w}×${d.h}` : ' — ' + why}"
           title="${d.label} · ${d.w}×${d.h}${ok ? '' : ' — ' + why}" ${ok ? '' : 'aria-disabled="true"'}
           ${ok ? `data-sbx-v="${escapeHtmlAttr(d.id)}" onclick="${onclick}(this.dataset.sbxV); pbSandboxRerender()"` : ''}>${protoDeviceIcon(d.id)}</button>`;
      const switcher = `<div class="proto-toolbar" role="radiogroup" aria-labelledby="sbx-l-dev">`
        + PROTO_DEVICES.map(d => devBtn(d, state.protoDevice === d.id, supported.indexOf(d.id) !== -1,
            'Not in meta.devices for this project', 'setProtoDevice', 'dev')).join('') + `</div>`;
      const shellToggle = `<div class="proto-shell-toggle" role="radiogroup" aria-labelledby="sbx-l-chrome">`
        + PB_SHELL_OPTS.map(([id, label]) =>
            `<button class="proto-shell-btn ${shell === id ? 'active' : ''}" type="button" role="radio" aria-checked="${shell === id}"
               data-sbx-f="chrome-${id}" data-sbx-v="${escapeHtmlAttr(id)}" onclick="setProtoShell(this.dataset.sbxV); pbSandboxRerender()">${label}</button>`).join('')
        + `</div>`;
      // Compare is a MODE, not a fourth device: off is the ordinary single view, on adds exactly
      // one more. Switching it on picks the first available second device, so the switch does
      // something the moment you flip it rather than arming an empty state.
      const others = PROTO_DEVICES.filter(d => supported.indexOf(d.id) !== -1 && d.id !== state.protoDevice);
      const cmpOn = !!state.protoDeviceB;
      const sw = (label, on, attrs) => `<button class="proto-menu-item pb-switch" type="button" role="switch" aria-checked="${on}" ${attrs}>
          <span>${label}</span><span class="sbx-sw ${on ? 'on' : ''}" aria-hidden="true"></span></button>`;
      const cmpSwitch = sw('Compare', cmpOn, `data-sbx-f="compare" ${others.length ? '' : 'disabled'}
          title="${others.length
            ? 'Show the same screen on a second device. Both lay out at their true CSS width and share one scale, so the size difference you see is the real one.'
            : 'This project supports only one device size.'}" onclick="toggleProtoCompare(); pbSandboxRerender()"`);
      const cmpPick = cmpOn
        ? `<div class="sbx-row"><span class="sbx-row-lbl" id="sbx-l-with">With</span>
             <div class="proto-toolbar" role="radiogroup" aria-label="Second device">`
           + PROTO_DEVICES.map(d => {
               const ok = others.some(o => o.id === d.id);
               return devBtn(d, state.protoDeviceB === d.id, ok,
                 d.id === state.protoDevice ? 'already the primary' : 'Not in meta.devices for this project', 'setProtoCompare', 'cmp');
             }).join('')
           + `</div></div>`
        : '';
      const roles = pbRolesList();
      const roleRow = roles.length
        ? `<div class="sbx-row"><label class="sbx-row-lbl" for="sbx-role">Role</label>
             <select id="sbx-role" class="sbx-select" data-sbx-f="role" aria-label="Preview as role" onchange="setProtoRole(this.value); pbSandboxRerender()">
             ${roles.map(r => `<option value="${escapeHtmlAttr(r.id)}" ${r.id === state.activeRole ? 'selected' : ''}>${pbEscape(r.name || r.id)}${r.isAdmin ? ' · admin' : ''}</option>`).join('')}
           </select></div>`
        : '';
      return `
        <div class="sbx-row"><span class="sbx-row-lbl" id="sbx-l-dev">Device</span>${switcher}</div>
        <div class="sbx-row"><span class="sbx-row-lbl" id="sbx-l-chrome">Chrome</span>${shellToggle}</div>
        ${cmpSwitch}${cmpPick}
        ${sw('Structure tree', !!isStructOpen, 'data-sbx-f="tree" onclick="toggleProtoStructPanel()"')}
        ${roleRow}`;
    }

    /* The runnable scenarios — flow.stories[].scenarios[], each with the SENTENCE that describes it.
       Two authored shapes are read: { text, category, test: { start, steps[], expect[] } } (what
       /pb:plan --flow writes), and the prose shape { id, test: "the sentence", steps: "…", expect: "…",
       lastResult: { result, at, note } } that a hand-authored suite uses. A list read from a `title`
       field that does not exist said "scenario" on every row, so the label walks the shapes in order.
       A scenario with no test and no steps is a manual check: it is not listed (Test Cases shows it). */
    /* The label and the verdict come from the Test Cases helpers (pbScLabel, pbScStatus), so a scenario is
       called the same thing, and counted the same way, in both places: lastResult.status or .result, one of
       pass · fail · blocked · retired · untested-by-design (`ubd`) · not run (`untested`), or `stale`. */
    function pbRunLabel(sc) { return String(pbScLabel(sc) || sc.name || sc.id || 'scenario'); }
    /* Prose steps / expectations: a string splits on newlines and "; ", an array is taken as it comes. */
    function pbRunProse(v) {
      const a = Array.isArray(v) ? v : typeof v === 'string' ? v.split(/\n+|;\s+/) : [];
      return a.map(x => String(x).trim()).filter(Boolean);
    }
    function pbTestScenarios() {
      const stories = (PB_DATA && PB_DATA.flow && PB_DATA.flow.stories) || [];
      const out = [];
      let retired = 0;
      stories.forEach((s, si) => (s.scenarios || []).forEach((sc, j) => {
        if (!sc || typeof sc !== 'object') return;
        const obj = !!sc.test && typeof sc.test === 'object';
        if (!pbScTracked(sc) && !sc.steps && !sc.expect) return;
        const test = obj ? sc.test : {};
        // `test.roles` scopes a scenario to the role(s) it was written for — the same field
        // test_run.py reads (D-27). A scenario without it shows for everyone. Deliberately NOT
        // admin-aware: this is a curated per-role list, not a permission gate.
        const roles = test.roles;
        if (roles && roles.length && (state.activeRole == null || roles.indexOf(state.activeRole) === -1)) return;
        const rec = pbScStatus(sc);
        // a retired scenario no longer applies: not listed, only counted (UX Design → Test Cases keeps it)
        if (rec.st === 'retired') { retired++; return; }
        const structured = (test.steps || []).length || (test.expect || []).length;
        out.push({ text: pbRunLabel(sc), category: sc.category || '', story: s.title || '', storyIdx: si,
                   id: sc.id || '', key: 's' + si + '-' + j,
                   start: test.start || sc.start || '', status: rec.st, rec: sc.lastResult || {}, test,
                   // Only a test{} block can be performed by this page. A string-shaped `test` is the case's NAME
                   // (its steps are prose): it is listed, with its recorded verdict, but never run here.
                   runnable: obj,
                   // authored as prose: shown, never run here — the run says so and points at /pb:test
                   prose: structured ? null : { steps: pbRunProse(sc.steps), expect: pbRunProse(sc.expect) } });
      }));
      out.retired = retired;   // the Run section says how many it left out
      return out;
    }

    /* Stage the sandbox for a scenario without running it: jump to the screen it starts on and say
       which one you are now driving (a seam for scripts; opening a scenario in the Run list does this). */
    window.pbStartScenario = function (i) {
      const sc = pbTestScenarios()[+i];
      if (!sc) return;
      if (sc.start && pbScreensHas(sc.start)) setProtoScreen(sc.start);
      pbUiToast(sc.text);
    };

    /* A result glyph: an icon with its word as the accessible name, never colour alone. The shared
       set has no icon for a retired scenario or one left untested on purpose, so those two are drawn
       here on the same 24-unit grid: a circle struck through by a minus, and a dashed circle. */
    const PB_RUN_ICONS = {
      retired: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
      ubd: '<circle cx="12" cy="12" r="8.5" stroke-dasharray="2.6 3.2"/>'
    };
    const PB_RUN_GLYPH = { pass: ['pass', 'Passed'], fail: ['fail', 'Failed'], blocked: ['blocked', 'Blocked'],
      untested: ['pending', 'Not run yet'], pending: ['pending', 'Not run'], stale: ['stale', 'Stale — the code changed since it ran'],
      running: ['running', 'Running'], manual: ['manual', 'Checked by hand'],
      retired: ['retired', 'Retired'], ubd: ['ubd', 'Untested by design'] };
    function pbRunGlyph(st) {
      const g = PB_RUN_GLYPH[st] ? st : 'untested', d = PB_RUN_GLYPH[g];
      const ico = PB_RUN_ICONS[d[0]]
        ? `<svg class="pb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PB_RUN_ICONS[d[0]]}</svg>`
        : pbUiIcon(d[0]);
      return `<span class="pb-g pb-g--${g}" role="img" aria-label="${d[1]}" title="${d[1]}">${ico}</span>`;
    }
    /* A step the page cannot perform (authored as prose, or needing the server): said once, the same way everywhere. */
    const PB_RUN_BLOCKED = 'blocked: run /pb:test for this step';
    /* What a row shows: the in-page run's verdict when it reached one; else what /pb:test recorded. A page
       that could not decide ("blocked") never hides a recorded verdict — that is the one of record. */
    function pbRunEffective(t) {
      const r = state.sbxRun[t.key];
      if (!r || !r.status) return t.status;
      if (r.status === 'blocked' && t.status !== 'untested') return t.status;
      return r.status;
    }
    /* "8 pass · 1 fail · 3 not run" — only the kinds present, so the numbers always add up to the count. */
    const PB_RUN_TALLY = [['pass', 'pass'], ['fail', 'fail'], ['blocked', 'blocked'], ['stale', 'stale'], ['running', 'running'],
      ['retired', 'retired'], ['ubd', 'untested by design'], ['untested', 'not run']];
    function pbRunTallyHTML(list) {
      const n = {};
      list.forEach(t => { const s = pbRunEffective(t); n[s] = (n[s] || 0) + 1; });
      return PB_RUN_TALLY.filter(p => n[p[0]]).map(p => `<span class="pb-run-tl pb-run-tl--${p[0]}">${n[p[0]]} ${p[1]}</span>`)
        .join('<span aria-hidden="true"> · </span>');
    }
    /* The tallies are live while a run goes: a closed group still says how far it has got. */
    function pbRunRefreshTallies() {
      const el = pbSandboxEl();
      if (!el) return;
      const tests = pbTestScenarios();
      const all = el.querySelector('[data-run-tally="all"]');
      if (all) all.innerHTML = pbRunTallyHTML(tests);
      el.querySelectorAll('[data-run-tally]').forEach(n => {
        const g = n.getAttribute('data-run-tally');
        if (g !== 'all') n.innerHTML = pbRunTallyHTML(tests.filter(t => String(t.storyIdx) === g));
      });
    }
    /* What /pb:test last recorded for a scenario, when it recorded anything: the verdict, when, and its note. */
    function pbRunRecordedHTML(t) {
      const lr = t.rec || {};
      if (!(lr.status || lr.result)) return '';
      const when = lr.ranAt || lr.at || '';
      const note = lr.note || lr.detail || '';
      const word = (PB_RUN_GLYPH[t.status] || PB_RUN_GLYPH.untested)[1];
      return `<div class="pb-run-rec">${pbRunGlyph(t.status)}<div><strong>${word}</strong>${when ? `<span class="pb-run-when" title="What /pb:test last recorded"> · ${pbEscape(when)}</span>` : ''}${note ? pbRichText(note, { numbers: false }) : ''}</div></div>`;
    }
    function pbRunScenarioHTML(t, i, gi) {
      const r = state.sbxRun[t.key] || {};
      const steps = r.lines || pbRunPlan(t.test, t.prose);
      const meta = [t.id ? `<span class="pb-run-id">${pbEscape(t.id)}</span>` : '', t.category ? pbEscape(t.category) : '',
                    t.start ? `starts on <strong>${pbEscape(t.start)}</strong>` : ''].filter(Boolean).join(' · ');
      const body = (meta ? `<p class="pb-run-meta">${meta}</p>` : '') + pbRunRecordedHTML(t)
        + (steps.length
            ? `<ol class="pb-run-steps" id="pb-run-steps-${i}">${steps.map(l =>
                `<li class="pb-run-step" data-step="${l.n}">${pbRunGlyph(l.status || 'pending')}<div>${l.html}${l.why
                  ? `<small class="why${l.status === 'fail' ? ' is-fail' : ''}">${pbEscape(l.why)}</small>` : ''}</div></li>`).join('')}</ol>`
            : `<p class="pb-run-meta">No steps are written for this scenario.</p>`);
      return `<li class="pb-run-sc" data-run="${i}" data-key="${pbEscape(t.key)}">`
        + pbDiscHTML({ id: 'sbx-run-s-' + t.key, level: 'row', group: 'sbx-run-s-' + gi, cls: 'pb-run-d',
            summary: `${pbRunGlyph(pbRunEffective(t))}<span class="t" title="${escapeHtmlAttr(t.text)}">${pbEscape(t.text)}</span>`, body })
        // a string-shaped `test` is a name over prose steps: nothing here can perform it, so its ▶ is off and says where to go
        + (t.runnable
          ? `<button class="pb-ib pb-ib--sm pb-run-go" type="button" data-sbx-f="run-p-${i}" onclick="pbRunScenarios([${i}])"
                  title="Run: ${escapeHtmlAttr(t.text)}" aria-label="Run: ${escapeHtmlAttr(t.text)}">${pbUiIcon('play')}</button></li>`
          : `<button class="pb-ib pb-ib--sm pb-run-go" type="button" data-sbx-f="run-p-${i}" disabled aria-disabled="true"
                  title="Prose steps — run /pb:test" aria-label="Run: ${escapeHtmlAttr(t.text)} — prose steps, run /pb:test">${pbUiIcon('play')}</button></li>`);
    }
    /* Run — a section disclosure over the scenarios grouped BY STORY: a group is the story's title, its
       count and its pass / fail / not-run tally; each scenario inside is a disclosure of its own. All
       multi-open; "Collapse all" acts on the groups. A small suite opens its groups, a large one (polygon:
       21 stories, 204 scenarios) opens none, and a run leaves them exactly as they were. The in-page run is
       shown here and only here; /pb:test is the only thing that writes a scenario's lastResult. */
    function pbSandboxRunHTML(tests, running) {
      const groups = [];
      tests.forEach((t, i) => {
        let g = groups.find(x => x.si === t.storyIdx);
        if (!g) { g = { si: t.storyIdx, title: t.story || 'Scenarios', items: [] }; groups.push(g); }
        g.items.push([t, i]);
      });
      const openGroups = tests.length <= 8 || groups.length === 1;
      const anyRun = tests.some(t => t.runnable);
      const runAll = `<button class="pb-btn pb-btn--ghost pb-btn--sm pb-run-all" type="button" data-sbx-f="runall" onclick="pbRunScenarios()"
          ${anyRun && !running ? '' : 'disabled'} title="${anyRun ? 'Run every scenario in order, here in the page' : tests.length ? 'Prose steps — run /pb:test' : 'No scenarios to run'}">${pbUiIcon('playAll')}Run all</button>`;
      let body;
      if (!tests.length) {
        body = `<p class="pb-insp-note">No scenarios yet. <code>/pb:plan --flow</code> writes them.</p>`;
      } else {
        const list = groups.map(g => pbDiscHTML({
          id: 'sbx-run-g-' + g.si, level: 'row', group: 'sbx-run-g', cls: 'pb-run-g', open: openGroups,
          summary: `<span class="pb-run-gh"><span class="pb-run-gt" title="${escapeHtmlAttr(g.title)}">${pbEscape(g.title)}</span><span class="pb-run-gn">${g.items.length}</span></span>`
            + `<span class="pb-run-tally" data-run-tally="${g.si}">${pbRunTallyHTML(g.items.map(x => x[0]))}</span>`,
          body: `<ul class="pb-run-list">${g.items.map(x => pbRunScenarioHTML(x[0], x[1], g.si)).join('')}</ul>`
        })).join('');
        body = `<div class="pb-run-bar"><span class="pb-run-tally" data-run-tally="all">${pbRunTallyHTML(tests)}</span>${groups.length > 1 ? pbDiscGroupBarHTML('sbx-run-g') : ''}</div>`
          + `<div class="pb-run" role="group" aria-label="Scenario testing">${list}</div>`;
      }
      if (tests.retired) body += `<p class="pb-insp-note pb-run-retired">${tests.retired} retired scenario${tests.retired === 1 ? '' : 's'} not listed — UX Design → Test Cases → Show retired.</p>`;
      return `<section class="pb-run-sec" aria-label="Run">`
        + pbDiscHTML({ id: 'sbx-run', level: 'section', open: false, cls: 'pb-run-disc',
            summary: `Run<span class="pb-run-count">${tests.length}</span>`, body })
        + runAll + `</section>`;
    }

    /* The inspector's whole content. Direct children are flat on purpose (rows, then the footer). */
    function pbSandboxHTML() {
      const tests = pbTestScenarios();
      const pinned = !!state.sbxPinned;
      const exploreSel = pbExploreSelect();
      const exploreOn = /<select(?![^>]*disabled)/.test(exploreSel);
      const running = !!state.sbxRunning;
      return `
        <div class="pb-insp-h">
          <h2 class="pb-insp-t" id="pb-insp-t" tabindex="-1">Sandbox</h2>
          <button class="pb-ib pb-insp-pin" type="button" data-sbx-f="pin" aria-pressed="${pinned}" onclick="pbSandboxSetPin(!state.sbxPinned)"
                  title="${pinned ? 'Unpin — float over the prototype' : 'Pin — dock beside the prototype'}"
                  aria-label="${pinned ? 'Unpin the sandbox' : 'Pin the sandbox'}">${pbUiIcon('pin')}</button>
          <button class="pb-ib" type="button" data-sbx-f="close" onclick="pbSandboxDismiss()" title="Close (Esc)" aria-label="Close the sandbox">${pbUiIcon('x')}</button>
        </div>
        <h3 class="pb-insp-sec">Conditions</h3>
        ${pbSandboxPreviewControls()}
        ${pbSandboxRunHTML(tests, running)}
        <h3 class="pb-insp-sec">Explore</h3>
        <div class="sbx-row ${exploreOn ? '' : 'is-disabled'}"><span class="sbx-row-lbl">Explore</span>${exploreSel}</div>
        ${exploreOn ? '' : `<p class="pb-insp-note">No explore round is open. Start one with <code>/pb:explore &lt;id&gt;</code></p>`}
        <div class="pb-insp-f">
          <button class="proto-menu-item" type="button" data-sbx-f="reset" onclick="pbSandboxReset()" title="Reset session (R) — first screen, empty fields, default role"
            >${pbUiIcon('reload')}<span>Reset session</span><span class="pb-kbd" aria-hidden="true">R</span></button>
          <span class="sbx-foot">pb v${PB_SHELL_VERSION}</span>
        </div>`;
    }
    /* Reset from the footer or R: the session, and the in-page run results with it. */
    function pbSandboxReset() {
      state.sbxRunToken = (state.sbxRunToken || 0) + 1;
      state.sbxRunning = false;
      state.sbxRun = {};
      pbResetSandbox();
      pbSandboxRerender();
      pbUiToast('Session reset');
    }

    /* ── The in-page run ────────────────────────────────────────────────────────────────────
       The same test{} vocabulary test_run.py drives (start · steps[{do,target,value}] · expect[]),
       performed on this page so you can watch it: navigate to the start screen, then each step,
       ticking pass / fail / blocked in order. What the page cannot do — apply a seed, read the
       console, read a step written as prose — is "blocked", and says to run /pb:test, the one place
       a verdict is recorded. A prose step is blocked before the run starts, because nothing about
       the run can change that, so it is drawn that way from the first paint. */
    function pbRunPlan(test, prose) {
      const t = test || {};
      const lines = [];
      const add = (kind, html, more) => lines.push(Object.assign({ n: lines.length, kind, html }, more));
      const word = (html) => add('prose', html, { status: 'blocked', why: PB_RUN_BLOCKED });
      if ((t.roles || []).length) add('role', `As <strong>${pbEscape(t.roles[0])}</strong>`);
      if (t.seed) add('seed', `Seed data <strong>${pbEscape(t.seed)}</strong>`);
      if (t.start) add('start', `Start on <strong>${pbEscape(t.start)}</strong>`);
      (t.steps || []).forEach(x => typeof x === 'string' ? word(pbEscape(x)) : add('step', pbStepText(x), { step: x }));
      (t.expect || []).forEach(x => typeof x === 'string' ? word('Expect ' + pbEscape(x)) : add('expect', 'Expect ' + pbExpectText(x), { exp: x }));
      if (prose) {
        prose.steps.forEach(x => word(pbEscape(x)));
        prose.expect.forEach(x => word('Expect ' + pbEscape(x)));
      }
      return lines;
    }
    /* Opening a scenario shows its steps and — when nothing is running — stages the sandbox for it:
       the screen it starts on, so you can drive it by hand. Running it is the ▶ beside it. The open
       state is the disclosure's own (pbDiscHTML remembers it across a re-render); this only adds the
       staging. */
    document.addEventListener('pb:disclosure', e => {
      const d = e.detail || {};
      if (!d.open || String(d.id).indexOf('sbx-run-s-') !== 0 || state.sbxRunning) return;
      const t = pbTestScenarios().find(x => 'sbx-run-s-' + x.key === d.id);
      if (t && t.start && pbScreensHas(t.start)) setProtoScreen(t.start);
    });
    const pbSleep = ms => new Promise(res => setTimeout(res, ms));
    function pbRunFrame() { return document.getElementById('proto-frame'); }
    /* A target that is not a selector may name a data-* value (data-nav="login"). `data-cmp` is left out:
       pbUse stamps every component root with its component id, which is a name for the component, not a
       hook the author put on an element, so it must never answer a step's target. */
    function pbRunByData(root, val) {
      for (const el of Array.from(root.querySelectorAll('*'))) {
        for (const a of Array.from(el.attributes)) if (a.name.indexOf('data-') === 0 && a.name !== 'data-cmp' && a.value === val) return el;
      }
      return null;
    }
    function pbRunResolve(frame, target) {
      if (!target) return null;
      try { const el = frame.querySelector(target); if (el) return el; } catch (e) { /* not a selector */ }
      return pbRunByData(frame, target);
    }
    function pbRunResolveInput(frame, target) {
      if (!target) return frame.querySelector('.field__input');
      for (const lb of Array.from(frame.querySelectorAll('.field__label, label'))) {
        const t = (lb.textContent || '').trim();
        if (t === target || t.indexOf(target) !== -1) {
          const field = lb.closest('.field') || lb.parentElement;

          if (inp) return inp;

    /* One step → { status, why }. Mirrors test_run.py's _STEP_JS. */

      const d = step && step.do;
      if (!d) return { status: 'blocked', why: 'blocked: a step with no `do` — run /pb:test for this step' };
      if (d === 'fill') {
        const inp = pbRunResolveInput(frame, step.target);
        if (!inp) return { status: 'fail', why: 'no input for ' + JSON.stringify(step.target) };
        inp.value = step.value == null ? '' : String(step.value);
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        inp.dispatchEvent(new Event('change', { bubbles: true }));

      }
      if (d === 'back') { protoBack(); return { status: 'pass' }; }
      let target = step.target;
      if (!target && d === 'submit') target = '[data-action="submit"]';
      if (!target && d === 'toggle-password') target = '[data-action="toggle-password"]';
      if (!target) return { status: 'blocked', why: 'blocked: run /pb:test for this step' };
      const el = pbRunResolve(frame, target);
      if (!el && (d === 'nav' || d === 'go') && pbScreensHas(step.target)) { setProtoScreen(step.target); return { status: 'pass' }; }
      if (!el) return { status: 'fail', why: 'no element for ' + JSON.stringify(step.target) };
      el.click();
      return { status: 'pass' };
    }
    function pbRunExpect(exp) {
      const frame = pbRunFrame();
      if (!exp || typeof exp !== 'object') return { status: 'blocked', why: 'blocked: run /pb:test for this step' };
      if ('screen' in exp) return state.protoScreenId === exp.screen ? { status: 'pass' } : { status: 'fail', why: 'on ' + state.protoScreenId };
      if ('text' in exp) return frame && (frame.textContent || '').indexOf(exp.text) !== -1 ? { status: 'pass' } : { status: 'fail', why: 'not on the screen' };
      if ('errors' in exp) {
        const n = frame ? Array.from(frame.querySelectorAll('.field__error')).filter(e => e.offsetParent !== null && getComputedStyle(e).display !== 'none').length : 0;

    async function pbRunOne(i, tok, quiet) {

      const lines = pbRunPlan(sc.test, sc.prose).map(l => l.kind === 'prose' ? l : Object.assign({}, l, { status: 'pending', why: '' }));
      state.sbxRun[sc.key] = { status: 'running', lines };
      // A single ▶ opens the scenario so its steps can be watched, and leaves it open. Inside a run of many,
      // a scenario opens only while it is the one running, and only if its group is already open; it closes
      // again after, so a run never leaves the list as a wall of open rows.
      const did = 'sbx-run-s-' + sc.key, wasOpen = pbDiscIsOpen(did, false);

      const gEl = document.querySelector('.pb-disc[data-pb-disc="sbx-run-g-' + sc.storyIdx + '"]');

      else if (gEl && gEl.classList.contains('is-open')) pbDiscSet(did, true, true);

        if (!live()) return false;
        if (failed) { line.status = 'pending'; line.why = 'not run — an earlier step failed'; pbRunTick(i, line); continue; }
        if (line.kind === 'prose') { pbRunTick(i, line); continue; }   // nothing to wait for: it cannot run here

        if (!live()) return false;
        let res;

    /* Run some scenarios (default: all of them), one after another. Starting a run, or a reset,

       A ▶ on a runnable one still runs it, whatever it was recorded as. */
    async function pbRunScenarios(list) {
      if (state.metaView !== 'prototype') setMetaView('prototype');
      if (!pbSandboxIsOpen()) pbSandboxOpen(false);

      const explicit = Array.isArray(list);
      const can = i => !!tests[i] && tests[i].runnable;
      const which = explicit ? list.filter(can) : tests.map((_, i) => i).filter(i => can(i) && tests[i].status !== 'retired' && tests[i].status !== 'ubd');
      const skipped = explicit ? 0 : tests.filter(t => t.runnable).length - which.length;
      if (!which.length) {

          tests.length ? 'These scenarios are prose steps — run /pb:test.' : '/pb:plan --flow writes them.');

      const tok = state.sbxRunToken = (state.sbxRunToken || 0) + 1;

      if (tok !== state.sbxRunToken) return;

    function pbExploreSelect() {

      // Supported device sizes — meta.devices (normalized to the 4-key model; legacy 'desktop'
      // expands to monitor+laptop). The current device must be supported.
      const supported = pbNormalizeDeviceList(meta.devices);
      if (!state.protoDevice) state.protoDevice = pbNormalizeDevice(meta.device || 'laptop');
      if (supported.indexOf(state.protoDevice) === -1) state.protoDevice = supported[0] || 'laptop';
      if (!state.protoShell) state.protoShell = PB_SHELLS[meta.shell] || 'browser';
      // v1.5 — resolve the active role (absent meta.roles ⇒ null, switcher hidden, nothing gated).
      const roles = (meta.roles && meta.roles.length) ? meta.roles : [];
      if (roles.length) {
        if (state.activeRole == null || !roles.some(r => r.id === state.activeRole)) state.activeRole = pbResolveDefaultRole();
      } else {
        state.activeRole = null;
      }
      let sel = screens.find(s => s.id === state.protoScreenId);
      // If the active (non-admin) role may not see the selected screen, fall back to the first it can.
      if (roles.length && sel && !pbScreenAllowsRole(sel, state.activeRole)) {
        const permitted = screens.find(s => pbScreenAllowsRole(s, state.activeRole));
        if (permitted) { state.protoScreenId = permitted.id; sel = permitted; }
      }
      const device = state.protoDevice;
      const shell = state.protoShell;

      // v1.9 — the Prototype tab has NO page header: chrome · device · compare · structure tree ·
      // sandbox all live in the consolidated Sandbox menu in the meta nav (openSandboxMenu), and the
      // preview fills the tab. The header-tool builders that used to sit here were already dead, and
      // one of them was a SECOND chrome toggle that only ever offered Browser and App — the pair of
      // them is how `none` came to be an option you could click and nothing happened.
      const isStructOpen = document.getElementById('proto-struct-panel')
        && document.getElementById('proto-struct-panel').classList.contains('is-open');

      // Compare (v2.0.0) — the same screen on a second device. It must be a device this project
      // supports, and it must not be the primary: a laptop beside itself is a bug, not a view.
      const devB = (state.protoDeviceB && state.protoDeviceB !== device
                    && supported.indexOf(state.protoDeviceB) !== -1) ? state.protoDeviceB : null;
      if (state.protoDeviceB && !devB) state.protoDeviceB = null;

      const body = (typeof window[sel.renderFn] === 'function')
        ? window[sel.renderFn]()
        : `<div class="placeholder-card"><p>Screen "${sel.name}" has no render function yet — run <code>/pb:build --render</code>.</p></div>`;

      const closeIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

      $('#app').innerHTML = `
        <div class="pb-page pb-page--viewport pb-page--proto">
          <div class="pb-content pb-content--fill">
            <div class="pb-main proto-main" id="proto-main">
              <div class="proto-stage" id="proto-stage">
                <div class="proto-fit${devB ? ' is-compare is-fitted' : (device === 'tablet' || device === 'mobile') ? ' is-fitted' : ''}" id="proto-fit">
                  <div class="proto-pair-box" id="proto-pair-box">
                    <div class="proto-pair" id="proto-pair">
                      ${protoFrameSlot('a', device, sel, meta, shell, body, !!devB)}
                      ${devB ? protoFrameSlot('b', devB, sel, meta, shell, body, true) : ''}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div id="proto-struct-panel" class="proto-struct-panel${isStructOpen ? ' is-open' : ''}">
              <div class="proto-struct-head">
                <span class="proto-struct-title">Structure</span>
                <button class="proto-struct-close" type="button" aria-label="Close the structure tree" title="Close the structure tree"
                        onclick="toggleProtoStructPanel()">${closeIcon}</button>
              </div>
              <div class="proto-struct-panel-body">${pbRenderStructureTree(screens)}</div>
            </div>
          </div>
        </div>`;
      wireProtoNav(document.getElementById('proto-frame'));
      if (devB) wireProtoNav(document.getElementById('proto-frame-b'));
      pbApplyRoleGating();
      pbSyncMachines(document.getElementById('proto-frame'));
      const frameB = document.getElementById('proto-frame-b');
      if (frameB) pbSyncMachines(frameB);
      requestAnimationFrame(function () {
        // pbMirrorFrames FIRST: it splits the two frames' radio groups, and a frame still showing
        // a collapsed view measures short — the pair would then be scaled to a height it is about
        // to stop having.
        pbMirrorFrames(); fitProtoFrame(); pbSetStatusBarContrast(); pbWatchStage();
      });
    }

    /* ── Compare mode: two frames, one session ──────────────────────────────────────────────
       Both frames show the same screen, so anything that changes INSIDE that screen has to show
       in both or the comparison is a lie. Screen-level navigation already did, because it
       re-renders — but everything below it did not: a wizard step, a revealed password, a
       validation error, a typed value all landed only in the frame that was clicked.

       Mirroring one verb at a time would not hold. `registry.runtime[]` lets a project run its
       own code against the DOM, and the next verb pb adds would have to remember to join in. So
       the mirror is general and knows nothing about verbs. Both frames hold IDENTICAL markup, so
       an element's twin is the node in the same position — which is exactly what re-serialising
       innerHTML replays, for free and for anything.

         · structure, attributes, injected nodes → a MutationObserver copies src.innerHTML across
         · value / checked / selectedIndex       → DOM *properties*. They are not in innerHTML and
                                                   they emit no mutation record, so an input and
                                                   change listener carries those over on their own
         · scrollTop / scrollLeft                → the same kind of thing, and the one that made
                                                   in-page navigation look broken (v2.0.0). A jump
                                                   to a section, a `scrollIntoView`, a re-render
                                                   that returns to the top: all of them move ONE
                                                   frame, and the copy above then put the twin's
                                                   old offset straight back. The content reached
                                                   both frames; only one of them was looking at it.

       The observers are DISCONNECTED around the write rather than skipped with a boolean: the
       callback is a microtask, so a flag set and cleared synchronously is already false by the
       time the echo arrives, while disconnect() drops the queued records outright.

       None of this exists outside compare mode. One `.proto-screen` means nothing to mirror and
       no observer is attached, so the single-frame path pays nothing. */
    var _pbMirror = null;
    const PB_MIRROR_OPTS = { subtree: true, childList: true, attributes: true, characterData: true };
    const PB_MIRROR_FIELDS = 'input, textarea, select';

    function pbMirrorPause(fn) {
      if (!_pbMirror) { fn(); return; }
      _pbMirror.obs.forEach(function (o) { o.disconnect(); });
      try { fn(); } finally {
        _pbMirror.obs.forEach(function (o, i) { o.observe(_pbMirror.roots[i], PB_MIRROR_OPTS); });
      }
    }

    /* A node's twin is the node at the same position in the other frame — the mirror's whole
       premise, so the address of a node is its chain of child indexes up to the frame root. */
    function pbFramePath(root, el) {
      const path = [];
      while (el && el !== root) {
        const p = el.parentNode;
        if (!p || p.nodeType !== 1) return null;
        path.push(Array.prototype.indexOf.call(p.children, el));
        el = p;
      }
      return el === root ? path : null;
    }
    function pbFrameNodeAt(root, path) {
      let el = root;
      for (let i = path.length - 1; i >= 0 && el; i--) el = el.children[path[i]];
      return el || null;
    }

    /* Taken as a snapshot rather than copied field by field, because the write that sits between
       the read and the apply can disturb the frame being read FROM — see pbScopeRadios. */
    function pbFieldSnapshot(root) {
      return Array.prototype.map.call(root.querySelectorAll(PB_MIRROR_FIELDS), function (el) {
        return (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked }
             : (el.tagName === 'SELECT') ? { index: el.selectedIndex }
             : { value: el.value };
      });
    }
    function pbApplyFieldSnapshot(root, snap) {
      const els = root.querySelectorAll(PB_MIRROR_FIELDS);
      for (let i = 0; i < els.length && i < snap.length; i++) {
        const el = els[i], rec = snap[i];
        if ('checked' in rec) { if (el.checked !== rec.checked) el.checked = rec.checked; }
        else if ('index' in rec) { if (el.selectedIndex !== rec.index) el.selectedIndex = rec.index; }
        else if (el.value !== rec.value) el.value = rec.value;
      }
    }
    function pbCopyFieldState(src, dst) { pbApplyFieldSnapshot(dst, pbFieldSnapshot(src)); }

    /* A radio button group is every radio sharing a NAME **and a form owner**, across the whole
       document. Two frames of the same screen is two of every radio in it, so the browser treats
       them as one group and only one of the two can be checked — checking the second frame's
       radio silently unchecks the first frame's, and there is no event and no mutation to notice
       it by. A project that drives its in-page navigation from CSS-only radio state (a
       `:has(#view-a:checked) .view-a { display:flex }` switch, which is how a prototype gets tabs
       and master-detail without a line of JS) therefore renders its content in EXACTLY ONE of the
       two frames: the other one's view is `display:none` and the frame looks empty.

       Renaming the radios would break any `[name="…"]` the project's own CSS uses. The form owner
       is the other half of what defines a group, and nothing selects on it: each secondary frame
       gets an empty `<form>` of its own, and its radios point at it. Same names, same ids, same
       CSS — two groups. It is re-applied after every copy, because innerHTML brings the original
       attributes back with it. */
    function pbScopeRadios(root, i) {
      const id = 'pb-radio-scope-' + i;
      let form = document.getElementById(id);
      if (!form) {
        form = document.createElement('form');
        form.id = id;
        form.hidden = true;
        form.addEventListener('submit', function (e) { e.preventDefault(); });
        document.body.appendChild(form);
      }
      Array.prototype.forEach.call(root.querySelectorAll('input[type="radio"]'), function (r) {
        if (r.getAttribute('form') !== id) r.setAttribute('form', id);
      });
    }

    /* Writing scrollTop fires a scroll event of its own, which would bounce straight back and
       fight the frame the user is actually driving. The echo is suppressed by time rather than by
       a flag cleared on the next event: a write that lands on the value already there fires
       nothing at all, and a flag nobody clears would then swallow the next real scroll. */
    const PB_SCROLL_ECHO_MS = 150;
    function pbNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
    function pbScrollQuiet(el) { if (el) el.__pbEcho = pbNow() + PB_SCROLL_ECHO_MS; }
    function pbScrollIsEcho(el) { return !!(el && el.__pbEcho && pbNow() < el.__pbEcho); }

    /* The two frames are DIFFERENT widths — that is the entire point of compare — so the same
       pixel offset is not the same content: a phone lays the same screen out far taller than a
       laptop does. What carries across is the PROPORTION. A jump to the last section lands on the
       last section in both; halfway down stays halfway down. */
    function pbCarryScrollTo(src, dst) {
      const sy = src.scrollHeight - src.clientHeight, dy = dst.scrollHeight - dst.clientHeight;
      const sx = src.scrollWidth - src.clientWidth, dx = dst.scrollWidth - dst.clientWidth;
      const top = sy > 0 ? Math.round((src.scrollTop / sy) * dy) : 0;
      const left = sx > 0 ? Math.round((src.scrollLeft / sx) * dx) : 0;
      if (Math.abs(dst.scrollTop - top) > 1 || Math.abs(dst.scrollLeft - left) > 1) {
        pbScrollQuiet(dst);
        dst.scrollTop = top; dst.scrollLeft = left;
      }
    }
    /* innerHTML resets every scroll position the twin holds — its own and every scroller inside
       it — and the twin is not the frame the user is looking at, so they all go back. */
    function pbScrollSnapshot(root) {
      const out = [[[], root.scrollTop, root.scrollLeft]];
      Array.prototype.forEach.call(root.querySelectorAll('*'), function (el) {
        if (el.scrollTop || el.scrollLeft) {
          const p = pbFramePath(root, el);
          if (p) out.push([p, el.scrollTop, el.scrollLeft]);
        }
      });
      return out;
    }
    function pbScrollRestore(root, snap) {
      snap.forEach(function (rec) {
        const el = rec[0].length ? pbFrameNodeAt(root, rec[0]) : root;
        if (!el) return;
        pbScrollQuiet(el);
        el.scrollTop = rec[1]; el.scrollLeft = rec[2];
      });
    }

    /* ONE frame drives the session (v2.0.0). Two frames in one document means every id in a
       screen body exists twice, so a project's own handler splits down the middle: `this` and
       `closest` find the frame that was clicked, `document.getElementById` always finds the
       first one. A click in the second frame ran half in each — the pane switched in frame A,
       the tab highlight moved in frame B — and the mirror then copied one half over the other,
       leaving BOTH frames showing a state that never existed.

       So a click in a secondary frame is replayed on the primary frame's twin node: the handler
       runs once, in one frame, with `this` and the ids agreeing, and the mirror carries the
       result back. The second frame stays live — it is still the thing you click — it just is
       not a second session, which is what the id space already decided.

       Not replayed: what the browser drives itself. A text field, a select, a label keep their
       click so the caret stays in the frame being typed in, and the field carry above syncs the
       value. ⌥-click is the inspector — read-only and deliberately frame-local. */
    const PB_MIRROR_NATIVE = 'input, textarea, select, option, label, [contenteditable]';
    function pbForwardClick(e, sec, primary) {
      if (e.altKey || !e.target || e.target.nodeType !== 1) return;
      if (e.target.closest(PB_MIRROR_NATIVE)) return;
      const path = pbFramePath(sec, e.target);
      if (!path || !path.length) return;
      const twin = pbFrameNodeAt(primary, path);
      if (!twin) return;
      e.preventDefault();
      e.stopPropagation();
      let ev;
      try {
        ev = new MouseEvent('click', { bubbles: true, cancelable: true, view: window,
          ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, metaKey: e.metaKey });
      } catch (err) {
        ev = document.createEvent('MouseEvents');
        ev.initEvent('click', true, true);
      }
      twin.dispatchEvent(ev);
    }

    function pbMirrorFrames() {
      if (_pbMirror) {
        _pbMirror.obs.forEach(function (o) { o.disconnect(); });
        _pbMirror.roots.forEach(function (r) { r.removeEventListener('scroll', _pbMirror.onScroll, true); });
      }
      _pbMirror = null;
      const roots = Array.prototype.slice.call(document.querySelectorAll('.proto-screen'));
      if (roots.length < 2 || typeof MutationObserver === 'undefined') return;
      const copy = function (src) {
        // Read the live properties BEFORE the write: parsing a `checked` attribute into the twin
        // takes the group away from the frame we are copying from, so `src` needs putting back too.
        const snap = pbFieldSnapshot(src);
        roots.forEach(function (dst, i) {
          if (dst === src) return;
          const keep = pbScrollSnapshot(dst);
          dst.innerHTML = src.innerHTML;
          if (i) pbScopeRadios(dst, i);
          pbApplyFieldSnapshot(dst, snap);
          pbScrollRestore(dst, keep);
        });
        pbApplyFieldSnapshot(src, snap);
      };
      const obs = roots.map(function (src) {
        return new MutationObserver(function () { pbMirrorPause(function () { copy(src); }); });
      });
      // Scroll does not bubble, so the listener captures: one per frame covers the frame itself
      // and every scroller inside it.
      const onScroll = function (e) {
        const src = e.currentTarget, el = e.target;
        if (!el || el.nodeType !== 1 || pbScrollIsEcho(el)) return;
        const path = (el === src) ? [] : pbFramePath(src, el);
        if (!path) return;
        roots.forEach(function (dst) {
          if (dst === src) return;
          const twin = path.length ? pbFrameNodeAt(dst, path) : dst;
          if (twin) pbCarryScrollTo(el, twin);
        });
      };
      // Before anything is observed: the render that just built both frames let the second one's
      // `checked` attributes take the group from the first, so scope the groups apart and put
      // every radio back to what its own markup says. Both frames came from one HTML string, so
      // the attribute IS the shared truth at this point.
      roots.forEach(function (r, i) { if (i) pbScopeRadios(r, i); });
      roots.forEach(function (r) {
        Array.prototype.forEach.call(r.querySelectorAll('input[type="radio"]'), function (x) {
          if (x.checked !== x.defaultChecked) x.checked = x.defaultChecked;
        });
      });
      _pbMirror = { roots: roots, obs: obs, onScroll: onScroll };
      obs.forEach(function (o, i) { o.observe(roots[i], PB_MIRROR_OPTS); });
      roots.forEach(function (src) {
        const carry = function () {
          pbMirrorPause(function () {
            roots.forEach(function (dst) { if (dst !== src) pbCopyFieldState(src, dst); });
          });
        };
        src.addEventListener('input', carry);
        src.addEventListener('change', carry);
        src.addEventListener('scroll', onScroll, true);
      });
      roots.slice(1).forEach(function (sec) {
        sec.addEventListener('click', function (e) { pbForwardClick(e, sec, roots[0]); }, true);
      });
    }

    /* The stage changes width for reasons that are not a window resize — the structure panel
       slides in and out beside it over 250ms. A single frame rides that out in CSS (max-width:100%),
       but compare mode's scale is computed in JS at render time, so opening the panel left the pair
       at its old size, overflowing the column and running under the panel. One observer on the
       stage covers the panel, the window, and whatever moves the column next. */
    var _pbStageRO = null;
    function pbWatchStage() {
      const stage = document.getElementById('proto-stage');
      if (!stage || typeof ResizeObserver === 'undefined') return;
      if (!_pbStageRO) _pbStageRO = new ResizeObserver(function () { fitProtoFrame(); });
      _pbStageRO.disconnect();
      _pbStageRO.observe(stage);
    }

    /* One device's frame. Compare mode renders two — the same screen body twice, each laid out at
       its own TRUE CSS width, so the wrapping and the container queries you see are the real ones
       (a @media rule would answer the browser window — every frame is in this one document).
       The bodies are pure functions of the registry, so rendering one twice is free and identical.
       What two frames are NOT is two sessions: they share this document, so a screen body that
       looks itself up by a duplicated id finds frame A's copy. That is why a click in the second
       frame is replayed on the first one's twin node (pbForwardClick) and the result mirrored back
       — one session, two views, rather than two half-sessions fighting over one id space. */
    function protoFrameSlot(slot, deviceId, sel, meta, shell, body, compare) {
      const d = PROTO_DEVICES.find(x => x.id === deviceId) || PROTO_DEVICES[1];
      const isDevice = (deviceId === 'tablet' || deviceId === 'mobile');
      const sfx = slot === 'a' ? '' : '-' + slot;
      // Compare gives BOTH frames their real pixel height, so the pair is one object to scale.
      const wrapH = compare ? `;height:${d.h}px` : (isDevice ? '' : ';height:100%');
      const scrH = (compare || !isDevice) ? 'flex:1 1 auto;min-height:0' : `height:${d.h}px`;
      // No visible caption. A line of "Mobile 429 × 926" above each frame was sub-info the preview
      // does not need — the devices are visibly different, and the Sandbox is where they are named.
      // The frame still has an accessible name, so which one is which is not lost to a screen reader.
      return `<div class="proto-frame-slot">
          <div class="proto-frame proto-frame--${deviceId} proto-shell--${shell}" id="proto-frame-wrap${sfx}"
               role="group" aria-label="${pbEscape(d.label)} · ${d.w} × ${d.h}"
               style="width:${d.w}px${compare || isDevice ? '' : ';max-width:100%'}${wrapH}">
            ${protoChrome(shell, deviceId, sel, meta, slot)}
            <div class="proto-screen pb-product" id="proto-frame${sfx}" style="${scrH}">${body}</div>
          </div>
        </div>`;
    }

    // Display chrome. `none` is the third value (v2.0.0): an internal back-office tool is not a
    // web site, and dressing every screen in a fake tab strip, a synthesised URL and a window frame
    // spends 77px of vertical space on set dressing that misleads the reviewer. A real project
    // reached for this by hiding the chrome in its own forked stylesheet — so pb ships the option
    // instead. Tablet and mobile keep their device frames under `none`: those are a PHONE, a
    // different mockup, and nobody asked to remove them.
    const PB_SHELL_OPTS = [['browser', 'Browser'], ['app', 'App'], ['none', 'None']];
    const PB_SHELLS = { browser: 'browser', app: 'app', none: 'none' };

    // The 4 fixed device sizes (logical CSS px). Gated per project by meta.devices.
    const PROTO_DEVICES = [
      { id: 'monitor', label: 'Large monitor', w: 1920, h: 1080 },
      { id: 'laptop',  label: 'Laptop',        w: 1280, h: 832  },
      { id: 'tablet',  label: 'Tablet',        w: 834,  h: 1112 },
      { id: 'mobile',  label: 'Mobile',        w: 429,  h: 926  },
    ];
    // Normalize a meta.devices list to the 4-key model — legacy 'desktop' → monitor + laptop.
    function pbNormalizeDeviceList(list) {
      const order = ['monitor', 'laptop', 'tablet', 'mobile'];
      const set = {};
      (list || []).forEach(d => {
        if (d === 'desktop') { set.monitor = 1; set.laptop = 1; }
        else if (order.indexOf(d) !== -1) set[d] = 1;
      });
      const out = order.filter(d => set[d]);
      return out.length ? out : order.slice();
    }
    function pbNormalizeDevice(dev) {
      if (dev === 'desktop') return 'laptop';
      return ['monitor', 'laptop', 'tablet', 'mobile'].indexOf(dev) !== -1 ? dev : 'laptop';
    }
    // The furniture of a browser window, drawn once. `back` and `reload` are the only two that do
    // anything; the rest are the photograph — marked aria-hidden and inert rather than `disabled`,
    // because they are not controls this prototype declined to implement, they are Chrome's.
    const PB_CHROME_ICONS = (function () {
      const w = (d, extra) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}${extra || ''}</svg>`;
      return {
        back: w('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
        fwd: w('<path d="M5 12h14M12 5l7 7-7 7"/>'),
        reload: w('<path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/><path d="M20.5 4v5h-5"/>'),
        puzzle: w('<path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.6a2.6 2.6 0 0 0-5.2 0V5H4a2 2 0 0 0-2 2v3.6h1.4a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.4a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/>'),
        kebab: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
        lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
        x: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      };
    })();

    // Device chrome — browser (a Chrome window), app (titlebar / bezel notch), or none.
    // `slot` keeps the ids unique when compare mode renders this twice.
    function protoChrome(shell, device, sel, meta, slot) {
      // `none` still keeps the tablet and mobile status bar: that is a phone, not a browser, and
      // removing the browser metaphor is not a reason to stop looking like the device.
      if (shell === 'none') return (device === 'tablet' || device === 'mobile') ? protoStatusBar(slot, false, device) : '';
      const title = `${(meta.name || 'prototype')} · ${(sel.name || sel.id)}`;
      const slug = (meta.name || 'app').toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/)[0];
      const path = (sel.id || '').replace(/-/g, '/');
      const dots = `<span class="proto-dots" aria-hidden="true"><i></i><i></i><i></i></span>`;
      const url = `<span class="proto-urlbar-host">${pbEscape(slug)}.app</span><span class="proto-urlbar-path">/${pbEscape(path)}</span>`;
      if (shell === 'browser' && device === 'mobile') {
        const I = PB_CHROME_ICONS;
        return protoStatusBar(slot, true, device)
          + `<div class="proto-mobar">
               <span class="proto-mobar-url">${I.lock}${url}</span>
               <span class="proto-mobar-tabs" aria-hidden="true">1</span>

        var org = elm && elm.orgId;
        var path = 'screen:' + screenId + ' › element:' + elId + (org ? ' › component:' + org : '');
        var hint = (elm && elm.label) ? elm.label : elId;
        if (org && nameOf(org)) hint += ' · ' + nameOf(org);
        return { path: path, hint: hint };
      }
      // 2a) schema 13: the nearest data-part, and the component whose part map explains it
      try {
        var hit = pbInspectPart(el, comps);
        if (hit) return { path: 'screen:' + screenId + ' › component:' + hit.comp.id + ' › part:' + hit.part,
                          hint: hit.part + ' · ' + (hit.comp.name || hit.comp.id) };
      } catch (e) { /* fall through to the legacy shape */ }
      // 2b) anatomy-part match by className anchor (real DOM class -> a component part name)
      try {
        for (var i = 0; i < comps.length; i++) {
          var parts = ((comps[i].anatomy || {}).parts) || [];
          for (var j = 0; j < parts.length; j++) {
            var anchor = parts[j].anchor;
            if (anchor && el.matches && el.matches(anchor)) {
              return { path: 'screen:' + screenId + ' › component:' + comps[i].id + ' › part:' + (parts[j].name || anchor),
                       hint: (parts[j].name || anchor) + ' · ' + (comps[i].name || comps[i].id) };
            }
          }
        }
      } catch (e) { /* selector edge cases — fall through */ }
      // 3) DOM fallback — never precise, but always copyable
      var tag = (el.tagName || 'node').toLowerCase();
      var cls = (el.classList && el.classList.length) ? '.' + el.classList[0] : (el.id ? '#' + el.id : '');
      var txt = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 32);
      return { path: 'screen:' + screenId + ' › ' + tag + cls, hint: txt ? '"' + txt + '"' : tag };
    }
    function pbInspectShow(el) {
      var frame = (el && el.closest && el.closest('.proto-screen')) || document.getElementById('proto-frame');
      if (!el || !frame || el === frame || !frame.contains(el)) { pbInspectHide(); return; }
      var info = pbInspectName(el);
      var r = el.getBoundingClientRect();
      var e = pbInspectEls();
      e.box.style.display = 'block';
      e.box.style.top = r.top + 'px'; e.box.style.left = r.left + 'px';
      e.box.style.width = r.width + 'px'; e.box.style.height = r.height + 'px';
      e.label.innerHTML = '';
      var p = document.createElement('span'); p.className = 'pb-inspect-path'; p.textContent = info.path; e.label.appendChild(p);
      if (info.hint) { var h = document.createElement('span'); h.className = 'pb-inspect-hint'; h.textContent = info.hint; e.label.appendChild(h); }
      e.label.style.display = 'flex';
      var ly = r.top - 30; if (ly < 4) ly = r.bottom + 6;
      e.label.style.top = ly + 'px'; e.label.style.left = Math.max(4, r.left) + 'px';
    }
    function pbInspectHide() {
      var box = document.getElementById('pb-inspect-box'); if (box) box.style.display = 'none';
      var label = document.getElementById('pb-inspect-label'); if (label) label.style.display = 'none';
    }
    function pbInspectCopy(el) {
      var info = pbInspectName(el);
      copyCommandToClipboard(info.path);
      pbUiToast('Copied', { note: info.path });
    }
    function pbInspectWireKeys() {
      if (pbInspectKeysWired) return; pbInspectKeysWired = true;
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Alt' && state.metaView === 'prototype' && pbInspectLast) pbInspectShow(pbInspectLast);
      });
      document.addEventListener('keyup', function (e) { if (e.key === 'Alt') pbInspectHide(); });
      window.addEventListener('scroll', pbInspectHide, true);
    }
    function wireProtoNav(frame) {
      frame = frame || document.getElementById('proto-frame');
      if (!frame) return;
      pbInspectWireKeys();
      frame.addEventListener('click', function (e) {
        if (e.altKey) { e.preventDefault(); e.stopPropagation(); pbInspectCopy(e.target); return; }  // ⌥-click = copy reference
