    /* =========================================================================
       TAB 5 — ERD (Entity Relationship Diagram)
       Mermaid `erDiagram` rendered inside the same zoomable canvas.
       Edit the Mermaid source below to model your domain.
       ========================================================================= */
    function renderMetaERD() {
      const populated = !!(PB_DATA.erd && PB_DATA.erd.populated);
      const header = pbPageHeader({ title: 'Data', infoKey: 'erd' });

      if (!populated) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.erd,
                title: 'No data model yet',
                body: 'Build the entity-relationship diagram from your spec. Claude generates a Mermaid `erDiagram` with PK/FK/cardinality guardrails — for a future production implementation.',
                ctaLabel: 'Generate ERD', command: '/pb:plan --data',
              })}
            </div>
          </div>`;
        return;
      }

      const e = (PB_DATA && PB_DATA.erd) || {};
      const rows = e.table || [];
      const byEntity = {};
      rows.forEach(r => { (byEntity[r.entity] = byEntity[r.entity] || []).push(r); });
      if (!state.erdView) state.erdView = 'diagram';

      // v1.5 — Data is single-column now (4.2): the table view carries the variants (4.4),
      // the diagram view carries the relationship legend (4.5). No right aside.
      $('#app').innerHTML = `
        <div class="pb-page">
          ${header}
          <div class="pb-content">
            <div class="pb-main">${pbErdMain(e, byEntity)}</div>
          </div>
        </div>`;

      if (state.erdView !== 'table' && e.mermaid && window.mermaid) {
        mermaid.initialize(pbMermaidConfig('erd'));
        mermaid.run({ querySelector: '#erd-diagram' }).then(function () {
          var stage = document.getElementById('erd-stage');
          if (!stage) return;
          var svg = stage.querySelector('svg');
          if (!svg) return;
          svg.style.maxWidth = 'none';
          svg.removeAttribute('width'); svg.removeAttribute('height');
          // erDiagram SVGs carry only a viewBox (no pixel width), so a bare bounding-box read
          // collapses the height. Pin a concrete target width first, measure the aspect-correct
          // height, size the stage to that, then release the SVG to fill the stage. initCanvas
          // re-fits the result into the viewport.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var vp = document.getElementById('erd-viewport');
              var targetW = Math.min(Math.max(((vp && vp.clientWidth) || 900) - 48, 320), 1100);
              svg.style.width = targetW + 'px';
              svg.style.height = 'auto';
              var bbox = svg.getBoundingClientRect();
              var W = Math.ceil(bbox.width)  || targetW;
              var H = Math.ceil(bbox.height) || 600;
              svg.style.width = ''; svg.style.height = '';
              stage.style.width = W + 'px';
              stage.style.height = H + 'px';
              stage.style.marginLeft = -(W/2) + 'px';
              stage.style.marginTop  = -(H/2) + 'px';
              initCanvas('erd', W, H);
            });
          });
        }).catch(function(){ /* silent */ });
      }
    }

    /* Data-tab (v1.5, single column): Diagram | Table toggle + relationship-legend button
       (diagram) / data-set variant chips (table). */
    /* A notes cell, clamped. On a real ERD 50 of 200 notes run past 120 characters and the
       longest is 1,444 — which is what turns this tab into 15,911px of scroll and makes one
       entity fill a screen. Clamped to a few lines with an inline expand; the full text stays
       in the DOM (and in `title`) so search and copy still see all of it. */
    function pbErdNote(text) {
      if (!text) return '';
      const esc = pbEscape(text);
      if (text.length <= 140) return esc;
      return `<span class="erd-note is-clamped" title="${esc}"
                onclick="this.classList.toggle('is-clamped')">${esc}</span>`;
    }

    /* The origin legend, rendered only for the values actually present. A chip for a value no
       row carries is a dead control. */
    function pbErdOriginLegend(byEntity) {
      const LABEL = { keep: 'Kept from the current system', rename: 'Renamed', adopt: 'Newly adopted' };
      const seen = new Set();
      Object.keys(byEntity).forEach(ent => byEntity[ent].forEach(r => {
        const o = (r.origin || '').toLowerCase();
        if (LABEL[o]) seen.add(o);
      }));
      if (!seen.size) return '';
      return `<div class="erd-origin-legend">` + ['keep', 'rename', 'adopt'].filter(o => seen.has(o)).map(o =>
        `<span class="erd-origin-key"><i class="erd-origin-swatch erd-origin-swatch--${o}"></i>${LABEL[o]}</span>`
      ).join('') + `</div>`;
    }

    /* Filter the table view. Repaints ONLY the rows — never the input, which lives in the
       toolbar outside this subtree. Empty query restores everything. */
    function pbErdFilter(q) {
      state.erdQuery = q || '';
      const needle = state.erdQuery.trim().toLowerCase();
      const host = document.getElementById('erd-tables');
      if (!host) return;
      host.querySelectorAll('.erd-entity').forEach(function (block) {
        let shown = 0;
        block.querySelectorAll('tbody tr').forEach(function (tr) {
          const hit = !needle || tr.textContent.toLowerCase().indexOf(needle) !== -1;
          tr.hidden = !hit;
          if (hit) shown++;
        });
        // An entity with no surviving row is hidden whole — a bare heading over an empty table
        // reads as a rendering bug.
        block.hidden = needle && shown === 0;
      });
    }

    function pbErdMain(e, byEntity) {
      const subtabs = [['diagram', 'Diagram'], ['table', 'Table']].map(([id, label]) =>
        `<button class="meta-subtab ${state.erdView === id ? 'active' : ''}" data-erd-view="${escapeHtmlAttr(id)}" onclick="setErdView(this.dataset.erdView)"><span class="pb-lb" data-t="${label}">${label}</span></button>`).join('');
      // The search input lives in the toolbar's right slot — empty in Table view, so it costs no
      // new layout — and is rendered ONCE. Filtering repaints `#erd-tables` only, never the input.
      //
      // This is not a micro-optimisation. Every view setter here does `$('#app').innerHTML = …`,
      // so an input rendered inside the repainted region loses focus on every keystroke. With a
      // Vietnamese keyboard that breaks IME composition mid-word, not merely the caret, and
      // focus restoration cannot fix it — by the time focus returns the composition is gone.
      // Keeping the input outside the repainted subtree is the only correct answer.
      const search = state.erdView === 'table'
        ? `<input id="erd-search" class="erd-search" type="search" autocomplete="off"
                  placeholder="Filter fields, types, notes…" value="${pbEscape(state.erdQuery || '')}"
                  oninput="pbErdFilter(this.value)">`
        : erdLegendButton();
      const toolbar = `<div class="erd-toolbar">
          <div class="meta-subtabs meta-subtabs--view">${subtabs}</div>
          ${search}
        </div>`;

      if (state.erdView === 'table') {
        const ents = Object.keys(byEntity);
        if (!ents.length) return toolbar + `<p class="meta-p" style="color:var(--text-tertiary);font-style:italic">No table data.</p>`;
        // 4.4 — **per-entity** data-set variants: each table that has multiple data treatments
        // (erd.mock sets for that entity) gets its own switcher — "Schema" (the field/type/example
        // definition) + one chip per label. Selecting one swaps just that table's Example column.
        if (!state.erdVariant || typeof state.erdVariant !== 'object') state.erdVariant = {};
        // 4.3 — fixed column widths (.erd-fixed) so every entity table lines up.
        const tables = `<div class="erd-tables" id="erd-tables">` + ents.map(ent => {
          const sets = ((e && e.mock) || []).filter(m => m.entity === ent);
          const variants = [{ key: 'schema', label: 'Schema' }].concat(sets.map(m => ({ key: m.label, label: m.label })));
          let v = state.erdVariant[ent] || 'schema';
          if (!variants.some(x => x.key === v)) v = 'schema';
          const switcher = sets.length ? `<div class="erd-entity-variants">`
            + variants.map(opt => `<button class="pb-mock-chip ${v === opt.key ? 'is-active' : ''}" data-erd-ent="${escapeHtmlAttr(ent)}" data-erd-variant="${escapeHtmlAttr(opt.key)}" onclick="setErdVariant(this.dataset.erdEnt,this.dataset.erdVariant)">${pbEscape(opt.label)}</button>`).join('')
            + `</div>` : '';
          const exHead = v === 'schema' ? 'Example' : v;
          // `pbSortTable(th)` has shipped in this shell for versions and was wired to nothing.
          // It is numeric-aware and needs no new JS — the <th>s just had to call it.
          const th = (label) =>
            `<th onclick="pbSortTable(this)" title="Sort by ${pbEscape(label)}">${pbEscape(label)}</th>`;
          return `<div class="erd-entity" data-entity="${pbEscape(ent)}">
              <div class="erd-entity-head"><h3 class="erd-entity-title">${pbEscape(ent)}</h3>${switcher}</div>
              <table class="erd-entity-table erd-fixed">
                <thead><tr>${th('Field')}${th('Type')}${th(exHead)}${th('Notes')}</tr></thead>
                <tbody>${byEntity[ent].map(r => {
                  const ex = v === 'schema' ? (r.example || '') : pbErdExampleFor(e, ent, r.field, v);
                  // `origin` is authored on nearly every row of a real ERD and the shell ignored
                  // it — which is why one real project forked this file to get it back. It rides
                  // as a row tint + a legend rather than a fifth column: four columns already use
                  // the width, and origin is a property OF the row, not another fact about it.
                  const org = (r.origin || '').toLowerCase();
                  const cls = ['keep', 'rename', 'adopt'].indexOf(org) >= 0 ? ` class="erd-row--${org}"` : '';
                  const notes = String(r.notes || '');
                  return `<tr${cls} data-origin="${pbEscape(org)}">`
                    + `<td>${pbEscape(r.field||'')}</td>`
                    + `<td><code class="erd-type-chip">${pbEscape(r.type||'')}</code></td>`
                    + `<td>${pbEscape(ex || '—')}</td>`
                    + `<td>${pbErdNote(notes)}</td></tr>`;
                }).join('')}</tbody>
              </table>
            </div>`;
        }).join('') + `</div>`;
        return toolbar + pbErdOriginLegend(byEntity) + tables;
      }

      const diagramView = `
        <div class="flow-canvas" id="erd-canvas">
          <div class="flow-viewport" id="erd-viewport">
            <div class="flow-stage flow-stage-erd" id="erd-stage">
              <div class="mermaid" id="erd-diagram">${e.mermaid || ''}</div>
            </div>
          </div>
          <div class="flow-zoom-controls">
            <button class="flow-zoom-btn" id="erd-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
            <button class="flow-zoom-btn" id="erd-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <button class="flow-zoom-btn" id="erd-zoom-fit" title="Fit / reset" aria-label="Fit / reset">⊙</button>
          </div>
          <div class="flow-zoom-readout" id="erd-zoom-readout">100%</div>
          <div class="flow-hint">Scroll to zoom · drag to pan</div>
        </div>`;
      return toolbar + diagramView;
    }

    /* The ordered data-set list for the Table view — "Schema" first, then each distinct
       erd.mock label in first-seen order. */
    function pbErdVariants(e) {
      const labels = [];
      ((e && e.mock) || []).forEach(m => { if (m.label && labels.indexOf(m.label) < 0) labels.push(m.label); });
      return [{ key: 'schema', label: 'Schema' }].concat(labels.map(l => ({ key: l, label: l })));
    }
    /* The example value for a field under a given data-set variant (rows[0] is representative;
       an absent/empty set → '' so the column reads as the no-data state). */
    function pbErdExampleFor(e, entity, field, variantKey) {
      const set = ((e && e.mock) || []).find(m => m.entity === entity && m.label === variantKey);
      if (!set || !(set.rows || []).length) return '';
      const row = set.rows[0];
      return (row && row[field] != null) ? String(row[field]) : '';
    }

    /* 4.5 — relationship legend in the diagram canvas (mirrors the UX-flow legend button). */
    function erdLegendButton() {
      return `<button class="flow-doc-legend-btn" type="button" aria-label="Show relationship legend" onclick="openErdLegendPopover(this)">
          <span class="erd-legend-mini">${erdRelSvg('one-many')}</span>
          <span class="flow-doc-legend-label">Legend</span>
          <span class="flow-doc-legend-q" aria-hidden="true">?</span>
        </button>`;
    }
    function openErdLegendPopover(anchorBtn) {
      document.querySelectorAll('.copy-popover:not(.pb-insp), .copy-popover-backdrop').forEach(el => el.remove());
      window.removeEventListener('keydown', copyPopoverKeyHandler);
      window.removeEventListener('resize', repositionCopyPopover);
      const backdrop = document.createElement('div');
      backdrop.className = 'copy-popover-backdrop';
      backdrop.addEventListener('click', closeCopyPopover);
      const pop = document.createElement('div');
      pop.className = 'copy-popover';
      pop.setAttribute('role', 'dialog');
      pop.setAttribute('aria-label', 'Relationship legend');
      pop.style.width = '300px';
      const rel = (kind, lbl, desc) => `
        <div class="legend-popover-row">
          <span class="erd-legend-svgwrap">${erdRelSvg(kind)}</span>
          <div class="legend-popover-text">
            <div class="legend-popover-name">${lbl}</div>
            <div class="legend-popover-desc">${desc}</div>
          </div>
        </div>`;
      pop.innerHTML = `
        <button class="copy-popover-close" type="button" aria-label="Close" title="Close" onclick="closeCopyPopover()">${COPY_POPOVER_ICONS.close}</button>
        <div class="copy-popover-cmd-label" style="margin-bottom:8px"><span>Relationship legend</span></div>
        <div class="legend-popover-body">
          ${rel('one-one', '1 : 1', 'One-to-one')}
          ${rel('one-many', '1 : N', 'One-to-many')}
          ${rel('many-many', 'N : N', 'Many-to-many')}
        </div>
        <div class="legend-popover-footer">Crow's-foot notation: bars = exactly one · split foot = many · circle = optional (zero).</div>`;
      document.body.appendChild(backdrop);
      document.body.appendChild(pop);
      positionCopyPopover(pop, anchorBtn);
      setTimeout(() => { pop.classList.add('is-visible'); positionCopyPopover(pop, anchorBtn); }, 10);
      window.addEventListener('keydown', copyPopoverKeyHandler);
      window.addEventListener('resize', repositionCopyPopover);
    }

    /* ERD legend cardinality symbols (Crow's-foot notation) */
    function erdRelSvg(kind) {
      var line = '<line x1="14" y1="7" x2="46" y2="7" stroke="currentColor" stroke-width="1.5"/>';
      function bars(x, dx) {
        return '<line x1="'+x+'" y1="2" x2="'+x+'" y2="12" stroke="currentColor" stroke-width="1.5"/>'
             + '<line x1="'+(x+dx)+'" y1="2" x2="'+(x+dx)+'" y2="12" stroke="currentColor" stroke-width="1.5"/>';
      }
      function foot(x, dir) {
        var dx = 6 * dir;
        return '<line x1="'+x+'" y1="7" x2="'+(x+dx)+'" y2="2"  stroke="currentColor" stroke-width="1.5"/>'
             + '<line x1="'+x+'" y1="7" x2="'+(x+dx)+'" y2="12" stroke="currentColor" stroke-width="1.5"/>'
             + '<line x1="'+x+'" y1="7" x2="'+(x+dx)+'" y2="7"  stroke="currentColor" stroke-width="1.5"/>';
      }
      function circle(x) {
        return '<circle cx="'+x+'" cy="7" r="2.5" style="fill:var(--pb-surface)" stroke="currentColor" stroke-width="1.5"/>';
      }
      var lEnd = '', rEnd = '';
      if (kind === 'one-one')      { lEnd = bars(8, 4);                       rEnd = bars(48, 4); }
      else if (kind === 'one-many'){ lEnd = bars(8, 4);                       rEnd = circle(50) + foot(46, +1); }
      else                          { lEnd = foot(14, -1) + circle(10);        rEnd = circle(50) + foot(46, +1); }
      return '<svg viewBox="0 0 60 14" xmlns="http://www.w3.org/2000/svg">'
        + line + lEnd + rEnd + '</svg>';
    }

    /* =========================================================================
       SHARED CANVAS — generalised pan/zoom for the User Flow + ERD tabs
       ========================================================================= */
    /* `minFit` (optional): a readable floor for the INITIAL fit. A wide, shallow org chart fits a
       620px box at ~0.3, where the labels are 4px of noise — showing everything is worthless if
       none of it can be read. Below the floor the canvas opens at the floor and stays pannable;
       zooming out to the true fit is still allowed, because minS is taken from the raw value. */
    /* `opts.modWheel`: the canvas sits in a page that scrolls (the IA site map, full width over the
       job list). A plain wheel there belongs to the PAGE — a map as tall as the view would otherwise
       trap it, and the list under it could never be reached — so it zooms only on ⌘/Ctrl + wheel,
       which is also what a trackpad pinch sends. The flow and the ERD fill their view; they keep the
       plain wheel. */
    function initCanvas(prefix, contentW, contentH, minFit, opts) {
      opts = opts || {};
      var viewport = document.getElementById(prefix + '-viewport');
      var stage    = document.getElementById(prefix + '-stage');
      var readout  = document.getElementById(prefix + '-zoom-readout');
      if (!viewport || !stage) return;

      var minS = 0.4, maxS = 3;
      var scale = 1, tx = 0, ty = 0;
      var dragging = false, lastX = 0, lastY = 0;

      function apply() {
        stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
        if (readout) readout.textContent = Math.round(scale * 100) + '%';
      }
      function fitToViewport() {
        var vw = viewport.clientWidth, vh = viewport.clientHeight;
        var pad = 32;
        var raw = Math.min((vw - pad * 2) / contentW, (vh - pad * 2) / contentH);
        if (raw < minS) minS = Math.max(0.1, raw * 0.9);
        var s = (minFit && raw < minFit) ? minFit : raw;
        scale = Math.max(minS, Math.min(maxS, s));
        // Centred is right when everything fits. When a `minFit` floor leaves the content wider
        // than the box, centring hides BOTH ends — including the left gutter, where a chart puts
        // the thing you read first. Anchor the overflowing axis to its start instead.
        tx = 0; ty = 0;
        if (contentW * scale > vw - pad * 2) tx = pad - vw / 2 + contentW * scale / 2;
        if (contentH * scale > vh - pad * 2) ty = pad - vh / 2 + contentH * scale / 2;
        stage.style.transition = 'transform 0.25s ease-out';
        apply();
      }
      function zoomBy(delta, cx, cy) {
        var prev = scale;
        var next = Math.max(minS, Math.min(maxS, scale * (1 + delta)));
        if (next === prev) return;
        if (cx !== undefined && cy !== undefined) {
          var rect = viewport.getBoundingClientRect();
          var px = cx - rect.left - rect.width / 2;
          var py = cy - rect.top  - rect.height / 2;
          tx = px - (px - tx) * (next / prev);
          ty = py - (py - ty) * (next / prev);
        }
        scale = next;
        stage.style.transition = 'none';
        apply();
      }

      viewport.addEventListener('wheel', function (e) {
        if (opts.modWheel && !e.ctrlKey && !e.metaKey) return;   // the page scrolls
        e.preventDefault();
        zoomBy(-e.deltaY * 0.0015, e.clientX, e.clientY);
      }, { passive: false });
      viewport.addEventListener('mousedown', function (e) {
        dragging = true;
        lastX = e.clientX; lastY = e.clientY;
        viewport.style.cursor = 'grabbing';
        stage.style.transition = 'none';
        e.preventDefault();
      });
      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        tx += e.clientX - lastX;
        ty += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        apply();
      });
      window.addEventListener('mouseup', function () {
        if (!dragging) return;
        dragging = false;
        viewport.style.cursor = '';
      });

      document.getElementById(prefix + '-zoom-in').onclick  = function () { zoomBy(0.18); };
      document.getElementById(prefix + '-zoom-out').onclick = function () { zoomBy(-0.18); };
      document.getElementById(prefix + '-zoom-fit').onclick = function () { fitToViewport(); };

      requestAnimationFrame(function () { requestAnimationFrame(fitToViewport); });
    }

    /* =====================================================================================
       Project settings + ⌘K (wave 2). The dialog and the palette are runtime.js's (shared with
       the design-system site); this page supplies what is specific to it — the meta it edits and
       what there is to find here.
       ===================================================================================== */
    function pbOpenProjectSettings(returnFocus) {
      pbUiOpenSettings({
        meta: (PB_REGISTRY && PB_REGISTRY.meta) || {}, viewOnly: VIEW_ONLY, returnFocus: returnFocus,
        onSaved: function (m) {
          // The page is a render of registry.json, so it is now one save behind. Patch the
          // in-memory copy so the bar says the new name at once; /pb:preview's live reload then
          // replaces the page with a fresh render of the saved file.
          PB_REGISTRY.meta = PB_REGISTRY.meta || {};
          PB_REGISTRY.meta.name = m.name;
          PB_REGISTRY.meta.designSystem = Object.assign({}, PB_REGISTRY.meta.designSystem || {}, m.designSystem);
          if (!m.designSystem.designLink) delete PB_REGISTRY.meta.designSystem.designLink;
          renderMetaNav();
        },
      });
    }
    function pbOpenSearch() { pbUiOpenCmdk(pbSearchItems); }

    /* Where a found thing lives, and how to arrive at it opened. */
    function pbFlash(el) {
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.remove('pb-flash'); void el.offsetWidth; el.classList.add('pb-flash');
    }
    function pbGoUx(view, after) {
      state.metaView = 'flow'; state.uxView = view;
      render();
      if (after) requestAnimationFrame(after);
    }
    function pbGoRule(id) { pbGoScan('logic', id, 'logic'); state.logicView = 'rules'; }
    function pbGoScan(list, key, view) {
      pbScanOpenKey(list, key);                        // arrives opened — and nothing else is closed for it
      if (list === 'logic') state.logicView = 'rules';
      pbFilterClear(list);
      pbGoUx(view, () => pbScanReveal(list, key));
    }
    function pbSearchItems() {
      const out = [];
      const add = (g, t, sub, x, act, mono) => out.push({ g, t, s: sub || '', x: x || '', act, mono: !!mono });
      const http = /^https?:$/.test(location.protocol);
      add('Commands', 'Run all scenarios', pbTestScenarios().length + ' in the Sandbox', 'test sandbox run', () => pbRunScenarios());
      add('Commands', 'Toggle theme', 'System · Light · Dark', 'dark light mode appearance', () => pbUiCycleTheme());
      add('Commands', 'Open project settings', 'Name · design system · Figma file', 'settings design system figma', () => pbOpenProjectSettings(null));
      add('Commands', 'Toggle the Sandbox', 'S', 'inspector device chrome compare role', () => { if (state.metaView !== 'prototype') setMetaView('prototype'); pbSandboxToggle(true); });
      add('Commands', 'Reset session', 'R', 'sandbox', () => { if (state.metaView !== 'prototype') setMetaView('prototype'); pbSandboxReset(); });
      if (http) add('Commands', 'Open the design system', 'New tab', 'components workbench', () => window.open('/design-system', '_blank', 'noopener'));
      add('Go to', 'Prototype', 'Tab', '', () => setMetaView('prototype'));
      add('Go to', 'Project Summary → Overview', 'Tab', 'objectives principles', () => { state.summarySubTab = 'overview'; setMetaView('summary'); });
      add('Go to', 'Project Summary → User Insights', 'Tab', 'research', () => { state.summarySubTab = 'insights'; setMetaView('summary'); });
      UX_SUBTABS.forEach(([id, label]) => add('Go to', 'UX Design → ' + label, 'Tab', '', () => pbGoUx(id)));
      add('Go to', 'Data', 'Tab', 'erd entities', () => setMetaView('erd'));
      const L = window.PB_LOGIC || {};
      (L.rules || []).forEach(r => {
        const x = pbRuleFacts(r);
        add('Rules', x.title || r.id, r.id, [r.summary || '', x.status, x.kind].join(' '), () => pbGoRule(r.id), true);
      });
      ((L.ia && L.ia.jobs) || []).forEach(j => add('Jobs', pbCap(j.want || j.job || j.id), j.id,
        ['when', j.when, 'so', j.so, (j.roles || []).join(' '), j.priority].join(' '), () => pbGoScan('ia', j.id, 'ia'), true));
      (PB_REGISTRY.screens || []).forEach(sc => add('Screens', sc.name || sc.id, sc.id, 'prototype screen',
        () => { state.metaView = 'prototype'; state.protoScreenId = sc.id; render(); }, true));
      // Components live on the design-system site, which only a served page can reach.
      if (http) (PB_REGISTRY.components || []).forEach(c => add('Components', c.name || c.id, c.level || 'component', c.id + ' ' + (c.description || ''),
        () => window.open('/design-system#/c/' + encodeURIComponent(c.id), '_blank', 'noopener'), true));
      pbTcRows().forEach(r => add('Test cases', r.head, r.id + (r.story ? ' · ' + r.story : ''), r.text.slice(0, 400) + ' ' + r.label,
        () => pbGoScan('tc', r.key, 'tests')));
      ((PB_DATA.content && PB_DATA.content.terms) || []).forEach((t, i) => {
        const name = t.term || t.name || t.id || '';
        if (!name) return;
        add('Content terms', name, 'Term', [t.definition || t.means || '', (t.aka || []).join(' ')].join(' '), () => {
          state.contentView = 'terms';
          pbGoUx('content', () => pbFlash(document.querySelectorAll('.ct-term')[i]));
        });
      });
      return out;
    }
    const pbCap = s => { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };

    /* ⌘F focuses the page's own filter when it has one (the browser's find still has Cmd+G and
       the menu); without one, it is the browser's. */
    document.addEventListener('keydown', function (e) {
      if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey || String(e.key).toLowerCase() !== 'f') return;
      const f = Array.from(document.querySelectorAll('.pb-fbar-q input')).find(i => i.offsetParent !== null && !i.disabled);
      if (!f || pbUiModalOpen()) return;
      e.preventDefault(); f.focus(); f.select();
    });
    pbUiInstall({ items: pbSearchItems });

    /* Deep link (v2.1.0): ?screen=<id>&device=<id>&shell=<mode>&embed=1. /pb:explore's compare
       page opens every option on the screen being compared; `embed` drops the tab bar so a frame
       is only the preview. Unknown values are ignored and the defaults apply. */
    (function pbApplyDeepLink() {
      let q;
      try { q = new URLSearchParams(location.search); } catch (e) { return; }
      const sc = q.get('screen');
      if (sc && (PB_REGISTRY.screens || []).some(x => x.id === sc)) { state.metaView = 'prototype'; state.protoScreenId = sc; }
      const dv = q.get('device');
      if (dv && PROTO_DEVICES.some(d => d.id === dv)) state.protoDevice = dv;
      const sh = q.get('shell');
      if (sh && PB_SHELLS[sh]) state.protoShell = PB_SHELLS[sh];
      if (q.get('embed') === '1') document.body.classList.add('pb-embed');
    })();

    /* Boot */
    applyRegistryTokens(PB_REGISTRY);
    if (VIEW_ONLY) {
      document.body.classList.add('view-only');
      const _c = (PB_REGISTRY.config && PB_REGISTRY.config.cover) || null;
      if (_c) {
        const _cov = document.createElement('div');
        _cov.className = 'pb-cover';
        _cov.innerHTML = `<strong>${_c.title || ''}</strong><span>${_c.summary || ''}</span>`
          + (_c.by || _c.date ? `<em>${[_c.by, _c.date].filter(Boolean).join(' · ')}</em>` : '');
        document.body.insertBefore(_cov, document.body.firstChild);
      }
    }
    render();
  </script>
</body>
</html>
