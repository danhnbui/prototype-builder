        var nav = e.target.closest('[data-nav]');
        if (nav) { var id=nav.getAttribute('data-nav'); if(pbScreensHas(id)){ e.preventDefault(); if(pbNavAllowed(id)) setProtoScreen(id); } return; }
        var tog = e.target.closest('[data-action="toggle-password"]');
        if (tog) { e.preventDefault(); pbTogglePassword(tog); return; }
        var sub = e.target.closest('[data-action="submit"]');
        if (sub) { e.preventDefault(); pbProtoSubmit(sub); return; }
        if (e.target.closest('[data-step-go]')) { e.preventDefault(); pbStepClick(e.target); return; }
      });
      frame.addEventListener('mousemove', function (e) {
        pbInspectLast = e.target;
        if (e.altKey) pbInspectShow(e.target); else pbInspectHide();
      });
      frame.addEventListener('mouseleave', function () { pbInspectLast = null; pbInspectHide(); });
    }

    /* =========================================================================
       TAB 2 — PROJECT SUMMARY
         2.1 Overview              (Objectives + Principles, auto-syncs)
         2.2 User Insights         (Quantitative + Research Summary + Executive Summary)
       Two sub-tabs, and this tab holds nothing else (D-33). UI Logic Trade-offs left for
       UX Design → Logic in v2.0.0 (D-30) and then stopped being a separate record at all: a
       trade-off is a rule, so it is a field ON the rule. `Others` — the one field with no schema,
       no writer and no check — is retired with it; `content` and `ia.rules[]` are where the
       terminology and the business rules it accreted actually belong.
       Empty sub-sections render with empty-state copy.
       ========================================================================= */
    /* v0.3.0 — Tab 2 sub-tab navigation. Only the active sub-section renders. */
    const SUMMARY_SUBTABS = [
      ['overview',  'Overview'],
      ['insights',  'User Insights'],
    ];

    function renderMetaSummary() {
      const o  = (PB_DATA && PB_DATA.overview) || {};
      const ui = (PB_DATA && PB_DATA.userInsights) || {};
      const hasSummary = !!(o.objectives || (o.principles && o.principles.length) ||
        ui.quantitative || ui.researchSummary || ui.executiveSummary);
      // A sub-tab that no longer exists must not survive in state from an earlier render.
      if (!SUMMARY_SUBTABS.some(([id]) => id === state.summarySubTab)) state.summarySubTab = 'overview';

      const header = pbPageHeader({ title: 'Project Summary', infoKey: 'summary' });

      if (!hasSummary) {
        $('#app').innerHTML = `
          <div class="pb-page">
            ${header}
            <div class="pb-content">
              ${renderEmptyState({
                icon: EMPTY_STATE_ICONS.summary,
                title: 'No summary yet',
                body: 'The Project Summary is auto-synced from your spec and clarify steps — objectives, principles, user insights, and UI-logic trade-offs.',
                ctaLabel: 'Write the spec', command: '/pb:specify',
              })}
            </div>
          </div>`;
        return;
      }

      const subTabs = SUMMARY_SUBTABS.map(([id, label]) =>
        `<button class="meta-subtab ${state.summarySubTab === id ? 'active' : ''}"
                 data-sub="${escapeHtmlAttr(id)}" onclick="setSummarySubTab(this.dataset.sub)"><span class="pb-lb" data-t="${label}">${label}</span></button>`
      ).join('');
      const body = {
        overview:  pbRenderOverview,
        insights:  pbRenderUserInsights,
      }[state.summarySubTab]();

      // v1.5 — split layout: scrolling content on the left, a scroll-spy table of contents on
      // the right that reflects the left column and navigates on click. A table of contents with
      // fewer than three entries is an empty box beside a short page (T2.7): then the page is one
      // column, held to a readable 760px, and there is no aside at all. An entry is a HEADING
      // (.meta-h2 / .meta-h3 — the page's section number and each section head under it), wherever
      // it sits in the class list; the labels the page used to carry were never headings, so a long
      // page counted one and never earned its contents.
      const sections = (body.match(/class="[^"]*\bmeta-h[23]\b/g) || []).length;
      const toc = sections >= 3;
      $('#app').innerHTML = `
        <div class="pb-page pb-page--viewport">
          ${header}
          <div class="pb-content ${toc ? 'pb-content--split sum-split' : 'pb-content--single'} pb-content--fill">
            <div class="pb-main summary-main">
              <div class="meta-subtabs">${subTabs}</div>
              <div class="summary-scroll" id="summary-scroll">${body}</div>
            </div>
            ${toc ? `<aside class="pb-aside summary-toc">
              <p class="pb-dialog-h">On this page</p>
              <nav class="summary-toc-nav" id="summary-toc-nav"></nav>
            </aside>` : ''}
          </div>
        </div>
      `;
      if (toc) requestAnimationFrame(pbBuildSummaryToc);
    }

    /* Build the Project Summary table of contents from the left column's headings, wire
       click-to-scroll + scroll-spy highlighting. Re-runs on every sub-tab render. */
    function pbBuildSummaryToc() {
      const scroll = document.getElementById('summary-scroll');
      const nav = document.getElementById('summary-toc-nav');
      if (!scroll || !nav) return;
      const heads = Array.from(scroll.querySelectorAll('.meta-h2, .meta-h3'));
      if (!heads.length) { nav.innerHTML = '<p class="pb-aside-empty" style="padding:6px 0">No sections.</p>'; return; }
      heads.forEach((h, i) => { if (!h.id) h.id = 'summary-sec-' + i; });
      // Group headings into a tree: each h2 is a parent node, the h3s under it are children —
      // rendered with the same .pb-tree component as the Prototype structure panel.
      const groups = []; let cur = null;
      heads.forEach(h => {
        if (h.classList.contains('meta-h2')) { cur = { head: h, children: [] }; groups.push(cur); }
        else { if (!cur) { cur = { head: null, children: [] }; groups.push(cur); } cur.children.push(h); }
      });
      const tocNode = (h, isChild) => isChild
        ? `<li class="pb-tree-node"><span class="pb-tree-node-label summary-toc-item" data-toc="${escapeHtmlAttr(h.id)}" onclick="pbSummaryTocClick(event,this.dataset.toc)">${pbEscape(h.textContent)}</span></li>`
        : `<div class="pb-tree-screen-name summary-toc-item" data-toc="${escapeHtmlAttr(h.id)}" onclick="pbSummaryTocClick(event,this.dataset.toc)"><span>${pbEscape(h.textContent)}</span></div>`;
      nav.innerHTML = '<div class="pb-tree summary-toc-tree">' + groups.map(g => {
        const parent = g.head ? tocNode(g.head, false) : '';
        const kids = g.children.length ? `<ul class="pb-tree-list">${g.children.map(c => tocNode(c, true)).join('')}</ul>` : '';
        return `<div class="pb-tree-screen">${parent}${kids}</div>`;
      }).join('') + '</div>';
      scroll.onscroll = pbSummaryTocSpy;
      pbSummaryTocSpy();
    }
    function pbSummaryTocClick(e, id) {
      e.preventDefault();
      const scroll = document.getElementById('summary-scroll');
      const el = document.getElementById(id);
      if (!scroll || !el) return;
      const top = scroll.scrollTop + (el.getBoundingClientRect().top - scroll.getBoundingClientRect().top) - 8;
      scroll.scrollTo({ top: top, behavior: 'smooth' });
    }
    function pbSummaryTocSpy() {
      const scroll = document.getElementById('summary-scroll');
      const nav = document.getElementById('summary-toc-nav');
      if (!scroll || !nav) return;
      const heads = Array.from(scroll.querySelectorAll('.meta-h2, .meta-h3'));
      const stop = scroll.getBoundingClientRect().top;
      let active = heads[0];
      heads.forEach(h => { if (h.getBoundingClientRect().top - stop <= 16) active = h; });
      nav.querySelectorAll('.summary-toc-item').forEach(a =>
        a.classList.toggle('is-toc-active', !!active && a.getAttribute('data-toc') === active.id));
    }

    function pbRenderOverview() {
      const o = (PB_DATA && PB_DATA.overview) || {};
      // Prose goes through pbRichText: paragraphs, "·" bullets, **bold** / *em* marks and numbers
      // (.pb-num) — and it owns white-space, so a hard-wrapped objective is not a wall of text.
      // The objective is the page's lead.
      const objectiveBody = o.objectives
        ? pbRichText(o.objectives, { cls: 'sum-lead' })
        : `<p class="sum-empty">No objective recorded yet. Run <code>/pb:specify</code> to capture one.</p>`;
      // Principles: number · bold title · body, one hairline-separated row each. The number is the
      // authored one (a project may number from 0, or skip), the row's index only when it has none.
      const ps = (o.principles || []);
      const principles = ps.length
        ? `<ol class="sum-principles" role="list">${ps.map((p, i) => `
            <li class="sum-pr">
              <span class="sum-pn" aria-hidden="true">${pbEscape(p.num != null && p.num !== '' ? p.num : i + 1)}</span>
              <div class="sum-pbody">
                <strong class="sum-pt">${pbEscape(p.title)}</strong>
                ${p.body ? `<div class="sum-pd">${pbRichText(p.body, { inline: true })}</div>` : ''}
              </div>
            </li>`).join('')}</ol>`
        : `<p class="sum-empty">No principles recorded yet. Run <code>/pb:init</code> to capture them.</p>`;
      return `
        <div class="meta-section sum-sec">
          <h2 class="meta-h2 sum-h2">2.1 Overview</h2>
          <section class="sum-block">
            <h3 class="meta-h3 sum-h3">Objectives</h3>
            ${objectiveBody}
          </section>
          <section class="sum-block">
            <h3 class="meta-h3 sum-h3">Principles</h3>
            ${principles}
          </section>
        </div>
      `;
    }

    function pbRenderUserInsights() {
      const u = (PB_DATA && PB_DATA.userInsights) || {};
      // The first section that has a body leads the page (its first paragraph is set larger).
      let led = false;
      const sub = (title, body) => {
        const lead = !!body && !led; if (body) led = true;
        return `
        <section class="sum-block">
          <h3 class="meta-h3 sum-h3">${title}</h3>
          ${body ? pbRichText(body, lead ? { cls: 'sum-lead' } : {}) : '<p class="sum-empty">Not recorded yet.</p>'}
        </section>`;
      };
      return `
        <div class="meta-section sum-sec">
          <h2 class="meta-h2 sum-h2">2.2 User Insights</h2>
          ${sub('Quantitative Data', u.quantitative)}
          ${sub('Research Summary Report', u.researchSummary)}
          ${sub('Executive Summary', u.executiveSummary)}
        </div>
      `;
    }

    /* A rule's DECISION — the part a rule cannot state for itself: what was asked, what lost, what
       was chosen, and why. It used to be `meta.tradeoffs[]`: a separate array, a separate view and
       a separate capture step in /pb:clarify, for a record that was already a rule. D-30 moved it
       beside the rules it produced; D-33 admitted it WAS one. Now any rule may carry a decision
       block and the card draws it, whatever the rule's kind.

       `[SUPERSEDED <date>]` in a title is still read. It is the convention the projects invented
       when the schema had no status field — `decision.status` is that field now, and the migration
       rewrites the prefix into it, but a title written the old way keeps working. */
    const PB_SUPERSEDED = /^\s*\[SUPERSEDED([^\]]*)\]\s*/i;

    const pbList = v => Array.isArray(v) ? v.filter(x => x != null && x !== '').map(String).join(' · ') : (v == null ? '' : String(v));

    /* `collapsed` (v2.1.0): when a rule carries structured blocks, they ARE the rule and the
       decision is how it got there — so it folds to one line ("Decided: X over Y") that opens on
       demand. A rule that is only a decision keeps it open; there is nothing else to read. */
    function pbRuleDecision(d, collapsed) {
      if (!d || typeof d !== 'object') return '';
      const opts = Array.isArray(d.options) ? d.options
        : (typeof d.options === 'string' ? d.options.split('|').map(x => x.trim()).filter(Boolean) : []);
      if (!d.question && !opts.length && !d.chose && !d.why) return '';
      // What LOST is the whole reason this record exists, so it is shown beside what won rather
      // than as a list the winner also appears in.
      // Compare loosely: projects write the winner once in `chose` and again in `options[]`, and a
      // trailing period or a case change made it list itself under "over".
      const norm = x => String(x || '').trim().replace(/[.\s]+$/, '').toLowerCase();
      const lost = opts.filter(o => norm(o) !== norm(d.chose));
      const chose = d.chose ? `<strong>${pbEmph(d.chose)}</strong>${lost.length
          ? ` <span class="lg-dim">over ${lost.map(o => pbEmph(o)).join(' · ')}</span>` : ''}` : '';
      const body = `
          ${d.question ? `<div class="lg-prose">${pbProseHTML(d.question)}</div>` : ''}
          ${chose && !collapsed ? `<p class="meta-p">${chose}</p>` : ''}
          ${!d.chose && opts.length ? `<ul class="tw-opts">${opts.map(o => `<li>${pbEmph(o)}</li>`).join('')}</ul>` : ''}
          ${d.why ? `<div class="lg-prose">${pbProseHTML(d.why)}</div>` : ''}
          ${d.affects ? `<div class="lg-dim">Affects: ${pbEscape(pbList(d.affects))}</div>` : ''}`;
      if (collapsed) {
        return `<details class="lg-sec lg-fold"><summary><span class="lg-sec-h">Decided</span> ${chose || '<span class="lg-dim">the question and why</span>'}</summary>${body}</details>`;
      }
      return `<div class="lg-sec"><div class="lg-sec-h">Decided</div>${body}</div>`;
    }

    function pbRuleOpen(r) {
      const d = r.decision || {};
      const v = d.stillOpen != null ? d.stillOpen : r.stillOpen;
      const items = Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
      const assume = /\bASSUMPTION\b/.test(String(d.why || '') + ' ' + String(r.summary || ''));
      return { items, assume };
    }
    /* A project that has not run /pb:update-version yet still holds its decisions in the retired
       `meta.tradeoffs[]`. The shell stopped reading that field as a view — and rendering nothing
       would take 22 decisions off someone's screen and call it a tidy-up, which is the exact
       failure D-30 refused for `others`. So they render, through the same decision renderer, under
       a banner naming the one command that turns them into rules. Both disappear with the field. */
    function pbLegacyTradeoffs() {
      const t = ((PB_REGISTRY && PB_REGISTRY.meta) || {}).tradeoffs;
      return Array.isArray(t) ? t.filter(x => x && typeof x === 'object') : [];
    }
    function pbRenderLegacyTradeoffs() {
      const t = pbLegacyTradeoffs();
      if (!t.length) return '';
      return `<div class="pb-qa-warn">
          <div class="pb-qa-warn-head">⚠ ${t.length} decision${t.length === 1 ? '' : 's'} still in the retired <code>meta.tradeoffs</code></div>
          <ul class="pb-qa-warn-list">
            <li>A trade-off is a rule with its decision still attached. Run <code>/pb:update-version</code> to move these into <strong>ia.rules[]</strong> — they render here, unchanged, until you do.</li>
          </ul>
        </div>` + t.map((to, i) => {
          const raw = to.title || '';
          const sup = PB_SUPERSEDED.exec(raw);
          return `<div class="lg-card" id="tradeoff-${i + 1}">
              <div class="meta-h3">${pbEscape(sup ? raw.replace(PB_SUPERSEDED, '') : raw)}
                ${pbLgChip('decision', 'lg-chip--kind')}
                ${sup ? `<span class="lg-chip lg-chip--dead" style="text-decoration:none">superseded${pbEscape(sup[1] || '')}</span>` : ''}</div>
              ${pbRuleDecision({ question: to.question, options: to.options, chose: to.decision,
                                 why: to.why, affects: to.tabsAffected })}
            </div>`;
        }).join('');
    }

    /* =========================================================================
       TAB 3 — UX DESIGN · three sub-tabs
         Information Architecture — jobs → screens, over the DERIVED site map
         User Flow               — the wireflow + stories/test cases (unchanged)
         Logic                   — declared Rules | derived Ripple

       Everything the IA and Logic views draw beyond the two authored slices
       (`registry.ia` and the rules) is DERIVED at render time into `PB_LOGIC`
       by pb/tools/logic_extract.py. When that data is absent — an older
       project, or a hand-off rendered before it existed — each view renders an
       honest empty state rather than a broken one.
       ========================================================================= */
    const UX_SUBTABS = [['logic', 'Logic'], ['ia', 'Information Architecture'], ['flow', 'User Flow'], ['tests', 'Test Cases'], ['content', 'Content']];

    /* v2.1.0: Logic leads — it is the first segment, and the one a reviewer opens the tab for.
       It renders its own empty state (and the Rules / Ripple toggle) when nothing is declared. */
    function pbUxDefaultView() {
      return 'logic';
    }
    function pbUxView() {
      if (!state.uxView) state.uxView = pbUxDefaultView();
      return state.uxView;
    }
    function pbSetUxView(v) { pbTabSwitch(() => { state.uxView = v; renderMetaFlow(); }); }

    function pbUxSubtabs() {
      const L = window.PB_LOGIC || {};
      const tc = pbTestCounts();
      const C = PB_DATA.content || {};
      const counts = {
        ia: (L.ia && L.ia.jobs) ? L.ia.jobs.length : 0,
        flow: (PB_DATA.flow && PB_DATA.flow.flows) ? PB_DATA.flow.flows.length : 0,
        // what the lists show by default: a superseded rule and a retired test case are behind "Show …"
        logic: (L.rules || []).filter(r => !pbRuleState(r).sup).length,
        tests: tc.total + tc.manual - tc.retired,
        content: (C.terms || []).length + (C.strings || []).length,
      };
      const cur = pbUxView();
      return `<div class="meta-subtabs ux-subtabs">` + UX_SUBTABS.map(([id, label]) =>
        `<button class="meta-subtab ${cur === id ? 'active' : ''}" data-ux-view="${escapeHtmlAttr(id)}" onclick="pbSetUxView(this.dataset.uxView)">`
        + `<span class="pb-lb" data-t="${label}">${label}</span>${counts[id] ? ` <span class="meta-subtab-count">${counts[id]}</span>` : ''}</button>`
      ).join('') + `</div>`;
    }

    /* ── shared bits ─────────────────────────────────────────────────────── */
    const pbLgChip = (t, cls) => `<span class="lg-chip ${cls || ''}">${pbEscape(t)}</span>`;
    const pbLgBase = f => String(f || '').split('/').pop();
    const pbLgLink = (type, id, label, cls) =>
      `<a class="lg-link ${cls || ''}" href="#" data-lg-type="${escapeHtmlAttr(type)}" data-lg-id="${escapeHtmlAttr(id)}" onclick="pbLogicGo(this.dataset.lgType,this.dataset.lgId);return false">${pbEscape(label || id)}</a>`;
    function pbRoleName(id) {
      const r = (((PB_REGISTRY || {}).meta || {}).roles || []).find(x => x.id === id);
      return r ? (r.name || r.id) : id;
    }
    /* Declared roles take the hues in order; a role a job uses but meta.roles never declared takes the
       next free one the first time it is drawn (it used to fall to hue 0 — red, the colour of an alarm).
       The hues are the tool's own tokens (--pb-role-1…8, chrome.css), light and dark; past eight they wrap. */
    const PB_ROLE_SLOT = {};
    function pbRoleSlot(id) {
      if (!Object.prototype.hasOwnProperty.call(PB_ROLE_SLOT, id)) PB_ROLE_SLOT[id] = Object.keys(PB_ROLE_SLOT).length % 8 + 1;
      return PB_ROLE_SLOT[id];
    }
    ((((PB_REGISTRY || {}).meta || {}).roles) || []).forEach(r => pbRoleSlot(r.id));
    const pbRoleDot = id =>
      `<i class="ia-dot ia-dot--${pbRoleSlot(id)}" title="${pbEscape(pbRoleName(id))}"></i>`;

    function pbUxEmpty(title, body, ctaLabel, command) {
      return `<div class="pb-content">${renderEmptyState({
        icon: EMPTY_STATE_ICONS.flow, title, body, ctaLabel, command,
      })}</div>`;
    }

    /* ── Information Architecture ───────────────────────────────────────────
       ONE column: the heading, ONE filter bar, the site map (full width), the jobs. The bar (the shared
       pbFilterBar, id "ia") filters the job rows AND the map: a screen no shown job is placed on is
       dimmed (pbIaCanvasSync, driven by `pb:filter`). The bar's search, Role, Priority and Screens
       narrow the jobs; the quick chip "Not handled" is the jobs with no screen — the one finding the
       page makes about itself. */

    // a re-render puts the reader back where they were (the scroller is the tab's .summary-scroll)
    function pbToggleIaOverlays() { state.iaOverlaysOpen = state.iaOverlaysOpen === false; pbKeepScroll(renderMetaFlow); }

    const pbJtbd = j =>
      `When <em>${pbEscape(j.when || '…')}</em>, I want to <strong>${pbEscape(j.want || j.job || '')}</strong>, so I can <em>${pbEscape(j.so || '…')}</em>`;

    /* Roles = the ones the registry declares ∪ any a job names. A job can cite a role nobody declared
       (polygon's `operator`); leaving it out of the chip would make those jobs unfilterable. */
    function pbIaRoles(jobs) {
      const declared = (((PB_REGISTRY || {}).meta || {}).roles) || [];
      const seen = new Set(declared.map(r => r.id));
      const out = declared.map(r => ({ id: r.id, name: r.name || r.id, declared: true }));
      jobs.forEach(j => (j.roles || []).forEach(id => { if (!seen.has(id)) { seen.add(id); out.push({ id, name: id, declared: false }); } }));
      return out;
    }
    const pbIaScreenName = id => { const s = ((PB_REGISTRY || {}).screens || []).find(x => x.id === id); return (s && (s.name || s.id)) || id; };
    // what the search box matches: everything a row says or opens into, plus the words for its finding
    const pbIaHay = j => [j.id, j.title, j.when, j.want, j.job, j.so, j.gap, j.source, j.priority,
      (j.roles || []).map(r => r + ' ' + pbRoleName(r)).join(' '),
      (j.screens || []).map(pbIaScreenName).join(' '),
      (j.screens || []).length ? '' : 'not handled no screen'].join(' ').toLowerCase();

    function pbIaFilterBar(jobs) {
      const roles = pbIaRoles(jobs);
      const pri = pbCountBy(jobs, j => j.priority || '—');
      const cov = pbCountBy(jobs, j => (j.screens || []).length ? 'has' : 'none');
      const chips = [];
      if (roles.length) chips.push({ id: 'role', label: 'Role', options: roles.map(r => ({
        value: r.id, label: r.declared ? r.name : r.name + ' · undeclared',
        count: jobs.filter(j => (j.roles || []).includes(r.id)).length })) });
      chips.push({ id: 'priority', label: 'Priority', options: Object.keys(pri).sort().map(v => ({ value: v, label: v, count: pri[v] })) });
      chips.push({ id: 'screens', label: 'Screens', options: [['has', 'Has a screen'], ['none', 'No screen yet']]
        .filter(([v]) => cov[v]).map(([v, l]) => ({ value: v, label: l, count: cov[v] })) });
      // a finding is shown only while there is one — a "Not handled 0" would be noise on every render
      // (unless it is switched on, when it has to stay reachable to be switched off)
      const quick = (cov.none || pbFilterState('ia').quick.unhandled) ? [{ id: 'unhandled', label: 'Not handled', count: cov.none || 0 }] : [];
      return pbFilterBar({ id: 'ia', label: 'Filter jobs', placeholder: 'Search jobs', countLabel: 'jobs', chips, quick });
    }
    /* The rows the bar filters, collected afresh on every keystroke. A job has several roles, which
       the legacy adapter's one-value-per-attribute facets (data-fb-<facet>) cannot say — so the bar
       is handed this page's own items instead. Rows are found by the adapter's two hooks only. */
    function pbIaItems() {
      const byId = {};
      ((((window.PB_LOGIC || {}).ia) || {}).jobs || []).forEach(j => { byId[j.id] = j; });
      return Array.from(document.querySelectorAll('[data-fb-list="ia"][data-key]')).map(el => {
        const j = byId[el.getAttribute('data-key')] || {}, n = (j.screens || []).length;
        return { el, text: pbIaHay(j), facets: { role: j.roles || [], priority: j.priority || '—', screens: n ? 'has' : 'none' }, quick: { unhandled: !n } };
      });
    }
    function pbIaApply() { if (document.querySelector('.pb-fbar[data-fbar="ia"]')) pbFilterApply('ia', pbIaItems); }
    /* The bar sticks to the top of the column, so the list's own sticky header must stick UNDER it, not on
       it: the bar's height (it wraps on a narrow screen) is published as --ia-bar-h for the CSS. */
    function pbIaStick() {
      const sc = document.getElementById('ia-scroll'), bar = sc && sc.querySelector('.ia-bar');
      if (!bar) return;
      const set = () => sc.style.setProperty('--ia-bar-h', (getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0) + 'px');
      set();
      if (window.ResizeObserver) new ResizeObserver(set).observe(bar);
    }

    /* The map answers the same filter: a screen is lit when a job that is still shown is placed on it;
       the rest dims (an edge stays lit while it leads to a lit screen). With nothing filtered, nothing
       is dimmed. A line under the title says what the dimming means — including when it dims everything
       (the jobs shown are placed on no screen, which is exactly what "Not handled" selects). */
    function pbIaCanvasSync(st) {
      st = st || pbFilterState('ia');
      const on = !!(String(st.q || '').trim() || Object.keys(st.sel || {}).length || Object.keys(st.quick || {}).length);
      const byId = {};
      ((((window.PB_LOGIC || {}).ia) || {}).jobs || []).forEach(j => { byId[j.id] = j; });
      const shown = Array.from(document.querySelectorAll('[data-fb-list="ia"][data-key]')).filter(r => !r.hidden);
      const lit = new Set();
      shown.forEach(r => ((byId[r.getAttribute('data-key')] || {}).screens || []).forEach(s => lit.add(s)));
      const stage = document.getElementById('iamap-stage');
      let nodesLit = 0, nodes = 0;
      if (stage) {
        const dim = (el, ok) => el.classList.toggle('is-dim', on && !ok);
        stage.querySelectorAll('.ia-node[data-screen]').forEach(n => { const ok = lit.has(n.getAttribute('data-screen')); nodes++; if (ok) nodesLit++; dim(n, ok); });
        stage.querySelectorAll('.ia-node[data-owners]').forEach(n => dim(n, n.getAttribute('data-owners').split(' ').some(o => lit.has(o))));
        stage.querySelectorAll('.ia-edge[data-to]').forEach(p => dim(p, lit.has(p.getAttribute('data-to'))));
        stage.querySelectorAll('.ia-edge[data-ov]').forEach(p => dim(p, lit.has(p.getAttribute('data-from'))));
      }
      const note = document.getElementById('iamap-live');
      if (note) {
        const k = shown.length, jw = k === 1 ? 'job' : 'jobs';
        note.textContent = !on ? ''
          : !k ? '· no job matches, so nothing is lit'
          : nodesLit ? `· ${nodesLit} of ${nodes} screens serve the ${k} ${jw} shown`
          : `· none of the ${k} ${jw} shown is placed on a screen of this map`;
      }
    }
    document.addEventListener('pb:filter', e => { if (e.detail && e.detail.id === 'ia') pbIaCanvasSync(e.detail.state); });

    function pbRenderIA() {
      const L = window.PB_LOGIC;
      const ia = (L && L.ia) || null;
      const allJobs = (ia && ia.jobs) || [];
      // The site map is DERIVED (the nav graph); the job list is AUTHORED. Gating both on the
      // authored half threw away a map that was already built — a real project with 10 screens
      // placed still showed "No jobs yet". Each half now answers for itself.
      const N = L && L.nav;
      const hasMap = !!(N && N.depth && Object.keys(N.depth).length);
      if (!allJobs.length && !hasMap) {
        return pbUxEmpty('No jobs yet',
          'List what each role needs done, as "when … I want to … so I can …". Each job maps to the screens that serve it, so a job with no screen shows up as unfinished work and a screen with no job as a question worth asking. /pb:clarify captures the jobs and /pb:plan maps them to screens and layers.'
            + (N && N.reason ? ' ' + pbSiteMapWhy(N) : ''),
          'Capture the jobs', '/pb:clarify');
      }

      // Every job with no screen is flagged on its own row ("No screen"), and is the "Not handled" chip's
      // count; the map flags the inverse (a screen with no job) per node, so screen-side coverage never
      // needs a summary of its own here.
      const jobsBody = allJobs.length
        ? `<div class="meta-h3 ia-jobs-title">Jobs <span class="meta-subtab-count">${allJobs.length}</span></div>
           <div class="ia-bar">${pbIaFilterBar(allJobs)}</div>
           ${pbJobsScanHTML(allJobs)}`
        : renderEmptyState({
            icon: EMPTY_STATE_ICONS.flow,
            title: 'No jobs yet',
            body: 'The site map above is derived from the code and needs nothing from you. The jobs do: list what each role needs done, as "when … I want to … so I can …". Once they exist, every screen shows which jobs it serves — and every job with no screen is flagged as unfinished work.',
            ctaLabel: 'Capture the jobs', command: '/pb:clarify',
          });

      // renderMetaFlow runs the legacy adapter (pbFbarApplyAll) once this HTML is in the page, and it would
      // filter this bar by single-valued data-fb-* attributes. One microtask later — before anything is
      // painted — the bar is handed this page's own items, which is also what restores a remembered filter.
      if (allJobs.length) Promise.resolve().then(() => { pbIaApply(); pbIaStick(); });

      return `<div class="summary-scroll ia-scroll" id="ia-scroll">
          <div class="ia-head"><h2 class="meta-h2">3.2 Information Architecture</h2></div>
          <section class="ia-map" aria-label="Site map">${pbRenderSiteMap(ia, allJobs)}</section>
          <section class="ia-jobs" aria-label="Jobs">${jobsBody}</section>
        </div>`;
    }

    /* The site map, drawn as an org chart. Layer membership and every edge are DERIVED — layer 0
       is each screen a sidebar item targets, deeper layers come from data-nav / data-go /
       setProtoScreen in the render bodies, and overlays are the drawer/modal/dialog components a
       screen composes. Only each layer's PURPOSE is authored; asking an author to redraw a
       hierarchy the code already encodes is how the two drift apart.

       It used to be a grid of columns, one per depth, which read as a table rather than a
       structure: you could see WHICH layer a screen sat in but not WHAT reaches it. A tidy tree
       answers the second question, which is the one the words "site map" promise. */
    const IA_NW = 220, IA_HGAP = 22, IA_VGAP = 56, IA_GUT = 96, IA_PAD = 20;
    /* Node height is DERIVED from the longest title and id in the chart, not fixed: a card grows
       to hold its text rather than clipping it. One height for every card keeps the row grid and
       the edge maths exact — only the tallest card decides it. */
    const IA_NH_BASE = 72, IA_TITLE_LH = 19, IA_ID_LH = 15;
    const pbIaLines = (s, charsPerLine) => Math.max(1, Math.ceil(String(s || '').length / charsPerLine));

    /* Leaving the whole card clickable made every attempt to READ the chart a navigation away from
       it — you cannot drag past a node, or point at one while talking, without being thrown into
       the Logic tab. The jump is an explicit affordance now; the card is just a card. */
    const pbIaGoBtn = id =>
      `<button class="ia-node-go" title="Open ${pbEscape(id)} in the Logic ripple" data-lg-id="${escapeHtmlAttr(id)}"
        onclick="event.stopPropagation();pbLogicGo('item',this.dataset.lgId)">ripple →</button>`;

    /* Tidy-tree layout: leaves take the next free column, a parent centres over its children.
       Returns post-order nodes (position is absolute, so order is irrelevant) + parent→child edges. */
    function pbIaTreeLayout(N, S, visible) {
      const placed = new Set();
      const nodes = [], edges = [];
      let cursor = 0, maxRow = 0;
      const kidsOf = id => ((N.children || {})[id] || []).filter(c => S[c] && visible(c) && !placed.has(c));

      const layout = (id, row) => {
        placed.add(id);
        maxRow = Math.max(maxRow, row);
        const cs = kidsOf(id);
        // Claim the whole child set BEFORE recursing: two siblings that share a child must not
        // both place it, and the graph is a DAG, not a tree.
        cs.forEach(c => placed.add(c));
        const centers = cs.map(c => layout(c, row + 1));
        let x;
        if (centers.length) {
          x = (centers[0] + centers[centers.length - 1]) / 2;
        } else {
          x = cursor + IA_NW / 2;
          cursor += IA_NW + IA_HGAP;
        }
        nodes.push({ id, row, x });
        centers.forEach((cx, i) => edges.push({ x1: x, r1: row, x2: cx, r2: row + 1, from: id, to: cs[i] }));
        return x;
      };

      // Roots in sidebar order — the hub list IS the product's own entry order — then any other
      // depth-0 screen, then whatever the walk never reached (a cycle, a stray parent).
      const roots = [];
      const push = id => { if (S[id] && visible(id) && roots.indexOf(id) === -1) roots.push(id); };
      (N.hubs || []).forEach(h => {
        [h.key].concat((h.children || []).map(c => c.key)).forEach(k => { if ((N.depth || {})[k] === 0) push(k); });
      });
      Object.keys(N.depth || {}).forEach(id => { if (N.depth[id] === 0) push(id); });
      roots.forEach(r => { if (!placed.has(r)) { layout(r, 0); cursor += IA_HGAP; } });
      Object.keys(N.depth || {}).forEach(id => {
        if (!placed.has(id) && S[id] && visible(id)) { layout(id, N.depth[id] || 0); cursor += IA_HGAP; }
      });

      return { nodes, edges, maxRow, width: Math.max(IA_NW, cursor - IA_HGAP) };
    }

    /* Why the derived map is blank, in words — it used to return '' and leave an empty column
       with nothing to say whether the project was broken or simply had no hub declared. */
    function pbSiteMapWhy(N) {
      const r = N && N.reason;
      if (r === 'no-hub') return 'The site map is blank because no navigation hub was found: set meta.navHub to the component that holds the top-level nav (a sidebar, a bottom bar — or a list of both), or run /pb:plan --ia.';
      if (r === 'hub-has-no-screens') return `The site map is blank because the hub (${(N.hubFiles || []).join(', ')}) lists no screen ids: each nav item needs a label and a key, screen or to naming a screen.`;
      if (r === 'no-edges') return 'The site map has its top layer but nothing below it: no render body names a screen through data-nav, data-go, setProtoScreen or a nav prop (screen:/to:).';
      return '';
    }
    function pbSiteMapEmpty(N) {
      const why = pbSiteMapWhy(N) || 'The site map is derived from the navigation hub and the render bodies; there is nothing to draw yet.';
      const missing = (N && N.hubMissing && N.hubMissing.length)
        ? `<p class="meta-p lg-dim">meta.navHub names ${N.hubMissing.map(pbEscape).join(', ')}, which ${N.hubMissing.length > 1 ? 'are' : 'is'} not a component with a render body.</p>` : '';
      return `<div class="ia-card ia-card--flat ia-map-empty">
          <div class="meta-h3">Site map</div>
          <p class="meta-p">${pbEscape(why)}</p>${missing}
          ${VIEW_ONLY ? '' : `<button class="sync-button" onclick="openCopyPopover('/pb:plan --ia', this)">/pb:plan --ia</button>`}
        </div>`;
    }

    /* Every screen is drawn, always: what the filter bar narrows is the JOB list, and the map answers by
       dimming the screens no shown job is placed on (pbIaCanvasSync) — a screen that left the chart
       would take its place in the tree with it. `jobs` is the whole list. */
    function pbRenderSiteMap(ia, jobs) {
      const N = (window.PB_LOGIC || {}).nav;
      if (!N || !N.depth || !Object.keys(N.depth).length) return pbSiteMapEmpty(N);
      const S = {};
      (PB_REGISTRY.screens || []).forEach(s => { S[s.id] = s; });
      const title = id => (S[id] && (S[id].title || S[id].name)) || id;
      const jobsOf = id => jobs.filter(j => (j.screens || []).includes(id));
      const visible = () => true;

      // `ia` may be absent entirely — the map is derived and stands on its own; only the
      // layer NAMES and purposes are authored, and those fall back to "Layer <n>".
      const layers = (ia && ia.layers) || [];
      const declared = layers.filter(l => l.depth !== 'overlay').sort((a, b) => a.depth - b.depth);
      const overlayLayer = layers.find(l => l.depth === 'overlay');
      const layerAt = d => declared.find(l => l.depth === d) || { name: 'Layer ' + d, purpose: '' };

      const T = pbIaTreeLayout(N, S, visible);
      if (!T.nodes.length) return pbSiteMapEmpty(N);

      // ~26 chars of 13px title and ~32 of 11px mono id fit one line of a 220px card.
      const IA_NH = IA_NH_BASE
        + (Math.max(...T.nodes.map(n => pbIaLines(title(n.id), 26))) - 1) * IA_TITLE_LH
        + (Math.max(...T.nodes.map(n => pbIaLines(n.id, 32))) - 1) * IA_ID_LH;

      /* Overlays are part of the structure, not a footnote — they are the drawers and modals a
         screen opens in place, and `ia.layers` declares a layer for them. They get their own rail
         at the foot of the chart: each overlay sits under the mean x of the screens that open it,
         with one dashed edge per owner, so a SHARED overlay reads as several edges converging.
         That convergence is the reuse signal, and a count inside the node could never show it. */
      const OV_W = 190, OV_GAP = 16;
      const ovOpen = state.iaOverlaysOpen !== false;
      const nodeX = {}, nodeRow = {};
      T.nodes.forEach(n => { nodeX[n.id] = n.x; nodeRow[n.id] = n.row; });
      const ovOwners = {};
      T.nodes.forEach(n => ((N.overlays || {})[n.id] || []).forEach(o => {
        (ovOwners[o] = ovOwners[o] || []).push(n.id);
      }));
      const meanX = o => ovOwners[o].reduce((s, i) => s + nodeX[i], 0) / ovOwners[o].length;
      const ovAll = Object.keys(ovOwners).sort((a, b) => meanX(a) - meanX(b));
      // Collapsed, the rail keeps its label and count but places nothing — this is the busiest
      // row on the chart (one edge per owner), and it is not always what you came to read.
      const ovIds = ovOpen ? ovAll : [];
      // Place at the preferred x, then push right just enough to clear the previous one. Sorting
      // by preference first is what keeps the edges from criss-crossing.
      const ovX = {};
      let ovCursor = OV_W / 2 - OV_W - OV_GAP;
      ovIds.forEach(o => { ovCursor = ovX[o] = Math.max(meanX(o), ovCursor + OV_W + OV_GAP); });
      const ovWidth = ovIds.length ? ovX[ovIds[ovIds.length - 1]] + OV_W / 2 : 0;
      // Same rule as the screen cards: the tallest id decides the row's height, nothing is cut.
      const OV_H = 56 + (ovAll.length ? Math.max(...ovAll.map(o => pbIaLines(o, 30))) - 1 : 0) * IA_ID_LH;

      const W = IA_GUT + Math.max(T.width, ovWidth) + IA_PAD * 2;
      const H = IA_PAD * 2 + (T.maxRow + 1) * (IA_NH + IA_VGAP) - IA_VGAP
        + (ovAll.length ? IA_VGAP + (ovOpen ? OV_H : 24) : 0);
      const cx = x => IA_GUT + IA_PAD + x;
      const ry = r => IA_PAD + r * (IA_NH + IA_VGAP);
      const ovY = IA_PAD + (T.maxRow + 1) * (IA_NH + IA_VGAP);

      // Orthogonal elbows: down out of the parent, across the gutter between rows, down into the
      // child. Straight segments read as hierarchy in a way curves do not.
      const edges = T.edges.map(e => {
        const y1 = ry(e.r1) + IA_NH, y2 = ry(e.r2), my = y1 + IA_VGAP / 2;
        return `<path class="ia-edge" data-from="${pbEscape(e.from)}" data-to="${pbEscape(e.to)}" d="M${cx(e.x1)} ${y1} V${my} H${cx(e.x2)} V${y2}"/>`;
      }).join('')
      + ovIds.map(o => ovOwners[o].map(owner => {
        const y1 = ry(nodeRow[owner]) + IA_NH, my = ovY - IA_VGAP / 2;
        return `<path class="ia-edge ia-edge--ov" data-from="${pbEscape(owner)}" data-ov="${pbEscape(o)}" d="M${cx(nodeX[owner])} ${y1} V${my} H${cx(ovX[o])} V${ovY}"/>`;
      }).join('')).join('');

      const rowLines = [], rowLabs = [];
      const rail = (top, label, count, purpose) =>
        `<div class="ia-rowlab" style="top:${top}px;width:${IA_GUT - 14}px" title="${pbEscape(purpose || 'No purpose authored for this layer — /pb:init asks for one sentence each')}">`
        + `${pbEscape(label)}<span class="ia-rowlab-n">${count}</span></div>`;
      for (let r = 0; r <= T.maxRow; r++) {
        const l = layerAt(r), n = T.nodes.filter(x => x.row === r).length;
        rowLines.push(`<line class="ia-rowline" x1="0" y1="${ry(r) - 16}" x2="${W}" y2="${ry(r) - 16}"/>`);
        rowLabs.push(rail(ry(r), 'L' + r + ' · ' + l.name, n, l.purpose));
      }
      if (ovAll.length) {
        rowLines.push(`<line class="ia-rowline ia-rowline--ov" x1="0" y1="${ovY - 16}" x2="${W}" y2="${ovY - 16}"/>`);
        rowLabs.push(`<div class="ia-rowlab ia-rowlab--ov" style="top:${ovY}px;width:${IA_GUT - 14}px"
            title="${pbEscape((overlayLayer && overlayLayer.purpose) || 'The drawers and modals a screen opens in place')}">
            <button class="ia-rail-toggle pb-hit-pad" onclick="pbToggleIaOverlays()" title="${ovOpen ? 'Collapse' : 'Expand'} the overlay layer" aria-label="${ovOpen ? 'Collapse' : 'Expand'} the overlay layer">${ovOpen ? '▾' : '▸'}</button>
            Overlay · ${pbEscape((overlayLayer && overlayLayer.name) || 'Drawer & modal')}<span class="ia-rowlab-n">${ovAll.length}</span>
          </div>`);
      }

      const nodeEls = T.nodes.map(n => {
        const js = jobsOf(n.id), ov = (N.overlays || {})[n.id] || [];
        const ovBit = ov.length ? ` · ${ov.length} overlay${ov.length > 1 ? 's' : ''}` : '';
        const meta = (js.length ? `${js.length} job${js.length > 1 ? 's' : ''}` : '<span class="lg-warn">no job</span>') + ovBit;
        const tip = (js.length ? js.map(j => '• ' + (j.want || j.job || '')).join('\n') : 'No job maps to this screen')
          + (ov.length ? '\n\noverlays: ' + ov.join(', ') : '');
        return `<div class="ia-node ia-node--card ${js.length ? '' : 'ia-node--empty'}" data-screen="${pbEscape(n.id)}"
            style="left:${cx(n.x) - IA_NW / 2}px;top:${ry(n.row)}px;width:${IA_NW}px;height:${IA_NH}px"
            title="${pbEscape(tip)}">
            <div class="ia-node-t"><strong>${pbEscape(title(n.id))}</strong>${((S[n.id] || {}).roles || []).map(pbRoleDot).join('')}</div>
            <div class="lg-dim ia-node-id">${pbEscape(n.id)}</div>
            <div class="ia-node-m"><span>${meta}</span>${pbIaGoBtn(n.id)}</div>
          </div>`;
      }).join('')
      + ovIds.map(o => {
        const owners = ovOwners[o];
        return `<div class="ia-node ia-node--card ia-node--ov" data-owners="${pbEscape(owners.join(' '))}"
            style="left:${cx(ovX[o]) - OV_W / 2}px;top:${ovY}px;width:${OV_W}px;height:${OV_H}px"
            title="${pbEscape('Opened by: ' + owners.map(id => title(id)).join(', '))}">
            <div class="ia-node-t">${pbEscape(o)}</div>
            <div class="ia-node-m"><span>${owners.length} screen${owners.length > 1 ? 's' : ''}</span>${pbIaGoBtn(o)}</div>
          </div>`;
      }).join('');

      const orphans = Object.keys(S).filter(id => N.depth[id] == null);
      const ovCount = ovIds.length;

      return `<div class="meta-h3 ia-map-title">Site map <span class="meta-subtab-count">${T.nodes.length} screens · ${T.maxRow + 1} layer${T.maxRow ? 's' : ''}${ovCount ? ` · ${ovCount} overlays` : ''}</span><span class="meta-subtab-count ia-map-live" id="iamap-live" aria-live="polite"></span></div>
        <div class="flow-canvas ia-canvas" id="iamap-canvas">
          <div class="flow-viewport" id="iamap-viewport">
            <div class="flow-stage ia-stage" id="iamap-stage" data-w="${W}" data-h="${H}"
                 style="width:${W}px;height:${H}px;margin-top:${-H / 2}px;margin-left:${-W / 2}px">
              <svg class="ia-edges" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${rowLines.join('')}${edges}</svg>
              ${rowLabs.join('')}
              ${nodeEls}
            </div>
          </div>
          <div class="flow-zoom-controls">
            <button class="flow-zoom-btn" id="iamap-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
            <button class="flow-zoom-btn" id="iamap-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <button class="flow-zoom-btn" id="iamap-zoom-fit" title="Fit / reset" aria-label="Fit / reset">⊙</button>
          </div>
          <div class="flow-zoom-readout" id="iamap-zoom-readout">100%</div>
          <div class="flow-hint">${/Mac|iPhone|iPad/.test((navigator.platform || '') + ' ' + (navigator.userAgent || '')) ? '⌘' : 'Ctrl'} + scroll to zoom · drag to pan · “ripple →” opens a screen in Logic</div>
        </div>
        <p class="lg-dim ia-pan-hint">Swipe the chart sideways to see the rest · “ripple →” opens a screen in Logic</p>
        ${orphans.length ? `<div class="ia-orphans"><span class="lg-warn">Reachable from no hub:</span> ${orphans.map(id => `<span class="ia-ov">${pbEscape(id)}</span>`).join(' ')}</div>` : ''}`;
    }

    /* ── Logic · Rules | Ripple ───────────────────────────────────────────── */
    function pbSetLogicView(v) { pbTabSwitch(() => { state.logicView = v; renderMetaFlow(); }); }
    /* The tab is rebuilt from scratch on every click, which put every scroller back at the top: pick
       something far down the list and the list jumped away, so the next pick began with a scroll.
       Remember where each scroller was (and what was typed in the filter) and put it all back. */
    function pbKeepScroll(fn) {
      const SEL = ['.ux-scroll-wrap > .summary-scroll', '.lg-list-wrap', '.lg-detail'];
      const saved = SEL.map(sel => { const el = document.querySelector(sel); return el ? [sel, el.scrollTop, el.scrollLeft] : null; }).filter(Boolean);
      const f = document.querySelector('.lg-search');
      const typed = f ? f.value : '';
      fn();
      saved.forEach(([sel, top, left]) => { const el = document.querySelector(sel); if (el) { el.scrollTop = top; el.scrollLeft = left; } });
      const nf = document.querySelector('.lg-search');
      if (nf && typed) { nf.value = typed; pbLogicFilter(nf); }
    }
    function pbLogicGo(type, id) {
      pbKeepScroll(() => {
        state.logicFocus = { type, id };
        state.logicView = 'ripple';
        state.uxView = 'logic';
        renderMetaFlow();
      });
    }
    /* Jump to a DECLARED rule, not a derived node — pbLogicGo lands in the ripple, which has no
       rule to land on. Content's glossary links here, so a term and the rule that governs it are
       one click apart. */
    function pbLogicGoRule(id) {
      state.logicView = 'rules';
      state.uxView = 'logic';
      pbScanOpenKey('logic', id);                     // a link to a rule opens its row
      pbFilterClear('logic');
      renderMetaFlow();
      pbScanReveal('logic', id);
    }
    function pbLogicFilter(inp) {
      const q = (inp.value || '').toLowerCase();
      document.querySelectorAll('#logic-list .logic-row').forEach(r => { r.hidden = q && r.dataset.k.indexOf(q) === -1; });
      document.querySelectorAll('#logic-list .logic-group').forEach(g => { g.hidden = !g.querySelector('.logic-row:not([hidden])'); });
    }

    function pbRenderLogic() {
      const L = window.PB_LOGIC;
      if (!L || !L.stats) {
        return pbUxEmpty('No logic graph yet',
          'The ripple view is derived from your render bodies at render time — what each handler reads, which store slice it touches, what it re-renders — and rules you declare are linked to the code that implements them. Re-render to generate it.',
          'Render', '/pb:build --render');
      }
      // Land on Rules when there is anything to read there — including decisions a project has
      // not migrated yet, which would otherwise open on Ripple and look like nothing was recorded.
      if (!state.logicView) {
        state.logicView = ((L.rules || []).length + pbLegacyTradeoffs().length) ? 'rules' : 'ripple';
      }
      const v = state.logicView;
      const S = L.stats;
      return `<div class="meta-section">
          <div class="meta-h2">3.1 Logic</div>
          <div class="lg-views">
            <button class="lg-view ${v === 'rules' ? 'active' : ''}" onclick="pbSetLogicView('rules')">Rules <span class="meta-subtab-count">${(L.rules || []).length + pbLegacyTradeoffs().length}</span></button>
            <button class="lg-view ${v === 'ripple' ? 'active' : ''}" onclick="pbSetLogicView('ripple')">Impact <span class="meta-subtab-count">${S.handlers}</span></button>
            <span class="lg-stats">${S.handlers} handlers · ${S.exported} shared · ${S.saves} saves · ${S.slices} store slices · <span class="${S.deadReads ? 'lg-warn' : ''}">${S.deadReads} dead read${S.deadReads === 1 ? '' : 's'}</span></span>
          </div>
          ${v === 'rules' ? pbRenderLogicRules(L) : pbRenderLogicRipple(L)}
        </div>`;
    }

    function pbRenderLogicRules(L) {
      const legacy = pbRenderLegacyTradeoffs();
      const rules = L.rules || [];
      if (!rules.length) {
        // "No rules declared yet" under a rendered decision reads as a contradiction; the banner
        // above it already says what those cards are and what to run.
        if (legacy) return legacy;
        return `<p class="meta-p lg-dim">No rules declared yet. A rule is a state machine, a matrix, a constraint — or a <code>decision</code>, one you have made but not yet expressed as any of those. The lifecycle of a cycle, who may edit what, why validation is inline: written down once, so the diagram, the code that implements it and the screens that display it stay linked.</p>`;
      }
      // One line per rule — [ID ·] Title · Status · Kind — that opens in place, straight into the
      // rule. The ID column is dropped when every id is a slug (it would only repeat the title);
      // the id is still in the opened rule, with a copy button.
      const noId = pbScanIdsAreSlugs(rules.map(r => r.id));
      const rows = rules.map((r, n) => {
        const fx = pbRuleFacts(r);
        const dot = fx.reds ? 'pb-dot--fail' : fx.status === 'To resolve' ? 'pb-dot--open' : fx.status === 'Superseded' ? 'pb-dot--hollow' : '';
        return pbScanRowHTML('logic', r.id, (noId ? [] : [
          `<span class="id" title="${escapeHtmlAttr(r.id)}">${pbEscape(r.id)}</span>`,
        ]).concat([
          `<span class="ti" title="${escapeHtmlAttr(fx.title)}">${pbEscape(fx.title)}</span>`,
          `<span class="st" title="${escapeHtmlAttr(fx.label)}"><span class="pb-dot ${dot}"></span><span class="w">${pbEscape(fx.label)}</span></span>`,
          `<span class="kd">${pbEscape(fx.kind)}</span>`,
        ]), pbLogicCard(r, n, { bare: true }), {
          dim: fx.status === 'Superseded', archived: fx.status === 'Superseded', label: fx.title,
          hay: [r.id, fx.title, fx.kind, fx.status, fx.label, r.summary || '', (r.decision || {}).chose || '', (r.decision || {}).question || ''].join(' '),
          vals: { status: fx.status, kind: fx.kind },
        });
      }).join('');
      return legacy + pbLogicFbar(rules)
        + pbScanHTML('logic', 'pb-scan--logic' + (noId ? ' pb-scan--noid' : ''), noId ? ['Title', 'Status', 'Kind'] : ['ID', 'Title', 'Status', 'Kind'], 'Rules', rows, noId ? 2 : 3);
    }

    /* Declared states that no code puts the system into. The answer is only sound when the rule
       named the property holding the state (`stateField`) and marked its computed states
       `derived` — without that, a scan cannot tell a domain state from a UI variant sharing the
       word, nor an assigned machine from one derived from dates. So: no stateField, no claim. */
    function pbRuleUnreachable(r) {
      const sw = ((window.PB_LOGIC || {}).stateWriters || {})[r.id];
      if (!sw || sw.unscoped || !r.stateField) return [];
      return Object.keys(sw).filter(k => !sw[k].derived && !(sw[k].assigns || []).length);
    }

    /* =====================================================================
       THE RULE CARD (v2.1.0) — chosen in /pb:explore logic-card, option 3, on the real rules of a
       polygon editor and an HR fund app. Read top to bottom it answers, in order:
         1. what the rule is            — the title (a statement, never a question) + one-line lead
         2. is anything wrong with it   — one status pill, then a to-do row per problem saying what
                                           is wrong, what to do, and which command does it
         3. the rule itself             — its structure, always open: lifecycle, matrix, invariants,
                                           and every structural block, in the order authored
         4. on demand                   — Values (colours, anatomy, examples, parameters) and History
                                           (a timeline: the decision is its latest entry, not a
                                           second record beside it)
       A superseded rule folds to its header. Colour carries meaning only: red = the rule is
       incomplete or contradicts itself, amber = something is unanswered, green = chosen/checked.
       ===================================================================== */
    const LGC_VALUE_TYPES = { swatches: 1, anatomy: 1, examples: 1, params: 1 };
    const lgcArr = v => v == null || v === '' ? [] : (Array.isArray(v) ? v : [v]);
    const lgcStr = v => v == null ? '' : String(v);
    const lgcSentences = s => {
      s = lgcStr(s).replace(/\s+/g, ' ').trim();
      return s ? s.split(/(?<=[.!?])\s+(?=[\p{Lu}"'`(])/u) : [];
    };
    // One sentence is a line; several are a list — the shape a long paragraph was hiding.
    const lgcProse = s => {
      if (/\n/.test(lgcStr(s))) return `<div class="lg-prose">${pbProseHTML(s)}</div>`;
      const ss = lgcSentences(s);
      if (!ss.length) return '';
      return ss.length === 1 ? `<p class="lgc-tx">${pbEmph(ss[0])}</p>`
        : `<ul class="lgc-ul">${ss.map(x => `<li>${pbEmph(x)}</li>`).join('')}</ul>`;
    };
    const lgcIsId = s => /^[a-z0-9]+(-[a-z0-9]+)+$/.test(lgcStr(s));
    const lgcIdOr = s => lgcIsId(s) ? `<code>${pbEscape(s)}</code>` : pbEmph(lgcStr(s));
    const lgcBadge = (tone, html, title) => `<span class="lgc-b lgc-b-${tone}"${title ? ` title="${escapeHtmlAttr(title)}"` : ''}>${html}</span>`;
    // Swatch values come from the project's data and land in a style attribute: colours only.
    const lgcColor = c => { c = lgcStr(c).trim(); return /^(#[0-9a-fA-F]{3,8}|(rgb|hsl)a?\([0-9.,%\s]+\))$/.test(c) ? c : ''; };
    const lgcHead = (t, extra) => t || extra ? `<div class="lgc-h"><span>${pbEmph(t || '')}</span>${extra || ''}</div>` : '';
    const lgcTable = (cols, rows, cls) => `<div class="lgc-w"><table class="lgc-t${cls ? ' ' + cls : ''}"><thead><tr>${cols.map(c => `<th>${pbEmph(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    function lgcVal(v) {
      if (v == null || v === '') return '';
      if (Array.isArray(v)) return `<ul class="lgc-ul">${v.map(x => `<li>${lgcVal(x)}</li>`).join('')}</ul>`;
      if (typeof v === 'object') return `<div class="lgc-kv">${Object.keys(v).map(k => `<div><b>${pbEscape(k)}</b> ${lgcVal(v[k])}</div>`).join('')}</div>`;
      if (typeof v === 'boolean') return v ? 'yes' : 'no';
      return lgcIdOr(v);
    }
    const lgcChips = list => `<div class="lgc-chips">${list.map(x => `<span class="lgc-chip">${lgcIdOr(x)}</span>`).join('')}</div>`;
    const lgcCell = (m, row, col) => { const rr = (m.cells || {})[row]; return rr && Object.prototype.hasOwnProperty.call(rr, col) ? rr[col] : undefined; };
    const LGC_TONE = { ok: 'ok', success: 'ok', green: 'ok', done: 'ok', warn: 'warn', warning: 'warn', yellow: 'warn', pending: 'warn',
      danger: 'bad', error: 'bad', red: 'bad', bad: 'bad', info: 'info', blue: 'info', neutral: 'n', grey: 'n', gray: 'n' };
    const lgcTone = t => LGC_TONE[lgcStr(t).toLowerCase()] || '';
    const lgcThen = (v, tone) => lgcTone(tone) ? lgcBadge(lgcTone(tone), pbEmph(lgcStr(v))) : lgcVal(v);
    const lgcBy = iv => iv.enforcedBy ? pbLgLink('handler', iv.enforcedBy, iv.enforcedBy + '()')
      : iv.enforcedIn ? `<code>${pbEscape(pbList(iv.enforcedIn))}</code>` : '';

    // Each block type is drawn by one function. The `lg-block--<type>` hook stays on the wrapper.
    const LGC_BLOCKS = {
      cases(b) {
        const rows = lgcArr(b.rows);
        const inputs = Array.isArray(b.inputs) && b.inputs.length && rows.some(x => x.when && typeof x.when === 'object') ? b.inputs : null;
        const body = rows.map((x, n) => `<tr><td class="lgc-num">${n + 1}</td>${inputs
            ? inputs.map(i => `<td>${lgcVal((x.when || {})[i] ?? '·')}</td>`).join('') : `<td>${lgcVal(x.when)}</td>`}`
          + `<td>${lgcThen(x.then, x.tone)}${x.note ? `<div class="lgc-sub">${pbEmph(x.note)}</div>` : ''}</td></tr>`).join('')
          + (b.else != null ? `<tr class="lgc-else"><td class="lgc-num"></td><td colspan="${inputs ? inputs.length : 1}"><i>Otherwise</i></td><td>${typeof b.else === 'object' && b.else.then != null ? lgcThen(b.else.then, b.else.tone) : lgcVal(b.else)}</td></tr>` : '');
        return lgcHead(b.title) + lgcTable(['#'].concat(inputs || [b.whenLabel || 'When']).concat([b.thenLabel || 'Then']), body, 'lgc-cases');
      },
      scope(b) {
        const col = (label, items, cls, mark) => `<div class="lgc-sc lgc-sc-${cls}"><div class="lgc-sch">${mark} ${pbEmph(label)}</div><ul class="lgc-ul">${lgcArr(items).map(x => `<li>${pbEmph(lgcStr(x))}</li>`).join('')}</ul></div>`;
        return lgcHead(b.title) + `<div class="lgc-g2">${col(b.actsLabel || 'Acts on', b.acts, 'in', '✓')}${col(b.untouchedLabel || 'Leaves untouched', b.untouched, 'out', '✕')}</div>`;
      },
      placement(b) {
        const never = lgcArr(b.surfaces).some(s => lgcArr(s.never).length);
        const rows = lgcArr(b.surfaces).map(s => `<tr><td><b>${pbEmph(lgcStr(s.surface))}</b></td><td>${lgcArr(s.holds).map(x => pbEmph(lgcStr(x))).join('<br>')}</td>`
          + (never ? `<td class="lgc-never">${lgcArr(s.never).map(x => '✕ ' + pbEmph(lgcStr(x))).join('<br>')}</td>` : '') + '</tr>').join('');
        return lgcHead(b.title) + lgcTable([b.surfaceLabel || 'Surface', 'Shows'].concat(never ? ['Never'] : []), rows);
      },
      matrix(m) {
        const cols = lgcArr(m.cols);
        const rows = lgcArr(m.rows).map(row => `<tr><td><b>${pbEmph(lgcStr(row))}</b></td>${cols.map(col => {
          const v = lgcCell(m, row, col);
          if (v === true) return '<td class="lgc-mx lgc-yes" title="yes">✓</td>';
          if (v === false) return '<td class="lgc-mx lgc-no" title="no">–</td>';
          if (v == null) return `<td class="lgc-mx lgc-gap" title="No answer for ${escapeHtmlAttr(row)} × ${escapeHtmlAttr(col)}">?</td>`;
          return `<td class="lgc-mx">${pbEmph(lgcStr(v))}</td>`;
        }).join('')}</tr>`).join('');
        return lgcHead(m.title) + lgcTable([m.rowLabel || ''].concat(cols), rows, 'lgc-tm');
      },
      validation(b) { return lgcHead(b.title) + lgcInvariants(lgcArr(b.items)); },
      formula(b) {
        const terms = lgcArr(b.terms).map(t => t && typeof t === 'object'
          ? `<tr><td><code>${pbEscape(t.name || t.term || '')}</code></td><td>${pbEmph(lgcStr(t.means || t.meaning || ''))}</td></tr>`
          : `<tr><td colspan="2">${pbEmph(lgcStr(t))}</td></tr>`).join('');
        const ex = b.example;
        const exHtml = ex == null ? '' : typeof ex === 'object'
          ? `<div class="lgc-expr lgc-ex"><span class="lgc-exh">Worked example</span> ${ex.inputs ? Object.entries(ex.inputs).map(([k, v]) => `<code>${pbEscape(k)}</code> = ${pbEscape(v)}`).join(' · ') : ''}${ex.result != null ? ` → <b>${pbEmph(String(ex.result))}</b>` : ''}</div>`
          : `<div class="lgc-expr lgc-ex"><span class="lgc-exh">Worked example</span> ${pbEmph(String(ex))}</div>`;
        return lgcHead(b.title) + `<div class="lgc-expr">${pbEscape(b.expr || '')}</div>` + (terms ? lgcTable(['Term', 'Means'], terms) : '') + exHtml;
      },
      steps(b) {
        return lgcHead(b.title) + `<ol class="lgc-steps">${lgcArr(b.items).map((s, i) => `<li><span class="lgc-n">${i + 1}</span><span>${typeof s === 'string'
          ? pbEmph(s) : `<b>${pbEmph(lgcStr(s.label))}</b>${s.detail ? ` <span class="lgc-sub">${pbEmph(s.detail)}</span>` : ''}`}</span></li>`).join('')}</ol>`;
      },
      effects(b) {
        const writes = lgcArr(b.writes).map(w => `<li><code>store.${pbEscape(String(w).replace(/^store\./, ''))}</code></li>`).join('');
        const ripple = lgcArr(b.ripple).map(x => `<li><b>${pbEmph(lgcStr(x.screen || x.on || ''))}</b> ${pbEmph(lgcStr(x.shows || x.what || ''))}</li>`).join('');
        return lgcHead(b.title) + `<div class="lgc-g2">${writes ? `<div class="lgc-sc"><div class="lgc-sch">Writes</div><ul class="lgc-ul">${writes}</ul></div>` : ''}${ripple ? `<div class="lgc-sc"><div class="lgc-sch">Also changes</div><ul class="lgc-ul">${ripple}</ul></div>` : ''}</div>`;
      },
      note(b) { return lgcHead(b.title) + `<div class="lgc-note">${lgcProse(b.text)}</div>`; },
      params(b) {
        const rows = lgcArr(b.items).map(p => `<tr><td>${pbEmph(lgcStr(p.name))}</td><td class="lgc-val">${pbEscape(p.value ?? '')}${p.unit ? ` <span class="lgc-unit">${pbEscape(p.unit)}</span>` : ''}</td><td>${pbEmph(lgcStr(p.note || ''))}</td></tr>`).join('');
        return lgcHead(b.title || 'Parameters') + lgcTable(['Parameter', 'Value', 'Note'], rows);
      },
      // A value shown as itself: the input, and exactly what it renders as.
      examples(b) {
        const items = lgcArr(b.items);
        const hasIn = items.some(x => x.input != null), hasNote = items.some(x => x.note);
        const rows = items.map(x => '<tr>' + (hasIn ? `<td><code>${pbEscape(x.input || '')}</code></td>` : '')
          + `<td class="lgc-out">${pbEscape(x.output)}</td>` + (hasNote ? `<td>${pbEmph(lgcStr(x.note || ''))}</td>` : '') + '</tr>').join('');
        return lgcHead(b.title || 'Examples') + lgcTable((hasIn ? ['Input'] : []).concat(['Renders as']).concat(hasNote ? ['Note'] : []), rows, 'lgc-tex');
      },
      // By state, compact: what each state looks like and what it means. Token names and values
      // are a folded reference — the card is about the logic, the palette is one click away.
      swatches(b) {
        const items = lgcArr(b.items);
        const rows = items.map(s => {
          const c = lgcColor(s.value), soft = lgcColor(s.soft);
          const look = soft
            ? `<span class="lgc-pill" style="color:${c};background:${soft};border-color:${c}">${pbEscape(s.label)}</span>`
            : s.sample ? `<span class="lgc-dot" style="background:${c || 'transparent'}"></span><span style="color:${c};font-weight:700">${pbEscape(s.sample)}</span>`
            : `<span class="lgc-dot" style="background:${c || 'transparent'}"></span><b>${pbEscape(s.label)}</b>`;
          return `<div class="lgc-swr"><span class="lgc-swlk">${look}</span><span>${soft || !s.sample ? '' : `<b>${pbEscape(s.label)}</b> — `}${pbEmph(lgcStr(s.meaning || ''))}</span></div>`;
        }).join('');
        const ref = items.map(s => `<tr><td>${pbEscape(s.label)}</td><td><code>${pbEscape(s.token || '')}</code></td><td><code>${pbEscape(s.value || '')}</code>${s.soft ? ` <code>bg ${pbEscape(s.soft)}</code>` : ''}</td></tr>`).join('');
        return lgcHead(b.title || 'Colours') + `<div class="lgc-swl">${rows}</div>`
          + (items.some(s => s.token || s.value) ? `<details class="lgc-ref"><summary>Token reference</summary>${lgcTable(['State', 'Token', 'Value'], ref)}</details>` : '');
      },
      // An identifier or a label broken into its parts: the sample, each part numbered under it,
      // then what each part is and the rule it follows.
      anatomy(b) {
        let pi = 0;
        const parts = lgcArr(b.parts).map(p => {
          let t = lgcTone(p.tone);
          if (!t) t = lgcStr(p.text).trim().length <= 1 && /^[\s\W_]*$/.test(lgcStr(p.text)) ? 'n' : ['info', 'ok'][(pi++) % 2];
          return { p, t };
        });
        const sample = `<div class="lgc-ans">${parts.map((x, i) => `<span class="lgc-ap lgc-t-${x.t}"><span class="lgc-apt">${pbEscape(x.p.text)}</span><span class="lgc-apn">${i + 1}</span></span>`).join('')}</div>`;
        const rows = parts.map((x, i) => `<tr class="lgc-t-${x.t}"><td><span class="lgc-n lgc-nt">${i + 1}</span></td><td><code class="lgc-pre">${pbEscape(x.p.text)}</code></td>`
          + `<td><b>${pbEscape(x.p.name || '')}</b></td><td>${pbEmph(lgcStr(x.p.rule || ''))}${x.p.note ? `<div class="lgc-pn">${x.t === 'warn' ? '⚠ ' : ''}${pbEmph(x.p.note)}</div>` : ''}</td></tr>`).join('');
        return lgcHead(b.title || 'Anatomy') + `<div class="lgc-an">${sample}</div>` + lgcTable(['#', 'Part', 'Name', 'Rule'], rows, 'lgc-tan');
      },
    };
    function lgcBlock(b) {
      const fn = LGC_BLOCKS[b.type];
      let inner;
      try {
        inner = fn ? fn(b) : lgcHead(b.title, lgcBadge('n', pbEscape(b.type || 'block')))
          + (b.text ? lgcProse(b.text) : lgcVal(Object.fromEntries(Object.entries(b).filter(([k]) => k !== 'type' && k !== 'title'))));
      } catch (e) { inner = `<div class="lgc-err">This ${pbEscape(b.type)} block could not be drawn (${pbEscape(e.message)}).</div>`; }
      return `<section class="lgc-sec lg-block lg-block--${pbEscape(b.type || 'unknown')}">${inner}</section>`;
    }

    // Invariants: numbered, one line each, "checked" or "not checked" — the detail (where it is
    // enforced, when it applies, its message) opens on demand. `quiet` = retired, no verdict.
    function lgcInvariants(inv, quiet) {
      return `<div class="lgc-ivl">${inv.map((iv, i) => {
        const by = lgcBy(iv);
        const st = quiet ? '' : by ? '<span class="lgc-ivok">✓ checked</span>' : '<span class="lgc-ivno">not checked</span>';
        const det = [['When', iv.when ? pbEmph(pbList(iv.when)) : ''], ['Enforced by', by], ['Message', iv.message ? `“${pbEmph(iv.message)}”` : ''],
          ['Code', iv.code ? `<code>${pbEscape(iv.code)}</code>` : '']].filter(x => x[1]);
        const sum = `<span class="lgc-n">${i + 1}</span><span class="lgc-ivm">${pbEmph(lgcStr(iv.must))}</span>${st}`;
        return det.length
          ? `<details class="lgc-iv"><summary class="lgc-ivs">${sum}<span class="lgc-chev" aria-hidden="true">▸</span></summary><div class="lgc-ivb">${det.map(x => `<div class="lgc-ivr"><span class="lgc-ivk">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div></details>`
          : `<div class="lgc-iv"><div class="lgc-ivs">${sum}</div></div>`;
      }).join('')}</div>`;
    }

    // The lifecycle as a flow: states left → right in declared order, a connector per pair (an
    // arrow when that transition exists), overlays as bands under the states they span, every
    // other transition (a skip or a return) as its own row. Vertical on a narrow screen.
    function lgcLifecycle(r, unreachable) {
      const states = lgcArr(r.states), idx = {}, keys = {};
      states.forEach((s, i) => { idx[s.key] = i; keys[s.key] = s; });
      const tset = {};
      lgcArr(r.transitions).forEach(t => { tset[t[0] + '>' + t[1]] = 1; });
      const n = states.length, cols = [];
      for (let i = 0; i < n; i++) { cols.push('minmax(0,1fr)'); if (i < n - 1) cols.push('36px'); }
      let track = '';
      states.forEach((s, i) => {
        const dead = unreachable.indexOf(s.key) !== -1;
        track += `<div class="lgc-fn${dead ? ' lgc-fn-dead' : ''}" style="grid-column:${2 * i + 1};grid-row:1"><div class="lgc-fnl">${pbEmph(lgcStr(s.label))}</div>`
          + `<div class="lgc-fnk"><code>${pbEscape(s.key)}</code>${s.derived ? ' ' + lgcBadge('info', 'derived') : ''}</div>`
          + (s.condition ? `<div class="lgc-fnc">${pbEmph(s.condition)}</div>` : '')
          + (dead ? `<div class="lgc-fnd">Nothing sets <code>${pbEscape(r.stateField)} = '${pbEscape(s.key)}'</code></div>` : '') + '</div>';
        if (i < n - 1) {
          const on = tset[s.key + '>' + states[i + 1].key];
          track += `<div class="lgc-fa${on ? '' : ' lgc-fa-off'}" style="grid-column:${2 * i + 2};grid-row:1" aria-hidden="true"><span class="lgc-fah">${on ? '→' : '·'}</span></div>`;
        }
      });
      let bands = '';
      lgcArr(r.overlays).forEach((o, k) => {
        const ix = lgcArr(o.over).map(key => idx[key]).filter(x => x != null).sort((a, b) => a - b);
        if (!ix.length) return;
        const span = ix[ix.length - 1] - ix[0] === ix.length - 1 ? `grid-column:${2 * ix[0] + 1}/${2 * ix[ix.length - 1] + 2}` : 'grid-column:1/-1';
        bands += `<div class="lgc-fb" style="${span};grid-row:${k + 2}"><span class="lgc-fbl">${pbEmph(lgcStr(o.label || o.key))}</span>${o.condition ? `<span class="lgc-fbc">${pbEmph(o.condition)}</span>` : ''}</div>`;
      });
      const lbl = k => keys[k] ? pbEmph(lgcStr(keys[k].label)) : `<span class="lgc-badref">${pbEscape(k)} ?</span>`;
      const other = lgcArr(r.transitions).filter(t => !(idx[t[1]] === idx[t[0]] + 1));
      const otherHtml = other.length ? `<div class="lgc-fo">${other.map(t => {
        const back = idx[t[1]] != null && idx[t[0]] != null && idx[t[1]] < idx[t[0]];
        return `<div class="lgc-for"><span class="lgc-fop">${lbl(t[0])}</span><span class="lgc-foa">${back ? '↩ returns to' : '→ skips to'}</span><span class="lgc-fop">${lbl(t[1])}</span></div>`;
      }).join('')}</div>` : '';
      return `<section class="lgc-sec lgc-life">${lgcHead('Lifecycle', r.stateField ? lgcBadge('k', `<code>${pbEscape(r.stateField)}</code>`) : '')}`
        + `<div class="lgc-flow" style="grid-template-columns:${cols.join(' ')}">${track}${bands}</div>${otherHtml}</section>`;
    }

    // History, newest first. The decision is the entry that produced the current rule; the
    // supersessions, amendments and sources before it are the entries under it.
    const lgcPick = (r, d, k) => r[k] != null && r[k] !== '' ? r[k] : d[k];
    const lgcDl = rows => { rows = rows.filter(x => x[1]); return rows.length ? `<dl class="lgc-dl">${rows.map(x => `<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl>` : ''; };
    const lgcOn = (date, by) => [date ? `<span class="lgc-date">${pbEscape(date)}</span>` : '', by ? 'by ' + lgcVal(by) : ''].filter(Boolean).join(' ');

    // The decision as a reader needs it: the question, what was weighed with the choice marked, why,
    // and what it touches. History shows it as its latest entry; a rule that is ONLY a decision
    // shows it directly, under its own heading — `{html, meta}`, html '' when nothing was decided.
    function lgcDecided(r, d) {
      let html = '';
      if (d.question) html += `<div class="lgc-q">${lgcProse(d.question)}</div>`;
      const opts = Array.isArray(d.options) ? d.options : (typeof d.options === 'string' ? d.options.split('|').map(x => x.trim()).filter(Boolean) : []);
      if (opts.length || d.chose) {
        const norm = x => lgcStr(x).trim().replace(/[.\s]+$/, '').toLowerCase();
        const hit = opts.findIndex(o => norm(o) === norm(d.chose));
        const items = opts.map((o, i) => `<li${i === hit ? ' class="lgc-on"' : ''}><span class="lgc-om">${i === hit ? '✓' : String.fromCharCode(65 + i)}</span><span>${pbEmph(lgcStr(o))}</span></li>`);
        if (d.chose && hit < 0) items.unshift(`<li class="lgc-on"><span class="lgc-om">✓</span><span>${pbEmph(lgcStr(d.chose))}</span></li>`);
        html += `<ul class="lgc-opts">${items.join('')}</ul>`;
      }
      html += lgcDl([['Why', d.why ? lgcProse(d.why) : ''], ['Affects', d.affects ? lgcChips(Array.isArray(d.affects) ? d.affects : lgcStr(d.affects).split(/\s+·\s+/).filter(x => x.trim())) : '']]);
      return { html, meta: lgcOn(lgcPick(r, d, 'answeredOn') || d.decidedOn, lgcPick(r, d, 'answeredBy')) };
    }

    // `o.skipDecided`: the decision is already on the card, so it is not repeated as an entry.
    function lgcHistory(r, d, f, o) {
      o = o || {};
      const ev = (title, meta, html, tone) => `<li class="lgc-ev lgc-ev-${tone || 'n'}"><div class="lgc-evh"><span class="lgc-evt">${title}</span>${meta ? `<span class="lgc-evd">${meta}</span>` : ''}</div>${html ? `<div class="lgc-evb">${html}</div>` : ''}</li>`;
      const dl = lgcDl, on = lgcOn, pick = k => lgcPick(r, d, k);
      const events = [];
      const openHtml = f.open.length ? `<div class="lgc-open"><div class="lgc-openh">⚠ Still open</div>${f.open.map(x => lgcProse(typeof x === 'object' ? JSON.stringify(x) : x)).join('')}</div>` : '';
      if (f.sup) events.push(ev('Superseded', on(f.supOn, f.supBy || ''), pick('supersededWhy') ? lgcProse(pick('supersededWhy')) : '', 'n'));
      if (f.loop) events.push(ev('Lineage loop', '', `Replaces and is replaced by <code>${pbEscape(f.supBy)}</code> — one of the two records is wrong.`, 'bad'));
      if (pick('supersededInPartBy') || pick('supersededInPartOn')) events.push(ev('Superseded in part', on(pick('supersededInPartOn'), pick('supersededInPartBy')), pick('supersededInPartWhy') ? lgcProse(pick('supersededInPartWhy')) : '', 'info'));
      if (pick('amendedOn') || pick('amendedBy') || pick('amendedWhy')) events.push(ev('Amended', on(pick('amendedOn'), pick('amendedBy')), pick('amendedWhy') ? lgcProse(pick('amendedWhy')) : '', 'info'));
      if (pick('qualifiedOn') || pick('qualifiedBy')) events.push(ev('Qualified', on(pick('qualifiedOn'), pick('qualifiedBy')), '', 'info'));
      if (pick('deferredOn') || pick('deferredBy') || pick('deferredWhy')) events.push(ev('Deferred', on(pick('deferredOn'), pick('deferredBy')), pick('deferredWhy') ? lgcProse(pick('deferredWhy')) : '', 'warn'));
      if (!o.skipDecided) { const dd = lgcDecided(r, d); if (dd.html) events.push(ev('Decided', dd.meta, dd.html, 'ok')); }
      if (pick('wasOpen')) events.push(ev('Was open', '', lgcProse(pick('wasOpen')), 'warn'));
      if (f.supersedes) events.push(ev('Replaced', '', lgcIdOr(f.supersedes), 'n'));
      const retired = [].concat(d.retired || [], r.retired || []);
      if (retired.length) events.push(ev('Retired invariants', '', lgcInvariants(retired, true), 'n'));
      // The section is titled "Origin", so the authored `origin` is its lead line, not a second row that says it again.
      const originV = pick('origin'), originLead = !originV ? '' : typeof originV === 'string' ? `<p class="lgc-tx">${lgcVal(originV)}</p>` : lgcVal(originV);
      const src = originLead + dl([['Was', pick('was') ? lgcVal(pick('was')) : ''], ['Was titled', pick('wasTitle') ? pbEmph(lgcStr(pick('wasTitle'))) : ''],
        ['Derived from', lgcVal(pick('derivedFrom'))],
        ['Decided in', lgcVal(pick('decidedIn'))], ['Built in', lgcArr(pick('implementedIn')).map(x => `<code>${pbEscape(typeof x === 'object' ? JSON.stringify(x) : x)}</code>`).join(' ')],
        ['Source', pick('citeNote') ? lgcProse(pick('citeNote')) : ''], ['Note', pick('note') ? lgcProse(pick('note')) : '']]);
      if (src) events.push(ev('Origin', '', src, 'n'));
      if (!events.length && !openHtml) return '';
      return openHtml + (events.length ? `<ol class="lgc-tlist">${events.join('')}</ol>` : '');
    }

    /* ONE status rule for a rule — what its row, its card and ⌘K all say. The card's list of what is
       wrong (a replaced-and-replacing loop, a transition naming a missing state, a matrix cell with no
       answer, a state nothing sets, an open question or an unconfirmed ASSUMPTION, an unchecked
       invariant) IS the count: the row's "N to resolve" is `todo.length`, so the two cannot disagree. */
    function pbRuleState(r) {
      const d = r.decision || {};
      const raw = r.title || '';
      const supT = PB_SUPERSEDED.exec(raw);
      const title = supT ? raw.replace(PB_SUPERSEDED, '') : raw;
      const supBy = r.supersededBy || d.supersededBy || '';
      const supOn = r.supersededOn || d.supersededOn || (supT ? lgcStr(supT[1]).trim() : '');
      const sup = !!supT || r.status === 'superseded' || d.status === 'superseded';
      const supersedes = r.supersedes || d.supersedes || '';
      const loop = !!(supersedes && supBy && supersedes === supBy);
      const openR = pbRuleOpen(r);
      const open = openR.items;
      const invariants = lgcArr(r.invariants);
      const unchecked = invariants.filter(iv => !iv.enforcedBy && !iv.enforcedIn).length;
      const blocks = lgcArr(r.blocks).filter(b => b && typeof b === 'object');
      const matrix = r.kind === 'matrix' || (r.rows && r.cols && r.cells) ? { rowLabel: r.rowLabel, rows: r.rows, cols: r.cols, cells: r.cells || {} } : null;
      let gaps = 0;
      (matrix ? [matrix] : []).concat(blocks.filter(b => b.type === 'matrix')).forEach(m =>
        lgcArr(m.rows).forEach(row => lgcArr(m.cols).forEach(col => { if (lgcCell(m, row, col) == null) gaps++; })));
      const states = lgcArr(r.states), keys = {};
      states.forEach(s => { keys[s.key] = 1; });
      let broken = 0;
      if (states.length) {
        lgcArr(r.transitions).forEach(t => { if (!keys[t[0]] || !keys[t[1]]) broken++; });
        lgcArr(r.overlays).forEach(o => lgcArr(o.over).forEach(k => { if (!keys[k]) broken++; }));
      }
      const unreachable = states.length ? pbRuleUnreachable(r) : [];

      // Every problem says what is wrong, what to do, and which command does it.
      const cmd = c => `<code>${c}</code>`;
      const pl = (k, one, many) => k + ' ' + (k > 1 ? many : one);
      const todo = [];
      if (loop) todo.push(['bad', `It replaces and is replaced by <code>${pbEscape(supBy)}</code>.`, 'Keep one direction — the newer rule supersedes the older.', cmd('/pb:clarify')]);
      if (broken) todo.push(['bad', pl(broken, 'transition names a state', 'transitions name a state') + ' that is not in the list.', 'Add the state or fix its key.', cmd('/pb:clarify')]);
      if (gaps) todo.push(['bad', pl(gaps, 'cell in the table has', 'cells in the table have') + ' no answer.', 'Decide each one — a blank means the build will guess.', cmd('/pb:clarify')]);
      if (unreachable.length) todo.push(['warn', pl(unreachable.length, 'state is', 'states are') + ' never set by any action.', `Add the action that sets <code>${pbEscape(r.stateField)}</code>, or mark the state <code>derived</code>.`, cmd('/pb:build')]);
      if (open.length) todo.push(['warn', pl(open.length, 'question is', 'questions are') + ' still open.', `Answer ${open.length > 1 ? 'them' : 'it'}, or accept the stated assumption — see History.`, cmd('/pb:clarify')]);
      else if (openR.assume) todo.push(['warn', 'It rests on an assumption no one has confirmed.', 'Confirm it or replace it with a decision.', cmd('/pb:clarify')]);
      if (unchecked) todo.push(['warn', `${unchecked} of ${pl(invariants.length, 'invariant', 'invariants')} ${unchecked > 1 ? 'are' : 'is'} not checked anywhere.`, 'Name the handler (<code>enforcedBy</code>) or the place (<code>enforcedIn</code>) that stops it being broken — or drop it.', cmd('/pb:clarify') + ' ' + cmd('/pb:test')]);
      const reds = todo.filter(t => t[0] === 'bad').length;
      return { d, title, supBy, supOn, sup, supersedes, loop, open, invariants, unchecked, blocks, matrix, states, unreachable, todo, reds };
    }

    /* A rule's one section that is on its own — Values alone, or History alone — is drawn OPEN, under
       its own heading, set off from the rule above it by one gap. (Two sections stay tabs.) */
    const lgcLone = (key, label, html, flag) => `<section class="lgc-lone lgc-lone-${key}">${lgcHead(label, flag ? `<span class="lgc-tdot lgc-tdot-${flag}"></span>` : '')}<div class="lgc-p lgc-p-${key}">${html}</div></section>`;

    /* `o.bare` = the card is the BODY of a scan row, which already shows its title, status and kind:
