name: pipeline

# test → version → release → deploy-prod.
#
# Every PR runs the TEST stage. Every push to main runs all of it: if a commit since the last
# release asks for one, a version is cut automatically and the run then WAITS for you to approve
# production. (Actions → pipeline → Run workflow does the same on demand, or forces a bump.)
#
#   test         secret-scan · semgrep-owasp · trivy-scan-repo
#   version      bump-version     picks the bump from Conventional Commits since the last tag
#                                 (`type!:` / BREAKING CHANGE → major · feat → minor · fix, perf →
#                                 patch · anything else → no release, and the run stops here);
#                                 commits the stamps on a release/vX branch, runs ci.yml on it,
#                                 then pushes main + tag vX together
#   release      release-tag      opens a DRAFT GitHub Release for vX
#   deploy-prod  ask-deploy-prod  waits until a required reviewer clicks approve
#                deploy-prod      publishes the draft and marks it Latest
#
# No personal token: main's protection requires the unit + e2e checks, and GITHUB_TOKEN can't
# bypass them — so the bump commit EARNS them. A GITHUB_TOKEN push triggers no workflow (so the
# bump commit can't re-trigger this one), but a workflow_dispatch does: bump-version dispatches
# ci.yml on the release branch, and once it is green on that exact SHA, a plain fast-forward
# push to main is allowed.
#
# One-time setup: environment `production` with yourself as a required reviewer ("prevent
# self-review" OFF if you are the only one). ask-deploy-prod fails closed if the gate is missing.
#
# No third-party actions: the scanners are pinned release binaries / an image digest, checked
# against a hard-coded SHA-256, and actions/* are pinned to commit SHAs (semgrep's
# mutable-action-tag rule — the trivy-action tag hijack is why).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      headline:
        description: "Release headline (optional) — titles it 'vX.Y.Z — <headline>'"
        type: string
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Main runs never cancel one another — a run can sit at the
  # approval gate for days; bump-version below is what serializes the releases themselves.
  group: pipeline-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── test ──────────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # every commit, not just the tip — a deleted secret is still leaked
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      # Known false positives are listed by fingerprint in .gitleaksignore, so anything new fails.
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  semgrep-owasp:
    name: semgrep-owasp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The ruleset is fetched from the registry each run, so a new rule can turn this red without
      # a code change. Suppress a reviewed false positive inline: `# nosemgrep: <rule-id>` + why.
      - name: OWASP Top 10 ruleset (any finding fails)
        run: semgrep scan --config p/owasp-top-ten --metrics=off --error .

  trivy-scan-repo:
    name: trivy-scan-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install trivy (pinned, checksum-verified)
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
      - name: Scan the repo (vulns, secrets, misconfig — HIGH/CRITICAL fail)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  # ─── version ───────────────────────────────────────────────────────────────────────────────
  bump-version:
    name: bump-version
    needs: [secret-scan, semgrep-owasp, trivy-scan-repo]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One release at a time: two merges in a row queue here, and the second bumps from the
    # first's tag instead of re-releasing the same commits.
    concurrency:
      group: pipeline-bump-version
      cancel-in-progress: false
    permissions:
      contents: write         # push the release branch, main and the tag
      actions: write          # dispatch ci.yml on the release branch
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      BUMP: ${{ inputs.bump || 'auto' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preflight — main only
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::releases are cut from main, not $GITHUB_REF"; exit 1; }
      # main's tip, not the triggering SHA: a release queued behind another must stack on it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0          # history + tags: the auto bump reads commits since vX
      - id: bump
        name: Pick the bump and stamp the version
        run: |
          set -o pipefail         # a bare `run:` is bash -e only; without this, tee hides a failure
          python3 .github/scripts/bump_version.py "$BUMP" | tee "$RUNNER_TEMP/bump.txt"
          v=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if ! git diff --quiet; then
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              echo "::error::tag v$v already exists"; exit 1
            fi
          else
            echo "### No release — nothing since the last tag asks for one (feat / fix / perf / breaking)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Version guards still hold
        if: steps.bump.outputs.version != ''
        run: python3 tests/command_refs.py && python3 tests/shell_version.py
      - id: commit
        name: Commit "release vX" to a release branch
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$VERSION"
          git push origin "HEAD:refs/heads/release/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The required checks, earned on the exact commit main will point at. Job names in ci.yml
      # are the branch-protection contexts, so this run is what lets the push below through.
      - name: Run ci.yml on the release commit (no release ships red)
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "release/v$VERSION"
          for _ in $(seq 30); do
            id=$(gh run list --workflow ci.yml --commit "$SHA" --event workflow_dispatch \
                   --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 5
          done
          test -n "$id" || { echo "::error::ci.yml never started for $SHA"; exit 1; }
          echo "ci run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" --interval 15 --exit-status > /dev/null \
            || { echo "::error::ci.yml failed on the release commit — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"; exit 1; }
      # main and the tag move together or not at all (--atomic). If main moved since checkout,
      # the fast-forward is rejected rather than releasing on top of untested code.
      - name: Push main + tag vX
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          { echo "### v$VERSION ($BUMP) → $(git rev-parse --short HEAD)"; echo '```'
            cat "$RUNNER_TEMP/bump.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Pass or fail, the release branch was only ever scaffolding.
      - name: Delete the release branch
        if: always() && steps.commit.outputs.sha != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: git push origin --delete "release/v$VERSION" || true

  # ─── release ───────────────────────────────────────────────────────────────────────────────
  release-tag:
    name: release-tag
    needs: bump-version
    if: needs.bump-version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write         # create the draft release
    outputs:
      url: ${{ steps.draft.outputs.url }}
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      HEADLINE: ${{ inputs.headline }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.bump-version.outputs.version }}
          persist-credentials: false
      - name: Verify tag matches plugin.json version
        run: |
          pj=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "$VERSION" = "$pj" || { echo "::error::v$VERSION != plugin.json $pj"; exit 1; }
      # Hand-written notes in .github/RELEASE_NOTES_vX.md, if present, go above the generated ones.
      - id: draft
        name: Open a draft GitHub Release
        run: |
          title="v$VERSION"; [ -n "$HEADLINE" ] && title="v$VERSION — $HEADLINE"
          args=(--draft --verify-tag --generate-notes --title "$title")
          notes=".github/RELEASE_NOTES_v$VERSION.md"
          [ -f "$notes" ] && args+=(--notes "$(cat "$notes")")
          url=$(gh release create "v$VERSION" "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Draft: [$title]($url) — review it, then approve deploy-prod" >> "$GITHUB_STEP_SUMMARY"

  # ─── deploy-prod ───────────────────────────────────────────────────────────────────────────
  # The approval IS the environment gate: this job doesn't start until a required reviewer
  # approves. If `production` has no reviewers it would start at once — so it checks, and fails
  # closed, before deploy-prod can publish anything.
  ask-deploy-prod:
    name: ask-deploy-prod
    needs: [bump-version, release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ needs.release-tag.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bump-version.outputs.version }}
    steps:
      - name: The approval gate is real
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
                --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          test "$n" -ge 1 || { echo "::error::environment 'production' has no required reviewers — v$VERSION stays a draft"; exit 1; }
          echo "v$VERSION approved for production."

  deploy-prod:
    name: deploy-prod
    needs: [bump-version, ask-deploy-prod]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write         # publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bump-version.outputs.version }}
    steps:
      - name: Publish the release and mark it Latest
        run: |
          gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest
          url=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "### 🚀 v$VERSION is live — $url" >> "$GITHUB_STEP_SUMMARY"
