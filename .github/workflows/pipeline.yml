name: pipeline

# test → version → release → deploy-prod.
#
#   test         secret-scan · semgrep-owasp · trivy-scan-repo
#   version      bump-version     PR: fails until the PR carries the bump its commits ask for,
#                                     and the migration guide for that version (see below)
#                                 main: reads the merged version — untagged means "release it"
#   release      release-tag      tags vX on the merged commit, opens a DRAFT GitHub Release whose
#                                     notes lead with the migration guide, attached as a file too
#   deploy-prod  ask-deploy-prod  waits until a required reviewer clicks approve
#                deploy-prod      publishes the draft and marks it Latest
#
# Every PR runs test + version. Every push to main runs all of it, and releases automatically when
# the merged version isn't tagged yet; anything else (docs, ci, chore…) stops after bump-version.
# Actions → pipeline → Run workflow re-runs that decision on main's tip (e.g. to retry a release).
#
# The bump lives IN THE PR (`python3 .github/scripts/bump_version.py auto`, commit the result):
# feat → minor · fix/perf → patch · `type!:` / BREAKING CHANGE → major, counted from the last tag.
# `auto` also writes docs/migrations/v<version>.md (.github/scripts/migration_guide.py): how to reach
# this release from ANY earlier one — schema steps, retired commands, upgrade notes, changelog. A
# major, a schema change or a removed command also needs a hand-written `### Upgrading` subsection
# in the release's changelog section; the check names what is missing.
# The pipeline never pushes to main. It can't: main requires the unit + e2e checks, GITHUB_TOKEN
# can't bypass them, and checks from runs GITHUB_TOKEN starts are never counted against a PR —
# so a version reaches main the same way code does, through a reviewed, checked PR.
#
# One-time setup: environment `production` with yourself as a required reviewer ("prevent
# self-review" OFF if you are the only one). ask-deploy-prod fails closed if the gate is missing.
#
# No third-party actions: the scanners are pinned release binaries / an image digest, checked
# against a hard-coded SHA-256, and actions/* are pinned to commit SHAs (semgrep's
# mutable-action-tag rule — the trivy-action tag hijack is why).

on:
  workflow_dispatch:
    inputs:
      headline:
        description: "Release headline (optional) — titles it 'vX.Y.Z — <headline>'"
        type: string
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Main runs never cancel one another — a run can sit at the
  # approval gate for days; release-tag below is what serializes the releases themselves.
  group: pipeline-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── test ──────────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # every commit, not just the tip — a deleted secret is still leaked
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      # Known false positives are listed by fingerprint in .gitleaksignore, so anything new fails.
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  semgrep-owasp:
    name: semgrep-owasp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The ruleset is fetched from the registry each run, so a new rule can turn this red without
      # a code change. Suppress a reviewed false positive inline: `# nosemgrep: <rule-id>` + why.
      - name: OWASP Top 10 ruleset (any finding fails)
        run: semgrep scan --config p/owasp-top-ten --metrics=off --error .

  trivy-scan-repo:
    name: trivy-scan-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install trivy (pinned, checksum-verified)
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
      - name: Scan the repo (vulns, secrets, misconfig — HIGH/CRITICAL fail)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  # ─── version ───────────────────────────────────────────────────────────────────────────────
  # One check, two readings. On a PR it is the gate: red until the version is bumped as far as the
  # commits since the last tag ask for. On main it decides whether this merge is a release.
  bump-version:
    name: bump-version
    needs: [secret-scan, semgrep-owasp, trivy-scan-repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # history + tags: the bump is measured from the last vX tag
          persist-credentials: false
      - id: check
        name: Version matches what the commits ask for
        run: |
          set -o pipefail         # a bare `run:` is bash -e only; without this, tee hides a failure
          python3 .github/scripts/bump_version.py check | tee "$RUNNER_TEMP/check.txt"
          { echo '```'; cat "$RUNNER_TEMP/check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Migration guide is written and current
        run: |
          set -o pipefail
          python3 .github/scripts/migration_guide.py check | tee "$RUNNER_TEMP/guide.txt"
          { echo '```'; cat "$RUNNER_TEMP/guide.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Version guards still hold
        run: python3 tests/command_refs.py && python3 tests/shell_version.py

  # ─── release ───────────────────────────────────────────────────────────────────────────────
  release-tag:
    name: release-tag
    needs: bump-version
    if: github.event_name != 'pull_request' && needs.bump-version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Two merges in a row tag one at a time; a tag that already exists fails the push, never moves.
    concurrency:
      group: pipeline-release-tag
      cancel-in-progress: false
    permissions:
      contents: write         # push the tag, create the draft release
    outputs:
      url: ${{ steps.draft.outputs.url }}
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      HEADLINE: ${{ inputs.headline }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preflight — main only
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::releases are cut from main, not $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tag matches plugin.json version
        run: |
          pj=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "$VERSION" = "$pj" || { echo "::error::v$VERSION != plugin.json $pj"; exit 1; }
      # Pushed with GITHUB_TOKEN, so the tag triggers no other workflow — this pipeline owns releases.
      - name: Tag the merged commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"
      # Notes, top to bottom: hand-written .github/RELEASE_NOTES_vX.md (if present), the migration
      # guide the PR committed (links pointed at the tag), then GitHub's generated list. The guide is
      # also attached as MIGRATION-vX.md. A body past GitHub's 125,000-character cap keeps only a link.
      - id: draft
        name: Open a draft GitHub Release
        run: |
          title="v$VERSION"; [ -n "$HEADLINE" ] && title="v$VERSION — $HEADLINE"
          guide="$RUNNER_TEMP/MIGRATION-v$VERSION.md"
          python3 .github/scripts/migration_guide.py print > "$guide"
          body="$RUNNER_TEMP/notes.md"; : > "$body"
          notes=".github/RELEASE_NOTES_v$VERSION.md"
          [ -f "$notes" ] && { cat "$notes"; printf '\n\n---\n\n'; } >> "$body"
          python3 .github/scripts/migration_guide.py print --release >> "$body"
          if [ "$(wc -c < "$body")" -gt 110000 ]; then
            [ -f "$notes" ] && { cat "$notes"; printf '\n\n'; } > "$body" || : > "$body"
            echo "**Upgrading:** see the attached MIGRATION-v$VERSION.md, or [docs/migrations/v$VERSION.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/migrations/v$VERSION.md)." >> "$body"
          fi
          url=$(gh release create "v$VERSION" "$guide" --draft --verify-tag --generate-notes \
                  --title "$title" --notes-file "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Draft: [$title]($url) — review it, then approve deploy-prod" >> "$GITHUB_STEP_SUMMARY"

  # ─── deploy-prod ───────────────────────────────────────────────────────────────────────────
  # The approval IS the environment gate: this job doesn't start until a required reviewer
  # approves. If `production` has no reviewers it would start at once — so it checks, and fails
  # closed, before deploy-prod can publish anything.
  ask-deploy-prod:
    name: ask-deploy-prod
    needs: [bump-version, release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ needs.release-tag.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bump-version.outputs.version }}
    steps:
      - name: The approval gate is real
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
                --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          test "$n" -ge 1 || { echo "::error::environment 'production' has no required reviewers — v$VERSION stays a draft"; exit 1; }
          echo "v$VERSION approved for production."

  deploy-prod:
    name: deploy-prod
    needs: [bump-version, ask-deploy-prod]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write         # publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.bump-version.outputs.version }}
    steps:
      - name: Publish the release and mark it Latest
        run: |
          gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest
          url=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "### 🚀 v$VERSION is live — $url" >> "$GITHUB_STEP_SUMMARY"
