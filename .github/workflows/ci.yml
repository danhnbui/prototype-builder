name: ci

# The regression suite. No release ships red.
#
# Job NAMES are load-bearing: `main`'s branch protection requires the contexts
# "unit (python, stdlib-only)" and "e2e (playwright chromium, dev-only)". They must
# match exactly, or every PR to main is blocked on checks that never report.

on:
  push:
    branches: [main]          # push CI on main only; PRs cover every branch
  pull_request:
  workflow_dispatch:          # run by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The browser tests, named once for both jobs.
env:
  # Browser-only: each exits 2 (a clean skip) without Playwright. unit defers them; e2e runs them.
  BROWSER_ONLY: >-
    e2e_smoke test_inspect test_sandbox verbs_browser sandbox_shell
    chrome_states handler_escape ia_view responsive spec_measure ui_primitives
  # A stdlib half that passes in unit with the browser half skipped; e2e runs them again, whole.
  BROWSER_HALF: >-
    chrome_foundation logic_blocks r5_ds_site tc_shapes tradeoff_rules test_run_reuse shot_tool

jobs:
  unit:
    name: unit (python, stdlib-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Every test that does NOT drive a browser. Playwright is deliberately absent
      # here, which is what "stdlib-only" asserts: pb's own tooling has no pip deps.
      - name: Regression suite (stdlib)
        run: |
          set -u
          # BROWSER_ONLY runs in the e2e job, with Playwright present.
          want=$(echo $BROWSER_ONLY | wc -w)
          pass=0; fail=0; skipped=0; failed=""
          for f in tests/*.py; do
            base=$(basename "$f" .py)
            case " $BROWSER_ONLY " in *" $base "*) skipped=$((skipped+1)); continue ;; esac
            if python3 "$f" > /tmp/out.txt 2>&1; then
              pass=$((pass+1)); echo "PASS  $base"
            else
              rc=$?; fail=$((fail+1)); failed="$failed $base"
              echo "::group::FAIL  $base  (exit $rc)"; cat /tmp/out.txt; echo "::endgroup::"
            fi
          done
          echo "--- $pass pass, $fail fail, $skipped deferred to the e2e job ---"
          test "$skipped" -eq "$want" || { echo "::error::expected $want browser tests, saw $skipped"; exit 1; }
          test "$fail" -eq 0 || { echo "::error::red:$failed"; exit 1; }

      - name: Registry contract is clean on the golden
        run: python3 pb/tools/lint_registry.py --strict fixtures/golden/registry.json

  e2e:
    name: e2e (playwright chromium, dev-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_VERSION: "1.55.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright (dev/CI-only — never shipped to users)
        run: |
          pip install "playwright==${PLAYWRIGHT_VERSION}"
          python3 -m playwright install --with-deps chromium

      # BROWSER_ONLY exit 2 as a "clean skip" when Playwright is missing. Here it is
      # installed, so a skip means the harness broke — treat it as failure, or the
      # suite reports green while asserting nothing about the shell in a browser.
      # BROWSER_HALF run again here so their browser halves are checked too.
      - name: Browser suite (a skip is a failure here)
        run: |
          set -u
          fail=0
          for base in $BROWSER_ONLY $BROWSER_HALF; do
            f="tests/$base.py"
            test -f "$f" || { fail=$((fail+1)); echo "::error::$f is listed but does not exist"; continue; }
            if python3 "$f" > /tmp/out.txt 2>&1; then rc=0; else rc=$?; fi
            case $rc in
              0) if grep -qiE "skipped|^SKIP" /tmp/out.txt && case " $BROWSER_HALF " in *" $base "*) true ;; *) false ;; esac; then
                   fail=$((fail+1)); echo "::group::FAIL  $base  (its browser half skipped)"; cat /tmp/out.txt; echo "::endgroup::"
                 else echo "PASS  $base"; fi ;;
              2) fail=$((fail+1)); echo "::error::$base SKIPPED but Playwright is installed" ;;
              *) fail=$((fail+1))
                 echo "::group::FAIL  $base  (exit $rc)"; cat /tmp/out.txt; echo "::endgroup::" ;;
            esac
          done
          test "$fail" -eq 0 || exit 1
